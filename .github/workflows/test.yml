name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows and macOS run and report, but do not fail the workflow (a user
    # decision, 2026-10-23). The suite grew from a few hundred tests to ~23 000
    # on Linux-only development. Its first Windows run on master failed ~2 100
    # of them, almost all through a few test-harness causes: fixtures that build
    # POSIX symlink/shebang mock CLIs with no `.cmd` shim, a Node harness
    # importing `C:\` paths instead of `file://` URLs, and scripts spawned
    # without a Windows-runnable extension. macOS failed many tests too and then
    # stalled at ~55%, near test_landlock_dispatch.py's FIFO home-check tests
    # (the plugin-Landlock rung is Linux-only). Porting both is owed
    # (plans/codex-plugin-publish.md); turn this back off when a leg is green.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    # Ubuntu runs the suite in ~35 minutes; a leg still running after two hours
    # is hung, and GitHub's default would hold the run for six.
    timeout-minutes: 120
    steps:
      # Actions are pinned by commit SHA, not by tag, for the reason the publish
      # workflow spells out: `@v4`/`@v5` are mutable refs the action owner can
      # move under us. The trailing comment names the tag each SHA came from —
      # bump the two together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, as every developer clone has. The committed-secret
          # scanner would be fine shallow, but several code-review tests build
          # their scratch project outside any repository, so their `git diff`
          # runs in this checkout and needs `HEAD~1` to resolve: on a shallow
          # clone they end `[DIFF_FAILED] ... a shallow clone` (measured on the
          # first CI run of this history, 2026-10-23). Giving each its own
          # two-commit repository is the better fix and is recorded as owed.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # The committed-secret guard is the one that actually holds the line for a
      # PUBLIC repo, so it has to run on a PR rather than only where a developer
      # happens to have the binary. Linux only: the guard is OS-independent, and
      # one runner catching a leak is enough — the module skips with a named
      # reason on the other two rather than failing.
      - name: Install gitleaks (leak guard)
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.28.0
          # From the release's own gitleaks_8.28.0_checksums.txt. Verified BEFORE
          # extraction, like every other downloaded artifact in this repo: a
          # version-pinned URL still trusts whatever the host serves today, and
          # this is the step that guards a PUBLIC repo against committed secrets.
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run tests
        # `not container`, `not package` and `not codex_jail` are not redundant
        # with pyproject's addopts: an explicit -m here REPLACES that default, so
        # without them a marked file would be collected and run on every PR —
        # `container` on runners with no Docker daemon (and none at all on the
        # macOS/Windows images), `package` on runners with no staged tarball,
        # which the package job below builds and these do not, and `codex_jail`
        # on runners with no codex binary to put in the jail.
        run: uv run --project skills/multi-llm -- pytest skills/multi-llm/tests -m "not live and not container and not package and not codex_jail"

  # The npm package. Linux-only by decision, exactly as the gitleaks guard above
  # is: nothing downstream of the uv probe has been measured on Windows or macOS
  # on this route, so a green leg there would claim coverage that does not exist.
  #
  # It is also the ONLY place the `package`-marked rows run. The three-OS `test`
  # job installs no npm and deselects them; here they run **by marker**, so a
  # skip in this job fails it rather than passing quietly — which is the whole
  # point, because a gate that skips silently everywhere is indistinguishable
  # from a gate that passes. `MLLM_REQUIRE_PACKAGE_ROWS` is what turns a skip
  # into a failure, and `make opencode-package-check-ci` sets it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The staging step refuses a dirty tree, and `git status --porcelain`
          # needs real history to answer. Full depth rather than shallow, and
          # the tags with it: the codex route's `test_version_bumps_with_payload`
          # reads `dist/tree.sha256` and the version at every `codex-v*` tag with
          # `git show`, so a checkout without them would grade no release at all.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Rows 1-6 only: everything that needs no Docker daemon, no registry and no
      # `opencode` binary. The full nine-row gate is the publishing job's, and
      # the difference between the two targets is the whole reason a publish
      # demands the full one rather than trusting a green PR.
      - name: Package gate (A4 rows 1-6)
        run: make opencode-package-check-ci
      # The codex plugin's CI tier, beside the npm one: the clean rebuild must
      # equal the committed `packaging/codex/multi-llm/` (the Git route serves
      # those bytes with no build), then the codex suite's plain and
      # `package`-marked rows. No Docker, no codex binary, no stamp.
      - name: Codex plugin gate (CI tier)
        run: make codex-package-check-ci
