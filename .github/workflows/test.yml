name: tests

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request supersedes the run still going on its previous
# head: the Windows and macOS legs run for up to two hours, and macOS jobs share
# a cap of five at a time across the account. Runs on master each get a group of
# their own (the run id), so none of them is ever cancelled. Use the PR number:
# separate forks can open independent PRs with the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # All three legs gate (a user decision, 2026-10-24). Windows and macOS ran
    # report-only from 2026-10-23 while the suite, written on Linux alone, was
    # ported: the first Windows run failed ~2 100 of ~23 000 tests and macOS
    # hung at ~55%. PR #5 (fix/windows-macos-tests) took both to zero, and the
    # product bugs the port found are fixed with it; what it left for later is
    # tracked in a local working note (plans/windows-macos-portability.md, kept
    # out of the published repo).
    #
    # Measured on PR #5: Ubuntu ~25 min, macOS ~60, Windows ~80 (every mock CLI
    # spawn there is a .cmd shim, node and python). A leg past its cap is hung;
    # GitHub's default would hold the run for six hours.
    #
    # The suite has grown since. On 2026-11-07 Windows took 110 min, then 164,
    # then hit its 180-minute cap at 99% while still passing tests (Ubuntu 42,
    # macOS 80 on the same push), and Windows runner speed varies a lot from run
    # to run. Hence 240: still well short of six hours, with room for that spread.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 240 || 120 }}
    steps:
      # Actions are pinned by commit SHA, not by tag, for the reason the publish
      # workflow spells out: `@v4`/`@v5` are mutable refs the action owner can
      # move under us. The trailing comment names the tag each SHA came from —
      # bump the two together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, as every developer clone has. The committed-secret
          # scanner would be fine shallow, but several code-review tests build
          # their scratch project outside any repository, so their `git diff`
          # runs in this checkout and needs `HEAD~1` to resolve: on a shallow
          # clone they end `[DIFF_FAILED] ... a shallow clone` (measured on the
          # first CI run of this history, 2026-10-23). Giving each its own
          # two-commit repository is the better fix and is recorded as owed.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # The lint gate (`make lint`). Linux only: ruff reads source text, so one
      # runner decides it for all three, and ruff is in the project's dev group.
      - name: Lint
        if: runner.os == 'Linux'
        run: uv run --project skills/multi-llm -- ruff check --config skills/multi-llm/pyproject.toml skills/multi-llm packaging
      # The committed-secret guard is the one that actually holds the line for a
      # PUBLIC repo, so it has to run on a PR rather than only where a developer
      # happens to have the binary. Linux only: the guard is OS-independent, and
      # one runner catching a leak is enough — the module skips with a named
      # reason on the other two rather than failing.
      - name: Install gitleaks (leak guard)
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.28.0
          # From the release's own gitleaks_8.28.0_checksums.txt. Verified BEFORE
          # extraction, like every other downloaded artifact in this repo: a
          # version-pinned URL still trusts whatever the host serves today, and
          # this is the step that guards a PUBLIC repo against committed secrets.
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run tests
        # `not container`, `not package` and `not codex_jail` are not redundant
        # with pyproject's addopts: an explicit -m here REPLACES that default, so
        # without them a marked file would be collected and run on every PR —
        # `container` on runners with no Docker daemon (and none at all on the
        # macOS/Windows images), `package` on runners with no staged tarball,
        # which the package job below builds and these do not, and `codex_jail`
        # on runners with no codex binary to put in the jail.
        #
        # The JUnit file is the per-test timing record the parallel trial below is
        # judged against (docs/development.md, "CI trial: parallel suite"). It goes
        # to the runner's temp directory, not the checkout: several tests read this
        # checkout's git status. --durations prints the slowest tests in the log.
        run: uv run --project skills/multi-llm -- pytest skills/multi-llm/tests -m "not live and not container and not package and not codex_jail" --junitxml="${{ runner.temp }}/junit.xml" --durations=25
      # Kept for failed runs too: a failure is when the timings matter most. A leg
      # that hit its cap is cancelled and pytest never wrote the file anyway.
      - name: Upload per-test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-test-${{ matrix.os }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: warn
          retention-days: 30

  # A one-week trial of the same suite spread over the runner's cores, kept apart
  # from the gating `test` job above (its checks keep their names and still
  # decide the merge). `--dist loadfile` keeps every test file on one worker, so
  # the module-level state some files share stays on one process. This leg is
  # non-blocking: `continue-on-error` stops a failure here from failing the run,
  # and its check names (`test-parallel (<os>)`) are not in any required list.
  # Hosted runners are slower than the 4-worker local run (6 min), and the tests
  # that time a 2 to 3 s child can flake on a busy one. How to read the trial,
  # promote the leg or fall back to file shards: docs/development.md, "CI trial:
  # parallel suite".
  test-parallel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    # The serial job's caps: a parallel leg is faster, never slower, so a leg
    # past them is hung.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 240 || 120 }}
    steps:
      # Pins as in the `test` job; bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, for the reason the `test` job gives.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # No gitleaks install: the serial job runs the committed-secret guard, and
      # the module skips with a named reason where the binary is absent.
      # pytest-xdist comes from the project's `dev` dependency group (pyproject + uv.lock),
      # like every other test dependency. The -m expression is the serial job's.
      # The serial log parser cannot profile this leg (workers interleave their
      # progress), so the JUnit file is its only per-file record; xdist merges
      # every worker's results into it. The worker count xdist picked is in the
      # log's "created: N/N workers" line.
      - name: Run tests in parallel
        run: uv run --project skills/multi-llm -- pytest skills/multi-llm/tests -n auto --dist loadfile -m "not live and not container and not package and not codex_jail" --junitxml="${{ runner.temp }}/junit.xml" --durations=25
      - name: Upload per-test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-test-parallel-${{ matrix.os }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: warn
          retention-days: 30

  # The npm package. Linux-only by decision, exactly as the gitleaks guard above
  # is: nothing downstream of the uv probe has been measured on Windows or macOS
  # on this route, so a green leg there would claim coverage that does not exist.
  #
  # It is also the ONLY place the `package`-marked rows run. The three-OS `test`
  # job installs no npm and deselects them; here they run **by marker**, so a
  # skip in this job fails it rather than passing quietly — which is the whole
  # point, because a gate that skips silently everywhere is indistinguishable
  # from a gate that passes. `MLLM_REQUIRE_PACKAGE_ROWS` is what turns a skip
  # into a failure, and `make opencode-package-check-ci` sets it.
  #
  # `PLAIN_ROWS=graded` on each tier: the Ubuntu `test` leg above already runs
  # every plain (unmarked) row of these suites on the same commit, so this job
  # runs only the plain rows a grader reads (opencode's rows 1-6 and 5b) beside
  # the `package` rows, the clean rebuilds and the moved-tree rule. The publish
  # workflows run the tiers with every plain row, as they must.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The staging step refuses a dirty tree, and `git status --porcelain`
          # needs real history to answer. Full depth rather than shallow, and
          # the tags with it: the codex route's `test_version_bumps_with_payload`
          # reads `dist/tree.sha256` and the version at every `codex-v*` tag with
          # `git show`, so a checkout without them would grade no release at all.
          # The Claude rule below reads the newest `claude-v*` tag and
          # `origin/<target>`, and depth 0 is what fetches every branch too.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Rows 1-6 only: everything that needs no Docker daemon, no registry and no
      # `opencode` binary. The full nine-row gate is the publishing job's, and
      # the difference between the two targets is the whole reason a publish
      # demands the full one rather than trusting a green PR.
      - name: Package gate (A4 rows 1-6)
        run: make opencode-package-check-ci PLAIN_ROWS=graded
      # The codex plugin's CI tier, beside the npm one: the clean rebuild must
      # equal the committed `packaging/codex/multi-llm/` (the Git route serves
      # those bytes with no build), then the codex suite's `package`-marked
      # rows. No Docker, no codex binary, no stamp.
      - name: Codex plugin gate (CI tier)
        run: make codex-package-check-ci PLAIN_ROWS=graded
      # The Claude Code plugin's CI tier: the clean rebuild must equal the committed
      # `packaging/claude/multi-llm/`, the moved-tree rule must hold, then the
      # `package`-marked rows. No Docker, no claude binary, no registry.
      #
      # The moved-tree rule is on a pull request where the shared-version check is
      # not, because Claude Code installs follow `master` and cache by version: a
      # same-version edit merged there reaches nobody who has that version. Its base
      # is the pull request's target, or on a push the commit `master` was at before
      # it, so a direct push is held to the rule too and an untagged bump is not a
      # gap. After a force push that commit is not fetched, and the rule refuses by
      # name for that one run. Through `env:`, never interpolated into the script,
      # because a branch name is text someone else chose.
      - name: Claude Code plugin gate (CI tier)
        env:
          CLAUDE_RELEASE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: make claude-package-check-ci PLAIN_ROWS=graded
