name: port-probe

# TEMPORARY, for the Windows/macOS port (PR #5); deleted before that PR leaves
# draft. The full `tests` legs now outrun their two-hour cap on Windows (98% at
# the cap) and hang on macOS inside test_plugin_landlock_surfaces.py, so neither
# reaches the summary that carries the tracebacks. This runs only the files that
# failed or were never reached, verbosely, with pytest's faulthandler dumping
# every thread's stack when one test runs past two minutes.

on:
  push:
    branches: [fix/windows-macos-tests]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 4: the fanout rows again (ps -o lstart= now reaches the real
          # run); the round-3 prefix and Windows legs are still running on 588bc847.
          - leg: macos-fanout
            os: macos-latest
            minutes: 15
            targets: skills/multi-llm/tests/test_plugin_landlock_fanout.py
    name: probe (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run the probed files
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          AFTER: ${{ matrix.after }}
          THROUGH: ${{ matrix.through }}
          IN_TESTS: ${{ matrix.in_tests }}
        run: |
          set -euo pipefail
          files="$TARGETS"
          for name in $IN_TESTS; do files="$files skills/multi-llm/tests/$name"; done
          if [ -n "$AFTER" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v a="skills/multi-llm/tests/$AFTER" '$0 >= a')"
          fi
          if [ -n "$THROUGH" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v t="skills/multi-llm/tests/$THROUGH" '$0 <= t')"
          fi
          uv run --project skills/multi-llm -- pytest $files \
            -m "not live and not container and not package and not codex_jail" \
            -v -rfE -o faulthandler_timeout=120 -p no:cacheprovider

  # Why a second stub_server.py never publishes its port on macOS (c60ce88d's
  # second-half leg: the first stub serves, every later one is silent for 20 s,
  # 87 rows). Each stub runs under a faulthandler timer, so a stuck one prints
  # where it is stuck; getfqdn is timed because HTTPServer.server_bind calls it.
  stub-diag:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Start three stubs, one after another
        shell: bash
        working-directory: skills/multi-llm
        run: |
          set -u
          uv run --project . -- python -c "
          import socket, time
          for _ in range(3):
              t = time.time(); name = socket.getfqdn('127.0.0.1')
              print(f'getfqdn(127.0.0.1) = {name!r} in {time.time() - t:.2f}s', flush=True)
          "
          d=$(mktemp -d)
          for i in 1 2 3; do
            PYTHONPATH=. uv run --project . -- python -c "
          import faulthandler, runpy, sys
          faulthandler.dump_traceback_later(25)
          sys.argv = sys.argv[1:]
          runpy.run_path(sys.argv[0], run_name='__main__')
          " tests/container/stub_server.py --port 0 --port-file "$d/port-$i" --log "$d/log-$i" \
              --scenario tests/fixtures/e2e/scenarios/happy_path.yaml > "$d/out-$i" 2> "$d/err-$i" &
            start=$(date +%s)
            until [ -s "$d/port-$i" ] || [ $(( $(date +%s) - start )) -ge 30 ]; do sleep 0.2; done
            echo "stub $i: port file after $(( $(date +%s) - start ))s: $(cat "$d/port-$i" 2>/dev/null || echo none)"
          done
          sleep 28
          for i in 1 2 3; do echo "--- stub $i stderr"; cat "$d/err-$i"; echo "--- stub $i stdout"; cat "$d/out-$i"; done
          pkill -f stub_server.py || true
      - name: The two stub files alone
        if: always()
        shell: bash
        run: |
          uv run --project skills/multi-llm -- pytest \
            skills/multi-llm/tests/test_scenario_matcher_parity.py \
            skills/multi-llm/tests/test_stub_scripted_tool_call.py \
            -m "not live and not container and not package and not codex_jail" \
            -x -q -o faulthandler_timeout=60 -p no:cacheprovider
