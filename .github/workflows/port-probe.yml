name: port-probe

# TEMPORARY, for the Windows/macOS port (PR #5); deleted before that PR leaves
# draft. The full `tests` legs now outrun their two-hour cap on Windows (98% at
# the cap) and hang on macOS inside test_plugin_landlock_surfaces.py, so neither
# reaches the summary that carries the tracebacks. This runs only the files that
# failed or were never reached, verbosely, with pytest's faulthandler dumping
# every thread's stack when one test runs past two minutes.

on:
  push:
    branches: [fix/windows-macos-tests]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 2 (after c60ce88d showed the file passes alone, 21 in 7 s): the
          # hang needs what ran before it. Its neighbours in suite order, then the
          # whole prefix through it.
          - leg: macos-landlock-neighbours
            os: macos-latest
            minutes: 25
            targets: >-
              skills/multi-llm/tests/test_plugin_landlock_acceptance.py
              skills/multi-llm/tests/test_plugin_landlock_executor.py
              skills/multi-llm/tests/test_plugin_landlock_fanout.py
              skills/multi-llm/tests/test_plugin_landlock_surfaces.py
          - leg: macos-prefix-through-the-hang
            os: macos-latest
            minutes: 70
            through: test_plugin_landlock_surfaces.py
    name: probe (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run the probed files
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          AFTER: ${{ matrix.after }}
          THROUGH: ${{ matrix.through }}
        run: |
          set -euo pipefail
          files="$TARGETS"
          if [ -n "$AFTER" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v a="skills/multi-llm/tests/$AFTER" '$0 >= a')"
          fi
          if [ -n "$THROUGH" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v t="skills/multi-llm/tests/$THROUGH" '$0 <= t')"
          fi
          uv run --project skills/multi-llm -- pytest $files \
            -m "not live and not container and not package and not codex_jail" \
            -v -rfE -o faulthandler_timeout=120 -p no:cacheprovider
