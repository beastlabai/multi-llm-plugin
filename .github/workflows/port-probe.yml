name: port-probe

# TEMPORARY, for the Windows/macOS port (PR #5); deleted before that PR leaves
# draft. The full `tests` legs now outrun their two-hour cap on Windows (98% at
# the cap) and hang on macOS inside test_plugin_landlock_surfaces.py, so neither
# reaches the summary that carries the tracebacks. This runs only the files that
# failed or were never reached, verbosely, with pytest's faulthandler dumping
# every thread's stack when one test runs past two minutes.

on:
  push:
    branches: [fix/windows-macos-tests]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 6: quick checks of the last fixes ahead of the full run —
          # every file that still failed on either OS in the last probes.
          - leg: windows-verify
            os: windows-latest
            minutes: 60
            in_tests: >-
              test_write_executor.py test_write_executor_orchestrators.py
              test_check_findings_hold_dependents.py test_check_gate_fixture.py
              test_codex_route.py test_implement_stop_account.py
              test_write_retry_redispatch.py test_resume_why.py
              test_human_task_answers.py test_plugin_landlock_executor.py
              test_apply_backup_across_rounds.py
              test_write_reply_prose_before_object.py test_e2e_improve_modes.py
              test_plan_updater.py test_stream_bootstrap.py test_detach.py
          - leg: macos-verify
            os: macos-latest
            minutes: 30
            in_tests: >-
              test_plugin_landlock_fanout.py test_sandbox_rung_reporting.py
              test_detach.py test_codex_mcp_server.py test_plugin_landlock_acceptance.py
              test_plugin_landlock_executor.py test_scenario_matcher_parity.py
              test_stub_scripted_tool_call.py
    name: probe (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run the probed files
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          AFTER: ${{ matrix.after }}
          THROUGH: ${{ matrix.through }}
          IN_TESTS: ${{ matrix.in_tests }}
        run: |
          set -euo pipefail
          files="$TARGETS"
          for name in $IN_TESTS; do files="$files skills/multi-llm/tests/$name"; done
          if [ -n "$AFTER" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v a="skills/multi-llm/tests/$AFTER" '$0 >= a')"
          fi
          if [ -n "$THROUGH" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v t="skills/multi-llm/tests/$THROUGH" '$0 <= t')"
          fi
          uv run --project skills/multi-llm -- pytest $files \
            -m "not live and not container and not package and not codex_jail" \
            -v -rfE -o faulthandler_timeout=120 -p no:cacheprovider

