name: port-probe

# TEMPORARY, for the Windows/macOS port (PR #5); deleted before that PR leaves
# draft. The full `tests` legs now outrun their two-hour cap on Windows (98% at
# the cap) and hang on macOS inside test_plugin_landlock_surfaces.py, so neither
# reaches the summary that carries the tracebacks. This runs only the files that
# failed or were never reached, verbosely, with pytest's faulthandler dumping
# every thread's stack when one test runs past two minutes.

on:
  push:
    branches: [fix/windows-macos-tests]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macos-landlock
            os: macos-latest
            minutes: 30
            targets: >-
              skills/multi-llm/tests/test_plugin_landlock_acceptance.py
              skills/multi-llm/tests/test_plugin_landlock_executor.py
          # Alone, so its hang cannot cost the other files their summary.
          - leg: macos-the-hang
            os: macos-latest
            minutes: 12
            targets: skills/multi-llm/tests/test_plugin_landlock_surfaces.py
          - leg: macos-after-the-hang
            os: macos-latest
            minutes: 60
            after: test_plugin_landlock_write.py
          - leg: windows-failing-and-unreached
            os: windows-latest
            minutes: 60
            after: test_write_executor.py
            targets: >-
              skills/multi-llm/tests/test_codex_route.py
              skills/multi-llm/tests/test_fake_lane_output_channel.py
              skills/multi-llm/tests/test_human_task_answers.py
              skills/multi-llm/tests/test_apply_backup_across_rounds.py
              skills/multi-llm/tests/test_implement_stop_account.py
              skills/multi-llm/tests/test_e2e_improve_modes.py
              skills/multi-llm/tests/test_resume_why.py
              skills/multi-llm/tests/test_plugin_landlock_executor.py
              skills/multi-llm/tests/test_e2e_exec_subagents.py
              skills/multi-llm/tests/test_check_gate_fixture.py
              skills/multi-llm/tests/test_check_findings_hold_dependents.py
    name: probe (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run the probed files
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          AFTER: ${{ matrix.after }}
        run: |
          set -euo pipefail
          files="$TARGETS"
          if [ -n "$AFTER" ]; then
            files="$files $(ls skills/multi-llm/tests/test_*.py | LC_ALL=C sort \
              | awk -v a="skills/multi-llm/tests/$AFTER" '$0 >= a')"
          fi
          uv run --project skills/multi-llm -- pytest $files \
            -m "not live and not container and not package and not codex_jail" \
            -v -rfE -o faulthandler_timeout=120 -p no:cacheprovider
