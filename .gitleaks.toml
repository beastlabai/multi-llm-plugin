# Committed-secret scanner rules for beastlabai/multi-llm-plugin.
#
# This repository is public, so anything committed is published. `.gitignore`
# keeps credentials out by *location* and prevents the accident; this config —
# together with `skills/multi-llm/tests/test_no_committed_secrets.py`, which
# walks `git ls-files` on every PR — catches the one that slips through. The two
# files land together and are maintained together: a rule change that needs an
# exception is not finished until the exception is written here.
#
# Two design rules decide whether this holds anything at all.
#
# 1. RULES MATCH VALUES, NOT PREFIXES AND NOT FIELD NAMES.
#    A rule that fires on the literal `sk-`, `ghp_` or `xoxb-` is red on its
#    first run against this tree, and a rule that fires on the *identifier*
#    `api_key` / `refresh_token` is red on content we cannot delete and would not
#    want to:
#      * `skills/multi-llm/tests/fixtures/e2e/responses/code_review/
#        mixed_importance.json` ships an `API_KEY = "sk-1234…"` assignment as the
#        anchor text of a review finding — the fixture is *about* a hardcoded
#        key (spelled elided here on purpose: the full 13-character literal
#        clears `generic-api-key`'s entropy floor when it sits next to the
#        identifier, so writing it out would make this very file a finding);
#      * `skills/multi-llm/tests/fixtures/e2e/plans/auth-feature.md` specifies a
#        `sessions` table with a `refresh_token VARCHAR(255)` column and a
#        `refresh(refresh_token)` endpoint — schema and API field names with no
#        value attached, i.e. exactly what a plan about session management says;
#      * `skills/multi-llm/uv.lock` is hundreds of 64-char sha256 digests that a
#        bare entropy floor would hit.
#    A scanner that is red on day one gets silenced on day two, so none of those
#    may match in the first place. That is what `useDefault` below buys: the
#    stock pack qualifies every vendor prefix with length, charset and (where the
#    vendor defines one) a checksum, and its `generic-api-key` shape needs an
#    identifier *plus* an adjacent value clearing length, charset and entropy
#    floors. Markdown stays in scope — a real key is pasted into a README far
#    more often than into a fixture — but only under those value-qualified rules.
#    We do not hand-roll regexes we would then own: vendor key formats are
#    precisely the thing that changes without telling us. Anything added on top
#    of the pack observes the same discipline.
#
# 2. EXCLUSIONS ARE MATCH-LEVEL, NEVER FILE-LEVEL.
#    A `paths` glob over `tests/fixtures/**` or `uv.lock` hides a *future* real
#    key pasted into those files, and fixture directories are exactly where a
#    real capture gets dropped "just to reproduce something". So `paths` never
#    appears without a `regexes` beside it: the pair means "this value in this
#    file", while `paths` alone means "this file is a blind spot".
#
#    Which shape actually *implements* that pair is a measured fact, not an
#    assumption — see "How gitleaks really evaluates an allowlist" below, because
#    the obvious spelling of it is a silent no-op.

title = "multi-llm-plugin committed-secret rules"

[extend]
# gitleaks' stock rule pack, whole and unmodified — see rule 1 above.
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist entries
# ---------------------------------------------------------------------------
#
# There is exactly one, and it is at the bottom of this file. Measured, not
# assumed: on 2026-08-14, gitleaks 8.28.0 with the stock pack over
# `git ls-files` reported zero findings on the tracked tree. The `uv.lock`
# digests the plan predicted would fire do not — the stock `generic-api-key`
# rule wants an identifier next to the value, and a bare `sha256:...` in a
# lockfile has none — and `mixed_importance.json`'s decoy is a 13-character
# `sk-` string inside an escaped JSON literal, below every vendor rule's length
# floor. An entry that suppresses nothing is decoration, and decoration is how a
# `paths`-shaped exclusion sneaks back in later, so the test asserts both
# directions: every entry present must be load-bearing (deleting it turns the
# scanner red) and the set must be no larger than what actually fires.
#
# The one entry arrived with the first *committed* container run record
# (2026-08-15). `tests/container/records/*.json` was always designed to be
# tracked provenance — `record.schema.json` has been tracked since C10 and the
# harness README calls records "tracked, committed with the promotion" — but no
# record had ever actually been committed, so this scanner had never seen one.
# A record's `bundle.files` is a digest manifest: a JSON object mapping each
# file in the ephemeral `runs/<utc>/<row-id>/` bundle to its SHA-256, which is
# what lets `make e2e-verify-record` re-hash a bundle the promotion cited after
# `make e2e-clean` has deleted it. One of those filenames is
# `credential-census.json` — Phase 1's count of which hosts found a working
# credential path, a file of integers — and the stock `generic-api-key` rule
# reads `credential… : <64 hex>` as identifier-next-to-value. The digest is not
# a credential; the *name of the file it digests* is what fires.
#
# So the exception is written to the manifest's **shape**, never to today's
# digests: `"<filename>.<ext>": "<64 lowercase hex>"` alone on its line, inside
# a record. A fingerprint list would pin 2026-08-15's twenty-two matches and go
# stale on the next `make e2e` run; a bare `[a-f0-9]{64}` on the default regex
# target would excuse *any* 64-hex value anywhere in a record, including one
# sitting under `"OPENROUTER_API_KEY"` — measured, and the reason this is a
# line-shaped regex rather than a value-shaped one.
#
# ---------------------------------------------------------------------------
# How gitleaks really evaluates an allowlist (measured, gitleaks 8.28.0)
# ---------------------------------------------------------------------------
#
# The natural way to write "this value in this file" does not do that, so this
# is written down rather than rediscovered. Each row below was run against a
# scratch tree holding one real-shape `ghp_` token, and
# `test_no_committed_secrets.py::TestGitleaksAllowlistSemantics` pins the two
# that these rules depend on, so a version bump that changes them fails loudly
# instead of quietly widening an exception:
#
#   [[allowlists]] + paths           -> the whole FILE is skipped before any rule
#                                       runs ("skipping file: global allowlist").
#                                       A `regexes` beside it is inert, and so is
#                                       `condition = "AND"`. This is the blind
#                                       spot rule 2 forbids, and it is forbidden
#                                       here however it is dressed up.
#   [[allowlists]] + regexes         -> works: that exact value is excused
#                                       everywhere. No blind spot — a different
#                                       value in the same file is still caught.
#   [[allowlists]] + targetRules     -> a SILENT NO-OP. It suppresses nothing,
#                                       for stock and locally-defined rules
#                                       alike, and an unknown rule id raises no
#                                       error. Forbidden: an exception that
#                                       looks scoped and does nothing is worse
#                                       than none, because the reviewer stops
#                                       looking.
#   [[rules.allowlists]] + paths     -> that rule is skipped in that file. Still
#                                       a blind spot, just a per-rule one.
#   [[rules.allowlists]] + paths
#     + regexes + condition = "AND"  -> the real thing: the value is excused only
#                                       in that file, and the same value
#                                       elsewhere — or a different value there —
#                                       is still a finding.
#
# And one more silent no-op, found writing the entry below and pinned by the
# same test class:
#
#   regexes, default regexTarget     -> the regex is matched against the SECRET
#                                       (the rule's capture group) alone, not the
#                                       line. So a regex describing the context a
#                                       benign value sits in — `"<key>": "<value>"`
#                                       — never matches, and the entry suppresses
#                                       nothing while looking precise. This is the
#                                       third shape that fails quietly.
#   regexes + regexTarget = "line"   -> matched against that one line, and only
#                                       that line: a secret on the line above or
#                                       below is still a finding. This is what
#                                       makes "excuse the *shape* of a manifest
#                                       row" expressible without excusing the
#                                       values in it. `regexTarget = "match"` is
#                                       the weaker cousin — the stock
#                                       `generic-api-key` match starts *inside*
#                                       the key (its regex opens with a lazy
#                                       `[\w.-]{0,50}?`), so a "match"-anchored
#                                       regex can pin neither the key's opening
#                                       quote nor the end of the line, and a real
#                                       key pasted after the benign value on the
#                                       same line rides along excused. Measured.
#
# A rule-level allowlist needs a `[[rules]]` block to hang on, and a bare `id`
# with no `regex` attaches to the stock rule of that id without restating its
# pattern, which is what keeps rule 1's "never hand-roll" intact.
#
# So the required shape for any entry added later — rule ID, match regex, path,
# fingerprints, rationale and the date it was added, every one of which the test
# enforces — is:
#
#   [[rules]]
#   id = "<stock-rule-id>"   # the stock rule; its regex is deliberately not restated
#
#   [[rules.allowlists]]
#   description = "<what this value is, why it is not a credential; added YYYY-MM-DD>"
#   condition   = "AND"      # value AND path; either alone is a blind spot
#   regexTarget = "line"     # omit and the regex is tested against the secret alone
#   regexes     = ['''<the benign value, in the context that makes it benign>''']
#   paths       = ['''<the one file or directory it may appear in>''']
#   # fingerprints: <what it suppressed the day it landed>
#
# Note there is no `.gitleaksignore` in this repository and there must not be
# one: fingerprint suppression outside this file is an exception nobody reviews.
# For the same reason the scanner runs with `--ignore-gitleaks-allow`, so an
# inline `gitleaks:allow` comment cannot silence a finding either. This file is
# the single exception channel.

[[rules]]
id = "generic-api-key"   # the stock rule; its regex is deliberately not restated

[[rules.allowlists]]
description = "container run records: SHA-256 rows of the bundle digest manifest, not credentials — `credential-census.json` is a filename being digested, not a key being assigned; added 2026-08-15"
condition   = "AND"      # value AND path; either alone is a blind spot
regexTarget = "line"     # default is the secret alone, against which this regex is inert
regexes     = ['''(?m)^[ \t]*"[A-Za-z0-9_./-]+\.[a-z0-9]{1,8}":[ \t]*"[a-f0-9]{64}",?[ \t]*\r?$''']
paths       = ['''^skills/multi-llm/tests/container/records/[^/]+\.json$''']
# Read the regex as the four things that must ALL hold before a line is excused,
# each one measured against a probe tree that also held a real-shape key:
#   1. the line is nothing but one JSON member — `[ \t]` never `\s` (which spans
#      newlines in Go), and `\r?$` so a CRLF checkout behaves the same. A real key
#      appended after the digest on the same line is still a finding.
#   2. its key is filename-shaped: a relative path ending in a lowercase
#      extension. `"OPENROUTER_API_KEY": "<64 hex>"` is not, and is still caught.
#   3. its value is a *bare* 64-char lowercase hex string, quote to quote. The
#      quotes are load-bearing: `"credential-census.json": "sk-or-v1-<64 hex>"`
#      is still caught, because an OpenRouter key is a 64-hex body behind a
#      prefix and the prefix does not fit between them.
#   4. it is in a committed run record. Same line in any other tracked file —
#      including the ignored `runs/` bundles were they ever staged — is a finding.
# What this deliberately does NOT do is name `credential-census.json`. The rule
# fires on that key only because it carries one of the stock pack's identifier
# words; a later bundle file called `auth*`, `secrets*`, `token-*`, `access-*`,
# `api-key-*`, `creds-*`, `key-*`, `passwd*` or `password-*` would fire exactly
# the same way. Measured, not assumed: a probe manifest of 26 filenames produced
# eleven findings — those nine shapes plus `credential-census.json` itself —
# while `host-run.json`, `stub.jsonl`, `usage.json`, `row-result.json`,
# `openrouter.json`, `bearer-check.json`, `discovery.json`, the `receipts/…`
# paths and the rest stayed quiet (a `/` between the identifier word and the
# key's closing quote takes the line out of the rule's reach, which is why
# `artifacts/auth-feature/…/.status.lock` never fired either). Pinning the entry
# to one filename would buy a second exception commit for each of them; pinning
# it to the manifest's shape covers them without widening what a "credential" is
# allowed to look like.
# fingerprints: 22 the day it landed — one per record carrying a
#   `credential-census.json` row, all `generic-api-key`, all under
#   skills/multi-llm/tests/container/records/. Listed by record and line, from
#   `20260815T172352Z-*`: claude-code-apply-native:8, claude-code-ask:14,
#   claude-code-review-plan:24, codex-apply-executor:8, codex-ask:15,
#   codex-auth-negative:8, codex-review-plan:24, opencode-apply-executor:8,
#   opencode-ask:15, opencode-auth-negative:8, opencode-review-plan:26; and from
#   `20260815T231349Z-*`: claude-code-apply-native:8, claude-code-ask:13,
#   claude-code-review-plan:16, codex-apply-executor:8, codex-ask:15,
#   codex-auth-negative:8, codex-review-plan:26, opencode-apply-executor:8,
#   opencode-ask:15, opencode-auth-negative:8, opencode-review-plan:24.
#   NOT exhaustive going forward, and that is the point: every future run commits
#   more records with fresh digests, so this list is provenance for the day the
#   exception was written, never the definition of what it covers.
