  # F5, 2026-09-16, the apply-code-fixes audit: isolated-high-risk batches now
  # dispatch first, not last.
  #
  # `code_fix_batcher.CodeFixBatch.priority_score` is a SUM of its fixes'
  # importance weights, so three LOW/MEDIUM fixes (1+2+2=5.0) always outranked
  # one isolated HIGH fix (3.0) under the old `batches.sort(key=lambda b:
  # -b.priority_score)` — inverting the isolation step 40 lines above it and
  # dispatching the riskiest, deliberately-isolated edit LAST, on top of every
  # other batch's edits, rather than first, onto known-good bytes.
  # `batch_sort_key` now ranks isolation (any high-risk fix in the batch) above
  # peak importance, above the summed score as a tiebreak, at both sort sites
  # (the early-return branch and the main one), so they cannot disagree again.
