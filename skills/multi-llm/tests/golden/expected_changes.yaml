  - pointer: /phases/code-review/created_paths
    rationale: >
      Two declared changes land on one positionally-flattened list, and the
      second renumbers the leaves the first used to name, so this covers the
      list — the same reason `/phases/review-plan/created_paths` does.

      `review-code` now writes `{phase}/.status.json` at the point in its
      fan-out where `review_orchestrator_base` already wrote one (after the
      detach boundary, before the first model), and `status_file` creates
      `.status.lock` beside it on the first read-modify-write. It wrote neither
      before, which is exactly why `build_unsanitize_map` found no
      `models_requested` for this phase, `--reaggregate` fell back to "the
      sanitized stem IS the identity", and a validate-then-reaggregate run
      rewrote `grouped.json`'s attribution — moving its bytes and so refusing
      its own `validation_tasks.json` on the `grouped_sha256` binding. Both new
      names sort ahead of every other entry, so everything after them shifts by
      two.

      L1 / §9.3.d, file-name half — `sanitize_model_name` derives the per-model
      result and log file names from the resolved spec, so `cursor-agent.json`
      / `log_cursor-agent.txt` become `cursor-agent_cursor-agent.json` /
      `log_cursor-agent_cursor-agent.txt`. The resume predicate looks for the
      current name, so a run started before L1 and resumed after it re-runs its
      bare-spec models once — stated, not discovered. The identical rename in
      `review-plan` and at the output root falls under the two entries above.
  - pointer: /phases/code-review/status_shape
    rationale: >
      The checkpoint document itself, absent from the baseline because
      `review-code` wrote none at all: `phase`, `state`, `started_at`,
      `models_requested`, `models_completed`, `models_failed`, `error`,
      `updated_at`. Not a shape of this phase's own — it is the field set
      `review_orchestrator_base` already writes for `review-plan`, mirrored
      rather than reinvented, because `build_unsanitize_map` reads
      `models_requested`/`models_completed` out of both and must not meet two
      documents.
  - pointer: /phases/code-review/status_steps
    rationale: >
      The same write seen as a sequence: `phase=code-review` then
      `state=models_complete`, where the baseline had no checkpoint to read a
      sequence out of. It stops one transition short of `review-plan`'s
      `state=grouping_complete`: the base's later phase-machine transitions are
      deliberately not mirrored here, since the reaggregation fix needs the
      recorded specs and the honest "the fan-out finished" state, and nothing
      reads a `grouping_complete` from this phase.
  - pointer: /phases/review-plan/status_steps/1
    rationale: >
      The phase machine now reaches the terminal word `utils/status_file.py`
      always documented (`… → validation_pending → complete`) and nothing ever
      wrote: `run_review_orchestration`, `reaggregate_from_existing_files` and
      the code-review orchestrator write `state: complete` right after
      `mark_phase_completed`, so `status` shows a finished run as finished
      instead of "grouping, models 3/3". The bundle records the checkpoint's
      final `state`, so the last step reads `complete` where the baseline's
      last checkpoint the fan-out wrote was `grouping_complete`. No reader
      gates resume or reaggregate on the word; `state.json`'s
      `phases_completed` stays the completion record this guard compares.

  # ---------------------------------------------------------------------------
  # The prior-changes id is now serialized WITH the batch.
  #
  # `prior_changes.append` is idempotent on `(id, phase)` — deliberately, so a
  # re-dispatched batch cannot double its summary. The id it was handed was not
  # unique per batch: the native path was told to pass `batch.file_key` /
  # `batch.section_key`, and both batchers emit MANY batches under one such key
  # (three fixes a batch, the char caps, one batch per security/HIGH fix; a
  # section that overflows starts a new batch under the same key). Every batch
  # after the first on a key was therefore skipped with a `Notice:` on stderr and
  # exit 0, and each later batch read a prior-changes context missing its own
  # predecessors — the exact "don't redo work" signal the step exists to provide.
  #
  # Both batchers' `to_dict()` now carry `prior_changes_id`, computed once in
  # Python by `prior_changes.entry_id(key, member_ids)` — the content key plus a
  # digest of the batch's own member ids, so it is unique per batch AND identical
  # when the same batch is re-materialized (an unstable id would DOUBLE an entry,
  # which is the failure the idempotency exists to prevent). It is byte-identical
  # to what `utils/write_phase_bridge` derives for the same batch, so the native
  # invoker and the Python executor append under the same key.
  #
  # The diff is therefore one ADDED key per serialized batch, and nothing else:
  # no existing value moves, and this fixture's apply-fixes batches carry an empty
  # `file_key`, which is why they read `batch#<digest>` rather than `<key>#<digest>`.
  # Pointers are leaf-exact, per the block above: a pointer at `…/batches` would
  # also excuse a changed batch count or a changed fix, which is what this guard
  # exists to catch.
  # ---------------------------------------------------------------------------
  - pointer: /phases/apply-fixes/artifacts/orchestrator_output.json/batches/0/prior_changes_id
