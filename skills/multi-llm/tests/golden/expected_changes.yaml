# Declared, rationale-carrying allowlist for the instruction-refactor guard.
#
# The guard (tests/test_instruction_refactor_guard.py) re-runs the named fixture
# — tests/fixtures/e2e/plans/auth-feature.md through
# tests/fixtures/e2e/scenarios/full_workflow.yaml, against mock providers — and
# diffs the normalized bundle against the baseline captured on the
# `phase3-pre-refactor` tag (272f946). The acceptable diff threshold is **zero**:
# identical instructions over pinned mock fixtures must produce a byte-identical
# normalized bundle, so any diff is an instruction-following change to be
# explained, not noise.
#
# Intentional changes are therefore *declared here*, never discovered by reading a
# failure. Each entry is a normalized JSON-pointer path (the vocabulary
# `diff_bundles` reports in) plus a one-line rationale. Two rules keep the file
# from decaying into a blanket ignore:
#
#   1. A diff outside this list fails the guard.
#   2. An entry that no longer matches anything ALSO fails the guard — a stale
#      allowlist row is a lie about what the refactor did.
#
# `pointer` is matched as a prefix against the reported path, so one entry can
# cover a subtree (e.g. `/phases/generate-tasks`) without enumerating leaves.
# `pointer` may not be `/` — a blanket ignore is not expressible on purpose.
#
# Phase 3 task 7 shipped with this list EMPTY, which is the strongest possible
# outcome: the host-neutral rewrite of instructions/*.md (7a), the additive
# capability data plus `--host` plumbing (7b) and the Claude Code shim cutover
# (7c) each reproduced the pre-refactor bundle exactly. Nothing about the
# machinery is vacuous — see `test_allowlist_mechanism_is_not_vacuous`, which
# drives a synthetic diff through both rules.

changes:
  - pointer: /phases/review-plan/created_paths
    rationale: >
      D4a's compare-and-set is now interprocess: every read-modify-write of
      `.status.json` holds `{phase}/.status.lock` (utils/status_file.py,
      `checkpoint_lock`) across the comparison and the atomic replace, because
      the run's own writers — worker, heartbeat, `status` close-out, `--abort`,
      `--sweep` — are separate processes that a thread lock cannot serialize.
      The mutex file is created next to the checkpoint it guards, so the phase
      writes one more path than the baseline; nothing else about the phase
      changed. Every entry after it shifts by one index because the bundle
      flattens lists positionally, which is why this covers the list rather
      than a leaf.
  - pointer: /output_root_paths
    rationale: >
      The same checkpoint files seen from the plan output root, with the same
      positional shift: `review-plan/.status.lock` for the mutex above, plus
      `code-review/.status.json` and `code-review/.status.lock` for the
      review-code checkpoint declared under
      `/phases/code-review/created_paths` below. Both fan-out phases in this
      fixture write a checkpoint now, so both dirs carry a mutex beside one.
  # ---------------------------------------------------------------------------
  # L1 (§9.3.d) — canonicalised model specs.
  #
  # `resolve_models` used to hand back `--models` / `defaults.models` verbatim,
  # bare (prefix-less) entries included, and every consumer re-resolved the same
  # bare string through its *own* `parse_model_spec` — only some of them
  # anchored. That is what let one `sonnet` become the project's `gemini:sonnet`
  # in validation and `cursor-agent:sonnet` at the spawn, in one run. It now
  # resolves each entry once, against the anchor it already accepts, and returns
  # `provider:model`, so the spec set entering both lanes is closed under
  # `parse_model_spec` and no later site can change the provider.
  #
  # This guard's fixture drives `--models cursor-agent` — a bare spec that
  # happens to be spelled like a provider name — which resolves against the
  # fixture's `default_provider: cursor-agent` to `cursor-agent:cursor-agent`.
  # Same provider, same model, same routing; only the spelling moved. It shows up
  # in two places, both declared below rather than discovered: model
  # *attribution* strings copied from the resolved spec list, and the per-model
  # artifact names, which `sanitize_model_name` derives from the same spec.
  #
  # Pointers are leaf-exact on purpose. JSON-pointer prefixes cannot express "any
  # index", so naming the *field* means naming the leaf; a container-level
  # pointer (`…/grouped.json/groups`) would also excuse a changed group id or
  # count, which is precisely what this guard exists to catch. The fixture is
  # pinned, so these indices do not churn without a deliberate re-capture.
  # ---------------------------------------------------------------------------
