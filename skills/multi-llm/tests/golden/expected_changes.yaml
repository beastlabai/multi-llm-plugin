  # `priority_score` and `total_chars`, across all three batches. Placed after
  # the L1 model-spec and `prior_changes_id` leaf entries above (both under
  # this same subtree) so those keep matching by list order first — this entry
  # only absorbs what neither of them already explains.
  # ---------------------------------------------------------------------------
