  - cli: muse
    binary: muse
    version: "Muse Code 0.1.0 (0.1.0-R708.1)"
    probe: ok
    help_invocation: "muse exec --help"
    help_sha256: 0fdca4a01db7369a5a4ab7a1c2db8c2f2702318d8ca3534b01087da2734a4cc7
    help_bytes: 3331
    profiles: [generate]
    subcommands: [exec]
    options:
      # RIG-INJECTED, not emitted by MuseProvider.build_command: this row's ONLY
      # redirect mechanism is argv (six config keys across auth.json and
      # settings.json were proved negative), so redirect.yaml's `argv_inject`
      # adds it after `exec` and the wrapper is the one place it comes from.
      # Unprobed, it would be the single unasserted link in every muse row.
      - "--base-url"
      - "--disable-approval"
      - "--json"
      - "--model"

  - cli: opencode
