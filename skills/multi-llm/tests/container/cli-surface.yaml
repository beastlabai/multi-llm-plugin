# Per-CLI surface contract — the ONE upstream-facing drift signal (C8 part two).
#
# WHY THE ARGV GOLDEN IS NOT THIS. Both sides of `expected_argv.yaml` originate in
# this repository, so it cannot move when upstream does: if a CLI renames or drops
# a flag, the wrapper keeps logging the argv *we* generate, byte-identical to the
# expected table, and the assertion stays green while the real binary rejects the
# call. Read that table as coverage of our own build_command(). THIS file is the
# half that can see upstream.
#
# Captured 2026-08-14 against the pinned image, offline. `options` is derived from
# each adapter's own build_command()/build_agent_command() across every profile it
# declares — never hand-listed — so the contract cannot drift from what we
# actually dispatch. The derivation runs against a prompt that NAMES AN EXISTING
# ABSOLUTE PATH, not a bare word: aider's argv is prompt-conditional (`--read
# <path>` per existing path it finds), so a bare prompt would derive a contract
# thinner than every aider row really dispatches.
#
# `options` also carries, per row, the flags the RIG injects that no adapter ever
# emits — redirect.yaml's `argv_inject`, which today is muse's `--base-url` alone.
# Presence is the same question for those: muse has no env var and no config key
# for the redirect, so if upstream drops the flag every muse container row breaks
# exactly as if an adapter flag had gone. Each is called out in its row.
#
# TWO ASSERTIONS, DELIBERATELY OF DIFFERENT STRENGTHS:
#   * presence is HARD — every option must still appear in that version's help.
#     A missing one fails the row naming the CLI, the pinned and installed
#     versions, and the option that disappeared: a pre-written bug report.
#   * help_sha256 is SOFT — help text that changed while every option we need
#     survived is REPORTED, not failed. That is the early warning a deprecation
#     notice is. codex's `--full-auto` -> `--sandbox workspace-write` is exactly
#     this class: the argv golden stays green straight through it, while the probe
#     sees the note appear and then the removal.
#
# The invocation is per CLI and is NOT always `<cli> --help`: goose, codex, muse,
# kilocode and opencode list only subcommands at the top level, so a contract
# taken there would be made of the wrong text.

version: 1
captured_on: "2026-08-14"
image: mllm-e2e:local

clis:

  - cli: aider
    binary: aider
    version: "aider 0.86.2"
    probe: ok
    help_invocation: "aider --help"
    help_sha256: 78282bb738f1d378d138db8302310a2cdd3542f3cadff38b958bef9178883314
    help_bytes: 29760
    profiles: [generate]
    options:
      - "--chat-history-file"
      - "--input-history-file"
      - "--message"
      - "--model"
      - "--no-analytics"
      - "--no-auto-commits"
      - "--no-check-update"
      - "--no-detect-urls"
      - "--no-fancy-input"
      - "--no-gitignore"
      - "--no-pretty"
      - "--no-show-model-warnings"
      - "--no-show-release-notes"
      - "--no-stream"
      # Prompt-conditional: one pair per existing absolute path the prompt
      # names, which is how the plan file reaches the model (aider's own
      # mention auto-add never matches absolute paths). expected_argv.yaml
      # asserts it on BOTH aider rows, so it is dispatched on every real run.
      - "--read"
      - "--yes-always"

  - cli: claude-code
    binary: claude
    version: "2.1.232 (Claude Code)"
    probe: ok
    help_invocation: "claude --help"
    help_sha256: 71ad650f59e08ae40ede14c534db4f49d8590ee5a4f92f6da2882d3a5560fea6
    help_bytes: 16886
    profiles: [generate, agent-readonly, agent-write]
    options:
      - "--allowed-tools"
      - "--disallowed-tools"
      - "--model"
      - "--output-format"
      - "--permission-mode"
      - "-p"

  - cli: cline
    binary: cline
    version: "3.0.55"
    probe: ok
    help_invocation: "cline --help"
    help_sha256: 5eb3b0a80e8dd33501f32f4b4d8996390d21604e8719f39caee8e3ecb1c06242
    help_bytes: 3768
    profiles: [generate]
    options:
      - "--json"
      - "-P"
      - "-m"

  - cli: codex
