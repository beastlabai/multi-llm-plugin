    help_bytes: 3681
    profiles: [generate, agent-readonly, agent-write]
    subcommands: [exec]
    options:
      - "--json"
      - "--model"
      - "--sandbox"

  - cli: gemini
    binary: gemini
    version: "0.25.2"
    probe: ok
    help_invocation: "gemini --help"
    help_sha256: b9c445819e0e31abb68742003b46bcc636438b8ddd9c7a4dfa52b7723d413a10
    help_bytes: 2648
    profiles: [generate]
    options:
      - "--model"
      - "--output-format"

  - cli: goose
    binary: goose
    version: "1.41.0"
    probe: ok
    help_invocation: "goose run --help"
    help_sha256: d40a8beaa569fdd633ff74662ee2597ff950e46da6d57cb6d9022362da584adc
    help_bytes: 4056
    profiles: [generate]
    subcommands: [run]
    options:
      - "--max-turns"
      - "--model"
      - "--no-profile"
      - "--no-session"
      - "--output-format"
      - "--provider"
      - "--with-builtin"
      - "-q"
      - "-t"

  - cli: grok
    binary: grok
    version: "grok 0.2.93 (f00f96316d)"
    probe: ok
    help_invocation: "grok --help"
    help_sha256: 371d1463e8a58eb945faba09bd572d3ac35f0649cf805c5f90b34b65c997238b
    help_bytes: 5587
    profiles: [generate]
    options:
      - "--always-approve"
      - "--output-format"
      - "--reasoning-effort"
      - "-m"
      - "-p"
    hidden_options:
      # Accepted by the binary but ABSENT from its help. Asserted by
      # acceptance rather than by presence: `grok --no-auto-update --help`
      # exits 0 while a bogus flag exits 2, so the CLI does validate flags
      # and acceptance is meaningful evidence. If upstream ever REMOVES it,
      # the accept-probe flips to rejected and the row fails — which a
      # presence-only contract could never catch, since it is already absent.
      - "--no-auto-update"

  - cli: kilocode
    binary: kilocode
    version: "7.4.19"
    probe: ok
    help_invocation: "kilocode run --help"
    help_sha256: 597c9d88f9e64c63f17871b6fafe660d268f97e4d00fc92555529678b3ffdbce
