    version: "omp/18.12.6"
    probe: ok
    help_invocation: "omp --help"
    help_sha256: 02b2d737374f07bdd127e3bfc53851cb09fbeded50a0f2b36f71a970cf2685a9
    help_bytes: 16269
    profiles: [generate]
    options:
      - "--approval-mode"
      - "--config"
      - "--cwd"
      - "--mode"
      - "--model"
      - "--no-session"
      - "--tools"
      - "-p"
