    probe: ok
    help_invocation: "pi --help"
    help_sha256: 7e4c9e558ae8e1b64f6ebeb5a28d9f7dee8a99fcf99197cc4610f642861a3dba
    help_bytes: 10705
    profiles: [generate]
    # `--mode` since plan §7 (T7.9, hand edit): `pi --help` at 0.87.1 documents
    # it ("Output mode: text (default), json, or rpc"); the help sha was
    # unchanged at the time. `--tools` since review-run-scope-salvage-and-
    # failure-visibility T3.1, also by hand: `--tools, -t <tools>  Comma-
    # separated allowlist of tool names to enable` at 0.87.1, help sha likewise
    # unchanged then. Both re-verified present, same wording, at 0.99.1 — the
    # 2026-09-30 re-seed moved the digest for unrelated reasons (new flags like
    # `--skill`, `--prompt-template`, `--use-theme`, `--fork`, `--offline`, and
    # a longer provider-env-var list, none of them options this adapter emits).
    # `--no-mcp` since fix round 24 (pi 1.1.0: "Disable built-in MCP support:
    # no servers connect and no MCP tools"), which PiProvider now passes because
    # 1.1.0's `--tools` keeps MCP tools; the 1.1.0 digest above already has it.
    options:
      - "--mode"
      - "--model"
      - "--no-mcp"
      - "--no-session"
      - "--tools"
      - "-p"
    # HAND-KEPT, never seeded: the accepted FORM of an option whose value format
    # is load-bearing, as a phrase the help line introducing it must contain.
    # Presence alone is not enough for `--tools`: pi drops unknown tool names
    # silently, so if upstream changed the separator, PiProvider's one
    # comma-joined value would become a single unknown name and pi would review
    # with no tools at all while every presence check stayed green. Checked as
    # hard as presence (tests/test_container_cli_surface.py).
    option_forms:
      "--tools": "Comma-separated"

