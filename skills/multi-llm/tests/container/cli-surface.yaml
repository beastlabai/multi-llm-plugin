  # omp. `pi --help` and this one describe two different products now: omp's is
  # 15,004 bytes against pi's 10,307 (2026-09-30), and every flag this adapter
  # adds over pi's argv (`--mode`, `--config`, `--approval-mode`, `--tools`,
  # `--cwd`) is documented there, so the seeder reported `missing_options: []`
  # and this row needs no forced-full-help invocation.
  #
  # TWO FLAGS THE ADAPTER EMITS ARE DELIBERATELY ABSENT from this list, and their
  # absence is the seeder's rule rather than an oversight: the contract is
  # derived from `build_command(prompt, model)` with no slot timeout and no
  # effort, so `--max-time` and `--thinking` — both CONDITIONAL emissions, both
  # documented at 18.2.2 (and still at 18.4.4) — never appear in the derivation.
  # They are not unguarded: `OmpProvider.build_command` runs `missing_flags`
  # over exactly the set THAT call will emit before it assembles anything, and
  # refuses the dispatch by the name of the flag a build lacks
  # (`OmpFlagsUnconfirmed`). So a rename upstream is a named launch failure
  # rather than a silent argv, which is the same guarantee this row gives for
  # the eight below.
  - cli: omp
