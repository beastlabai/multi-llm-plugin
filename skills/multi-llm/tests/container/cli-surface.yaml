  # THE ONE ROW WHOSE ONLY OTHER COVERAGE IS CREDENTIALED. cursor-agent has no
  # provider-lane row and can never have one (binary protobuf over Connect-RPC —
  # there is nothing a stub can answer), so the argv golden and the full-chain
  # bundle are permanently out of reach for it. This probe is not: it needs the
  # binary and nothing else, runs `--network none` as uid 10001, and costs
  # nothing. It is also the exact signal the `--mode ask` regression needed —
  # `--mode` disappearing, or its `ask` value changing meaning, is what breaks an
  # adapter that declares `supports_file_output = False` *because* of it.
  #
  # `--trust` and `--mode` are additionally gated at spawn time: the adapter reads
  # this same help before it will emit them and refuses the slot (`version-too-
  # low`) if either is absent. So this row failing and every cursor slot refusing
  # are the same event, seen a build earlier.
  # THE ROW THAT WAS DROPPED BY HAND, and the reason it was. copilot's npm entry
  # point is a loader that self-extracts its native runtime into
  # $XDG_CACHE_HOME; the image pre-warms /opt/mllm/copilot-cache and
  # redirect.yaml's row pins the variable there, but this probe used to run with
  # the ambient environment — so the loader landed on the noexec tmpfs $HOME and
  # printed `Failed to load package index ... Native addon "runtime" not found`.
  # 2.3 KB of error text, all nine options "missing".
  #
  # It could not self-exempt either: `probe: none` is recorded only when the help
  # invocation produces NO output, and an error message is output. So the row
  # that would have failed the presence assertion was removed by hand, and the
  # one proprietary CLI in the image — the only one whose help we cannot read on
  # a developer's laptop — was left with no upstream drift signal at all.
  #
  # The probe now passes the row's own `env_extra` (and nothing else), which is
  # what makes this a real `probe: ok` row rather than an honest-looking
  # `probe: none` that would have been a false statement.
  - cli: copilot
    binary: copilot
    version: "GitHub Copilot CLI 1.0.86."
    probe: ok
    help_invocation: "copilot --help"
    help_sha256: 24506daa60bbddea5954593190fb247b7694317bef1daa95411b45d53b014de9
    help_bytes: 13519
    profiles: [generate]
    subcommands: []
