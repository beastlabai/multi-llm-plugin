# Per-CLI surface contract — the ONE upstream-facing drift signal (C8 part two).
#
# WHY THE ARGV GOLDEN IS NOT THIS. Both sides of `expected_argv.yaml` originate in
# this repository, so it cannot move when upstream does: if a CLI renames or drops
# a flag, the wrapper keeps logging the argv *we* generate, byte-identical to the
# expected table, and the assertion stays green while the real binary rejects the
# call. Read that table as coverage of our own build_command(). THIS file is the
# half that can see upstream.
#
# RE-SEEDED 2026-09-19, after the whole pin set moved to latest. The digest half
# of this contract is a deprecation notice to READ, so it is not re-seeded as a
# side effect of moving a pin — and it was read before these rows were written:
# `seed_cli_surface.py` was run against the rebuilt pinned image and its
# `missing_options` was empty for every CLI, i.e. **not one option any adapter
# dispatches disappeared** across 17 simultaneous upgrades, majors included
# (kimi 0.36.1 -> 2.0.2, grok 0.2.93 -> 1.0.34, gemini 0.25.2 -> 0.60.0, muse
# 0.1.0-R708.1 -> 1.3.0-R3401.1). grok's `--no-auto-update` reads as missing in
# the raw probe and is not: it is already recorded in that row's
# `hidden_options`, still accepted at 1.0.34 (measured, exit 0), merely no longer
# listed in --help.
#
# Two drifts the same sweep DID find, both fixed in redirect.yaml rather than
# here, because neither was a surface change: gemini 0.60.0 added two
# non-interactive startup gates (auth-method selection, workspace trust) and grok
# 1.0.x added a `GET /` reachability probe and renamed its hardcoded
# session-title model to `grok-4.6`.
#
# RE-SEEDED 2026-09-23 for ten pin moves (codex 0.156.1, claude-code 2.1.280,
# opencode 1.18.32, cline 3.0.64, kilocode 7.7.9, pi 0.87.1, goose 1.52.0, grok
# 1.0.41, agy 1.2.9, omp 18.2.11). `missing_options` was grok's hidden
# `--no-auto-update` alone, still accepted at 1.0.41 (exit 0 against a bogus
# flag's 2). Three help digests moved, each read against the previous binary
# (whose help reproduced the old digest byte for byte) and each purely additive:
# claude-code reworded `--bare` and `--safe-mode`; pi lists META_API_KEY; omp
# added `--system-prompt-template`, four subcommands and three provider keys.
#
# RE-SEEDED 2026-09-30 for eighteen pin moves (codex 0.156.1 -> 0.159.2,
# claude-code 2.1.280 -> 2.1.285, gemini 0.60.0 -> 0.62.0, opencode 1.18.32 ->
# 1.18.33, cline 3.0.64 -> 3.0.66, kilocode 7.7.9 -> 7.8.1, kimi 2.0.2 -> 2.1.1,
# copilot 1.0.86 -> 1.0.89, qwen-code 0.24.1 -> 0.24.7, pi 0.87.1 -> 0.99.1,
# vibe 2.25.5 -> 2.25.8, grok 1.0.41 -> 1.0.44, muse 1.3.0-R3401.1 ->
# 1.4.1-R4503.1, cursor-agent 2026.09.18-9a7762b -> 2026.09.28-64d2043, agy
# 1.2.9 -> 1.2.14, omp 18.2.11 -> 18.4.4; aider and goose held). `missing_options`
# was grok's hidden `--no-auto-update` alone, still accepted at 1.0.44 (exit 0
# against a bogus flag's 2, both re-verified by hand). Seven help digests moved
# (agy, claude-code, copilot, cursor-agent, omp, pi, qwen-code), each read in
# full against the newly installed binary and each purely additive — no option
# any adapter dispatches disappeared from any of the eighteen. Nothing here
# needed a code change; the two worth recording for later:
#
#   * copilot 1.0.89 documents a new `--reasoning-effort <level>` flag (none,
#     minimal, low, medium, high, xhigh, max) that CopilotProvider does not
#     emit yet — a candidate for a future effort-suffix wiring, not a drift.
#   * qwen-code 0.24.7 marks `--telemetry*`, `--proxy` and `--sandbox-image`
#     `[deprecated: ... will be removed in a future version]` in its own
#     --help; none of the three is an option QwenProvider emits.
#
# grok's row also drops `--reasoning-effort` from `options:` here (see that
# row's own comment): it was listed as an unconditional documented option, but
# GrokProvider only emits it for a `model:effort` suffix and this file's
# derivation runs with the row's plain `stub-model`, so the flag never appears
# in a real probe. Handled the way qwen-code's `--max-wall-time` and omp's
# `--max-time`/`--thinking` already are — named in a comment, asserted nowhere
# — rather than silently dropped or left asserting a shape the seeder can never
# reproduce.
#
# RE-SEEDED 2026-10-02 for one pin move, opencode 1.18.33 -> 1.18.34 (`make
# opencode-bump`, the newest release being the only supported one): the help
# digest and the derived options are unchanged, so only the row's version moved.
#
# RE-SEEDED 2026-10-08 for sixteen pin moves (fix round 24: `make
# e2e-lock-update` plus the archive and PyPI rows by hand, and `make
# opencode-bump`): codex 0.159.2 -> 0.161.0, claude-code 2.1.285 -> 2.1.293,
# gemini 0.62.0 -> 0.63.0, opencode 1.18.34 -> 1.18.35, cline 3.0.66 -> 3.0.69,
# kilocode 7.8.1 -> 7.8.8, copilot 1.0.89 -> 1.0.93, qwen-code 0.24.7 -> 0.25.0,
# pi 0.99.1 -> 1.1.0, vibe 2.25.8 -> 2.26.0, goose 1.52.0 -> 1.53.0, grok 1.0.44
# -> 1.0.46, muse 1.4.1-R4503.1 -> 1.4.3-R5018.1, cursor-agent
# 2026.09.28-64d2043 -> 2026.10.01-e373342, agy 1.2.14 -> 1.3.1, omp 18.4.4 ->
# 18.8.3 (kimi and aider held). `missing_options` was grok's hidden
# `--no-auto-update` alone, still accepted at 1.0.46 (exit 0 against a bogus
# flag's 2, re-verified by hand). Ten help digests moved (agy, claude-code,
# cline, codex, copilot, muse, omp, pi, qwen-code, vibe); each was read against
# the newly installed binary, every option an adapter dispatches still documented
# with the same form, none marked deprecated. codex's row gains `-c`, which every
# codex argv has carried since dac3372 (`-c features.plugins=false`) and this
# file had not recorded. Worth knowing, none needing a code change here:
#
#   * vibe 2.26.0 makes the "Unified Harness" its default runtime
#     (`--experimental-harness` is now redundant, `--legacy-harness` forces the
#     old Python one): the runtime behind VibeProvider's argv changed without a
#     flag changing.
#   * qwen-code 0.25.0 marks `-p/--prompt` deprecated (the positional prompt is
#     preferred) and lists `qwen auth` as removed; QwenProvider uses neither.
#   * codex 0.161.0 documents `-p/--profile` as config-profile v2 (layering
#     `$CODEX_HOME/<name>.config.toml`); CodexProvider passes no profile.
#
# RE-SEEDED 2026-10-09 for ten pin moves (`make e2e-lock-update` for the npm layer
# and the grok/muse/omp downloads, goose, agy and vibe by hand): codex 0.161.0 ->
# 0.162.0, claude-code 2.1.293 -> 2.1.295, cline 3.0.69 -> 3.0.70, copilot 1.0.93
# -> 1.0.94, vibe 2.26.0 -> 2.26.1, goose 1.53.0 -> 1.54.0, grok 1.0.46 -> 1.0.50,
# muse 1.4.3-R5018.1 -> 1.4.4-R5419.1, agy 1.3.1 -> 1.3.2, omp 18.8.3 -> 18.8.7
# (gemini, kilocode, kimi, qwen-code, pi, opencode, aider and cursor-agent held).
# `missing_options` was grok's hidden `--no-auto-update` alone, still accepted at
# 1.0.50 (exit 0 against a bogus flag's 2, re-verified by hand). Four help digests
# moved (cline, muse, omp, vibe); the other six rows moved their version only. Each
# changed help was diffed against the previous pin's own binary, whose digest
# reproduced the one recorded here before the diff was read; every option an
# adapter dispatches is documented in the same form and none is marked
# deprecated. What changed, none needing a code change here:
#
#   * cline 3.0.70: `--retries` takes `<count>` (was `[value]`) and defaults to 3
#     (was 6), `-k/--key` now also saves the key as the provider's, the reasoning
#     effort's omitted case follows the level last chosen with `/model`, and the
#     `dashboard` command is gone; ClineProvider passes none of them.
#   * muse 1.4.4: `muse exec` gains `-c/--config <KEY=VALUE>` (repeatable, values
#     are JSON) and names `--effort` as an alias of `--reasoning-effort`;
#     MuseProvider uses neither.
#   * omp 18.8.7: the digest moved only because the help opens with the version
#     banner (`omp v18.8.3` -> `omp v18.8.7`); no option line changed.
#   * vibe 2.26.1 adds `--time-limit`, `--prompt-file` and `--output-dir`
#     (export.json plus a session journal on every exit) and documents the
#     programmatic exit codes: 0 finished, 1 usage or config error, 2
#     infrastructure failure, 3 stopped by a limit. VibeProvider's docstring says
#     every failure it measured exits 1 (2.24.1, 2.26.0); whether 2.26.1 now
#     exits 2 or 3 where it exited 1 was not re-measured here.
#
# Captured 2026-08-14 against the pinned image, offline. `options` is derived from
# each adapter's own build_command()/build_agent_command() across every profile it
# declares — never hand-listed — so the contract cannot drift from what we
# actually dispatch. The derivation runs against a prompt that NAMES AN EXISTING
# ABSOLUTE PATH, not a bare word: aider's argv is prompt-conditional (`--read
# <path>` per existing path it finds), so a bare prompt would derive a contract
# thinner than every aider row really dispatches.
#
# `options` also carries, per row, the flags the RIG injects that no adapter ever
# emits — redirect.yaml's `argv_inject`, which today is muse's `--base-url` alone.
# Presence is the same question for those: muse has no env var and no config key
# for the redirect, so if upstream drops the flag every muse container row breaks
# exactly as if an adapter flag had gone. Each is called out in its row.
#
# TWO ASSERTIONS, DELIBERATELY OF DIFFERENT STRENGTHS:
#   * presence is HARD — every option must still appear in that version's help.
#     A missing one fails the row naming the CLI, the pinned and installed
#     versions, and the option that disappeared: a pre-written bug report.
#   * help_sha256 is SOFT — help text that changed while every option we need
#     survived is REPORTED, not failed. That is the early warning a deprecation
#     notice is. codex's `--full-auto` -> `--sandbox workspace-write` is exactly
#     this class: the argv golden stays green straight through it, while the probe
#     sees the note appear and then the removal.
#
# The invocation is per CLI and is NOT always `<cli> --help`: goose, codex, muse,
# kilocode and opencode list only subcommands at the top level, so a contract
# taken there would be made of the wrong text.

# RE-SEEDED 2026-10-22 after seventeen CLI upgrades (aider unchanged).
# All documented options remain present, and grok's hidden --no-auto-update
# still passes the bogus-flag control. Reviewed the changed help: no dispatched
# option was removed; qwen retains its existing deprecated flags. omp 18.12.6
# now loads natives for --help, so redirect.yaml points PI_NATIVES_DIR at the
# image's pre-extracted addons. Probes ran offline as uid 10001 with all
# capabilities dropped; this host's Snap Docker rejects no-new-privileges even
# for /bin/echo in the official Node base, so the full posture gate is unverified.
#
version: 1
captured_on: "2026-08-14"
image: mllm-e2e:local

clis:
  # Captured from the checksummed Vercel 0.0.14 binary, 2026-10-22.
  - cli: fx
    binary: fx
    version: "0.0.14"
    probe: ok
    help_invocation: "fx ask --help"
    help_sha256: 25db350082aa92b568843273c3ff59883d9cbf24446edc6d584bb46e89183448
    help_bytes: 3099
    profiles: [generate]
    subcommands: [ask]
    options: ["--auto", "--json", "--model", "--no-save"]


  # THE ROW WITH NO OTHER COVERAGE AT ALL, and the reason `surface_probe` exists.
  # agy reaches no stub -- its auth resolves BEFORE the first RPC, and
  # GEMINI_API_KEY + GOOGLE_API_KEY + GOOGLE_GEMINI_BASE_URL set together were
  # measured producing a byte-identical auth failure with ZERO requests reaching
  # a stub -- so it has no provider-lane row, no argv golden and no full-chain
  # bundle, and unlike cursor-agent it has no live lane either (that needs a
  # file-store OAuth token nobody has staged yet). This probe is everything this
  # binary gets, and it costs nothing: offline, credential-free, uid 10001.
  #
  # `agy --help` prints to STDERR with stdout EMPTY and exits 0. Both the seeder
  # and the gate concatenate the two streams, which is what makes this a real
  # `probe: ok`; reading stdout alone would have self-exempted the row as
  # `probe: none` -- an honest-looking false statement about a binary that
  # documents every flag we emit.
  #
  # Captured 2026-08-19 against agy 1.1.15, with the row's own
  # AGY_CLI_DISABLE_AUTO_UPDATE=true. That variable is not decoration here: with
  # `=1` agy was measured spawning a background updater and rewriting itself
  # mid-run, and it publishes DAILY -- so a re-seed on a later day is expected to
  # move both `version` and `help_sha256`, and that movement is upstream cadence,
  # not a deprecation. Read the help before moving the digest anyway.
  - cli: agy
    binary: agy
    version: "1.4.5"
    probe: ok
    help_invocation: "agy --help"
    help_sha256: a12355e8fc064b330eeb25ba52de596406582752442e293083bcda6388a63b78
    help_bytes: 2907
    profiles: [generate]
    subcommands: []
    options:
      - "--dangerously-skip-permissions"
      - "--model"
      - "--new-project"
      - "--output-format"
      # Derived, not hand-listed: the adapter renders a Go duration from the
      # caller's resolved timeout (`print_timeout_value`), and the flag is how
      # agy's own print-mode cutoff is held UNDER the parent's deadline so agy
      # writes its `status: ERROR` envelope instead of being killed.
      - "--print-timeout"
      # NOT a positional prompt: `-p` is the short alias of `--print` and carries
      # the prompt AS ITS VALUE. Every other CLI in this file takes its prompt
      # positionally or after `-p` as a separate token, so this is exactly the
      # spelling an upstream rename would break silently -- the argv golden
      # compares our argv against our own table and would stay green.
      - "-p"

  - cli: aider
    binary: aider
    version: "aider 0.86.2"
    probe: ok
    help_invocation: "aider --help"
    help_sha256: 78282bb738f1d378d138db8302310a2cdd3542f3cadff38b958bef9178883314
    help_bytes: 29760
    profiles: [generate]
    options:
      - "--chat-history-file"
      - "--input-history-file"
      - "--message"
      - "--model"
      - "--no-analytics"
      - "--no-auto-commits"
      - "--no-check-update"
      - "--no-detect-urls"
      - "--no-fancy-input"
      - "--no-gitignore"
      - "--no-pretty"
      - "--no-show-model-warnings"
      - "--no-show-release-notes"
      - "--no-stream"
      # Prompt-conditional: one pair per existing absolute path the prompt
      # names, which is how the plan file reaches the model (aider's own
      # mention auto-add never matches absolute paths). expected_argv.yaml
      # asserts it on BOTH aider rows, so it is dispatched on every real run.
      - "--read"

  - cli: claude-code
    binary: claude
    version: "2.1.308 (Claude Code)"
    probe: ok
    help_invocation: "claude --help"
    help_sha256: b10f5c36adfe3285f6c5a0d18284f466e6c4486499de56ef62745e13312a7fbc
    help_bytes: 22311
    profiles: [generate, agent-readonly, agent-write]
    options:
      - "--allowed-tools"
      - "--disallowed-tools"
      - "--model"
      - "--output-format"
      - "--permission-mode"
      - "-p"

  - cli: cline
    binary: cline
    version: "3.0.73"
    probe: ok
    help_invocation: "cline --help"
    help_sha256: 04d834c4ae0cc8ea0bf304351a54a4d534acfb52f92c40fa6e28bd290ddef651
    help_bytes: 3993
    profiles: [generate]
    options:
      - "--json"
      - "-P"
      - "-m"

  - cli: codex
    binary: codex
    version: "codex-cli 0.163.0"
    probe: ok
    help_invocation: "codex exec --help"
    help_sha256: df0d864ca2076f7654288c6a1e3394e3eaa2ea8f15021df2524efdd90c70986c
    help_bytes: 4331
    profiles: [generate, agent-readonly, agent-write]
    subcommands: [exec]
    options:
      - "--ephemeral"
      - "--json"
      - "--model"
      - "--sandbox"
      - "--skip-git-repo-check"
      - "-c"                  # `-c features.plugins=false` on every argv since dac3372

  # THE ONE ROW WHOSE ONLY OTHER COVERAGE IS CREDENTIALED. cursor-agent has no
  # provider-lane row and can never have one (binary protobuf over Connect-RPC —
  # there is nothing a stub can answer), so the argv golden and the full-chain
  # bundle are permanently out of reach for it. This probe is not: it needs the
  # binary and nothing else, runs `--network none` as uid 10001, and costs
  # nothing. It is also the exact signal the `--mode ask` regression needed —
  # `--mode` disappearing, or its `ask` value changing meaning, is what breaks an
  # adapter that declares `supports_file_output = False` *because* of it.
  #
  # `--trust` and `--mode` are additionally gated at spawn time: the adapter reads
  # this same help before it will emit them and refuses the slot (`version-too-
  # low`) if either is absent. So this row failing and every cursor slot refusing
  # are the same event, seen a build earlier.
  # THE ROW THAT WAS DROPPED BY HAND, and the reason it was. copilot's npm entry
  # point is a loader that self-extracts its native runtime into
  # $XDG_CACHE_HOME; the image pre-warms /opt/mllm/copilot-cache and
  # redirect.yaml's row pins the variable there, but this probe used to run with
  # the ambient environment — so the loader landed on the noexec tmpfs $HOME and
  # printed `Failed to load package index ... Native addon "runtime" not found`.
  # 2.3 KB of error text, all nine options "missing".
  #
  # It could not self-exempt either: `probe: none` is recorded only when the help
  # invocation produces NO output, and an error message is output. So the row
  # that would have failed the presence assertion was removed by hand, and the
  # one proprietary CLI in the image — the only one whose help we cannot read on
  # a developer's laptop — was left with no upstream drift signal at all.
  #
  # The probe now passes the row's own `env_extra` (and nothing else), which is
  # what makes this a real `probe: ok` row rather than an honest-looking
  # `probe: none` that would have been a false statement.
  - cli: copilot
    binary: copilot
    version: "GitHub Copilot CLI 1.0.102."
    probe: ok
    help_invocation: "copilot --help"
    help_sha256: d3eb12c9c2bf565ad101ea0e89664638e7707bb6361e4ab24b45d39dea01ccf3
    help_bytes: 14753
    profiles: [generate]
    subcommands: []
    options:
      - "--disable-builtin-mcps"
      - "--log-level"
      - "--model"
      - "--no-ask-user"
      - "--no-auto-update"
      - "--no-custom-instructions"
      - "--output-format"
      - "--stream"
      - "-p"

  - cli: cursor-agent
    binary: cursor-agent
    version: "2026.10.19-6bbf2c4"
    probe: ok
    help_invocation: "cursor-agent --help"
    help_sha256: c24026e17118188478fcb47ed8113fa842f93df2043da5116660a368d3dc64b0
    help_bytes: 5991
    profiles: [generate]
    subcommands: []
    options:
      - "--mode"
      - "--model"
      - "--output-format"
      - "--print"
      - "--trust"

  - cli: gemini
    binary: gemini
    version: "0.65.0"
    probe: ok
    help_invocation: "gemini --help"
    help_sha256: b5c6e1af180f48adb3700982e7b06e905f29d2965f047eaeebd0b5c4f676b632
    help_bytes: 3989
    profiles: [generate]
    options:
      - "--model"
      - "--output-format"

  - cli: goose
    binary: goose
    version: "1.55.0"
    probe: ok
    help_invocation: "goose run --help"
    help_sha256: c6c76cbcf38ba3839df9e36b66bee049c435bb9ec9ba320404fa87ca5b353583
    help_bytes: 4312
    profiles: [generate]
    subcommands: [run]
    options:
      - "--max-turns"
      - "--model"
      - "--no-profile"
      - "--no-session"
      - "--output-format"
      - "--provider"
      - "--with-builtin"
      - "-q"
      - "-t"

  - cli: grok
    binary: grok
    version: "grok 1.0.67 (2fe064390d07)"
    probe: ok
    help_invocation: "grok --help"
    help_sha256: 5f1fce5a2c6bed62f49a503ba3770e02dd5832f1fac1c7f8ea96a8c72dd85219
    help_bytes: 5148
    profiles: [generate]
    options:
      - "--always-approve"
      - "--output-format"
      - "-m"
      - "-p"
      # NOT listed, deliberately, matching qwen-code's `--max-wall-time` and
      # omp's `--max-time`/`--thinking` below: `--reasoning-effort` is emitted
      # only when `split_reasoning_effort(model, REASONING_EFFORTS)` finds a
      # `model:effort` suffix (GrokProvider.build_command), and this file's
      # derivation runs with redirect.yaml's plain `model_arg: "stub-model"` —
      # deliberately chosen there so this row's model matches every other
      # row's, per that file's own comment — which carries no suffix, so the
      # flag never appears in a real probe. It IS documented at 1.0.44
      # ("--reasoning-effort <EFFORT> ... [aliases: --effort]") and its form is
      # pinned by test_providers.py's test_grok_build_command_all_reasoning_
      # efforts, which derives the exact `-m <base> --reasoning-effort
      # <effort>` argv for every accepted suffix.
    hidden_options:
      # Accepted by the binary but ABSENT from its help. Asserted by
      # acceptance rather than by presence: `grok --no-auto-update --help`
      # exits 0 while a bogus flag exits 2, so the CLI does validate flags
      # and acceptance is meaningful evidence. If upstream ever REMOVES it,
      # the accept-probe flips to rejected and the row fails — which a
      # presence-only contract could never catch, since it is already absent.
      - "--no-auto-update"

  - cli: kimi
    binary: kimi
    version: "2.3.0"
    probe: ok
    help_invocation: "kimi --help"
    help_sha256: f5a0ed1d6b6ab479f0f6b3a931cc7cb1cab72d7499199c372ac8658f788ee624
    help_bytes: 3506
    profiles: [generate]
    subcommands: []
    options:
      - "--output-format"
      - "-p"

  - cli: qwen-code
    binary: qwen
    version: "0.26.0"
    probe: ok
    # NOT `qwen --help`: five of the options this adapter emits are HIDDEN and
    # absent from the visible help, and qwen returns 0 for a bogus flag whenever
    # --help is present -- which makes the `hidden_options` route vacuous (its
    # own control catches that). An unknown argument without --help dumps the
    # complete option list deterministically, so that is the surface probed.
    # See the redirect.yaml row for the full reasoning.
    help_invocation: "qwen --mllm-force-full-help"
    help_sha256: d999156ce62198709ad79aafb752897f3ce5b1733e535fbe328a1347cbeb279c
    help_bytes: 11979
    profiles: [generate]
    subcommands: []
    options:
      - "--bare"
      - "--chat-recording"
      - "--max-session-turns"
      - "--max-tool-calls"
      - "-m"
      - "-o"
      # NOT listed, deliberately: `--max-wall-time` is emitted only when the
      # caller passes a timeout, and seed_cli_surface derives this list from
      # `build_command()` with `timeout_s=None` (§1's guard -- that call renders
      # argv byte-identical to omitting the keyword). It IS documented by the
      # probed surface, and its presence is pinned by expected_argv.yaml's
      # `<timeout>` placeholder plus test_providers.py's derivation table.

  - cli: kilocode
    binary: kilocode
    version: "7.8.15"
    probe: ok
    help_invocation: "kilocode run --help"
    help_sha256: 4fff43529130e190fee0b7336c8187fe31298d364ffbaf25d50caa237e2a3300
    help_bytes: 3261
