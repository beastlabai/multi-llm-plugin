# MODEL POLICY FOR THE HOST LANE (operator decision 2026-10-01, scoped to running
# multi-llm tests). Spend on CHEAP models only:
#   * claude-code billed through OpenRouter -> `openai/gpt-6-luna`. NOT DeepSeek:
#     its tool-call markup (DSML) leaks through Claude Code's Anthropic skin as
#     literal text (recorded at claude-code-review-plan and apply-native below).
#   * claude-code on the Claude subscription (`--creds fallback` /
#     MLLM_E2E_HOST_CREDS=fallback) -> Haiku or Sonnet.
#   * every other OpenRouter host (codex, opencode, ...) ->
#     `deepseek/deepseek-v4.1-flash` ($0.03 in / $0.50 out / $0.01 cache-read per
#     M, prices as of 2026-10-01), not `~deepseek/deepseek-v4-flash-latest` (the
#     0731 build, $0.0108 / $1.28 per M, which also hangs under opencode
#     `--variant`).
#   * NEVER `anthropic/claude-haiku-4.5` through OpenRouter ($1 / $5 per M).
# SUBSCRIPTIONS FIRST (operator decision 2026-10-02). codex and claude-code run
# on the developer's OWN subscription whenever the credential file `creds.yaml`
# allowlists for them is present (`harness.default_host_creds` -> `fallback`),
# and fall back to the OpenRouter pins above only when it is absent:
#   * codex on the Codex subscription -> `gpt-6-luna`, reasoning effort `high`.
#   * claude-code on the Claude subscription -> `sonnet`.
#   * opencode declares no `subscription:` block and ALWAYS uses OpenRouter.
# The pin lives in each host's `subscription.model` block, read by
# `entrypoint.subscription_model` and recorded by `harness`. MLLM_E2E_HOST_CREDS
# still forces one mode on every row. Nothing from a subscription credential is
# ever written to a tracked file: the copied files are scrubbed by value from
# every artifact (`entrypoint.fallback_secret_values`), and `runs/` and
# `records/` are gitignored.
# A per-run override goes through MLLM_HOST_MODEL (outranks row and host pins).
# Slugs named in attempt logs, `detail:` and `usd:` rows below are HISTORY; only
# `model:` blocks are live. Pins switched 2026-10-01 carry `provenance: unmeasured`
# until a row of that kind runs on them; the comment above each says what has.
# ---------------------------------------------------------------------------
hosts:

  # ===========================================================================
  claude-code:
    # `install-host claude-code` writes NOTHING, so the reference host needs a
    # stage step of its own. `installable: false` makes install a refusal in those
    # words, and --check reads the PLUGIN'S OWN SKILL.md under the running skill
    # root: a green check proves the shipped shim's shape and this machine's
    # prerequisites, and proves nothing about whether Claude Code can FIND the
    # skill. Left implicit, every claude-code row would fail the discovery
    # assertion behind a passing install step.
    stage:
      form: link
      target: "$HOME/.claude/skills/multi-llm"
      source: /opt/mllm/skill
      then: "install-host claude-code --check --project-root /work/sample-project"
      provenance: verified
      measured: >
        A directory symlink to the skill tree, then --check: rows 3-5 green, rows
        1-2 reported n/a ("host 'claude-code' is not installable: its shim is the
        plugin's own SKILL.md"), auth=unknown, exit 0. `install-host claude-code
        --global` refuses with "`install-host claude-code` is --check-only" and
        exit 3, exactly as capabilities.yaml declares.
        WHAT GETS STAGED IS THE WHOLE TREE, never SKILL.md alone: every command in
        that shim is `uv run --project "${CLAUDE_SKILL_DIR}" -- python
        "${CLAUDE_SKILL_DIR}/multi_llm.py" ...`, so a lone file leaves the host
        expanding the variable at a directory with no dispatcher in it.
        A SYMLINK rather than a copy because that is the mechanism this repo
        already runs the skill through (link-skill.sh) and the one
        cli_common's skill-dir resolution is written for (abspath, symlinks
        preserved, NEVER realpath, so `uv run --project` stays on the
        pyproject.toml the host loaded). It also keeps the check honest: under a
        link the file --check reads and the file the host loads are one inode and
        cannot drift.
      copy_fallback:
        # If the host declines to traverse a symlinked skill directory. It must
        # NOT try to carry a second uv environment: the root filesystem is
        # read-only and the env is materialized into the image layer at build
        # time, so the copy runs with UV_PROJECT_ENVIRONMENT pinned and no sync,
        # and the row additionally byte-compares the copied SKILL.md against
        # /opt/mllm/skill/SKILL.md — two files can drift where one inode cannot.
        env: {UV_PROJECT_ENVIRONMENT: /opt/mllm/skill/.venv}
        assert: "byte-compare copied SKILL.md against /opt/mllm/skill/SKILL.md"
    reload: none
    list_step:
      form: none
      provenance: verified
      note: >
        MEASURED: no credential-free listing surface exists. `claude --help` shows
        no skills/commands listing, and `claude doctor` (which explicitly "reads
        settings files in the current directory without a trust prompt", so it was
        the best candidate) never names a staged skill. `claude plugin` manages
        plugins, not skills. So discovery on this host can only be proven by a
        PROMPTED turn, which needs a credential — and the --creds none tier
        therefore reports this host as `discovery: unavailable-without-credential`
        rather than passing it. A green `install-host --check` is NOT discovery:
        it reads our own bytes at our own path.
    # MEASURED 2026-08-14 — the permission/trust cell, and it is the ARGV flag,
    # not the settings file. A synthesized `$HOME/.claude/settings.json` carrying
    # `permissions.allow` was read far enough to let the **Skill** tool through
    # (without it the host cannot even open our shim: the very first thing it
    # does is call `Skill{skill: multi-llm}`, and a denial there sends it hunting
    # for the file by hand until its turn budget runs out) — but every Bash rule
    # in that same file was ignored: `command -v uv` and the shim's own
    # `uv run --project …` were both denied, i.e. the host loaded our shim and
    # then could not run a single command in it. The identical rule list passed
    # as `--allowedTools` ran first time. Never a `--dangerously-*` bypass.
    invoke_argv: ["claude", "-p", "<prompt>", "--output-format", "json",
                  "--max-turns", "<N>", "--model", "<model>",
                  "--allowedTools", "<allowed-tools>"]
    invoke_provenance: verified
    permission_form:
      mechanism: "--allowedTools, one argv token PER RULE, and the flag must be LAST"
      comma_join: "REFUSED IN PRACTICE — see note"
      source: "SKILL.md's own `allowed-tools` frontmatter + Skill / Skill(multi-llm)"
      provenance: verified
      note: >
        DERIVED, never invented: the grant list is the shipped shim's own
        declaration, so the rig cannot become a second source of truth for what
        the shim needs. The two additions are the one grant frontmatter cannot
        carry — permission to invoke the skill at all.
        A settings.json `permissions.allow` block is NOT a substitute (measured
        above); it is still written, because it is what carries the trust entry
        and the onboarding flag.
        THE FLAG'S OWN SHAPE IS PART OF THE MEASUREMENT. `claude --help` says
        `--allowedTools <tools...>  Comma or space-separated list`. A single
        comma-joined token is accepted and is silently WRONG: every rule that
        contains a space — `Bash(command -v uv)`, `Bash(PYTHONUNBUFFERED=1 uv:*)`
        — stops matching, and the space-free rules around it (`Read`) stop
        matching too. Measured twice: comma-joined, the host loaded the skill
        (`Skill` has no space) and then had all seven of its tool calls denied,
        including `uv run … util instructions ask` and a plain `Read` of the
        instruction file; one token per rule, with `--allowedTools` last because
        it is variadic, ran first time.
    prompt_template: |
      Use the multi-llm skill with exactly these arguments: {args}
      Follow the skill's own instructions step by step and run the commands it
      gives you. Do not summarise instead of running them.
    cwd: /work/sample-project
    # MEASURED: 12 was not enough. The first credentialed row burned all 12 —
    # one on the denied Skill call, the rest hunting for the file by hand — and
    # ended `is_error: true, stop_reason: tool_use`. A shim-following run is
    # ~8 tool turns (skill load, uv preflight, `util instructions`, the
    # dispatcher, a read-back), so 25 left headroom for one retry without
    # turning the bound into a licence.
    #
    # RAISED 25 -> 40 on 2026-08-15, and the reason is the DISTRIBUTION, not one
    # bad row. `claude-code-ask` hit `error_max_turns` at num_turns 26 against
    # --max-turns 25 while its dispatcher receipt still read `state: done,
    # exit: 0` — the phase completed, three seconds before the cap.
    # The turn count on this row has always been wide, and the recorded
    # `measured: turns: 12` below is one sample out of five taken that day:
    #
    #   2026-08-14  9, 11, 12, 13(capped at the old 12), 21   ← argv byte-identical
    #   2026-08-15  26                                        ← argv byte-identical
    #
    # 25 was set when the observed tail was 21, i.e. four turns of headroom, and
    # 26 is one turn past it. Nothing the shim asks for grew: both runs produced
    # the same two dispatcher receipts (`util instructions ask`, then `ask …`),
    # both completed the phase, and `host-run.json`'s argv is byte-for-byte the
    # same as the 2026-08-14 pass — SKILL.md last moved on 2026-08-08 (3a6d62c)
    # and instructions/ask.md's last edit (e4e43a9, 11:39 UTC) predates that
    # 19:01 UTC pass by seven hours, so both runs read identical bytes.
    # What moved is the model behind the `~`-prefixed ALIAS this matrix
    # already flags as a moving target, which improvised for ~22 turns between
    # reading the instructions and dispatching (two of its Bash calls denied:
    # `grep … | head` does not match `Bash(grep:*)`, and `python3 -c` is granted
    # nowhere). The cheaper, faster, higher-turn shape says so too: 166 s and
    # $0.0113 for 26 turns against 295 s and $0.0204 for 12.
    # 40 clears the observed tail by half again rather than by one turn. The
    # real ceiling on a runaway row is `wall_clock_s` below, not this.
    #
    # RAISED 40 -> 60 on 2026-08-21, same rule as the 25 -> 40 raise above and
    # the same shape of evidence: a row that hit the cap with its work DONE.
    # `claude-code-apply-native` reached `num_turns: 41` against --max-turns 40
    # in run 20260821T034820Z and exited 1 (`is_error: true, stop_reason:
    # tool_use`) — having already run all three write batches (batch-index 1, 2
    # and 3, each with its `prior-changes append` and `metrics record`),
    # `util metrics finish --phase apply-code-fixes`, the verification step, and
    # `util metrics report`. It stopped ONE command short of the finalization.
    #
    # What grew is not the model's improvisation but the instruction: R1
    # (plans/harness-residual-work.md §1) added a required post-loop
    # `apply-code-fixes --plan-file <plan> --mark-completed` step to
    # instructions/apply-code-fixes.md, because the phase never recorded its own
    # completion without it. That is one more mandatory dispatcher turn on the
    # longest row in the matrix, and 40 was calibrated before it existed. This
    # is therefore the 2026-08-15 case exactly: the bound, not the row, is what
    # was wrong.
    #
    # 60 is chosen the way 40 was — clear the observed tail (41) by half again,
    # not by one turn — so a row that legitimately needs a retry still has room
    # and the bound does not become a licence. `wall_clock_s` below remains the
    # real ceiling on a runaway row: this run used 768 s of its 900 s bound, so
    # raising turns cannot let one run unboundedly.
    turn_bound: {kind: max-turns, value: 60}
    # ADAPTER CHANGES OF 2026-08-16 (§7.3/L6, §3.6/L7, §9.8/L8) — this cell is
    # UNCHANGED, and that is a finding, not an omission. Provenance: derived,
    # 2026-08-16, from the adapters' own builders read offline (no container run).
    #
    #   * `invoke_argv` above launches claude-code AS A HOST, i.e. the argv that
    #     loads SKILL.md and runs the dispatcher. It is not
    #     `ClaudeCodeProvider.build_command`, so a provider-side flag never
    #     appears in it. Adding one here would make the host lane launch an argv
    #     no code emits.
    #   * §3.6's `--fallback-model` is emitted only from a configured
    #     `providers.claude-code.fallback_models`, and the shipped value is an
    #     EMPTY map — so on this lane the provider argv is byte-for-byte what it
    #     has always been, and `expected_argv.yaml`'s three claude-code rows still
    #     match (re-derived offline through `seed_expected_argv.adapter_shapes`).
    #   * §9.8's `--` separator lands only on the ARGV transport of the two agent
    #     profiles. Both container rows are `transport: stdin`, where the adapter
    #     drops the separator along with the prompt it shields, so those rows are
    #     byte-identical too.
    #   * §7.3's `CLAUDE_CODE_MAX_RETRIES=3` / `API_TIMEOUT_MS` are child-process
    #     ENV, not argv. They reach a provider child through `wrapper.py`'s
    #     carry-over allowlist (widened for exactly these two names); the HOST
    #     process launched by `invoke_argv` is unaffected, since `get_env()` is
    #     applied per provider dispatch and never exported by the harness.
    #   * §4.2/M7's `--json-schema` is emitted only when a CALLER attaches a
    #     schema (`invoke_with_provider(schema_phase=…)`), and no lane in this
    #     matrix does — `schema=None` renders argv byte-for-byte as before, which
    #     `tests/test_structured_output.py` asserts against L5's frozen capture
    #     over all thirteen adapters. Its pinned `MAX_STRUCTURED_OUTPUT_RETRIES=1`
    #     is child ENV on the same terms as the two names above, and is carried
    #     by the same `wrapper.py` allowlist.
    #     T3 EVIDENCE, 2026-08-16, host lane, ZERO paid tokens: the adapter's own
    #     rendered argv for `generate-tasks` — `claude -p --output-format json
    #     --json-schema <generated_tasks.schema.json> --model <m> <prompt>` — was
    #     run VERBATIM against a localhost Anthropic stub at claude 2.1.233. Exit
    #     0 in ONE request, `structured_output` present, `parse_output` unchanged.
    #     The same argv against a stub whose tool input omits
    #     `estimated_complexity` exits 1 as `error_max_structured_output_retries`
    #     after ONE request (the pin working), and a prose-only stub exits 0,
    #     `subtype: success`, with NO `structured_output` key — §4.2.1's trap,
    #     measured.
    parser: utils/providers/claude_code.py
    # WHERE THE INNER MULTI_LLM_RESULT LINE LANDS — and on this host it does NOT.
    result_line_in_stream:
      status: absent
      provenance: verified
      where: "nowhere: `--output-format json` emits ONLY the final result envelope"
      truncated: null
      note: >
        MEASURED 2026-08-14, and it is the strongest case in the matrix for the
        receipt being the anchor rather than merely the primary one. The pinned
        invocation's whole stdout is a single JSON object (`is_error`, `usage`,
        `permission_denials`, `result`, …) with no per-turn tool results in it at
        all, so the dispatcher's own stdout never reaches the harness. The one
        occurrence of the string in the entire stream is the agent PARAPHRASING
        it in its final prose: "`MULTI_LLM_RESULT.next` was `null`".
        `--output-format stream-json` would carry the tool results — but that is
        a different pinned cell and would still only move the line into a nested
        escaped envelope, as it is on the other two hosts.
    result_source: "the uv wrapper's receipt — there is no second source here"
    credential_mode: openrouter
    credential_provenance: verified          # measured 2026-08-14, live row
    credential_note: >
      MEASURED, exactly as the plan documented it: ANTHROPIC_BASE_URL =
      https://openrouter.ai/api (the bare `/api` origin — Claude Code appends
      `/v1/messages` itself), ANTHROPIC_AUTH_TOKEN = <key>, and
      ANTHROPIC_API_KEY present-and-EMPTY, asserted at launch. The run's own
      envelope confirms the routing (`modelUsage` keyed by the OpenRouter slug).
      ONE THING TO DISTRUST IN THAT ENVELOPE: its `total_cost_usd` is WRONG on
      this path. The row reporting `total_cost_usd: 0.2061` really spent $0.0204
      — Claude Code prices the tokens as if they were first-party Anthropic
      ("provider": "firstParty"), which they are not. Only the key's own `usage`
      delta is a spend figure on this lane.
    # The plan's original documented wiring is unchanged by the measurement
    # above; it was right. Only the cost-envelope caveat is new.
    #
    # THE HOST-WIDE PIN. Two of this host's three rows drive it; the third,
    # `claude-code-apply-native`, overrides it with a `model:` block of its own
    # (added 2026-08-21, after four failures that were the model rather than the
    # shim — the derivation is beside that row). `entrypoint.pinned_model`
    # resolves MLLM_HOST_MODEL > the row block > this one.
    # SWITCHED 2026-10-01 (see the MODEL POLICY block above `hosts:`) from the
    # 2026-08-14 pin `~deepseek/deepseek-v4-flash-latest`, `verified`; that block's `why:` below is
    # the history of the old pin. Evidence on the new slug: only measured on the claude-code-next-command row (runs/20261001T114907Z, passed, skill route); the ask / review-plan / write rows have never run on luna.
    model:
      slug: "openai/gpt-6-luna"
      arg: ["--model", "openai/gpt-6-luna"]
      provenance: unmeasured
      resolved_on: "2026-10-01"
      why: >
        OPERATOR CHOICE (2026-08-14): deepseek v4 flash latest on every host, for
        cost. Resolved against the live catalog: $0.08/M in, $0.16/M out, 1M
        context, tool-calling supported — about half the price of the previously
        pinned `deepseek/deepseek-v4-flash-0731`.
        TWO THINGS THIS TRADES AWAY, recorded rather than buried:
        (1) It is a `~`-prefixed ALIAS. The plan pins slugs precisely so a model
        cannot move under a run — an alias is a moving target, so a golden or a
        cost-table row keyed to it can change meaning without a diff. Accepted
        deliberately here; revisit if a row starts drifting for no reason.
        (2) On `claude-code` this is a NON-ANTHROPIC model, and the OpenRouter
        cookbook warns Claude Code "may not work correctly with other providers".
        Tool-calling fidelity is exactly what the host lane grades, so a failure
        on that row may be the model rather than our shim. The verified Anthropic
        fallback is `anthropic/claude-haiku-4.5` ($1/M in) — measured working
        through the skin on 2026-08-14.
    # THE SUBSCRIPTION PIN (operator decision 2026-10-02, see the MODEL POLICY
    # block above `hosts:`): the model a `fallback` row drives on the developer's
    # own Claude subscription. The OpenRouter `model:` pins above, row pins
    # included, are OpenRouter slugs and do not apply on that path.
    subscription:
      model:
        slug: "sonnet"
        provenance: unmeasured
        resolved_on: "2026-10-02"
        why: >
          Claude Code on the subscription costs nothing on the OpenRouter key,
          and the memory rule for test runs is Haiku or Sonnet there. Sonnet is
          the one the 2026-10-01 three-host run drove through all eight phases
          (plans/2026-10-01-three-host-racing-run.md); `sonnet` is Claude Code's
          own alias, which its catalog resolves.
    auth_check: none
    auth_check_note: >
      claude-code declares no auth_check (utils/providers/claude_code.py:115), so
      its executor preflight is `unknown` rather than refused. It is deliberately
      absent from the positive/negative auth row pair, and its native write row
      never crosses /opt/mllm/bin to reach that gate at all.
    baked_flags: ["--host claude-code"]
    # `--yes` is NOT baked (SKILL.md:87) where the two rendered shims bake it, so
    # an unattended row must carry it itself.
    must_type_explicitly: ["--yes"]
    forbidden_flags:
      # --detach is forbidden by this host's own shim, and would rewrite the row:
      # it implies --exec-subagents, converting this plan's one native-dispatch
      # row into an executor row.
      - "--detach"
      - "--exec-subagents"
    dispatch: foreground
    continuation:
      who: host
      mechanism: native Task, then re-invoke the printed `next`
      receipts_expected: ">=2"
      note: >
        subagents: native means the orchestrator stops at [VALIDATION_PENDING] /
        [CONSOLIDATION_PENDING], prints the reaggregate command as `next`, and
        exits 0 — so its first receipt reads state: done with a NON-NULL next and
        the phase NOT completed. A row that produced exactly one `state: done`
        receipt with a live `next` fails as "dispatched, never continued".
        Every one of those Task turns is real spend: native dispatch never crosses
        /opt/mllm/bin, so "the fan-out is stubbed" is true of the provider
        subprocesses on every host and of the SUBAGENT BATCHES only on the two
        executor hosts.
    # -----------------------------------------------------------------------
    # STRUCTURAL LIMIT: THIS HOST CANNOT TAKE A `--full` ROW.
    #
    # Recorded as a cell rather than left as an absence, because the other two
    # hosts each carry one (`codex-full`, `opencode-full`) and a matrix that
    # simply omits the third row says "nobody got to it" where the truth is "the
    # product forbids it here". §6.3's rule: a committed, measured "not
    # applicable, because …" is an acceptable cell; an untested one is not.
    #
    # DERIVED 2026-08-19 from `full_workflow_orchestrator.py` read offline, not
    # from a run — no `--full` row has ever been launched on any host. Provenance
    # is `derived`, and the first `codex-full` pass is what would promote it.
    #
    # `forbidden_flags` above is the whole cause: this host's own shim refuses
    # both `--exec-subagents` and `--detach`, so a `full` invocation here is
    # necessarily foreground AND necessarily native-subagent. Two walls follow,
    # in the order a run would hit them:
    #
    # (1) PHASE 1 NEVER COMPLETES. `full` runs each phase by calling that phase's
    #     `main(argv)` in-process (`run_mode`), and forwards `--exec-subagents`
    #     only if it was given (`common_flags`). Without it, `review-plan` fans
    #     out to the native invoker, stops at [VALIDATION_PENDING], prints the
    #     `--reaggregate` follow-up as `next` and exits 0 with the phase
    #     DELIBERATELY not recorded — exactly what `claude-code-review-plan`
    #     measured on 2026-08-14. `_verify` grades the artifact, not the claim
    #     ("exited 0 but state.json records no completion for 'review-plan'"),
    #     `_phase_failed` prints the follow-up and exits 3, and no later phase
    #     runs. There is no invoker inside `full` to run those Task batches: the
    #     agent would have to re-invoke `next` from outside the process it is
    #     waiting on.
    # (2) AND PAST IT, PHASE 2 STALLS THE SAME WAY FOR A DIFFERENT REASON. Even
    #     granting an agent that re-invokes `next` until review-plan records
    #     itself, `apply-suggestions` is a write phase that marks itself
    #     completed when it EMITS its batch document. `_unexecuted_batches`
    #     exists for precisely that lie: with `--exec-subagents` unset it counts
    #     the emitted batches, `_unexecuted_write_phase` prints
    #     [WRITE_PHASE_NOT_EXECUTED] — "nothing applied them: `full` runs every
    #     phase inside this one process, so with --exec-subagents unset there is
    #     no invoker between this phase and the next" — and the workflow exits 3
    #     again. Three of the remaining phases are write phases and would each do
    #     the same.
    #
    # AND THE AGENT HAS ALREADY FAILED THE ONE THING THAT COULD RESCUE IT, TWICE.
    # Both walls are only survivable by an agent that re-invokes the printed
    # `next` between phases. This host's measured record on that is
    # `claude-code-review-plan`: it dispatched, stopped at the marker, began
    # running the validation batches through its own Task tool and never
    # re-invoked the dispatcher — on BOTH model attempts. A `--full` row would be
    # asking the same host to do that up to eight times in a row, at
    # $0.239-per-review-plan spend, to reach a state the other two hosts reach in
    # one turn.
    #
    # NOT PAPERED OVER, and specifically not by any of the three tempting fixes:
    # dropping `--exec-subagents` from `forbidden_flags` would make the rig
    # launch an invocation the shipped shim tells the agent never to type; adding
    # `--detach` would convert this host's one NATIVE-dispatch row set into
    # executor rows and delete the only native coverage in the matrix; and
    # widening `_verify` to accept a phase that recorded no completion would
    # break the artifact-over-claim rule that makes every other row mean
    # anything.
    full_row: not-applicable
    full_row_provenance: derived
    full_row_reason: >
      Its shim forbids --exec-subagents and --detach, so `full` stops at
      review-plan's [VALIDATION_PENDING] (exit 3, phase not recorded) and, past
      that, at apply-suggestions' [WRITE_PHASE_NOT_EXECUTED] — both survivable
      only by an agent that re-invokes the printed `next`, which this host has
      measurably failed to do twice. 8-of-8 phase coverage through a real host
      is carried by `codex-full` and `opencode-full` instead.
      THAT EVIDENCE SENTENCE IS CORRECTED 2026-09-22, and the conclusion is not:
      "measurably failed to do twice" was true of 2026-08-14's two attempts and
      is NOT a permanent incapacity — two of the four 2026-09-22 runs DID
      re-invoke the printed `--reaggregate` and recorded
      `phases_completed["review-plan"]` (`claude-code-review-plan`'s
      `re_measured:` block). What the same four runs also measured is that the
      host turn is FLAKY: 7 pass / 4 fail over eleven turns, in two shapes, one
      of which is precisely "stopped on return from a backgrounded native Task
      batch, never continued". A `--full` row needs that continuation up to
      eight times consecutively, so an intermittent continuation is a weaker
      basis for one than a reliable one would be, not a stronger one. The
      per-turn record is `claude-code-apply-native`'s `measured:` block.
      NOT A BARE ABSENCE, AND UPDATED 2026-09-22 TO SAY SO: 8-of-8 on THIS host
      is reached one phase at a time instead of in one `full` turn. `phase_rows:`
      immediately below records the four READ phases — `review-plan`,
      `generate-tasks`, `review-tasks`, `code-review` — as dated
      `not-applicable` cells, each with its own reason and each naming **T4a**;
      three WRITE phases are authored as rows at the end of `rows:`
      (`claude-code-phase-apply-suggestions`, `claude-code-phase-implement`,
      `claude-code-phase-apply-task-suggestions`, all **T4**); and the remaining
      two of the eight already exist under historical names —
      `apply-code-fixes` IS `claude-code-apply-native` and `review-plan` IS
      `claude-code-review-plan`. So this host's coverage reads *four write
      phases authored and unmeasured, four read phases measured-not-applicable*,
      which is explicitly NOT 8-of-8 and is explicitly not "nobody got to it".
    # -----------------------------------------------------------------------
    # THE FOUR READ PHASES, RECORDED RATHER THAN AUTHORED (T4a, 2026-09-22).
    #
    # Same triple shape as `full_row:` above — a verdict, a provenance word and
    # a reason — one entry per phase, because §6.3's rule is that a committed,
    # measured "not applicable, because …" is an acceptable cell and an untested
    # one is not. The union guard reads these cells, so a phase dropped from the
    # eight without one still fails in plain CI.
    #
    # §3.4's consequence 2, applied literally. The four read phases share ONE
    # unsolved step and therefore stand or fall together on T4a — and T4a IS
    # BLOCKED IN THIS CHANGE: making an isolated `review-plan` record itself
    # completed needs a keyed `make e2e-container-host` pass, which has not been
    # run. A `claude-code-phase-review-plan` row would be byte-for-byte the shape
    # that already failed twice; authoring it plus three siblings before T4a buys
    # four rows that dispatch and never complete, at ~$0.25-0.60 each. So this
    # host's stated outcome is **four write phases authored, four read phases
    # measured-not-applicable** — which is explicitly NOT 8-of-8, and is written
    # here rather than quietly missed.
    #
    # THE WALL IS THE SAME ONE `full_row_reason` NAMES, and it is INTERNAL TO THE
    # PHASE, which is why no amount of pre-command seeding touches it: with
    # `--exec-subagents` in `forbidden_flags` each of the four fans out to the
    # native invoker, prints the `--reaggregate` follow-up as `next`, and exits 0
    # with the phase DELIBERATELY unrecorded. Three of them print it from the
    # shared base (`utils/review_orchestrator_base.py:4426,5161`) and
    # `generate-tasks` carries its own (`generate_tasks_orchestrator.py:137,620`).
    # A recorded completion for ANY read phase therefore requires the host to
    # re-invoke `--reaggregate` — the one step `claude-code-review-plan` failed
    # on BOTH model attempts (see that row's `attempts:` block below, recorded
    # `partial` twice: the host began running the validation batches through its
    # own native Task tool and never re-invoked the dispatcher, so `state.json`
    # records no completion and only `validation_tasks.json` was materialized).
    phase_rows:
