        scenario: /opt/mllm/skill/tests/fixtures/e2e/scenarios/container_full_chain.yaml
        # Stated rather than defaulted: `wall_clock_s + 500` is the row's docker
        # timeout and it has to cover the pre-command leg too. Copied from the
        # twin, which measured 82.23 s of host wall against it.
        wall_clock_s: 900
        cost_budget_usd: 1.00   # UNMEASURED: a provisional stand-in, not an estimate — 2x headroom makes its ceiling the $2.00 lane default, so the lane total is what binds until a first pass replaces it
        expect:
          run: done
          exit: 0
          phases: [apply-suggestions]
          # C4 option (b), carried across unchanged: a real executor CLI pointed
          # at a tool-call-free stub can only ever come back with nothing moved,
          # so the row asserts THAT instead of hoping for an applied one. An
          # `applied` batch here fails just as loudly — bytes landing from a
          # tool-call-free stub means the redirect leaked.
          # CORRECTED 2026-09-22, FROM `clean-failure`, HOURS AFTER THIS ROW WAS
          # AUTHORED and for a reason that has nothing to do with the route: the
          # word was copied from the sibling rows, and the sibling rows had it
          # from `runs/20260820T093838Z`, which pre-dates `1633dd4` (2026-09-16).
          # That commit split `write_batch_scheduler`'s empty-diff branch by the
          # runner's CLAIM, and this lane's canned write-batch document has said
          # `{"status": "no-op"}` since 2026-08-15. The full derivation is at
          # `codex-apply-executor`'s own `write_outcome` cell; the short version
          # is that the leak guarantee is unchanged, because both words are
          # assigned only inside the classifier's `if not changed:` branch and
          # `applied` is reachable only past a NON-empty snapshot diff.
          write_outcome: no-op
          bytes_must_change: false
        measured:
          on: runs/20260922T124956Z
          provenance: measured-red
          blocked_on: [T4]
          detail: >
            THIS ROW HAS NOW RUN, on 2026-09-22, and the cell above is what it
            corrected. T0 and T0a landed on that run: the write batches went
            through `opencode:stub/stub-model` (the write report's own
