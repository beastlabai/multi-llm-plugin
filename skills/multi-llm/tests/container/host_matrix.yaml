        # single-row pass is evidence toward it and not the run that closes it;
        # this field flips when that bundle exists.
        provenance: measured-red   # runs/20260820T093838Z; R1 and R2 corrected on runs/20260821T082250Z (single-row), B2 owns the promotion
        note: >
          The ONE row on either lane where an `applied` batch is a pass rather than
          a rig bug, and this plan's only applied-byte coverage through a real
          host. Explicitly WITHOUT --exec-subagents: the shipped shim says "Never
          pass --exec-subagents on this host". An all-clean-failure result is
          reported as a FAILED row ("dispatched, nothing landed"), not a green one.
          D3 IS ANSWERED HERE, AND THE ANSWER IS "THE ROW NAMED THE WRONG PHASE".
          The row demands `bytes_must_change: true` under `paths: ["src/**"]`, and
          `apply-suggestions` declares exactly one file — the plan
          (`write_phase_bridge.py:80-82`, "The plan file is THE artifact") — which
          the grader's `_source_delta` then drops with everything else under
          `plans/` as workflow output. Two phases write `src/**`
          (`write_phase_bridge.py:117-171`): `implement` and `apply-code-fixes`.
          `apply-code-fixes` is the one chosen, and the reason that survived
          measurement is the ONE-COMMAND LEG: its only prerequisite is
          `code-review`, where `implement` needs `apply-suggestions` AND
          `generate-tasks`, i.e. three commands. That is the whole remaining
          argument for it.
          THE SECOND REASON THIS NOTE USED TO GIVE WAS WRONG, and is corrected
          here rather than dropped. It read "every issue in
          `code_review/container_issues.json` names `src/security.py` or
          `src/auth.py`, so `paths: ["src/**"]` needs no widening at all".
          `runs/20260820T093838Z` disproved it: the census diff for this row is
