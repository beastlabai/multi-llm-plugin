        # The `ask` rows need none: `ask` has no JSON schema.
        # `container_full_chain.yaml`, not `full_workflow.yaml`: under
        # --exec-subagents this phase also dispatches VALIDATION batches, and
        # the narrower scenario answers those with something that is not a
        # validation result — measured, all three batches `schema_invalid`
        # (rung 6, never retried), run.state failed, exit 3.
        scenario: /opt/mllm/skill/tests/fixtures/e2e/scenarios/container_full_chain.yaml
        measured:
          on: "2026-08-14"
          verdict: partial — the workflow completed, the SHIM was not followed
          usd: 0.0241
          host_wall_s: 304
          host_exit: 0
          phases_completed: [review-plan]
          run_state: "none — the agent never passed --detach"
          note: >
            The phase really completed: fan-out, grouping, three validation
            batches through --exec-subagents with NO failures, validation.json,
            report.md/html, and `state.json` recording review-plan completed.
            But the agent IMPROVISED rather than following the shim: it polled
            `status --wait` before starting anything (exit 2), then ran
            `review-plan --plan-file … --quick` with none of the baked flags and
