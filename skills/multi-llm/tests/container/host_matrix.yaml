        row: not-applicable        # as a NEW row. The phase is already covered.
        provenance: derived
        task: T4a
        reason: >
          NOT A NEW ROW — this phase IS `claude-code-review-plan` below, under
          its historical name, and it is already the isolated-single-phase shape
          §3.4 would otherwise author. It is recorded `partial` on BOTH model
          attempts (the `~deepseek/deepseek-v4-flash-latest` attempt leaked DSML
          tool-call markup as literal text; the `anthropic/claude-haiku-4.5`
          attempt at $0.2392 dispatched correctly and stopped at
          [VALIDATION_PENDING]), so adding a second row with the same argv would
          buy a second copy of the same measured failure. T4a is a RE-RUN of that
          row with the continuation named in it, not an authoring task: its
          acceptance check is `state.json` recording the phase completed DURING
          the host's own execution, with the model pin and the `--reaggregate`
          follow-up written into the row.
      generate-tasks:
        row: not-applicable
        provenance: derived
        task: T4a
        reason: >
          Blocked on the same [VALIDATION_PENDING]-class continuation wall as
          `review-plan`, from its own code path rather than the shared one:
          `generate_tasks_orchestrator.py:137,620` carries `--reaggregate`
          itself. With `--exec-subagents` forbidden here the phase fans out to
          the native invoker, prints the follow-up as `next` and exits 0 with the
          phase unrecorded, and its gradeable evidence — a recorded completion
          plus the `tasks/` artifact — is exactly what that exit withholds. The
          failure is INTERNAL TO THE PHASE, so the two-command leg
          (`review-plan`, `apply-suggestions`) that its
          `PHASE_PREREQUISITES` closure would need does nothing for it: seeding
          phases 1..n-1 from the rig cannot supply a continuation step the host
          declines to take. Authored only if T4a shows an isolated read phase can
          complete on this host.
      review-tasks:
        row: not-applicable
        provenance: derived
        task: T4a
        reason: >
          Same wall, from the shared base
          (`utils/review_orchestrator_base.py:4426,5161`): Task batches, then a
          `--reaggregate` the host has measurably not re-invoked. Its only
          gradeable evidence is a recorded completion, which is precisely what
          stopping at the marker withholds. Its leg would be the three-command
          closure (`review-plan`, `apply-suggestions`, `generate-tasks`) and
          would not help, for the reason above. Authored only after T4a.
      code-review:
        row: not-applicable
        provenance: derived
        task: T4a
        reason: >
          Same wall, same base, and the one read phase with NO prerequisites at
          all (`check_workflow_prerequisites.PHASE_PREREQUISITES` gives
          `code-review` none), so it has no leg to blame: if an isolated read
          phase could complete on this host, this is the row that would show it
          most cheaply — and that is T4a's question, asked once on `review-plan`
          rather than four times. Note the mode word / phase name split: mode
          `review-code` records phase `code-review`. Its OUTPUT is already
          exercised here, through `claude-code-apply-native`'s pre-command leg,
          which runs `review-code … --exec-subagents` from the RIG and whose
          receipts land in `receipts/<row>-pre/` — that is the rig completing the
          phase, never the host, and it is not coverage for this cell.
    # -----------------------------------------------------------------------
    # THIS HOST'S FAN-OUT SUBSET (T3 — UNMEASURED, authored 2026-09-22; no run
    # has ever fanned any host out past one provider). Six CLI IDS; see the
    # header block for why ids and never slugs, and for the three carve-outs.
    #
    # WHY THESE SIX, in the four terms §3.3's per-host review is made of:
    #
    # (1) THE THREE HOST CLIs ARE CROSS-ASSIGNED AS A 3-CYCLE, ON PURPOSE.
    #     `codex`-the-provider runs under the claude-code host (here),
    #     `opencode`-the-provider under the codex host, and
    #     `claude-code`-the-provider under the opencode host. All three hosts are
    #     also `lane: provider` rows (`redirect.yaml:90`, `:850`, `:1056`), and
    #     the SELF-pairing cell is the one today's lane already covers — every
    #     row on all three hosts fans out to `codex:stub-model` and nothing else.
    #     The untested cell is a CLI running as a provider UNDER ANOTHER VENDOR'S
    #     AGENT, with that host's env overlay and $HOME. It is an available
    #     assignment rather than a conflict to design around: `entrypoint.run_host`
    #     execs the host binary at its REAL path (`REAL_DIR/<binary>`,
    #     `entrypoint.py:2014-2027`) while PATH stays wrapper-first for the whole
    #     process tree, so a provider subprocess with the same name as the host
    #     still resolves through /opt/mllm/bin and is redirected. If the per-host
    #     review finds a cross cell infeasible — a host overlay colliding with
    #     the provider's own home — the self-pairing is the fallback and is
    #     written here as a dated cell rather than quietly taken.
    #
    # (2) A WIRE-SURFACE MIX, NOT AN ALPHABETICAL SLICE. This host carries BOTH
    #     `responses` CLIs — `codex` and `muse` — plus four `chat`. The codex
    #     host carries the one `gemini` surface plus four `chat`; the opencode
    #     host carries the one `anthropic` surface (`claude-code`) plus four
    #     `chat`. So no host can go green having exercised one wire shape.
    #
    # (3) THE PENALTY AND EGRESS-CHATTY CLIs GO TO THE HOST WITH THE FEWEST
    #     FAN-OUT ROWS, WHICH IS THIS ONE. Counted after this change: claude-code
    #     has TWO fan-out rows (`claude-code-ask`, `claude-code-review-plan`),
    #     the codex host four, the opencode host eight (six before §3.4's two new
    #     package rows). `claude-code-apply-native` and the three phase rows
    #     below it are `fan_out: native` carve-outs and multiply nothing. So the
    #     two CLIs whose cost is paid PER INVOCATION are placed where the
    #     multiplier is smallest:
    #       * `cline` pays ~7.5 s of blocked-egress wait every invocation —
    #         `redirect.yaml` records `turn_s: 1.448` against
    #         `turn_s_egress_blocked: 8.97`, and sizes its own `row_timeout_s:
    #         600` for the penalty rather than the fast path. On a fan-out row
    #         that multiplies by phases x batches, straight into `wall_clock_s`
    #         and through it into `row_timeout_s` (`wall_clock_s + 500`,
    #         `test_container_host_lane.py:531-532`).
    #       * `kilocode`'s measured call-home set is models.dev, api.kilo.ai and
    #         the registry.npmjs.org + github.com update-check pair 6 ms apart
    #         (`redirect.yaml:614-641`) — and that pair SURVIVES
    #         KILO_DISABLE_AUTOUPDATE, so it is per-invocation latency this lane
    #         cannot switch off.
    #
    # (4) EGRESS RECONCILED WITH THIS LANE'S POSTURE BEFORE PLACEMENT, NOT AFTER.
    #     The host lane runs on `bridge` with `egress: open`
    #     (`posture.yaml:56-68`: the credentialed host modes must reach
    #     openrouter.ai, so their guarantee downgrades from impossibility to
    #     DETECTION), which means `TestTheFanOutNeverWentLive`
    #     (`test_container_host_lane.py:992-1013`) catches a CLI reaching past
    #     the stub only because something grades it. The declared
    #     `egress_beyond_stub` CLIs were read against that before assignment:
    #     `goose` (empty host list), `cline` and `kilocode` here; `aider`
    #     (raw.githubusercontent.com) and `gemini` (play.googleapis.com) on the
    #     codex host. Every one of them is `fatal_when_blocked: false`, so none
    #     converts a detection lane into a blocked row — the reconciliation is
    #     about what must be GRADED, not about what would break.
    #
    # THE ASSIGNMENT IS `unmeasured`, AND IT IS RE-DERIVED RATHER THAN DEFENDED.
    # T3's one-row two-spec spike — widen exactly one `ask` row to two specs, run
    # it, and count the distinct provider invocations, stub sessions and result
    # files in that row's receipts — is what turns this list from a declaration
    # into coverage; the partition is coverage only when that count equals the
    # fan-out length. A provider the scenario cannot answer CONCURRENTLY under
    # `on_unmatched: fail` is reassigned to another host's subset, or recorded as
    # a dated carve-out cell in the `full_row: not-applicable` shape above —
    # never silently dropped, because the union guard reads those cells and a
    # drop nobody wrote down still fails in plain CI.
    fan_out:
      - codex        # 3-cycle leg 1: another vendor's agent CLI, run here as a
                     # provider. `responses` surface, `model_arg: gpt-5.5`.
      - muse         # the second `responses` CLI, and the reason this host cannot
                     # go green on `chat` alone. `model_arg: muse-spark-1.2`; its
                     # four background reminder observers are already in the
                     # scenario's negative-lookahead set (§5's scenario row).
      - cline        # per-invocation penalty CLI — see (3). `openai/stub-model`.
      - kilocode     # egress-chatty CLI — see (3). `stub/stub-model`.
      - pi           # `chat`, `stub/stub-model`. Also §3.1's chain-lane reviewer
                     # pin, so its wire shape is the best-answered in the scenario.
      - goose        # `chat`, `openai/stub-model`. Declares `egress_beyond_stub`
                     # with an EMPTY host list, and brings the session-TITLE
                     # request that fires even under --no-session — the trap the
                     # scenario's negative lookahead already carries a rule for.
    fan_out_provenance: unmeasured
    fan_out_reason: >
      T3. Authored 2026-09-22 from the per-host egress/timeout/env review above
      and never executed: today every row on this host fans out to exactly one
      provider (`codex:stub-model`, hard-coded at
      `test_container_host_lane.py:530`), so no measurement of a widened fan-out
      exists on any host. Re-derived from T3's one-row two-spec spike; the
      per-provider runtime correlation (an invocation in `calls.jsonl`, a
      `stub.jsonl` session, and that provider's own result file, all counted from
      the host-start watermark) is what makes it evidence rather than a
      declaration. Each inheriting row's `measured:` block and its `wall_clock_s`
      are RE-MEASURED on the first fan-out pass, never edited to a prediction.
    runner: opencode
    runner_provenance: unmeasured
    runner_reason: >
      T0a, and this is the key's first appearance in the file — read it here and
      the other two hosts' cells reference it.
      WHAT IT REPLACES: `test_container_host_lane.py:530` hard-codes
      `runner="codex:stub-model"` for every non-negative row on all three hosts,
      so the whole lane dispatches its write batches through codex — precisely
      the slug §1.4 predicts can no longer start. WHY NOT CODEX: codex's
      `agent-write` renders `--sandbox workspace-write`, which is bubblewrap,
      which needs an unprivileged user namespace that Docker's default seccomp
      profile denies. The D6 pre-dispatch sandbox probe landed 2026-09-17 — a
      month AFTER `runs/20260820T093838Z`, the run the four write rows below and
      on the other two hosts last passed on — so inside this image that probe now
      returns `unavailable` and `agent-write` raises `sandbox_unavailable` before
      a child ever starts. 3.1/3.2's change to `redirect.yaml`'s
      `chain_write_runner` does not reach this fixture: that key drives the chain
      lane only, which is why the host lane needs a key of its own.
      WHY OPENCODE: it is the same write-capable helper §3.2 picks for the chain
      lane, for the same three reasons — it declares `agent-write`, its profile
      is the application-level `--agent build` so it spawns NO sandbox, and it is
      itself a `lane: provider` row here, which keeps
      `test_redirect_matrix_claims.py`'s named-runner-is-itself-a-redirected-row
      guard true with no carve-out (`redirect.yaml:84-95`).
      A CLI ID, NOT A SLUG: the spec is built at read time from `model_arg`, so
      this renders `opencode:stub/stub-model`. The bare form is the exact defect
      R3 diagnoses — `ProviderModelNotFoundError: Model not found: stub-model/.`,
      raised before one HTTP call left the process.
      THE `remove_seed` ROWS ARE EXEMPT and keep `f"{host}:{negative_model}"`:
      their subject is the host preflighting ITS OWN configured runner against a
      deleted credential, so a shared runner would sail straight past the file
      the row removes and the row would assert nothing at all. They carry no
      `runner` key, and the guard asserts the absence rather than skipping them.
      THE RUNNER NEEDS A SEEDED HOME, AND `helpers` IS WHERE IT COMES FROM —
      which is why the disjoint partition does not starve two of the three hosts.
      The fixture turns a row's `helpers` into its seeded identities
      (`entrypoint.py:2375`, `seed_homes(identities)`) and `helpers` becomes the
      row's fan-out; `opencode` is in exactly ONE host's `fan_out` (the codex
      host's, by the 3-cycle) and must nonetheless have a home on all three.
      `helpers` is about SEEDED HOMES, `fan_out` is about GRADED PROVIDER
      COVERAGE, and the two sets are UNIONED at read time: the disjointness rule
      governs the second only. A runner with no seeded home fails preflight for a
      reason that has nothing to do with the phase under test.
      UNMEASURED: no row on this lane has ever dispatched a write batch through
      this runner. T0a is the task, and its acceptance check is the row's
      `subagent_audit.jsonl` naming a non-codex write runner with the write phase
      completing.
      WHAT IT REACHES ON THIS HOST, which has no executor rows at all: every
      `pre_commands` leg. `claude-code-apply-native`'s `review-code … --yes
      --quick --exec-subagents` and the three phase rows' legs below are the RIG
      dispatching with subagent execution on, so their batches route through this
      runner — which is why §3.4's phase rows sit behind T0a even though the host
      turn itself is `fan_out: native` and never crosses /opt/mllm/bin.
