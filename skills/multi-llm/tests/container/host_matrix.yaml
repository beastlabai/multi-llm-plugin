        cost_budget_usd: 1.00   # UNMEASURED: a provisional stand-in, not an estimate — 2x headroom makes its ceiling the $2.00 lane default, so the lane total is what binds until a first pass replaces it
        expect:
          run: done
          exit: 0
          phases: [apply-suggestions]
          # CORRECTED 2026-09-22, FROM `clean-failure`, AND THE WORD MOVED IN THE
          # PRODUCT RATHER THAN IN THE RIG. The full derivation lives here and the
          # two sibling apply rows point at it, so there is one copy of it.
          # WHAT CHANGED AND WHEN: `1633dd4` (2026-09-16, "Tell a no-op from a
          # failure, and track the files the write executor verified") split
          # `utils/write_batch_scheduler`'s empty-diff branch, which until then
          # had ONE verdict for three claims. Before it, ANY claim over an empty
          # diff was `clean-failure`. After it the branch reads the runner's own
          # claim: a `no-op` claim + empty diff is `WRITE_NO_OP` at `status: ok`;
          # a `failed` claim or a non-zero exit + empty diff is `clean-failure` at
          # `STATUS_BATCH_FAILED`; `applied`-or-no-status + empty diff stays
          # `clean-failure` at `status: ok`. The constant's own docstring
          # (`utils/subagent_executor.WRITE_NO_OP`) records why: labelling an
          # honest "already present" batch `(batch failed — …)` told the NEXT
          # batch, and the reader, that the work had failed.
          # WHY THIS ROW MOVED WITH IT, AND WHY NOTHING IN THE RIG DID: the claim
          # this stub makes has never changed. The canned write-batch document —
          # `fixtures/e2e/responses/write_batches/apply_suggestions.json` — is
          # `{"status": "no-op", "summary": "No edit tool call was made: …"}` and
          # has been since `f62cc89` (2026-08-15); `git log --follow` over it
          # returns that one commit and today's working tree does not touch it.
          # So `runs/20260820T093838Z` measured the PRE-`1633dd4` verdict of the
          # very same claim, and this cell was written to that verdict and then
          # outlived it by six days.
          # MEASURED 2026-09-22 on `runs/20260922T124956Z`: all four batches
          # `status: ok`, `write_outcome: no-op`, each reasoned "NO-OP: the batch
          # reported 'no-op' and the pre-batch snapshot comparison confirms no
          # byte changes in plans/auth-feature.md."
          # THE REDIRECT-LEAK CLAIM SURVIVES THE RENAME, which is what makes this
          # cell safe to move rather than load-bearing to keep. `WRITE_NO_OP` is
          # assigned ONLY inside the classifier's `if not changed:` branch — the
          # same branch `WRITE_CLEAN_FAILURE` lives in — and `WRITE_APPLIED` is
          # reachable only where the pre/post snapshot diff is NON-empty. What
          # disproves a leak is therefore the row refusing `applied` and
          # `partial-application`, never which of the two empty-diff words it
          # names, and `no-op` excludes both exactly as strictly. It is in fact
          # the STRONGER of the two here: `no-op` requires the runner's claim and
