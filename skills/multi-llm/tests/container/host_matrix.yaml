            `sandbox_unavailable` refusal appears anywhere in the bundle. The
            row reached `run: done`, exit 0, `phases: [apply-suggestions]`, four
            batches at `status: ok` / `write_outcome: no-op`, zero bytes moved,
            in 31.61 s of host wall clock and 10 stub requests past the
            host-start watermark — the cheapest of the three apply rows by a
            factor of four, exactly as the route promised.
            `measured-red` RATHER THAN `verified`, and the distinction is this
            file's whole point: that run graded the row RED, because
            `write_outcome` still read `clean-failure` — a verdict the classifier
            has not returned for this stub since `1633dd4`. This edit owns the
            correction. T4 stays open and now means one thing only: re-grade the
            row against the corrected cell, which is a container run this edit
            did not make.
        provenance: measured-red   # runs/20260922T124956Z — authored 2026-09-22, executed the same day; the `write_outcome` word was corrected here, T4 owns the promotion
        note: >
          THE WRITE ROW THE PACKAGE ROUTE DID NOT HAVE, and the only row on this
          route that dispatches a write batch at all. It is where the route
          difference and the write runner meet: the batch goes through the host
          block's `runner` (T0a, `opencode:stub/stub-model` built at read time),
          while the host's own dispatcher argv is composed by the plugin rather
          than retyped by a model. Both halves are unmeasured, and they fail
          distinguishably — a runner failure is a `sandbox_unavailable` or
          `ProviderModelNotFoundError` batch record, a route failure is a missing
          or improvised argv in `host-run.json`.
          WHY IT IS NOT REDUNDANT WITH `opencode-apply-executor`: the twin grades
          a 99-line prose runbook a model reads and retypes; this grades an
          11-line command that tells the model to call the `multi_llm` TOOL,
          whose `execute` composes the argv in JavaScript. `route: package` is
          read into `harness.Row.route`, which makes `build_run_argv` forward
          `--route package`, which makes `stage_host` stage NO file shim (two
          command sources in one $HOME would leave the plugin silently
          overwriting the shim's entry) and `_write_opencode_config` write
          `plugin[]`. Crediting a plugin run to the shim, or the reverse, would
          let either route rot behind the other's evidence.

