        scenario: /opt/mllm/skill/tests/fixtures/e2e/scenarios/container_full_chain.yaml
        remove_seed: ".codex/auth.json"
        # NO `fan_out` KEY AND NO `runner` KEY ON THIS ROW — BOTH ABSENCES ARE
        # DECLARED AND BOTH ARE ASSERTED, not merely skipped (§3.3's carve-outs).
        #
        # WHY NO `fan_out`: this row is graded on the refusal landing BEFORE the
        # first model call — `expect.stub_requests: 0`, counted from the
        # watermark `entrypoint` writes at the moment the host process starts —
        # which is UPSTREAM of any point a fan-out could act. A list here would
        # be unreachable as well as undesirable: it could not change what the row
        # measures, and it would hand the row five further ways to go red for
        # reasons that are not the refusal. The guard therefore excludes
        # `remove_seed` rows from both the union and the disjointness check, and
        # asserts the key's ABSENCE rather than ignoring the row.
        #
        # WHY NO `runner`: the host block's `runner: opencode` must NOT reach
        # this row. Its subject is the host preflighting ITS OWN configured
        # runner against the credential removed below, so the runner has to stay
        # this row's own CLI — `f"{host}:{negative_model}"`, built in the fixture
        # (`test_container_host_lane.py:525-530`) because it is the one place the
        # negative slug is spelled. A shared opencode runner would sail straight
        # past the `.codex/auth.json` this row deletes and the row would assert
        # nothing at all: preflight_runner would probe a credential nobody
        # touched, pass, and the refusal this row exists to observe would never
        # happen.
        # Stated rather than defaulted: `wall_clock_s + 500` is the row's docker
        # timeout and it now has to cover the pre-command leg too. It is NOT the
        # refusal's bound — `expect.within_s` is, and it is 30 s.
        wall_clock_s: 900
        cost_budget_usd: 1.00   # UNMEASURED: a provisional stand-in, not an estimate — 2x headroom makes its ceiling the $2.00 lane default, so the lane total is what binds until a first pass replaces it
        expect:
          exit: 3
          reason: not_authenticated
          # ZERO REQUESTS **AFTER THE CREDENTIAL WAS REMOVED**, not zero in the
          # container. The pre-command leg fans out to the stub by design, while
          # the seed is still in place, so the grader counts against the
          # watermark `entrypoint` writes to `stub-watermark.json` at the moment
          # the host process starts. Counting raw would have made this cell
          # unsatisfiable the day the leg landed.
          stub_requests: 0
          within_s: 30
        note: >
          `args` WIRED 2026-08-20, and the string is deliberately identical to
          `codex-apply-executor`'s. Header findings (1) and (2) are both answered
          above — `pre_commands` supplies the review-plan output, and
          `remove_seed` is now really removed — and `runs/20260820T093838Z` was
          the first execution of either.
          "WHO DECIDES THE FOREGROUND FORM" IS ANSWERED, AND THE ANSWER IS "NOT
          THE OPERATOR". `command` omits --detach because the auth gate this row
          trips is `write_batch_scheduler`'s per-dispatch `preflight_runner`,
