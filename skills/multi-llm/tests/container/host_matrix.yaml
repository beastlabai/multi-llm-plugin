          # `phase` is whatever `modes.py` gives the mode — and for `full` that
          # is the string `full` (it owns no workflow phase but does own a run
          # dir, which is what `--detach` needs somewhere to put `.status.json`).
          # Grading the eight phase names against the receipts would fail a
          # perfect row over a fact about our own dispatcher.
          receipt_phase: full
          # ...and WHAT state.json MUST RECORD, which is the whole reason this
          # row exists: all eight workflow phases, in one host turn, against a
          # real host. Cross-checked against `test_container_full_chain.py`'s
          # CHAIN_PHASES, which asserts the same eight on the provider lane.
          # NOTE the one place the mode word and the phase name differ: mode
          # `review-code` records phase `code-review`.
          phases:
            - review-plan
            - apply-suggestions
            - generate-tasks
            - review-tasks
            - apply-task-suggestions
            - implement
            - code-review
            - apply-code-fixes
          # The same floor the review-plan row declares, and for the same reason:
          # a minimum, not a count. This row's observed shape should be four
          # (`util instructions full`, the launcher, the worker re-exec, the
          # status poll) but the floor a PASS actually needs is the launcher plus
          # one terminal read-back. `artifacts_min` is left unstated — the
          # default of 1 holds structurally, because `detach.launch` records the
          # run log and `.status.json` on the launcher's own receipt.
          receipts_min: 2
        wall_clock_s: 900
        # The same scenario the review-plan row declares, for the same measured
        # reason: a scenario-less stub answers a bare "OK", which is not a
        # suggestions document. `full` needs strictly more of it — this scenario
        # is the one written for the eight-phase chain, and it is what the
        # provider lane's `container_full_chain` row already drives.
        scenario: /opt/mllm/skill/tests/fixtures/e2e/scenarios/container_full_chain.yaml
        provenance: verified   # runs/20260820T093838Z — row executed and passed
        note: >
          THE CHEAPEST PATH TO 8-OF-8 PHASES THROUGH A REAL HOST, and the reason
          it is one row rather than six: `full` runs the whole workflow inside a
          single process with no invoker between phases, so one host turn covers
          every phase this matrix could otherwise only reach by adding a row per
          phase — each with its own prerequisite seeding, its own host turn and
          its own spend. Derived from `codex-review-plan` cell for cell: same
          `run`, same `exit`, same `receipts_min`, same scenario, same
          `wall_clock_s`; only `phases` and `receipt_phase` differ, and both
          differ because `full` is one invocation over eight phases rather than
          one invocation over one.
          `args` is the OPERATOR form of `command`, per the header's rule: the
          mode word as a `--` flag, the same quoted positional, and only the
          flags this host does NOT bake — so `--quick` is typed and `--yes`,
          `--exec-subagents`, `--host codex` and `--detach` are not (the first
          three are baked by the shim, the fourth is added by its own step 5).
          VERIFIED on `runs/20260820T093838Z`: this row executed and passed, and
          that run is the measurement this note used to be waiting for. It was
          written against three things that had already been measured — the
          provider lane's eight-phase chain under this exact scenario, the
          `codex-review-plan` row's detach-poll-terminal shape, and `run_mode`'s
          in-process dispatch — and all three held.
          ONE THING IT WILL NOT GRADE: the chain's write phases really do move
          bytes under `src/**` (`implement`), and this row declares no
          `write_outcome`, so `TestTheWriteRowsAreGradedOnBytes` skips it by
          name. That is deliberate — the applied-byte question belongs to the
          apply rows, which declare an outcome to grade — and it is recorded here
          so a later reader does not mistake the skip for an oversight.
          TWO BOUNDS THAT WERE NAMED AHEAD OF THE FIRST RUN, and what that run
          then measured. (a) `wall_clock_s: 900` is the same bound a ONE-phase
          review-plan row carries, and that row measured 219 s (codex) / 304 s
          (opencode) of host wall clock. The prediction was that eight phases
          inside one detached worker is not eight times that — the host's own
          turns are the poll loop, not the work — and `runs/20260820T093838Z`
          bears it out: **287.87 s**, well inside 900 s, with `opencode-full` at
          52.22 s. The bound stays where it is. A `timed_out` host with complete
          receipts is still reported as "dispatched, host did not terminate"
          rather than as a failure to run. (b) the lane cap:
          `MLLM_E2E_MATRIX_TIMEOUT_S` defaults to 3600 s and the credentialed
          tier already measures ~21 min, so the two `--full` rows were the ones
          most likely to push a later row into `never_started`. That run took
          33 min for all 13 rows and no row was `never_started`; raise the cap
          deliberately, not pre-emptively.
      - id: codex-apply-executor
        # WIRED 2026-08-20, per the header's derivation rule: the mode word as a
        # `--` flag, the same quoted positional, and only the flags this host
        # does NOT bake — so nothing else is typed at all. `--yes` and
        # `--exec-subagents` are in `baked_flags`, `--detach` is added by the
        # shim's own step 5, and this row's `command` carries no `--quick`, so
        # there is no fourth token to type.
        args: '--apply-suggestions "plans/auth-feature.md"'
        command: "apply-suggestions plans/auth-feature.md --yes --exec-subagents --detach"
        # The pre-command leg — see claude-code-apply-native for the full cell.
        pre_commands:
          - "review-plan plans/auth-feature.md --yes --quick --exec-subagents"
        scenario: /opt/mllm/skill/tests/fixtures/e2e/scenarios/container_full_chain.yaml
        # Stated rather than defaulted: the driver derives the row's whole docker
        # timeout from it (`wall_clock_s + 500`) and that budget now has to cover
        # the pre-command leg as well as the host turn.
        wall_clock_s: 900
        expect:
          run: done
          exit: 0
          phases: [apply-suggestions]
          write_outcome: clean-failure
          bytes_must_change: false
        provenance: measured-red   # runs/20260820T093838Z; R4 owns the correction
        note: >
          C4 option (b), chosen deliberately: a real executor CLI pointed at a
          tool-call-free stub can only ever produce a clean failure, so the row
          asserts that outcome instead of hoping for an applied one. An `applied`
          batch here fails just as loudly — bytes landing from a tool-call-free
          stub means the redirect leaked.
          `args` WIRED 2026-08-20. Header finding (1) — one host process against a
          workspace with no review-plan output, `apply-suggestions` exiting 1
          before it reaches a batch — is answered by the `pre_commands` leg above,
          and `runs/20260820T093838Z` was that leg's first execution as well as
          this row's.
          MEASURED-RED on that run, and the adverse half is named rather than
          rounded off: the row executed — leg included — and failed
          `test_the_declared_run_state_was_reached`. `expect.run: done` found no
          `.status.json` run block because THE AGENT DID NOT DETACH. That is
          model-following, not a code defect — the same class as opencode's
          `--detach` miss in `harness-expansion.md` §14.6, on a different host —
          and **R4** owns it, including the recurrence count. Everything else the
          row asserts held: exit 0, `phases: [apply-suggestions]`, the
          clean-failure outcome and `bytes_must_change: false`, over 6 turns and
          14 stub requests in 373.81 s.
      - id: codex-auth-negative
        # WIRED 2026-08-20, and it is the SAME string the executor row types —
        # which is the point: the two rows differ only in `remove_seed`, so a
        # difference in outcome is attributable to the credential and to nothing
        # an operator typed.
        args: '--apply-suggestions "plans/auth-feature.md"'
        command: "apply-suggestions plans/auth-feature.md --yes --exec-subagents"
        # The pre-command leg, and on a NEGATIVE row its ordering is the row.
        # The leg runs while the seeded credential is still in place — it fans
        # out through the CONFIGURED RUNNER and would be refused by the very gate
        # this row exists to trip — and `remove_seed` below is honoured
        # immediately after it, and after the stage step, which also probes that
        # runner. entrypoint.main states that order explicitly at the call sites.
        pre_commands:
          - "review-plan plans/auth-feature.md --yes --quick --exec-subagents"
        scenario: /opt/mllm/skill/tests/fixtures/e2e/scenarios/container_full_chain.yaml
        remove_seed: ".codex/auth.json"
        # Stated rather than defaulted: `wall_clock_s + 500` is the row's docker
        # timeout and it now has to cover the pre-command leg too. It is NOT the
        # refusal's bound — `expect.within_s` is, and it is 30 s.
        wall_clock_s: 900
        expect:
          exit: 3
          reason: not_authenticated
          # ZERO REQUESTS **AFTER THE CREDENTIAL WAS REMOVED**, not zero in the
          # container. The pre-command leg fans out to the stub by design, while
          # the seed is still in place, so the grader counts against the
          # watermark `entrypoint` writes to `stub-watermark.json` at the moment
          # the host process starts. Counting raw would have made this cell
          # unsatisfiable the day the leg landed.
          stub_requests: 0
          within_s: 30
        note: >
          `args` WIRED 2026-08-20, and the string is deliberately identical to
          `codex-apply-executor`'s. Header findings (1) and (2) are both answered
          above — `pre_commands` supplies the review-plan output, and
          `remove_seed` is now really removed — and `runs/20260820T093838Z` was
          the first execution of either.
          "WHO DECIDES THE FOREGROUND FORM" IS ANSWERED, AND THE ANSWER IS "NOT
          THE OPERATOR". `command` omits --detach because the auth gate this row
          trips is `write_batch_scheduler`'s per-dispatch `preflight_runner`,
          which runs INSIDE the worker; the shim, meanwhile, tells the agent to
          add --detach to a fan-out mode, and an `args` string has no token that
          can forbid it. So the row does NOT try to force the foreground form —
          it is graded so that either form is legible. On a detached run the
          launcher's receipt reads exit 0 and the WORKER's carries the exit-3
          refusal; receipts are named `NNN.receipt.json` at completion time, so
          the worker's sorts last and `_mode_receipts(...)[-1]` — the grader's own
          rule — picks it. The refusal's prose then lands in
          `{phase}/orchestrator-run.log` rather than on the host's stdout, which
          is why the transcript the `reason` is looked for in now includes the
          exported run log (this host's own `result_source` cell already named it
          as where the verdict comes from). If the agent runs it foreground
          instead, both halves are on the host's stdout and the same assertions
          hold. MEASURED on `runs/20260820T093838Z`, and either way was legible:
          the row executed and PASSED — 1 turn, 4 stub requests, 103.66 s. (This
          row carries no row-level `provenance:` cell; the sentence that used to
          end here read "UNMEASURED either way", and that run is what replaced
          it. Its opencode counterpart is the row that did NOT reach its host —
          see `opencode-auth-negative` and R3.)

  # ===========================================================================
  opencode:
    stage:
      form: install
      command: "install-host opencode --global"
      target: "$HOME/.config/opencode/commands/multi-llm.md"
      provenance: verified
      measured: >
        Green (exit 0, five rows OK) on a COMPLETELY FRESH $HOME with no
        credential at all — row 5 reported `auth=ok, version=1.18.18`. See the
        auth_check note below: that is not the same thing as being authenticated.
        Installing also creates ~/.local/share/opencode/opencode.db, so this host
        writes state during the stage step.
    reload: new-session
    list_step:
      # THE ONE CREDENTIAL-FREE DISCOVERY ASSERTION IN THE MATRIX, and the reason
      # the --creds none tier is worth shipping at all.
      form: debug-config
      command: "opencode debug config"
      assert: 'json["command"] contains "multi-llm"'
      provenance: verified
      note: >
        MEASURED offline, under --network none, with no credential and no model
        call: `opencode debug config` emits the resolved configuration as JSON,
        and an installed command appears under its `command` key by name. After
        `install-host opencode --global` the key list is exactly ["multi-llm"],
        carrying the shim's own description.
        This is strictly better than the previously recorded fallback
        (`opencode run --command multi-llm -- "--help"`), which is an AGENT
        invocation: it needs a model, so it costs a credential and cannot run in
        the free tier. That form is still what an end user types, so it stays the
        `invoke_argv`; it is simply not the listing.
        NOTE `opencode debug skill` is the WRONG surface and looks right: it lists
        *skills*, our shim installs as a *command*, and it happily returns exit 0
        listing only the built-in `customize-opencode` — a green command that
        proves nothing.
    # ----------------------------------------------------------------------- #
    # THE DOCUMENTED INVOCATION — see the codex entry's header for why this is a
    # different question from `invoke_argv`.
    # ----------------------------------------------------------------------- #
    documented_invocation:
      surface: tui
      typed: "/multi-llm --review-plan {plan}"
      launch_argv: ["opencode", "--model", "<stub-model>"]
      stub_model: "stub/stub-model"
      # The composer's status bar, which is painted once the TUI is up. Chosen
      # over the banner because opencode repaints the whole screen and the banner
      # scrolls; this line does not.
      ready: 'ctrl\+p commands'
      ready_timeout_s: 120
      settle_s: 3.0
      submit_gap_s: 2.0
      wall_clock_s: 300
      refusal: null
      # MEASURED 2026-08-24, opencode 1.18.18: the documented spelling WORKS in a
      # fresh TUI session. Typing `/multi-llm --review-plan plans/<marker>.md`
      # expands the installed command into the turn — the prompt the host sent
      # carried the shim's own title, its dispatcher block with `{SKILL_DIR}`
      # already substituted to the absolute skill path, `--host opencode --yes
      # --exec-subagents`, and `--review-plan plans/<marker>.md` still adjacent.
      #
      # HEADLESS IS A DIFFERENT ANSWER, and the README already half-says so.
      # `opencode run -- "/multi-llm --review-plan plans/<marker>.md"` does NOT
      # expand: the line goes to the model as literal text. The headless form is
      # `opencode run --command multi-llm -- "<args>"` (capabilities.yaml's
      # `headless_invocation`), whose mandatory `--` the README documents; the
      # part it does not say is that `--command` is what performs the resolution,
      # not the separator.
      resolves: true
      provenance: verified
    invoke_argv: ["opencode", "run", "--command", "multi-llm", "--format", "json",
                  "--print-logs", "--log-level", "ERROR", "--model",
                  "openrouter/<model>", "--", "<args>"]
    # NOT a prompt: `<args>` is the argument string the shim maps to a mode, so
    # this host takes the row's `args` verbatim with no template around it.
    prompt_template: null
    invoke_provenance: verified      # in-repo, capabilities.yaml headless_invocation
    invoke_note: >
      The `--` separator is MANDATORY headless: `opencode run` parses its message
      with yargs, so an argument list starting with a flag (--ask ..., --review-plan
      ... — i.e. every invocation this skill makes) is swallowed as an option and
      the run silently prints yargs' own help instead.
    cwd: /work/sample-project
    turn_bound: {kind: wall-clock, value: 900}
    parser: utils/providers/opencode.py
    credential_mode: openrouter
    credential_provenance: verified          # measured 2026-08-14, live row
    credential_note: >
      MEASURED, and it is exactly the form providers.yaml:116 documents: a STORED
      credential, written non-interactively as
      $HOME/.local/share/opencode/auth.json = {"openrouter": {"type": "api",
      "key": "<key>"}} (mode 0600, in the tmpfs $HOME, never in the repo).
      `opencode auth list` then reports it, and `opencode models` lists
      `openrouter/~deepseek/deepseek-v4-flash-latest`. No `opencode auth login`
      turn is needed — the file IS the credential.
      TWO THINGS THE ROW ALSO NEEDS, neither of them a credential:
      (1) the image's baked cold-start tree (home_seed/opencode: the
      $XDG_CONFIG_HOME/opencode/node_modules the warm-up installs plus the
      models.dev catalog under .cache/opencode). The host's tmpfs $HOME is seeded
      from it, or the first `opencode run` pays a ~63 MB npm install first.
      (2) an $HOME/.config/opencode/opencode.json declaring the pinned slug under
      the built-in `openrouter` provider, so a slug the models.dev catalog does
      not name still resolves — plus `permission: {bash: allow, edit: allow}`.
      The seed's own opencode.json (the provider lane's {{base_url}} stub block)
      is OVERWRITTEN rather than copied, or it shadows the host wiring.
    model:
      slug: "~deepseek/deepseek-v4-flash-latest"
      arg: ["--model", "~deepseek/deepseek-v4-flash-latest"]
      provenance: verified
      resolved_on: "2026-08-14"
      why: >
        OPERATOR CHOICE (2026-08-14): deepseek v4 flash latest on every host, for
        cost. Resolved against the live catalog: $0.08/M in, $0.16/M out, 1M
        context, tool-calling supported — about half the price of the previously
        pinned `deepseek/deepseek-v4-flash-0731`.
        TWO THINGS THIS TRADES AWAY, recorded rather than buried:
        (1) It is a `~`-prefixed ALIAS. The plan pins slugs precisely so a model
        cannot move under a run — an alias is a moving target, so a golden or a
        cost-table row keyed to it can change meaning without a diff. Accepted
        deliberately here; revisit if a row starts drifting for no reason.
        (2) On `claude-code` this is a NON-ANTHROPIC model, and the OpenRouter
        cookbook warns Claude Code "may not work correctly with other providers".
        Tool-calling fidelity is exactly what the host lane grades, so a failure
        on that row may be the model rather than our shim. The verified Anthropic
        fallback is `anthropic/claude-haiku-4.5` ($1/M in) — measured working
        through the skin on 2026-08-14.
    auth_check:
      probe: ["opencode", "auth", "list"]
      provenance: verified
      logged_out: {stdout: "0 credentials", exit: 0, classify: true}
      logged_in:  {stdout: "1 credentials", exit: 0, classify: true}
      seed: ".local/share/opencode/auth.json"
      finding: >
        THIS HOST DOES NOT FAIL CLOSED, and it is the one measured result that
        contradicts the plan. A logged-out `opencode auth list` exits 0 and prints
        "0 credentials", which matches NONE of the adapter's auth_error_patterns
        ('not logged in', 'no credentials', 'unauthorized', ...), so
        classify_auth_probe returns True — "authenticated". `install-host opencode`
        duly reports auth=ok on a $HOME with no credential in it.
        Consequence for Phase 4: the planned negative auth row CANNOT expect a
        named not_authenticated refusal on opencode. The gate simply opens, and the
        failure surfaces later at dispatch. codex and opencode therefore do NOT
        fail the same way, and a green codex negative row proves nothing about
        opencode.
        This is a finding about the PRODUCT (a missing pattern, or a probe that
        should key on the credential count), recorded here rather than fixed:
        the rig is not a second source of truth for adapter behaviour.
    baked_flags: ["--host opencode", "--yes", "--exec-subagents"]
    dispatch: detach            # detach: required — timeout_ceiling_s: 120
    dispatch_note: >
      A foreground row on OpenCode is a WRONG row, not a slow one: detach: required
      plus a 120 s bash ceiling is why that shim offers no foreground fan-out path
      at all, so a --review-plan typed without --detach is killed mid-run — and
      would be testing an invocation the product does not ship.
    continuation: {who: worker, mechanism: in-process under --exec-subagents}
    result_source: "{phase}/orchestrator-run.log + .status.json"
    result_line_in_stream:
      status: present-escaped-in-nested-tool-result
      provenance: verified
      where: '{"type":"tool_use"} -> part.state.output'
      truncated: false
      note: >
        Same shape as codex, one field name different: complete, untruncated, and
        JSON-escaped inside the tool part's `state.output`. No `text` event in
        the run carried it — the agent read the answers file and summarised.
    rows:
      # `args` is what the OPERATOR types; `command` is the dispatcher command
      # the shim is expected to build from it, and what the receipt is graded
      # against. They are two different strings on purpose: the row asserts the
      # mapping, so writing only one of them would assert nothing.
      - id: opencode-ask
        args: '--ask "plans/auth-feature.md" "What does this plan change?" --quick'
        command: "ask plans/auth-feature.md 'What does this plan change?' --yes --quick --detach"
        expect: {run: done, exit: 0, phases: [ask], receipts_min: 2, artifacts_min: 0}
        wall_clock_s: 600
        measured:
          on: "2026-08-14"
          verdict: pass
          usd: 0.0080          # re-run after the poll fix: 0.0026
          host_wall_s: 97
          host_exit: 0
          # THE FIRST TIME AN AGENT HAS READ OUR SHIM AND RUN OUR DISPATCHER.
          receipts:
