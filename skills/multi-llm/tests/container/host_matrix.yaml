          exit: unknown
          reason: "probe passes while logged out; failure surfaces at dispatch"
          # THE ONE CELL IN THIS FILE THAT STILL READS `unmeasured` AFTER
          # `runs/20260820T093838Z`, and the reason is NOT the one the word used
          # to imply. The row had its credential; what never happened is the
          # HOST TURN. The pre-command leg exited 3 — the executor runner was
          # `opencode:stub-model`, an unqualified slug opencode parses as provider
          # `stub-model` with an empty model half
          # (`ProviderModelNotFoundError: Model not found: stub-model/.`, opencode
          # 1.18.18) — so the row stopped before `apply-suggestions` was ever
