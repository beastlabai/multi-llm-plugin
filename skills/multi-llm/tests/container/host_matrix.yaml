          declaration and `test_no_write_landed_outside_the_declared_paths` failed
          on it. The premise is where it went wrong: the fifth issue (emitted
          `index: 3`, `validation_status: valid`, so never filtered out) names
          `src/security.py` in its `file` field, but what it ASKS FOR is a new
          file somewhere else — "src/security.py ships with no tests … Add a test
          module for the rate limiter before the diff lands". The batcher
          partitions by `file_key`, so the batch is keyed `src/security.py` and
          its prompt opens "Fix the following 3 related issues in
          `src/security.py`"; nothing in the fixture, the batch or the instruction
          states a target filename. A `tests/` path is therefore expected OUTPUT
          of that issue, not a stray write.
          WHY THE WIDENING IS A SHAPE AND NOT THAT RUN'S FILENAME. The filename is
          chosen by the model on one turn: `tests/test_rate_limiter.py`, a split
          across two files, or appending to the seeded `tests/test_auth.py` —
          which the fixture's own description points at and which
          `seed_workspace.py:158` really does create — are equally faithful
          readings of the same instruction, and the variance is downstream of a
          workspace and a scenario that are ALREADY frozen. Pinning
