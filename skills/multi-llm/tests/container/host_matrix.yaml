        wall_clock_s: 900
        expect:
          run: done
          exit: 0
          phases: [apply-suggestions]
          write_outcome: clean-failure
          bytes_must_change: false
        provenance: verified   # runs/20260820T093838Z — row executed and passed
        note: >
          `args` WIRED 2026-08-20, exactly as codex-apply-executor is: the
          `pre_commands` leg above answers header finding (1), and
          `runs/20260820T093838Z` was that leg's first execution.
          THE RISK THIS ROW CARRIES THAT CODEX'S DOES NOT had already been
          measured on this host: `opencode-review-plan` completed its workflow
          while IMPROVISING the invocation — it dropped every baked flag and
          omitted `--detach` on a host where `detach: required`. `expect.run:
          done` would fail here for that shim-following reason rather than a
          workflow one, and that would be the correct verdict, not a bound to
