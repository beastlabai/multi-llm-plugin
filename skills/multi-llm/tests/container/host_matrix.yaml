        args: '--apply-suggestions "plans/auth-feature.md"'
        command: "apply-suggestions plans/auth-feature.md --yes --exec-subagents"
        # The pre-command leg, and on a NEGATIVE row its ordering is the row.
        # The leg runs while the seeded credential is still in place — it fans
        # out through the CONFIGURED RUNNER and would be refused by the very gate
        # this row exists to trip — and `remove_seed` below is honoured
        # immediately after it, and after the stage step, which also probes that
        # runner. entrypoint.main states that order explicitly at the call sites.
