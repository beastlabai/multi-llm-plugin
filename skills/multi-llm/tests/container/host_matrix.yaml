# Host-lane matrix — per-host stage/list/invoke cells, credential mode, model pin,
# and the per-row `expect` block (C6, C6c, C8).
#
# Installing a shim is not driving a host. Between `install-host` and an assertion
# sit seven cells that cannot be left to "the entrypoint runs the host": how the
# command is *listed*, the exact argv that starts a headless run, what prompt text
# reaches the dispatcher, which directory it runs in, when a reload takes effect,
# what bounds the run, and how its output is read.
#
# Same provenance key as hosts/capabilities.yaml — verified / documented / unknown —
# plus two this rig needs that that file does not: **measured-red** and
# **unmeasured**. Conflating any of them is how a lane goes green having covered
# nothing, so each is defined here and each cell below is written to one of them.
#
#   verified     — a named run exercised this cell and AGREED with it. Carries the
#                  bundle id in a comment, the way
#                  `credential_provenance: verified  # measured 2026-08-14, live
#                  row` already does.
#
#   measured-red — a named run exercised this cell and CONTRADICTED it. Carries
#                  the bundle id AND the task that owns the correction. The cell
#                  has evidence; it has ADVERSE evidence. **A failed assertion is
#                  a measurement**, and this word exists so such a cell stops
#                  reading like one nobody has looked at — which is the single
#                  failure mode a per-cell provenance field exists to prevent.
#
#   unmeasured   — nothing has ever exercised this cell. NARROWED 2026-08-20 from
#                  the credential-only wording it shipped with ("this cell
#                  requires a credential that was not available when the spike
#                  ran"), which was a statement about 2026-08-14's credential and
#                  was afterwards made to carry two further claims it does not
#                  mean. It now means: no credential was available, **or** the
#                  row's host turn never started. A cell keeping this word NAMES
#                  which of the two, and names the task that would clear it.
#
#   documented   — the vendor says so. unknown — nobody has looked.
#
# `measured-red` is not a synonym for `unknown` and never a place to park a red
# row: it is the one word that says the run happened and the cell lost.
#
# ---------------------------------------------------------------------------
# WHAT WAS MEASURED ON 2026-08-14, AND WHAT WAS NOT
#
# MEASURED, offline, with no credential — the whole stage/discovery tier:
#   * every host's stage step, run against a scratch $HOME
#   * both executor hosts' `auth_check` probes in BOTH states, and the product's
#     own classify_auth_probe verdict on each
#   * the minimum synthesized credential that makes each probe pass with no real
#     vendor login (committed value-free under home_seed/)
#
# ---------------------------------------------------------------------------
# THE CREDENTIALED LANE, MEASURED 2026-08-14 (second pass, live key)
#
# The `--ask` row ran on all three hosts against a real OpenRouter key with the
# fan-out still stubbed. What that settled, per host, is written into the cells
# below with `provenance: verified` and the measurement quoted beside it. The
# headline: **an agent has now read our shim and run our dispatcher** — receipts
# for `util instructions <mode>`, the dispatcher command itself and the
# `status --view run` poll, with artifacts on disk and a terminal run state.
#
# Four findings that were NOT in the plan, each recorded at the cell it corrects:
#   * codex `wire_api = "chat"` is refused outright by codex-cli 0.146.0.
#   * codex's own sandbox is bubblewrap and cannot initialize under this lane's
#     posture, so every command the agent runs fails before it starts.
#   * codex runs commands through `bash -lc`; a LOGIN shell re-derives PATH from
#     /etc/profile, so the image's `ENV PATH` was invisible to the agent and its
#     `command -v uv` preflight correctly reported uv missing.
#   * claude-code ignores `permissions.allow` from a synthesized $HOME
#     settings.json for Bash while still honouring it for the Skill tool; the
#     same list passed as `--allowedTools` works.
#
# STILL NOT MEASURED — as of 2026-08-14. SUPERSEDED by `runs/20260820T093838Z`,
# which executed all thirteen rows; each row's own `provenance:` cell now carries
# that bundle id and one of verified / measured-red / unmeasured, and those cells
# are the address for this question, not this list:
#   * every row with a subagent batch (review-plan, and the three apply rows)
#     — all executed on that run
#   * the negative auth rows — codex's executed; opencode's pre-command leg exited
#     3 and its host turn never started (R3)
#   * `applied` bytes through a real host (the claude-code native write row)
#     — measured: three census entries, two of them under `src/**`
#
# ---------------------------------------------------------------------------
# WHY FIVE ROWS CARRIED NO `args` — AND WHY ADDING ONE WOULD NOT HAVE HELPED
# (verified 2026-08-15; SUPERSEDED 2026-08-19/20 — read to the end of this
#  block, all three blockers are now answered and all five rows are wired)
#
# `codex-apply-executor`, `opencode-apply-executor`, `claude-code-apply-native`,
# `codex-auth-negative` and `opencode-auth-negative` are authored down to their
# `command:` and `expect:` blocks and carry no `args:`, so `render_prompt`
# aborts each in ~1.5 s having made zero model calls. That is not a missing
# prompt. **No prompt can make these five rows run**, and writing one would only
# turn a fast, honest abort into a slow red row that spends money and proves
# nothing. Three blockers, each verified rather than inferred:
#
# (1) ALL FIVE DISPATCH `apply-suggestions`, AND THAT MODE CANNOT RUN FIRST.
#     The host lane seeds one fresh workspace per row (`seed_workspace.py`: the
#     src tree, plans/auth-feature.md, one commit, a working diff,
#     .multi-llm/providers.yaml) and launches exactly ONE host process against
#     it — this lane has no pre-command leg. Run standalone against that
#     workspace, `apply-suggestions plans/auth-feature.md --yes` exits **1** in
#     `_setup` step 9 — "Output directory not found: …/plans/auth-feature" —
#     before any batch, any runner and any auth gate; with the phase dir present
#     but empty it is still exit 1, "Run --review-plan first to generate
#     validation results". The provider lane says the same thing in a test name:
#     "apply-suggestions has nothing to apply without review-plan", which is why
#     its applied-bytes row runs `review-plan` and then `apply-suggestions` as
#     two commands. The host lane has nowhere to put the first one.
#
# (2) `remove_seed` IS A DEAD CELL. Both negative rows name a credential file to
#     delete and nothing anywhere deletes it — the key's only other readers are
#     in `test_container_host_lane.py`, which uses its mere PRESENCE to classify
#     a row as negative and never acts on its value. So even past (1), both rows
#     would run with the seeded credential in place and could not be refused for
#     the reason they declare.
#
# (3) `claude-code-apply-native`'s BYTE EXPECTATION CANNOT BE MET BY THE MODE IT
#     NAMES. `apply-suggestions` declares exactly one file, the plan
#     (write_phase_bridge.py: "The plan file is THE artifact"), and the grader's
#     census delta drops everything under `plans/` as the workflow's own output.
#     `bytes_must_change: true` with `paths: ["src/**"]` — AS THE ROW DECLARED
#     `paths` THEN; it now declares `["src/**", "tests/test_*.py"]`, see the
#     2026-08-20 update at the end of this header — is therefore unsatisfiable
#     for this mode however the row is prompted: src/** moves under `implement` /
#     `apply-code-fixes`, not here. The finding is unaffected by the widening:
#     `apply-suggestions` writes neither tree.
#
# (1) and (2) are rig gaps and belong in the harness — a per-row pre-command leg
# that can seed the prerequisite phase through the SAME host turn or ahead of
# it, and an implementation of `remove_seed` in the home-seeding step. (3) is a
# row-design question (which phase is supposed to supply this lane's only
# applied bytes) and is left open rather than answered by widening a matcher.
#
# --- UPDATE 2026-08-19: (1) AND (2) HAVE LANDED. (3) HAS NOT. ---------------
#
# Both rig gaps are now implemented, and all five rows declare the cells they
# need:
#
#   (1) THE PRE-COMMAND LEG. `entrypoint.run_pre_commands` runs a row's
#       `pre_commands:` in order, in the row's own workspace, BEFORE the host
#       process starts, and stops the row at the first non-zero exit rather than
#       launching a host against a half-prepared workspace. All five rows
#       declare the one command they were missing —
#       `review-plan … --yes --quick --exec-subagents` — plus the
#       `container_full_chain.yaml` scenario that leg needs to produce a real
#       suggestions document.
#       The leg's receipts land in `receipts/<row>-pre/`, NOT in
#       `receipts/<row>/`. That separation is the whole design: every host-lane
#       assertion about "the agent really ran our dispatcher" reads the latter,
#       and a leg writing there would let a row pass its receipt anchor on the
#       RIG's own invocation — the exact false positive the anchor exists to
#       prevent.
#
#   (2) `remove_seed` IS IMPLEMENTED. `entrypoint.drop_seeded_credential`
#       deletes the named file from `/work/homes/<identity>` — the tree
#       `wrapper.seed_invocation_root` copies every per-invocation provider root
#       from, so it is gone from every dispatch of that CLI — and RAISES if the
#       path matched nothing, because a no-op deletion reproduces the exact
#       silence this cell had for its whole life. Never the host's own `$HOME`:
#       the host must still be able to run, or the row leaves no receipt to
#       grade the refusal on.
#       ITS CALL SITE IS ORDERED, not incidental: after `stage_host` and after
#       the leg. `install-host codex --global` row 5 probes the configured
#       runner's auth and exits 3 without the seed (see codex `stage.measured`),
#       and the leg's own fan-out crosses the same gate — so removing the
#       credential any earlier returns from the row before `apply-suggestions`
#       is ever dispatched, and a refusal with no receipt proves nothing.
#
# --- UPDATE 2026-08-20: ALL FIVE ROWS NOW CARRY `args`. ---------------------
#
# The derivation rule, restated because it is what the five strings below were
# built from: `args` is what the OPERATOR types, `command` is what the shim must
# build from it, so `args` = the `--<mode>` flag form of `command`'s mode word,
# the same quoted positionals, and only the flags the host does NOT bake —
# never `--host`, never `--detach` (the shim adds it per its own step 5), never
# `--yes`/`--exec-subagents` on codex or opencode, and `--yes` explicitly on
# claude-code, whose shim bakes none of them (`must_type_explicitly` below).
#
# Applied, one line each:
#
#   codex-apply-executor    --apply-suggestions "plans/auth-feature.md"
#   opencode-apply-executor --apply-suggestions "plans/auth-feature.md"
#   codex-auth-negative     --apply-suggestions "plans/auth-feature.md"
#   opencode-auth-negative  --apply-suggestions "plans/auth-feature.md"
#   claude-code-apply-native
#                           --apply-code-fixes "plans/auth-feature.md" --yes
#
# ONE DISCREPANCY BETWEEN THIS RULE AND THE ROWS THAT ALREADY PASS, recorded
# rather than resolved by silence: `must_type_explicitly: ["--yes"]` says the
# claude-code operator types `--yes`, and NEITHER green claude-code row does —
# `claude-code-ask` and `claude-code-review-plan` both spell `args` without it
# and both measured a receipt carrying `--yes`, i.e. the AGENT supplied it. The
# rule is followed here anyway, because the row below is a write phase running
# unattended: a phase that stops to ask is a dead row, and `must_type_explicitly`
# is the cell that says whose job it is to prevent that. If the row passes, the
# two green rows are the ones out of step with the rule, not this one.
#
# WHAT THE FIVE ROWS' FIRST RUN IS ACTUALLY MEASURING, since all three of the
# cells under them are still unrun: the pre-command leg (D1), the credential
# removal (D2), and — on claude-code only — the retarget that answers D3 below.
#
#   (3) IS NOW ANSWERED, AND THE ANSWER IS (a): THE ROW WAS POINTED AT THE WRONG
#       PHASE. `bytes_must_change: true` with `paths: ["src/**"]` was never
#       satisfiable under `apply-suggestions`, whose only declared artifact is
#       the plan file. `claude-code-apply-native` therefore now dispatches
#       `apply-code-fixes`, the write phase whose declared files ARE source
#       files. The full derivation — and why (b) and (c) were rejected — is
#       written into that row's own note.
#
#       `bytes_must_change: true` IS carried across unchanged. `paths` IS NOT,
#       and an earlier revision of this block claiming "its byte assertion is
#       carried across UNCHANGED, character for character" was wrong about the
#       second half. `runs/20260820T093838Z` ran the retargeted row and measured a
#       three-entry census diff — `M src/security.py`, `M src/auth.py`,
#       `A tests/test_security.py` — so `paths` is now
#       `["src/**", "tests/test_*.py"]`. THE CAUSE, in one line: the fifth issue
#       in `code_review/container_issues.json` names `src/security.py` in its
#       `file` field but asks for a NEW TEST MODULE, whose filename the model
#       chooses; the widening is that shape and deliberately not that run's
#       filename. The row's note carries the derivation and the two rejected
#       alternatives (pinning the exact path; an "additions only" qualifier).
# ---------------------------------------------------------------------------

version: 1
measured_on: "2026-08-14"

# ---------------------------------------------------------------------------
# ONE CROSS-HOST FINDING THAT CHANGES HOW A RECEIPT IS READ (measured 2026-08-14)
#
# C6c says "a dispatcher invocation that emitted NO line writes a receipt with
# result: null, which is itself a finding rather than a silent gap, because every
# mode emits one". On a DETACHING row exactly one receipt is structurally null
# and it is not a finding:
#
#   process_control.spawn_detached (POSIX) sends the worker's stdio to /dev/null
#   and closes every inherited descriptor; the worker then opens
#   {phase}/orchestrator-run.log ITSELF (enter_detached_worker). So the `uv`
#   wrapper that exec'd the worker sees EOF on its pipe immediately, captures
#   nothing, and writes `result: null` — while the worker's real
#   MULTI_LLM_RESULT line lands in the log, where the matrix already says the
#   verdict comes from.
#
# Observed on every codex and opencode row: the launcher receipt carries the
# payload plus `run.state: running`, the worker receipt carries `result: null`,
# and the `status` receipt carries `run.state: done, exit_code: 0`. A grader must
# therefore count DISPATCHER receipts with a payload, not receipts, and must not
# read the null one as "the mode emitted nothing".
worker_receipt_is_null: structural-on-detaching-rows
worker_receipt_is_null_provenance: verified
# ---------------------------------------------------------------------------

hosts:

  # ===========================================================================
  claude-code:
    # `install-host claude-code` writes NOTHING, so the reference host needs a
    # stage step of its own. `installable: false` makes install a refusal in those
    # words, and --check reads the PLUGIN'S OWN SKILL.md under the running skill
    # root: a green check proves the shipped shim's shape and this machine's
    # prerequisites, and proves nothing about whether Claude Code can FIND the
    # skill. Left implicit, every claude-code row would fail the discovery
    # assertion behind a passing install step.
    stage:
      form: link
      target: "$HOME/.claude/skills/multi-llm"
      source: /opt/mllm/skill
      then: "install-host claude-code --check --project-root /work/sample-project"
      provenance: verified
      measured: >
        A directory symlink to the skill tree, then --check: rows 3-5 green, rows
        1-2 reported n/a ("host 'claude-code' is not installable: its shim is the
        plugin's own SKILL.md"), auth=unknown, exit 0. `install-host claude-code
        --global` refuses with "`install-host claude-code` is --check-only" and
        exit 3, exactly as capabilities.yaml declares.
        WHAT GETS STAGED IS THE WHOLE TREE, never SKILL.md alone: every command in
        that shim is `uv run --project "${CLAUDE_SKILL_DIR}" -- python
        "${CLAUDE_SKILL_DIR}/multi_llm.py" ...`, so a lone file leaves the host
        expanding the variable at a directory with no dispatcher in it.
        A SYMLINK rather than a copy because that is the mechanism this repo
        already runs the skill through (link-skill.sh) and the one
        cli_common's skill-dir resolution is written for (abspath, symlinks
        preserved, NEVER realpath, so `uv run --project` stays on the
        pyproject.toml the host loaded). It also keeps the check honest: under a
        link the file --check reads and the file the host loads are one inode and
        cannot drift.
      copy_fallback:
        # If the host declines to traverse a symlinked skill directory. It must
        # NOT try to carry a second uv environment: the root filesystem is
        # read-only and the env is materialized into the image layer at build
        # time, so the copy runs with UV_PROJECT_ENVIRONMENT pinned and no sync,
        # and the row additionally byte-compares the copied SKILL.md against
        # /opt/mllm/skill/SKILL.md — two files can drift where one inode cannot.
        env: {UV_PROJECT_ENVIRONMENT: /opt/mllm/skill/.venv}
        assert: "byte-compare copied SKILL.md against /opt/mllm/skill/SKILL.md"
    reload: none
    list_step:
      form: none
      provenance: verified
      note: >
        MEASURED: no credential-free listing surface exists. `claude --help` shows
        no skills/commands listing, and `claude doctor` (which explicitly "reads
        settings files in the current directory without a trust prompt", so it was
        the best candidate) never names a staged skill. `claude plugin` manages
        plugins, not skills. So discovery on this host can only be proven by a
        PROMPTED turn, which needs a credential — and the --creds none tier
        therefore reports this host as `discovery: unavailable-without-credential`
        rather than passing it. A green `install-host --check` is NOT discovery:
        it reads our own bytes at our own path.
    # MEASURED 2026-08-14 — the permission/trust cell, and it is the ARGV flag,
    # not the settings file. A synthesized `$HOME/.claude/settings.json` carrying
    # `permissions.allow` was read far enough to let the **Skill** tool through
    # (without it the host cannot even open our shim: the very first thing it
    # does is call `Skill{skill: multi-llm}`, and a denial there sends it hunting
    # for the file by hand until its turn budget runs out) — but every Bash rule
    # in that same file was ignored: `command -v uv` and the shim's own
    # `uv run --project …` were both denied, i.e. the host loaded our shim and
    # then could not run a single command in it. The identical rule list passed
    # as `--allowedTools` ran first time. Never a `--dangerously-*` bypass.
    invoke_argv: ["claude", "-p", "<prompt>", "--output-format", "json",
                  "--max-turns", "<N>", "--model", "<model>",
                  "--allowedTools", "<allowed-tools>"]
    invoke_provenance: verified
    permission_form:
      mechanism: "--allowedTools, one argv token PER RULE, and the flag must be LAST"
      comma_join: "REFUSED IN PRACTICE — see note"
      source: "SKILL.md's own `allowed-tools` frontmatter + Skill / Skill(multi-llm)"
      provenance: verified
      note: >
        DERIVED, never invented: the grant list is the shipped shim's own
        declaration, so the rig cannot become a second source of truth for what
        the shim needs. The two additions are the one grant frontmatter cannot
        carry — permission to invoke the skill at all.
        A settings.json `permissions.allow` block is NOT a substitute (measured
        above); it is still written, because it is what carries the trust entry
        and the onboarding flag.
        THE FLAG'S OWN SHAPE IS PART OF THE MEASUREMENT. `claude --help` says
        `--allowedTools <tools...>  Comma or space-separated list`. A single
        comma-joined token is accepted and is silently WRONG: every rule that
        contains a space — `Bash(command -v uv)`, `Bash(PYTHONUNBUFFERED=1 uv:*)`
        — stops matching, and the space-free rules around it (`Read`) stop
        matching too. Measured twice: comma-joined, the host loaded the skill
        (`Skill` has no space) and then had all seven of its tool calls denied,
        including `uv run … util instructions ask` and a plain `Read` of the
        instruction file; one token per rule, with `--allowedTools` last because
        it is variadic, ran first time.
    prompt_template: |
      Use the multi-llm skill with exactly these arguments: {args}
      Follow the skill's own instructions step by step and run the commands it
      gives you. Do not summarise instead of running them.
    cwd: /work/sample-project
    # MEASURED: 12 was not enough. The first credentialed row burned all 12 —
    # one on the denied Skill call, the rest hunting for the file by hand — and
    # ended `is_error: true, stop_reason: tool_use`. A shim-following run is
    # ~8 tool turns (skill load, uv preflight, `util instructions`, the
    # dispatcher, a read-back), so 25 left headroom for one retry without
    # turning the bound into a licence.
    #
    # RAISED 25 -> 40 on 2026-08-15, and the reason is the DISTRIBUTION, not one
    # bad row. `claude-code-ask` hit `error_max_turns` at num_turns 26 against
    # --max-turns 25 while its dispatcher receipt still read `state: done,
    # exit: 0` — the phase completed, three seconds before the cap.
    # The turn count on this row has always been wide, and the recorded
    # `measured: turns: 12` below is one sample out of five taken that day:
    #
    #   2026-08-14  9, 11, 12, 13(capped at the old 12), 21   ← argv byte-identical
    #   2026-08-15  26                                        ← argv byte-identical
    #
    # 25 was set when the observed tail was 21, i.e. four turns of headroom, and
    # 26 is one turn past it. Nothing the shim asks for grew: both runs produced
    # the same two dispatcher receipts (`util instructions ask`, then `ask …`),
    # both completed the phase, and `host-run.json`'s argv is byte-for-byte the
    # same as the 2026-08-14 pass — SKILL.md last moved on 2026-08-08 (3a6d62c)
    # and instructions/ask.md's last edit (e4e43a9, 11:39 UTC) predates that
    # 19:01 UTC pass by seven hours, so both runs read identical bytes.
    # What moved is the model behind the `~`-prefixed ALIAS this matrix
    # already flags as a moving target, which improvised for ~22 turns between
    # reading the instructions and dispatching (two of its Bash calls denied:
    # `grep … | head` does not match `Bash(grep:*)`, and `python3 -c` is granted
    # nowhere). The cheaper, faster, higher-turn shape says so too: 166 s and
    # $0.0113 for 26 turns against 295 s and $0.0204 for 12.
    # 40 clears the observed tail by half again rather than by one turn. The
    # real ceiling on a runaway row is `wall_clock_s` below, not this.
    #
    # RAISED 40 -> 60 on 2026-08-21, same rule as the 25 -> 40 raise above and
    # the same shape of evidence: a row that hit the cap with its work DONE.
    # `claude-code-apply-native` reached `num_turns: 41` against --max-turns 40
    # in run 20260821T034820Z and exited 1 (`is_error: true, stop_reason:
    # tool_use`) — having already run all three write batches (batch-index 1, 2
    # and 3, each with its `prior-changes append` and `metrics record`),
    # `util metrics finish --phase apply-code-fixes`, the verification step, and
    # `util metrics report`. It stopped ONE command short of the finalization.
    #
    # What grew is not the model's improvisation but the instruction: R1
    # (plans/harness-residual-work.md §1) added a required post-loop
    # `apply-code-fixes --plan-file <plan> --mark-completed` step to
    # instructions/apply-code-fixes.md, because the phase never recorded its own
    # completion without it. That is one more mandatory dispatcher turn on the
    # longest row in the matrix, and 40 was calibrated before it existed. This
    # is therefore the 2026-08-15 case exactly: the bound, not the row, is what
    # was wrong.
    #
    # 60 is chosen the way 40 was — clear the observed tail (41) by half again,
    # not by one turn — so a row that legitimately needs a retry still has room
    # and the bound does not become a licence. `wall_clock_s` below remains the
    # real ceiling on a runaway row: this run used 768 s of its 900 s bound, so
    # raising turns cannot let one run unboundedly.
    turn_bound: {kind: max-turns, value: 60}
    # ADAPTER CHANGES OF 2026-08-16 (§7.3/L6, §3.6/L7, §9.8/L8) — this cell is
    # UNCHANGED, and that is a finding, not an omission. Provenance: derived,
    # 2026-08-16, from the adapters' own builders read offline (no container run).
    #
    #   * `invoke_argv` above launches claude-code AS A HOST, i.e. the argv that
    #     loads SKILL.md and runs the dispatcher. It is not
    #     `ClaudeCodeProvider.build_command`, so a provider-side flag never
    #     appears in it. Adding one here would make the host lane launch an argv
    #     no code emits.
    #   * §3.6's `--fallback-model` is emitted only from a configured
    #     `providers.claude-code.fallback_models`, and the shipped value is an
    #     EMPTY map — so on this lane the provider argv is byte-for-byte what it
    #     has always been, and `expected_argv.yaml`'s three claude-code rows still
    #     match (re-derived offline through `seed_expected_argv.adapter_shapes`).
    #   * §9.8's `--` separator lands only on the ARGV transport of the two agent
    #     profiles. Both container rows are `transport: stdin`, where the adapter
    #     drops the separator along with the prompt it shields, so those rows are
    #     byte-identical too.
    #   * §7.3's `CLAUDE_CODE_MAX_RETRIES=3` / `API_TIMEOUT_MS` are child-process
    #     ENV, not argv. They reach a provider child through `wrapper.py`'s
    #     carry-over allowlist (widened for exactly these two names); the HOST
    #     process launched by `invoke_argv` is unaffected, since `get_env()` is
    #     applied per provider dispatch and never exported by the harness.
    #   * §4.2/M7's `--json-schema` is emitted only when a CALLER attaches a
    #     schema (`invoke_with_provider(schema_phase=…)`), and no lane in this
    #     matrix does — `schema=None` renders argv byte-for-byte as before, which
    #     `tests/test_structured_output.py` asserts against L5's frozen capture
    #     over all thirteen adapters. Its pinned `MAX_STRUCTURED_OUTPUT_RETRIES=1`
