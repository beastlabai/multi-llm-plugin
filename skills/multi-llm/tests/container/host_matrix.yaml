    # MEASURED 2026-08-14, and a correction to the plan's cell (which said
    # `--sandbox workspace-write`). Codex's own sandbox is **bubblewrap**, and
    # bwrap needs unprivileged user namespaces:
    #
    #   bwrap: No permissions to create a new namespace, likely because the
    #   kernel does not allow non-privileged user namespaces.
    #
    # Under this lane's posture (--cap-drop=ALL, --security-opt
    # no-new-privileges, read-only root) that is unavailable, so EVERY
    # command_execution fails before it runs — the agent read nothing, dispatched
    # nothing, and spent $0.006 across 12 turns concluding "the execution
    # environment is broken at the sandbox level". A row that never reaches our
    # dispatcher tests nothing about our shim.
    #
    # `danger-full-access` here is NOT a `--dangerously-*` bypass and is not one
    # in spirit either: it turns off CODEX's inner sandbox inside a container
    # that is already the sandbox (non-root, cap-drop ALL, no-new-privileges,
    # read-only root, writes confined to tmpfs + one bind, workspace with no git
    # remote). The confinement is the container's, and stacking a second one that
    # cannot initialize buys nothing but a dead row.
    #
    # NOTE this is a HOST-lane launch cell only. It says nothing about the
    # `agent-write` profile our own adapter builds (`--sandbox workspace-write`),
    # which the provider lane still asserts verbatim — and which never hit bwrap
    # there because a tool-call-free stub makes codex execute no commands at all.
    #
    # M2 (`--ephemeral` + `--skip-git-repo-check`, unconditional) does NOT reach
    # this cell, and the omission is deliberate rather than an oversight. M2
    # changes `utils/providers/codex.py` — the argv the dispatcher builds for a
    # codex *provider* dispatch — while this line is how the rig launches codex
    # as the *host agent*, hand-typed and re-verifiable only by running the host
    # lane. Neither flag would change what this row measures: `seed_workspace.py`
    # `git init`s /work/sample-project, so the trust gate
    # `--skip-git-repo-check` opens is already open here, and this row's finding
    # is about bwrap, not about rollout persistence. Adding two unmeasured
    # tokens would downgrade `invoke_provenance: verified` to a guess in the one
    # lane whose whole value is that its cells were observed. If the host lane
    # is re-run for another reason, adding `--ephemeral` here is a free tidy-up.
    # ----------------------------------------------------------------------- #
    # THE DOCUMENTED INVOCATION — what README.md and docs/hosts.md tell a reader
    # to type after `install-host`, driven by `--documented-invocation` at
    # `--creds none` and graded by tests/test_container_documented_invocation.py.
    #
    # This is NOT `invoke_argv`. That cell is how the RIG launches a headless
    # turn, and its `prompt_template` ("Use the multi-llm skill with exactly
    # these arguments: …") proves the writer — the shim landed somewhere the host
    # reads and an argument reaches the dispatcher. It says nothing about the
    # published spelling, because nothing had ever typed it.
    # ----------------------------------------------------------------------- #
    documented_invocation:
      surface: tui
      # The published string, with `{plan}` substituted per run by a unique
      # marker so a fact can never match stale text. Copied from README.md's
      # "invoke it exactly as in Claude Code, minus the plugin namespace" block
      # and from docs/hosts.md's per-host quickstart, which both spell it
      # `/multi-llm <the same arguments the Claude Code skill takes>`.
      typed: "/multi-llm --review-plan {plan}"
      launch_argv: ["codex", "--model", "<stub-model>"]
      stub_model: "stub-model"
      ready: 'OpenAI Codex \(v'
      ready_timeout_s: 120
      settle_s: 3.0
      wall_clock_s: 240
      refusal: "Unrecognized command '/multi-llm'"
      # MEASURED 2026-08-24, codex-cli 0.146.0, and it is a NEGATIVE result:
      # codex does not accept the documented spelling on either surface.
      #
      #   * TUI. Typing `/multi-llm --review-plan plans/<marker>.md` into a fresh
      #     session and pressing Enter prints
      #         • Unrecognized command '/multi-llm'. Type "/" for a list of
      #           supported commands.
      #     and sends NOTHING: zero requests reached the stub. The `/` popup
      #     lists /model, /ide, /permissions, /keymap, /vim, /experimental,
      #     /approve, /memories … and no skill; typing `/multi` offers no
      #     completion.
      #   * The deprecated `install_paths.legacy` location does not rescue it: a
      #     file at `$CODEX_HOME/prompts/zzprobe.md` gets the same
      #     "Unrecognized command '/zzprobe'" on this version, so custom prompts
      #     are no longer a slash surface either.
      #   * Headless. `codex exec "/multi-llm --review-plan plans/<marker>.md"`
      #     exits 0 and sends the line VERBATIM as the user message — no
      #     expansion, no shim text, `{SKILL_DIR}` never involved.
      #
      # WHAT CODEX DOES DO, measured on the same run: it enumerates the installed
      # skill and advertises it to the model inside `<skills_instructions>` —
      #   - multi-llm: Orchestrate plan reviews, task generation, implementation
      #     and code reviews … (file: $CODEX_HOME/skills/multi-llm/SKILL.md)
      # — so the skill is discovered by NAME and reached by the model deciding to
      # read that file, which is what this lane's `prompt_template` asks for and
      # what the README should describe. A codex skill is a model-invoked
      # instruction source, not a command the composer resolves.
      resolves: false
      alternative: "Use the multi-llm skill with exactly these arguments: <args>"
      # What counts as a page having been CORRECTED, so the guard grades the
      # substance rather than one author's sentence. Any one of these phrases,
      # anywhere in README.md / docs/hosts.md, says the thing a reader needs:
      # that `/multi-llm` is not what this host takes. Deliberately loose — the
      # wording belongs to whoever owns those files, and a guard that pinned a
      # sentence would be the hand-maintenance failure D4 refuses.
      doc_qualifier: "not a (?:codex )?slash command|model-invoked|Unrecognized command"
      provenance: verified
    invoke_argv: ["codex", "exec", "--json", "--sandbox", "danger-full-access",
                  "--model", "<model>", "<prompt>"]
    invoke_provenance: verified
    sandbox_finding: bwrap-needs-userns
