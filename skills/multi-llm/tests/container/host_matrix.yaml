          become code in `index.mjs`'s `execute`. So this row asks the route's
          own question — "does the route that cannot be improvised past actually
          not get improvised past" — on the workload where the difference is
          largest, and it does it for the cost of one host turn.
          ONE THING IT WILL NOT GRADE, inherited verbatim from the twin: the
          chain's write phases really do move bytes under `src/**` (`implement`),
          and this row declares no `write_outcome`, so
          `TestTheWriteRowsAreGradedOnBytes` skips it by name. That is
          deliberate — the applied-byte question belongs to the apply rows, which
          declare an outcome to grade — and it is recorded here so a later reader
          does not mistake the skip for an oversight.
      - id: opencode-package-apply-executor
        route: package
        # IDENTICAL to `opencode-apply-executor`'s, which is itself identical to
        # `codex-apply-executor`'s: both hosts bake the same three flags and both
        # add `--detach` from their own shim step, so the operator form of the
        # same `command` is the same string. On the package route the string is
        # not retyped by a model at all — the plugin's `multi_llm` tool composes
        # the argv — which is precisely the difference this row exists to grade.
        args: '--apply-suggestions "plans/auth-feature.md"'
        command: "apply-suggestions plans/auth-feature.md --yes --exec-subagents --detach"
        # The pre-command leg — see `claude-code-apply-native` for the full cell.
        # Copied verbatim from the twin: the leg is the RIG dispatching and does
        # not vary by route, since `route:` governs how the HOST is given its
        # command and the leg never goes near the host.
        pre_commands:
