      - id: claude-code-apply-native
        # RETARGETED 2026-08-20 from `apply-suggestions` to `apply-code-fixes`.
        # This is D3's answer; the derivation and the two rejected alternatives
        # are in `note` below. `bytes_must_change: true` — the assertion the row
        # exists for — is carried across character for character. `paths` is NOT:
        # `runs/20260820T093838Z` ran the retargeted row and measured one
        # `tests/` path in the census diff, so it widened to
        # `["src/**", "tests/test_*.py"]`. An earlier revision of this comment
        # said "nothing else about the row moved"; that run corrected it.
        args: '--apply-code-fixes "plans/auth-feature.md" --yes'
        command: "apply-code-fixes plans/auth-feature.md --yes"
        # THIS ROW **IS** THE `apply-code-fixes` PHASE ROW, under its historical
        # name — recorded here 2026-09-22 because §3.4 reaches this host's eight
        # phases through `claude-code-phase-<name>` rows and a reader counting
        # them would otherwise see seven and call this an eighth, unrelated row.
        # It is one of only two of the eight that already existed (the other is
        # `claude-code-review-plan`, which is the `review-plan` phase row), and
        # it is the shape all three NEW write rows below are modelled on: a
        # pre-command leg, then native Task batches, graded on the SHA census.
        # It is not renamed: the id is written into
        # `tests/test_stray_write_paths.py:78-88`, into `CREDENTIALED_ROWS`, and
        # into five run bundles' receipt directories, and a rename would orphan
        # every one of them to gain a naming convention.
        #
        # A NATIVE-DISPATCH ROW, DECLARED RATHER THAN OMITTED. The host's own
        # Task tool never crosses /opt/mllm/bin, so a fan-out list has no
        # mechanism to act through: this row adds NO provider coverage toward G2
        # and the union guard excludes it BY DECLARATION. The literal string is
        # what lets the guard tell "deliberately outside the partition" from
        # "somebody forgot"; a list-valued `fan_out` here is an error.
        fan_out: native
        # WHAT THIS PHASE IS SUPPOSED TO CHANGE — the positive half of the grade,
        # and on this row it is exactly what `_source_delta` already grades
        # (`test_container_host_lane.py:1441`), which is why the key changes
        # nothing here and changes everything on the two rows whose artifacts
        # live under `plans/`. Derived from the phase's own task builder:
        # `utils/write_phase_bridge.py:132-153` keys an apply-code-fixes batch by
        # `file_key` and declares that file, and the five issues in
        # `code_review/container_issues.json` name `src/security.py` and
        # `src/auth.py` — with the fifth asking for a NEW test module whose
        # filename the model chooses, which is why the second entry is a shape.
        # Identical to `expect.paths` below on this row; the two cells still mean
        # opposite things (what MUST change, versus what nothing may be written
        # outside) and are not interchangeable.
        editable_artifacts:
          - "src/**"
          - "tests/test_*.py"
        graded_on: [bytes, recorded-completion]
        graded_on_reason: >
          BOTH, and this row is the reason the second is available at all.
          `apply_code_fixes_orchestrator.py:563` sets
          `marks_phase_completed = False` and `:627` passes
          `include_mark_completed=True`, so the completion record is written by
          the host's POST-LOOP `apply-code-fixes --plan-file "$PLAN_PATH"
          --mark-completed` (`instructions/apply-code-fixes.md:501`, added by R1)
          — a command a loop that stopped early never reaches. Four of this
          row's five measured attempts did not reach it; the fifth did, at
          receipt 16, and `artifacts/auth-feature/state.json` then recorded
          `phases_completed["apply-code-fixes"]`. That is evidence, where the
          same assertion on `apply-suggestions` or `implement` would pass with
          nothing applied.
        # THE PRE-COMMAND LEG (header finding (1), landed 2026-08-19). Ordered
        # dispatcher invocations the ENTRYPOINT runs in this row's workspace
        # before the host process starts, so the row's mode has the prerequisite
        # phase it exits 1 in `_setup` without. Not the host's work and never
        # counted as it: the leg's receipts land in `receipts/<row>-pre/`, one
        # directory across from the ones every "the agent really ran our
        # dispatcher" assertion reads.
        # No `--host`: this is the rig dispatching, not an agent following a
        # shim. `--exec-subagents` so the validation batches run in-process
        # against the stub, which is the same two-command shape the provider
        # lane's applied-bytes row already uses.
        #
        # `review-code`, NOT `review-plan`, and it is a one-for-one swap rather
        # than a longer chain: `check_workflow_prerequisites.PHASE_PREREQUISITES`
        # gives `apply-code-fixes` exactly ONE prerequisite, `code-review`, and
        # gives `code-review` none at all. (`implement`, the other phase that
        # writes `src/**`, needs `apply-suggestions` AND `generate-tasks`, i.e. a
        # three-command leg. THE ONE-COMMAND LEG IS THE ENTIRE ARGUMENT: an
        # earlier revision added "and its task fixture also declares
        # `tests/test_security.py` — so it would have forced `paths` open too",
        # which `runs/20260820T093838Z` disproved. This phase forces `paths` open
        # too — see the row note — so that was never a reason to prefer it.)
        # `review-code` is also what this workspace was built for:
        # `seed_workspace.py` labels the committed tree "what `review-code` diffs
        # against" and writes the uncommitted diff the fixtures were captured on.
        pre_commands:
          - "review-code plans/auth-feature.md --yes --quick --exec-subagents"
