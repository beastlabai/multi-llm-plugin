# The redirection matrix — Phase 1 spike output, provenance-tagged (C3).
#
# This repo already has a vocabulary for "how much do we actually know":
# hosts/capabilities.yaml tags every field verified / documented / unknown and never
# lets a `documented`-only value select the non-conservative path. The same
# discipline applies here — except that, unlike that file, **every row below was
# measured**, on 2026-08-14, by running the real binary against a local HTTP stub
# with the argv the product's own adapter built (`get_provider(<name>)
# .build_command(prompt, model)`). Nothing here is inference from documentation.
#
# A row that cannot be verified is NOT a failure of the plan — it drops to the
# fake-binary lane (C5), which is exactly where it sits today. The matrix is
# checked in so what the suite covers is legible without reading the Dockerfile.
#
# ---------------------------------------------------------------------------
# HOW THE SPIKE CHANGED THE PLAN'S EXPECTATIONS
#
#   plan said        measured        rows
#   ---------------  --------------  ----------------------------------------
#   verified         verified        codex, muse
#   documented       verified        claude-code, aider, goose, opencode,
#                                    gemini, cline, kilocode
#   unknown          VERIFIED        pi      <- the plan's one open row, closed
#   none expected    VERIFIED        grok    <- a documented custom-endpoint mode
#   none expected    none            cursor-agent, agy
#
# Net: 11 of 13 rows reach the provider lane, against a plan whose go/no-go was
# five. Not one `documented` guess turned out to be wrong, and both surprises went
# our way. The practical consequence is that the fake-binary lane's roster
# collapses to {cursor-agent, agy} — and cursor-agent is already one of
# mock_llm.py's six identities, so only `agy` ever needs C5's five mock parts.
#
# THREE FINDINGS THAT ARE STUB REQUIREMENTS, NOT CLI TRIVIA. Each one presented
# as "redirection does not work" before it was diagnosed:
#   * QUERY STRINGS. claude-code posts /v1/messages?beta=true and gemini signals
#     streaming with ?alt=sse. A route table matching the raw target 501s both.
#   * SSE TERMINATION. HTTP/1.1 with no Content-Length and no chunked framing has
#     no defined end: claude-code retried 16 times over 90 s writing zero bytes.
#   * `data: [DONE]` IS AN OPENAI-ISM. gemini-cli JSON.parses every frame and dies
#     with `Unexpected token 'D'`, so the sentinel is per-surface, not global.
#
# AND ONE ABOUT TURN COUNTS: claude-code, opencode, kilocode and goose each fire a
# SESSION-TITLE completion before the real turn, tool-free and on the SAME model —
# so C4's "one non-tool message ends the run" is true of the *run* but the turn
# count is 2-3, not 1, and `has_tools` is the only discriminator. muse is the
# outlier at 17 (four parallel background reminder tasks, not retries).
#
# PHASE 3 CORRECTION, measured with a prompt-logging stub against all 11 rows:
# it is FIVE CLIs, not four. `grok` fires one too ("You are tasked with generating
# the session title.") and — unlike the other four — IT CARRIES TOOLS, so
# `has_tools` separates four of the five and not the fifth. muse's extra requests
# are "reminder observer" tasks and need answering as well. The discriminator that
# works on all of them is the instruction's own text, which is what
# tests/fixtures/e2e/scenarios/container_full_chain.yaml anchors on.
#
# AND ONE ABOUT PROMPT SHAPE, which decides how every scenario pattern is written:
# EVERY redirected CLI wraps our prompt inside its own system prompt, so the text a
# stub extracts starts with the CLI's preamble, not ours. A pattern anchored with
# `^` on our first line matches on the fake-binary lane and matches NOTHING here.
# Worse, a session-title call QUOTES the prompt it is titling (goose's carries ours
# in full), so a product pattern without a negative lookahead answers the title
# request with that phase's document.
#
# WRAPPER CONTRACT. tests/container/wrapper.py reads these keys per row:
#   binary           the executable name, when it differs from the provider id
#                    (`claude` -> `claude-code`). argv[0] gives the wrapper the
#                    binary; the row and home_seed/<id>/ are keyed by the id.
#   credential_vars  variable NAMES set to the per-exec fake stub session key
#   base_url_vars    variable NAME -> template ({base_url} substituted per exec)
#   config_files     path under the per-invocation root -> file body template
#   config_roots     variable NAME -> path under the per-invocation root
#   env_extra        static variables the CLI needs. THESE CANNOT COME FROM THE
#                    IMAGE: the wrapper rebuilds the child environment from
#                    scratch and carries over only PATH/TERM/LANG/LC_ALL/TZ and
#                    MLLM_*, so an image-wide CLINE_NO_AUTO_UPDATE=1 reaches the
#                    build and the entrypoint but never the CLI it was set for —
#                    leaving C9's verified pins silently un-held at run time.
#   argv_inject      {after_token, args} for a CLI whose ONLY override is argv
#   session_prefix   whether a /s/<exec-id>/v1 base URL still works
# NO VALUES APPEAR IN THIS FILE. Every credential is a template the wrapper fills
# with a string that is meaningful on 127.0.0.1 and worthless anywhere else.
#
# GRADER CONTRACT, one key, read by tests/container/harness.py and by nothing in
# the image:
#   tool_artifacts   globs this CLI writes into the WORKSPACE that are the
#                    vendor tool's own cache rather than a product write (today:
#                    aider's repo map). `harness.tool_artifact_paths` forgives
#                    them only on a row whose own fan-out names this CLI, and
#                    never over a path that row declares as an editable
#                    artifact. Distinct from `harness.workflow_bookkeeping`,
#                    which is THIS product's record-keeping.
#
# ---------------------------------------------------------------------------
# THE SHARED CHAIN WRITE RUNNER IS `opencode`, ON EVERY ROW THAT NAMES ONE.
# The 13 rows below whose adapter declares no `agent-write` profile dispatch the
# chain lane's write batches through one shared helper, and that helper is
# opencode: it declares `agent-write`, its profile is the application-level
# `--agent build` so it spawns NO sandbox, and it is already a `lane: provider`
# row here — which is what keeps the named-runner-is-itself-a-redirected-row
# guard in `test_redirect_matrix_claims.py` true without a carve-out. The helper
# used to be codex, and could not stay: codex's `agent-write` renders
# `--sandbox workspace-write`, which needs an unprivileged user namespace that
# this host's AppArmor policy and Docker's default seccomp profile each deny, so
# every borrowed write batch was refused with `reason_code: sandbox_unavailable`
# before a child ever started.
#
# CONSEQUENCE FOR THE MEASURED NUMBERS, STATED ONCE HERE: every `chain_s` cell in
# this file was measured with CODEX writing. For the 13 repointed rows those
# cells — and the `chain_row_timeout_s` derived from each — are therefore STALE,
# pending the re-seed capture pass that re-records them. opencode fires a
# session-title completion per exec, so they are expected to move up, not down.
# Nothing has been edited to a prediction: the numbers stay exactly as measured
# until a capture pass replaces them.
# ---------------------------------------------------------------------------

version: 1
measured_on: "2026-08-14"
measured_against: "scratchpad spike stub (3 surfaces, canned answer, total logging)"

clis:

  # -------------------------------------------------------------------------
  - cli: codex
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. With the 13 helper rows repointed to opencode, codex is the
    # one row whose effective write runner still returns a non-`None`
    # `sandbox_probe_command('agent-write')`, and this host cannot satisfy it.
    # The row still RUNS: its write batches are refused with
    # `reason_code: sandbox_unavailable`, `harness.row_outcome` classifies the row
    # `sandbox-skip` from those batch records, and the test side turns that into a
    # STRICT, TYPED xfail licensed by an in-image `sandbox_verdict('agent-write')`
    # probe re-measured every run. Never a `pytest.skip` — a row that never
    # executes can never announce that its blocker lifted — and never a bare red.
    sandbox_skip_when: userns-unavailable
    surface: responses
    mechanism: "$CODEX_HOME/config.toml [model_providers.stub] + env_key"
    model_arg: "gpt-5.5"
    session_prefix: true
    config_roots:
      # $CODEX_HOME is read AHEAD of $HOME, and the directory must EXIST: codex
      # exits 1 with "CODEX_HOME points to ... but that path does not exist".
      CODEX_HOME: ".codex"
    credential_vars: [STUB_API_KEY]
    seed_files: [".codex/config.toml", ".codex/auth.json"]
    http_log:
      - {method: POST, path: /v1/responses, stream: true}
    turns: 1
    terminates_on_text: true
    startup_s: 0.021
    first_call_s: 0.177
    turn_s: 0.470
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 119.3
    chain_row_timeout_s: 600
    version_measured: "0.146.0"
    help_invocation: "codex exec --help"
    version_offline: true
    notes: >
      TWO TRAPS, both measured. (1) A RELATIVE $HOME is silently useless: codex
      resolves ~/.codex against it, finds no config, and goes straight to the real
      api.openai.com — which looks exactly like "redirection does not work". (2) On
      the DEFAULT provider codex now prefers a WebSocket transport
      (wss://api.openai.com/v1/responses) and only falls back to HTTPS after five
      retries; a custom base_url avoids that transport entirely.
      Also: `codex exec` refuses a cwd that is neither a git repo nor trusted
      ("Not inside a trusted directory and --skip-git-repo-check was not
      specified") — satisfied by seed_workspace.py's git init, which answers the
      open C6c cell about an untrusted cwd.

  # -------------------------------------------------------------------------
  - cli: aider
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: chat
    mechanism: "OPENAI_API_BASE + an openai/<id> litellm spec on --model (env only)"
    model_arg: "openai/stub-model"
    session_prefix: true
    base_url_vars:
      OPENAI_API_BASE: "{base_url}"
    credential_vars: [OPENAI_API_KEY]     # litellm refuses to start without one
    seed_files: []
    # THE REPO MAP, and it lands in the WORKSPACE rather than in this row's
    # per-invocation home. aider builds a tags cache of the tree it is pointed
    # at on every invocation and writes it to
    # `<cwd>/.aider.tags.cache.v4/cache.db` -- so on the host lane it lands in
    # `/work/sample-project`, inside the SHA census the write rows are graded
    # on. Measured on four bundles: it appears on every row aider runs on
    # (`runs/20260922T084502Z` codex-ask / codex-review-plan / codex-full /
    # codex-apply-executor, where aider is in codex's fan-out, and
    # `runs/20260920T105458Z` + `runs/20260921T224840Z` chain-aider) and on no
    # other row in any of them. On 2026-09-22 it was the ENTIRE census delta of
    # `codex-apply-executor` and failed that row with
    # `bytes moved on a row declared 'clean-failure'`.
    #
    # Declared here, not tolerated in the grader: `harness.tool_artifact_paths`
    # forgives these globs only on a row whose own fan-out names this CLI, and
    # never over a path the row declares as its own editable artifact. It is a
    # narrow, per-CLI statement about what a VENDOR's binary does -- NOT the
    # workflow's own bookkeeping, which is `harness.workflow_bookkeeping` and a
    # separate category.
    #
    # The cache version is spelled out because it was measured, the way every
    # other pin in this file is: aider bumping to a `v5` directory turns these
    # rows red naming the new path, which is the re-measurement this matrix
    # exists to force. A `v*` wildcard would absorb it silently.
    tool_artifacts:
      - ".aider.tags.cache.v4/**"
    http_log:
      # THE ONE NON-STREAMING ROW: --no-stream is in the adapter's own argv, so the
      # stub's single-body chat shape is load-bearing here, not decorative.
      - {method: POST, path: /v1/chat/completions, stream: false}
    turns: 1
    terminates_on_text: true
    startup_s: 0.377
    first_call_s: 2.257
    turn_s: 2.867
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 111.9
    chain_row_timeout_s: 600
    version_measured: "0.86.2"
    help_invocation: "aider --help"
    version_offline: true
    egress_beyond_stub:
      # SPELLED AS A HOSTNAME, because a5's second half matches this list with
      # `endswith`. The previous value was an IP range carrying the hostname in a
      # parenthetical, so it matched nothing and graded nothing -- a declaration
      # that looked like coverage and was not. The addresses observed were
      # 185.199.108-111.133; they belong in this comment, where they cannot
      # pretend to be a matcher.
      hosts: ["raw.githubusercontent.com"]
      fatal_when_blocked: false          # actually FASTER blocked: 2.06 s vs 2.87 s
      # PERMITTED on the credentialed live lane, and that is a policy statement
      # this field does not make: `hosts` is the FACTUAL list of what the row
      # reaches past the stub. Which of them are tolerated lives in
      # ALLOWED_EGRESS (tests/test_container_live_provider.py), which adds this
      # name to the resolver's allowlist and then asserts it was answered. What
      # is fetched is litellm's model cost map -- pricing and context windows,
      # not an updater and not telemetry.
    container_status: green
    container_note: >
      Green only after a wrapper fix, and the failure was worth the trip.
      AiderProvider.get_env() sets COLUMNS=10000 precisely to stop aider
      hard-wrapping its output; the wrapper's scrub dropped it (not in the
      carry-over allowlist), aider wrapped at ~78 columns, and the JSON document
      it printed came back with RAW NEWLINES INSIDE ITS STRING VALUES — invalid
      JSON, surfaced three layers up as the uninformative "No JSON found in aider
      output". Dropping what the product's own adapter deliberately sets means the
      container tests a configuration the product never ships.
      tests/test_wrapper_env_contract.py now asserts every adapter's get_env()
      keys survive the scrub, so the next adapter to add one fails a test instead
      of being silently scrubbed.
    notes: >
      The reply carries no '► **ANSWER**' marker: aider emits it only when the
      response has reasoning content, so a plain stub answer takes
      AiderProvider.parse_output's FALLBACK branch and never its primary one. To
      cover the marker path the stub must emit reasoning_content — otherwise
      aider's primary parser is untested in the image.

  # -------------------------------------------------------------------------
  - cli: goose
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: chat
    mechanism: "GOOSE_PROVIDER=openai + OPENAI_BASE_URL (env only)"
    model_arg: "openai/stub-model"
    session_prefix: true
    base_url_vars:
      OPENAI_BASE_URL: "{base_url}"
    credential_vars: [OPENAI_API_KEY]
    env_extra:
      GOOSE_PROVIDER: "openai"
      GOOSE_DISABLE_KEYRING: "1"
    seed_files: []
    http_log:
      - {method: GET,  path: /v1/models,           stream: false}
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: false,
         note: "SESSION-TITLE call — see notes"}
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 3
    terminates_on_text: true
    startup_s: 0.005
    first_call_s: 0.057
    turn_s: 0.161
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 99.2
    chain_row_timeout_s: 600
    version_measured: "1.41.0"
    help_invocation: "goose run --help"   # top-level --help lists subcommands only
    version_offline: true
    egress_beyond_stub: {hosts: [], fatal_when_blocked: false}
    notes: >
      THE LANE-DECIDING NUMBER IS 3, NOT 25. The plan flagged goose as the row most
      likely to loop: it ships developer tools and the adapter passes --max-turns 25.
      Measured across four independent runs, goose accepts a tool-free answer as
      final on iteration 1 and never approaches the ceiling. C4's precondition holds.
      THE TRAP FOR PHASE 3: one of the two completions is a SESSION-TITLE request
      with a completely different system prompt ("Generate a short title (four words
      or less)...", user text wrapped in ---BEGIN USER MESSAGES---). It fires even
      under --no-session and GOOSE_DISABLE_SESSION_NAMING=1 does NOT suppress it.
      Under `on_unmatched: fail` this call fails EVERY goose row unless
      container_full_chain.yaml carries a pattern for it — and it is why a naive
      per-session turn counter would hand goose's real turn the second fixture.

  # -------------------------------------------------------------------------
  - cli: cline
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: chat
    mechanism: "~/.cline/data/settings/providers.json -> openai-compatible.settings.baseUrl (NO env var exists)"
    model_arg: "openai/stub-model"
    session_prefix: true
    seed_files: [".cline/data/settings/providers.json"]
    seed_recipe: "cline auth -p openai -b <base_url> -k <fake> -m stub-model"
    env_extra:
      CLINE_NO_AUTO_UPDATE: "1"
    egress_beyond_stub:
      # MEASURED ON THE CREDENTIALED LIVE LANE (2026-08-19), which is the only
      # lane that can see this at all: the provider lane is `--network none`,
      # where a call-home is a connection error rather than a fact. cline 3.0.55
      # queried BOTH of these on a run where `CLINE_NO_AUTO_UPDATE=1` (this row's
      # own, plus the image's) and `DO_NOT_TRACK=1` were present in the resolved
      # env and asserted by name. `data.cline.bot` is its analytics sink and
      # `otel.cline.bot` its OTLP one.
      #
      # THERE IS NO THIRD OPT-OUT TO TRY. The only UPDATE/TELEMETRY/TRACK-shaped
      # name in the 3.0.55 tree is CLINE_NO_AUTO_UPDATE itself, and the bundle
      # carries posthog and sentry.io clients beside it. So configuration cannot
      # silence these, exactly as with cursor-agent's statsig and sentry calls,
      # and the DNS allowlist is the control that actually holds: the resolver
      # returns NXDOMAIN, the run is unaffected, and `test_a5_egress` FAILS the
      # row if either name is ever ANSWERED. On a user's own machine there is no
      # such allowlist and these requests do go out — a product fact worth
      # knowing, not a lane defect. Re-check on the next version bump.
      hosts: ["data.cline.bot", "otel.cline.bot"]
      opt_out_vars: ["CLINE_NO_AUTO_UPDATE", "DO_NOT_TRACK"]
      fatal_when_blocked: false
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 1
    terminates_on_text: true
    startup_s: 0.959
    startup_s_egress_blocked: 8.66
    first_call_s: 0.759
    turn_s: 1.448
    turn_s_egress_blocked: 8.97          # ~7.5 s of blocked-egress wait, EVERY invocation
    row_timeout_s: 600                   # sized for the blocked-egress penalty, not the fast path
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 106.8
    chain_row_timeout_s: 600
    version_measured: "3.0.55"
    help_invocation: "cline --help"      # `cline auth --help` for -b/--baseurl
    version_offline: false
    container_status: green
    container_note: >
      Green only after the seed template was replaced with the shape cline itself
      writes. A HAND-WRITTEN config was silently ignored: the real file carries a
      `providers` wrapper key plus `version`, `lastUsedProvider` and a
      `settings.provider` field, none of which the spike's one-line summary
      captured. cline then fell back to a default endpoint and reported
      `ConnectionRefused` with ZERO stub requests — which reads exactly like a
      broken redirect and is nothing of the kind.
      THE RULE THIS ROW ESTABLISHES: generate a seed template with the CLI's own
      command (`cline auth -p openai -b <url> -k <key> -m <model>`) and commit
      what it wrote, with the values templated out. Do not hand-write a config
      shape from a prose description of it.
    notes: >
      CLINE SELF-UPDATED THE INSTALLED PACKAGE MID-SPIKE (3.0.39 -> 3.0.55, global
      node_modules rewritten while a probe ran; that run hung to the cap). C9's pin is
      NOT honoured unless the auto-update is disabled. CLINE_NO_AUTO_UPDATE=1 cuts
      run-time connects from ~10 to 2 but removes neither the telemetry call nor the
      blocked-egress delay — `--network none` is what actually settles it, at the cost
      of the ~7.5 s this row's timeout is sized for.
      cline also spawns a BACKGROUND HUB DAEMON that can outlive the run. One
      container per row makes that safe by construction; a shared container would not.

  # -------------------------------------------------------------------------
  - cli: qwen-code
    provenance: verified
    lane: provider
    # id != binary (§8.1's one such pair in this plan besides claude-code). The
    # row id MUST be the registry key or test_redirect_matrix_claims.py fails at
    # COLLECTION with "no built-in adapter"; the binary key is what the wrapper
    # resolves through BINARY_TO_CLI to find homes/<id> and home_seed/<id>/.
    binary: qwen
    # CHAIN ROW ONLY. qwen-code declares no `agent-write` profile -- it is
    # `(generate,)` only, like every adapter harness-expansion.md adds -- so the
    # executor's runner is a second binary and is DECLARED rather than tolerated.
    # That binary is the shared helper `opencode`, which writes without spawning
    # a sandbox where codex could not (header).
    chain_write_runner: opencode
    surface: chat
    mechanism: "OPENAI_BASE_URL/OPENAI_API_KEY/OPENAI_MODEL trio drives the generic OpenAI backend; QWEN_HOME relocates every write"
    # MUST equal env_extra.OPENAI_MODEL below, byte for byte. `-m` WINS over
    # OPENAI_MODEL (measured), so a drift between the two would have the flag
    # override the variable and `test_the_stub_saw_only_this_row_s_model` would
    # grade a value that never reached the wire.
    model_arg: "stub-model"
    # MEASURED (§7 step 4), all three forms: qwen appends `/chat/completions` to
    # OPENAI_BASE_URL VERBATIM and adds no version segment of its own, so a
    # session-prefixed base arrives intact as
    # `/s/<exec-id>/v1/chat/completions`. Full, not `partial` -- there is no
    # catalog GET to keep the prefix off.
    session_prefix: true
    config_roots:
      # NOT $HOME/.qwen and NOT a HOME redirect: QWEN_HOME replaces the
      # `.qwen` directory itself, and `$HOME/.qwen` is then never created.
      QWEN_HOME: ".qwen"
    base_url_vars:
      # The `/v1` is load-bearing: qwen adds none of its own.
      OPENAI_BASE_URL: "{base_url}"
    credential_vars: [OPENAI_API_KEY]
    env_extra:
      OPENAI_MODEL: "stub-model"
      # The adapter sets these three; the image sets them ENV-wide too, but
      # build_child_env starts from scratch and carries over only the
      # allowlist, so the per-CLI copies are what actually reach the CLI.
      QWEN_TELEMETRY_ENABLED: "false"
      QWEN_USAGE_STATISTICS_ENABLED: "false"
      QWEN_CODE_SKIP_UPDATE_CHECK_ONCE: "1"
    # The env trio needs no config file at all: it drives the CLI with no auth
    # step and no settings.json, measured. (`--auth-type openai` exists as an
    # explicit selector but the trio alone was measured sufficient.)
    seed_files: []
    # MEASURED: one completion POST per clean dispatch, streamed, with a full
    # `tools` array -- qwen advertises tools to the model even in headless mode,
    # which is precisely why `--max-tool-calls 0` is in the shipped argv. No
    # catalog GET is issued at any point.
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 1
    terminates_on_text: true
    row_timeout_s: 300
    chain_row_timeout_s: 600
    version_measured: "0.21.13"
    # NOT `qwen --help`, and the reason is a measurement rather than taste.
    # FIVE of the flags this adapter emits -- --bare, --chat-recording,
    # --max-session-turns, --max-tool-calls and --max-wall-time -- are HIDDEN
    # options: real, accepted, and absent from `qwen --help`. Probing the visible
    # help would report five permanently-MISSING options forever, which trains a
    # reader to ignore the drift report.
    #
    # The `hidden_options` key is not the answer here either: its assertion runs
    # a control first (`<binary> --bogus-flag --help` must FAIL, or "the binary
    # accepts it" proves nothing), and qwen returns 0 for a bogus flag whenever
    # --help is present -- so that assertion would be vacuous for this CLI, which
    # is exactly what its control exists to catch.
    #
    # An unknown argument WITHOUT --help makes yargs dump the complete option
    # list, deterministically (two runs byte-equal) and with a non-zero exit that
    # seed_cli_surface.run_help already tolerates when there is text. So the
    # drift probe reads the surface we actually depend on.
    help_invocation: "qwen --mllm-force-full-help"
    version_offline: true
    notes: >
      EXITS 0 ON EVERY API-ERROR CLASS -- 401, 404, 400-overflow and 500 alike
      all produce rc=0, `subtype: "success"`, `is_error: false`, EMPTY stderr,
      and an answer of "[API Error: <upstream text>]". So §6 step 3's two named
      traps (errors on stdout with an empty stderr, and exit-0 failures)
      coincide in one shape, and the adapter declares `[API Error:` as an
      exit-zero failure marker, matched by SEARCH because the truncated-stream
      shape puts it after ten characters of concatenated partial text.
      `-o json` is the shipped mode rather than `stream-json`, whose `result`
      record drops the `stats` block that corroborates the classification.
      `--json-schema` is real (OQ2: inline, claude-code's spelling) but ends the
      session on a TOOL CALL, which the committed stub deliberately never emits
      -- so this lane cannot grade it, and its coverage is unit tests plus the
      §7.4 live smoke. Growing the stub to emit a tool call would be rig growth.

  # -------------------------------------------------------------------------
  - cli: copilot
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. copilot's adapter declares no `agent-write` profile (it is
    # `(generate,)` only, like every adapter harness-expansion.md adds), so the
    # executor's runner is a second binary and is DECLARED rather than tolerated.
    # That binary is the shared helper `opencode`, which writes without spawning
    # a sandbox where codex could not (header).
    chain_write_runner: opencode
    # OQ5 RESOLVED, on its preferred branch: `chat`, and
    # COPILOT_PROVIDER_WIRE_API is NOT set. The `responses` wire was measured
    # working against the COMMITTED stub too, so the fallback for a future
    # reasoning-slug parser bug (copilot-cli#4196) is proven available without
    # any rig growth -- it is simply not needed today.
    surface: chat
    mechanism: "COPILOT_PROVIDER_BASE_URL is the BYOK activation switch (+_TYPE/_API_KEY); no GitHub account, no PAT, no gh auth login"
    # MUST equal env_extra's model surface below -- but note copilot's is a FLAG,
    # not a variable: the adapter passes `--model`, which was measured to OVERRIDE
    # COPILOT_MODEL. So the id `test_the_stub_saw_only_this_row_s_model` reads out
    # of the request body comes from argv, and COPILOT_MODEL is stripped by
    # get_remove_env rather than set here.
    model_arg: "stub-model"
    # MEASURED (§7 step 4), all three base-URL forms, resolving BOTH of the
    # unknowns that stack for this CLI: the base URL is used VERBATIM and copilot
    # appends exactly `/chat/completions` (never `/v1/chat/completions`), so the
    # `/v1` belongs in the base and the feared `.../v1/v1/chat/completions` 404
    # cannot occur. Full, not `partial` -- copilot fetches NO catalog at all.
    session_prefix: true
    config_roots:
      # Config and state only. This deliberately does NOT cover the 209 MB
      # self-extracted package cache: COPILOT_HOME does not relocate it
      # (measured), XDG_CACHE_HOME does, and the image pre-warms that at build
      # time into an exec-capable /opt path -- see the Dockerfile.
      COPILOT_HOME: ".copilot"
    base_url_vars:
      # The `/v1` is load-bearing: copilot adds no version segment of its own.
      COPILOT_PROVIDER_BASE_URL: "{base_url}"
    credential_vars: [COPILOT_PROVIDER_API_KEY]
    env_extra:
      COPILOT_PROVIDER_TYPE: "openai"
      # Measured NOT to block the BYOK provider call, despite the vendor doc's
      # "requires a local model provider" wording. It disables GitHub auth,
      # telemetry, web tools, the GitHub MCP server and auto-update.
      COPILOT_OFFLINE: "true"
      COPILOT_AUTO_UPDATE: "false"
      # The pinned token pair, at the adapter's conservative floor. The stub has
      # no real context window, so pinning the floor keeps the row's env and its
      # argv deterministic rather than tracking a catalog.
      COPILOT_PROVIDER_MAX_PROMPT_TOKENS: "32000"
      COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: "8000"
      # THE ROW WOULD NOT START WITHOUT THIS LINE, and the reason is not obvious
      # from any error it produces. The `copilot` npm entry point is a LOADER: on
      # first run it self-extracts a 209 MB platform package into
      # $XDG_CACHE_HOME and executes from there. `build_child_env` points
      # XDG_CACHE_HOME at the per-invocation root (wrapper.py step 3), which is a
      # --tmpfs mount, and Docker's tmpfs default is NOEXEC -- so copilot dies
      # with `Native addon "runtime" not found ... failed to map segment from
      # shared object`, which reads like a broken install rather than a mount
      # option. COPILOT_HOME does NOT relocate that cache (measured); only this
      # variable does. The image pre-warms the path at build time, so pointing at
      # it here also removes a 209 MB extraction from every single spawn.
      # `env_extra` is applied AFTER step 3, which is what lets it win.
      XDG_CACHE_HOME: "/opt/mllm/copilot-cache"
    # The BYOK env family needs no config file: COPILOT_PROVIDER_BASE_URL alone
    # activates the mode, and there is no trust prompt in `-p` mode.
    seed_files: []
    # MEASURED: exactly ONE completion POST per clean dispatch and NO catalog GET
    # at any point, so `test_the_stub_saw_only_this_row_s_model` sees exactly one
    # id. `stream: false` because the adapter ships `--stream off`; a full `tools`
    # array rides every request regardless, since copilot advertises tools to the
    # model even at §6.5 tier 1 (which is why the tier is a claim about OUR flags
    # and the filesystem canary is the claim about the child).
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: false, has_tools: true}
    turns: 1
    terminates_on_text: true
    # copilot's own retry chain is UNBOUNDED where a backend sends `Retry-After`
    # (measured: ~61/71/68/66 s gaps, a chain past 300 s) and it exposes no knob
    # to shorten it, so this outer bound is the only one there is.
    row_timeout_s: 300
    chain_row_timeout_s: 600
    version_measured: "1.0.80"
    help_invocation: "copilot --help"
    version_offline: true
    notes: >
      BYOK needs NO GitHub account: COPILOT_PROVIDER_BASE_URL is the activation
      switch and GitHub's own docs say authentication is not required in this
      mode. The seat path is stripped rather than configured
      (COPILOT_GITHUB_TOKEN/GH_TOKEN/GITHUB_TOKEN), and so is COPILOT_ALLOW_ALL,
      which is the env twin of --allow-all-tools and would widen the §6.5 tier
      with no argv change at all. Errors arrive as a `session.error` JSONL record
      ON STDOUT with stderr at 0 bytes; the one exit-0 failure shape (an empty
      provider 200) carries no error text anywhere and is detected structurally
      in parse_output rather than by a marker.

  - cli: kimi
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. kimi's adapter declares no `agent-write` profile (it is
    # `(generate,)` only, like every adapter harness-expansion.md adds), so the
    # executor's runner is a second binary and is DECLARED rather than tolerated.
    # That binary is the shared helper `opencode`, which writes without spawning
    # a sandbox where codex could not (header).
    chain_write_runner: opencode
    surface: chat
    mechanism: "KIMI_MODEL_* env family synthesizes one provider+model under the fixed ids __kimi_env__/__kimi_env_model__; KIMI_CODE_HOME isolates every write"
    # MUST equal env_extra.KIMI_MODEL_NAME below, byte for byte: that variable is
    # the ONLY place the slug exists. `kimi -m <slug>` is a hard failure
    # ("Model ... is not configured in config.toml"), so no model token ever
    # reaches argv and `test_the_stub_saw_only_this_row_s_model` reads the id out
    # of the request body that this variable produced.
    model_arg: "stub-model"
    # MEASURED (§7 step 4), not assumed: kimi appends `/chat/completions` to the
    # base URL VERBATIM and inserts no version segment of its own, so a
    # session-prefixed base arrives intact as `/s/<exec-id>/v1/chat/completions`.
    # Full, not `partial` — there is no catalog GET to keep the prefix off.
    session_prefix: true
    config_roots:
      KIMI_CODE_HOME: ".kimi-code"
    base_url_vars:
      # The `/v1` is load-bearing: kimi adds none of its own.
      KIMI_MODEL_BASE_URL: "{base_url}"
    credential_vars: [KIMI_MODEL_API_KEY]
    env_extra:
      # The enable switch. With no member of the family set, `kimi provider list
      # --json` returns empty and the CLI silently reverts to its config-file
      # route -- so a partial set is a run on somebody else's credential, not a
      # degraded one.
      KIMI_MODEL_NAME: "stub-model"
      KIMI_MODEL_PROVIDER_TYPE: "openai"
      # The pinned output ceiling. kimi otherwise asks for 131072 output tokens
      # on every call; a capped upstream rejects that outright rather than
      # clamping it (measured live: "Requested maximum tokens of 131072 exceeds
      # the maximum output tokens limit: 102400"). Pinned here as well as in
      # get_env so the container row runs the configuration the product ships.
      KIMI_MODEL_MAX_TOKENS: "8192"
      # The pinned retry knob. Without it a 5xx row would make TEN completion
      # POSTs over ~145 s inside one dispatch instead of one, blowing both the
      # row timeout and the single-request expectation in http_log below.
      KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: "1"
      # The image sets these two ENV-wide, but build_child_env starts from
      # scratch and carries over only the allowlist, so the per-CLI copies are
      # what actually reach the CLI.
      KIMI_CODE_NO_AUTO_UPDATE: "1"
      KIMI_DISABLE_TELEMETRY: "1"
    # The env family needs no config file at all: it is the only path that reads
    # process.env, and it writes nothing of its own (the config.toml
    # `[providers.<n>.env]` sub-table merely NAMES variables and is not a
    # shell-env reader).
    seed_files: []
    # MEASURED: one completion POST per clean dispatch, `stream: true` always,
    # and a full `tools` array on every request -- kimi advertises tools to the
    # model even in `-p` mode. No catalog GET is issued at any point.
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 1
    terminates_on_text: true
    row_timeout_s: 300
    chain_row_timeout_s: 600
    version_measured: "0.36.1"
    help_invocation: "kimi --help"
    version_offline: true
    notes: >
      Plain KIMI_API_KEY does NOTHING -- verified inert on its own. The
      KIMI_MODEL_* family is the only path that reads process.env.
      Assistant text is on stdout and stderr is EXACTLY 0 bytes on success,
      carrying one classified `error: failed to run prompt: <class>: <detail>`
      line on every failure; the exit code is authoritative in every shape (0
      success, 1 failure), so the adapter declares no exit-zero markers.
      The trailing `session.resume_hint` record also carries a `content` key,
      which is why the parser filters on `role == "assistant"`.

  - cli: kilocode
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: chat
    mechanism: "$HOME/.config/kilo/kilo.jsonc provider.<id> {npm: '@ai-sdk/openai-compatible', options.baseURL}"
    model_arg: "stub/stub-model"
    session_prefix: true
    seed_files: [".config/kilo/kilo.jsonc"]
    env_extra:
      # THE TWO OPT-OUTS KILOCODE SHIPS, which until 2026-08-20 nothing set. The
      # 2026-08-19 live row measured five call-home queries from this CLI —
      # models.dev, us.i.posthog.com twice, the registry.npmjs.org + github.com
      # update-check pair 6 ms apart, and api.kilo.ai — while the image's own
      # step-8 ENV block covers `DO_NOT_TRACK` and cline's updater but neither of
      # these, and this row's `env_extra` was empty. The names come from the
      # 7.4.19 bundle itself, not from documentation:
      #
      #   KILO_DISABLE_AUTOUPDATE  is in the CLI's env schema beside
      #                            KILO_ALWAYS_NOTIFY_UPDATE and
      #                            KILO_DISABLE_PRUNE.
      #   KILO_TELEMETRY_LEVEL     gates the PostHog client, and the gate is
      #                            `level ? level === "all" : config.enabled` —
      #                            so ANY value other than `all` disables it, and
      #                            `off` is the one we set. The bundle's own
      #                            description says the CLI "reads
      #                            KILO_TELEMETRY_LEVEL once at spawn".
      #
      # THEIR HOME IS HERE and not in the Dockerfile, for the reason the wrapper
      # contract at the top of this file states: wrapper.py rebuilds the child
      # environment from scratch, so an image-wide ENV never reaches a CLI
      # dispatched through it. The credentialed live lane inherits the image ENV
      # directly and would have been covered either way; the provider and chain
      # lanes would not.
      #
      # MEASURED AFTER, 2026-08-20, on the live row (green, 15.5 s): the DNS log
      # went from six names to five — **us.i.posthog.com is gone** and nothing
      # else moved. KILO_TELEMETRY_LEVEL does what its bundle says; the
      # registry.npmjs.org + github.com update-check pair survives
      # KILO_DISABLE_AUTOUPDATE, and models.dev and api.kilo.ai are untouched by
      # either. Both stay set: one works, and the other is the shipped opt-out
      # for the behaviour observed, so unsetting it would misreport the finding
      # as "nobody tried". The residue is declared in REFUSED_EGRESS
      # (tests/test_container_live_provider.py) with the same measurement, and
      # the DNS allowlist is what actually refuses it.
      KILO_DISABLE_AUTOUPDATE: "1"
      KILO_TELEMETRY_LEVEL: "off"
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: false}
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 2
    terminates_on_text: true
    startup_s: 0.641
    first_call_s: 1.904
    turn_s: 4.311
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 117.9
    chain_row_timeout_s: 600
    version_measured: "7.4.19"
    help_invocation: "kilocode run --help"
    version_offline: true
    notes: >
      TURN COUNT DEPENDS ON EGRESS. On a fresh $HOME kilocode fetches the 3.6 MB
      models.dev catalog; that fetch is best-effort (it still exits 0 unreachable),
      but with the catalog missing a small no-tools pre-turn call falls back onto the
      configured provider, so 1 request becomes 2. Under --network none the stub must
      serve TWO POST /v1/chat/completions per exec, the first carrying no tools.

