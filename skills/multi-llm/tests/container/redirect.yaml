  # -------------------------------------------------------------------------
  - cli: claude-code
    # The BINARY is `claude`; the provider id is `claude-code`. The wrapper
    # resolves one to the other, because argv[0] gives it the binary while the
    # row and home_seed/<id>/ are keyed by the id.
    binary: claude
    provenance: verified
    lane: provider
    surface: anthropic
    mechanism: "ANTHROPIC_BASE_URL + ANTHROPIC_API_KEY (or ANTHROPIC_AUTH_TOKEN); no config file"
    model_arg: "haiku"
    # The row pins the ALIAS `haiku`; claude-code resolves it to a concrete id
    # before the request leaves, so that is what the stub records. Declared here
    # rather than tolerated by a loose count — and it is a drift signal worth
    # having: when Anthropic moves the alias, this row fails naming both ids
    # instead of silently testing a different model than the one it pinned.
    # It did on the 2.1.285 -> 2.1.293 pin move (2026-10-08): `haiku` resolved to
    # claude-haiku-4-5-20251001 through 2.1.285 and resolves to claude-haiku-5-5
    # on 2.1.293 (the same id the re-captured parser fixtures carry).
    side_model_ids: ["claude-haiku-5-5"]
    session_prefix: true
    base_url_vars:
      ANTHROPIC_BASE_URL: "{base_url_root}"
    credential_vars: [ANTHROPIC_API_KEY]
    seed_files: []
    http_log:
      - {method: POST, path: /v1/messages, query: "beta=true", stream: true, has_tools: false,
         note: "session-title generator - SAME model, no tools"}
      - {method: POST, path: /v1/messages, query: "beta=true", stream: true, has_tools: true}
    turns: 2
    terminates_on_text: true
    startup_s: 0.070
    first_call_s: 0.550
    turn_s: 1.347
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 20.0
    chain_row_timeout_s: 600
    version_measured: "2.1.232"
    help_invocation: "claude --help"
    version_offline: true
    #: THE CREDENTIALED LIVE LANE'S ENDPOINT for this row: the bare `/api`
    #: origin, NOT `/api/v1`. Claude Code appends `/v1/messages` itself, so the
    #: `/api/v1` every other OpenRouter row uses would produce
    #: `/api/v1/v1/messages` and a 404 that reads like an auth failure. Identical
    #: to `entrypoint.py`'s OPENROUTER_ANTHROPIC_BASE, which has been driving the
    #: host lane's claude-code rows against OpenRouter since 2026-08-14.
    #:
    #: The variable this URL is EXPORTED in (ANTHROPIC_BASE_URL), the
    #: present-and-empty ANTHROPIC_API_KEY beside it, and the credential's alias
    #: (ANTHROPIC_AUTH_TOKEN) all live in the test module's lane-shaping tables
    #: rather than here. That is not a preference: `wrapper.build_child_env`
    #: applies `env_extra` AFTER `base_url_vars`, so an ANTHROPIC_BASE_URL in this
    #: row's `env_extra` would override the provider lane's per-exec stub URL and
    #: leave that lane green while testing nothing.
    live_base_url: "https://openrouter.ai/api"
    #: MEASURED ON THE FIRST CREDENTIALED RUN (2026-08-20, exit 0 in 7.9 s,
    #: `modelUsage` keyed by `anthropic/claude-haiku-4.5`, DNS log naming
    #: openrouter.ai and nothing else): the wire was fine and the OUTPUT CHANNEL
    #: was not. `claude -p` under this adapter's argv had no permission grant, so
    #: the model's `Write` call came back as
    #: `permission_denials: [{"tool_name": "Write", …}]`, the run ended
    #: `is_error: false, subtype: "success", terminal_reason: "completed"` with
    #: exit 0, and the answer on stdout was "Permission is required to write to
    #: the file. Please approve the write operation to proceed." — which
    #: `ClaudeCodeProvider.parse_output` then failed on ("No valid JSON found in
    #: text"). The adapter declares `supports_file_output = True`, so the live
    #: lane's a7 failed the row, and that was the assertion doing its job: the
    #: agent-write profile passed `--permission-mode acceptEdits` while the
    #: generate profile — the one whose prompt ASKS for a file — passed no
    #: permission flag at all.
    #:
    #: FIXED IN THE ADAPTER, NOT HERE (2026-08-20): `build_command` now emits
    #: `--permission-mode acceptEdits` in the policy region, so the generate argv
    #: carries the same narrow grant every other file-output adapter already had
    #: (codex `--sandbox workspace-write`, opencode's write-capable `run` agent,
    #: kilocode `--auto`). The re-run is 7/7 green with
    #: `observed_output_channel: file`, a real file on disk and
    #: `permission_denials: []`. Nothing here was ever seeded to paper over it,
    #: and nothing here changed to make it pass.
    notes: >
      TWO REQUESTS PER EXEC, NOT ONE. The first is Claude Code's own session-title
      generator - tool-free, 2.3 KB, and it uses the SAME model as the session, so
      a stub keyed on (model, surface) alone cannot tell the two apart; has_tools
      (0 vs 28) is the discriminator. The real turn is 142 KB.
      THE PATH CARRIES A QUERY STRING: /v1/messages?beta=true. A route table
      matching the raw target with endswith("/messages") 501s it - the spike's stub
      did exactly that and Claude Code retried 16 times over 90 s without writing a
      byte, which is indistinguishable from "redirection failed". The stub must
      split the query before dispatch.
      With NEITHER key variable set it fails CLOSED and fast: exit 1, zero requests,
      "Not logged in - Please run /login". In a scratch $HOME the plan's warning
      about an unset ANTHROPIC_API_KEY falling back to api.anthropic.com did not
      reproduce - but that is because the scratch home carries no OAuth credential,
      so it is not evidence against the host lane's present-and-empty assertion.

  # -------------------------------------------------------------------------
  - cli: gemini
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: gemini
    mechanism: "GOOGLE_GEMINI_BASE_URL (read by the bundled @google/genai SDK) + GEMINI_API_KEY"
    model_arg: "gemini-2.5-flash"
    session_prefix: true
    base_url_vars:
      GOOGLE_GEMINI_BASE_URL: "{base_url_root}"
    credential_vars: [GEMINI_API_KEY]
    # MEASURED 2026-09-19, on the 0.25.2 -> 0.60.0 bump. That jump added TWO
    # non-interactive gates, and each one fails EARLY ENOUGH TO LOOK LIKE A
    # REDIRECTION BUG: the CLI exits before any HTTP call, so the row reports
    # `zero requests reached the stub` while the redirect was never consulted.
    #
    # 1. A KEY IS NO LONGER AN AUTH METHOD. 0.25.2 inferred the method from the
    #    key's presence; 0.60.0 requires it to be SELECTED, and an unselected one
    #    exits 41 with `{"error":{"message":"Invalid auth method selected."}}`.
    #    `validateAuthMethod` accepts `gemini-api-key` against GEMINI_API_KEY, so
    #    the value is not in doubt -- only where it is written. Measured: the flat
    #    `selectedAuthType` key 0.25.2 used is IGNORED (still exit 41); the shape
    #    that works is nested under `security.auth.selectedType`, which is why
    #    this row grew a seed file it never had.
    # 2. THE WORKSPACE MUST BE TRUSTED. With auth fixed, 0.60.0 then refuses with
    #    "Gemini CLI is not running in a trusted directory", naming `--skip-trust`
    #    and this variable. The variable is used rather than the flag: the flag
    #    would have to be injected into every argv our own adapter builds, and
    #    this lane's job is to run the adapter's real argv.
    #
    # With both, gemini reaches `generateContentStream` and GOOGLE_GEMINI_BASE_URL
    # is honoured exactly as before -- the transitive-dependency contract the
    # `notes` below warned was the likeliest to move did NOT move; the CLI's own
    # startup gates did.
    env_extra:
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    seed_files: [".gemini/settings.json"]
    http_log:
      - {method: POST, path: "/v1beta/models/<model>:streamGenerateContent",
         query: "alt=sse", stream: true, has_tools: true}
    turns: 1
    terminates_on_text: true
    startup_s: 0.783
    first_call_s: 2.226
    turn_s: 2.257
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 107.2
    chain_row_timeout_s: 600
    version_measured: "0.25.2"
    help_invocation: "gemini --help"
    version_offline: true
    #: THE SECOND NON-OPENROUTER VENDOR ON THE CREDENTIALED LIVE LANE, and the
    #: first that had to be one for a protocol reason rather than a stub one.
    #: OpenRouter serves the three surfaces every other row speaks (Chat
    #: Completions, Responses, Anthropic Messages) and does NOT serve Google's
    #: `:generateContent`, so there is no way to point this CLI at the lane's
    #: default endpoint. Google's own API is the only live endpoint gemini has,
    #: and the key for it is a free-tier one with per-model, per-minute and
    #: per-day caps — one one-shot per row is well inside them.
    #:
    #: The credential is `GEMINI_API_KEY` rather than the lane default, which the
    #: driver's `_run_argv` reads: a row naming its own `credential_env` is
    #: forwarded THAT variable and only that one, so the OpenRouter key never
    #: reaches a binary with no use for it.
    live_lane: true
    live_vendor: google
    live_base_url: "https://generativelanguage.googleapis.com"
    #: NARROWED TO THE ENDPOINT, deliberately, and not to the `googleapis.com`
    #: suffix: gemini-cli's usage statistics go to `play.googleapis.com/log`
    #: (Clearcut, compiled into the 0.25.2 bundle) and the wider suffix would
    #: ALLOW that sink to resolve. Its opt-out is the `usageStatisticsEnabled`
    #: key in ~/.gemini/settings.json and there is no environment equivalent, so
    #: the DNS allowlist is the only control this lane can apply — the same
    #: position cursor-agent's row is in.
    live_allow: ["generativelanguage.googleapis.com"]
    credential_env: GEMINI_API_KEY
    egress_beyond_stub:
      #: MEASURED IN THE BINARY, not in the DNS log yet — `play.googleapis.com`
      #: is where the CLI's Clearcut client posts. Declared so a5's second half
      #: asserts it was REFUSED rather than merely hoping the allowlist held.
      hosts: ["play.googleapis.com"]
      opt_out_vars: []
      fatal_when_blocked: false
    notes: >
      THE VARIABLE IS NOT GEMINI-CLI'S. GOOGLE_GEMINI_BASE_URL appears nowhere in
      @google/gemini-cli 0.25.2 or -core; it is read by the bundled @google/genai
      SDK. It works, but it is a TRANSITIVE DEPENDENCY'S contract and therefore the
      likeliest of every mechanism here to move under a CLI upgrade - it deserves
      its own surface probe.
      Three stub consequences, all measured: (1) streaming ONLY, signalled by
      "?alt=sse" on the URL rather than a body flag or an Accept header; (2) the
      model is in the PATH, never in the body, so a stub keying sessions on
      body["model"] sees null for gemini; (3) NO [DONE] SENTINEL - Google's SSE
      dialect has none and gemini-cli JSON.parses every frame, so an OpenAI-style
      "data: [DONE]" kills the run with "Unexpected token D". That makes the
      sentinel a PER-SURFACE behaviour, not a global one.
      GEMINI_CLI_CONFIG_DIR is NOT consulted (the CLI names $HOME/.gemini/
      settings.json), and gemini CRASHES if $HOME does not exist.
      "-p/--prompt" is marked deprecated in 0.25.2 ("will be removed in a future
      version") - the adapter's positional form is correct, and this is a live
      drift signal worth a surface-probe row.

  # -------------------------------------------------------------------------
  - cli: opencode
    provenance: verified
    lane: provider
    surface: chat
    mechanism: "$XDG_CONFIG_HOME/opencode/opencode.json custom openai-compatible provider block"
    model_arg: "stub/stub-model"
    session_prefix: true
    seed_files:
      - ".config/opencode/opencode.json"
      - ".config/opencode/node_modules/"
      - ".config/opencode/package.json"
      - ".cache/opencode/models.json"
    env_extra:
      OPENCODE_DISABLE_MODELS_FETCH: "1"
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: false,
         note: "session-title generator"}
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 2
    terminates_on_text: true
    startup_s: 0.291
    first_call_s: 0.888
    turn_s: 1.245
    row_timeout_s: 600
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 51.4
    chain_row_timeout_s: 600
    version_measured: "1.18.18"
    help_invocation: "opencode run --help"
    version_offline: true
    notes: >
      COLD START IS A NETWORK DEPENDENCY, and it is the biggest image-level finding
      in the spike. On a fresh home opencode npm-installs ~63 MB into
      $XDG_CONFIG_HOME/opencode/node_modules (writing its own package.json and
      lockfile) and fetches a ~3.6 MB models.json from models.dev. Measured at
      >120 s, never reaching the stub. Under --network none that is a HARD FAILURE
      unless the image PRE-BAKES both, and it presents as a redirection bug rather
      than a missing install step. OPENCODE_DISABLE_MODELS_FETCH=1 guards the
      catalog half.
      "opencode auth login" is NOT needed: the key travels in the config block.
      TWO requests per exec, same shape as claude-code - a tool-free session-title
      call then the real one with tools.
      THE timeout-WRAPPER HAZARD HAS A MECHANISM, AND IT IS WORSE THAN RECORDED:
      a killed run leaves its PROJECT DIRECTORY poisoned, and every later run in
      that directory hangs at init with zero bytes - surviving a fresh $HOME, a
      fresh $TMPDIR, an empty process table and deletion of the .git/opencode
      marker. A clean exit poisons nothing. So a chain may reuse
      /work/sample-project, but a row that trips its cap burns the directory for
      every later opencode step; recreating it is the recovery.
      The adapter does NOT bake a "--" separator - build_command ends with a bare
      trailing positional. Fine for prompts not starting with "-", but the yargs
      hazard is still live for a materialized prompt beginning with "--", and
      cli-surface.yaml must not record a separator the product does not send.

  - cli: vibe
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. vibe's adapter declares no `agent-write` profile (it is
    # `(generate,)` only, like every adapter harness-expansion.md adds), so the
    # executor's runner is a second binary and is DECLARED rather than tolerated.
    # That binary is the shared helper `opencode`, which writes without spawning
    # a sandbox where codex could not (header).
    chain_write_runner: opencode
    surface: chat
    mechanism: "seeded config.toml [[providers]] backend=generic/api_style=openai; the endpoint and the KEY VARIABLE NAME live in the file, the model in VIBE_ACTIVE_MODEL"
    # THE SEED ALIAS, WHICH IS DELIBERATELY THE REAL SLUG. vibe is the one row
    # here whose model surface is an indirection: `model_arg` is what the driver
    # spec carries and what the adapter puts in VIBE_ACTIVE_MODEL, and the seed's
    # [[models]] entry maps that ALIAS to a WIRE name. Only the wire name differs
    # per lane ({{model_name}} -> `stub-model` here, the slug itself live), so
    # this value is byte-identical in three places -- here, providers.yaml's
    # `models:`, and the seed's `alias` -- and none of them invents a nickname.
    # The request body therefore carries `stub-model`, which
    # test_the_stub_saw_only_this_row_s_model already allows as the stub default.
    model_arg: "openai/gpt-5.6-luna"
    # MEASURED (§7 step 4), all three api_base forms: vibe appends exactly
    # `/chat/completions` to the base VERBATIM and never re-origins it, so the
    # `/v1` belongs in the base and a session-prefixed base is preserved intact.
    # Full, not `partial` -- vibe fetches NO catalog at all (zero GET /models
    # across 25 POSTs), which is also why `--max-price` is decidable offline.
    session_prefix: true
    config_roots:
      # vibe writes on EVERY run -- session logs, vibehistory, trusted_folders.toml
      # -- and reads its catalog from $VIBE_HOME/config.toml, so this is both the
      # isolation root and the seed's destination.
      VIBE_HOME: ".vibe"
    # NO base_url_vars: vibe has no base-URL environment variable at all. The
    # endpoint is `api_base` inside the seeded config.toml, rendered from
    # {{base_url}} by wrapper.py's copytree substitution.
    base_url_vars: {}
    # The seed names this variable through {{api_key_env}}; the wrapper binds
    # that token to STUB_API_KEY here and live_provider.py binds the SAME
    # template to OPENROUTER_API_KEY on the credentialed lane.
    credential_vars: [STUB_API_KEY]
    seed_files: [".vibe/config.toml"]
    env_extra:
      # Every VIBE_* the adapter's get_env sets. The wrapper rebuilds the child
      # environment FROM SCRATCH, so without these the row would run under a
      # configuration the product never ships -- and for VIBE_ACTIVE_MODEL that
      # would mean no model selected at all, since vibe has no --model flag.
      # Kept BYTE-EQUAL to the adapter; test_wrapper_env_contract.py fails if any
      # declared name is missing here.
      # BYTE-COUPLED TO THREE OTHER PLACES, and missing this one broke the row:
      # providers.yaml `models[0]`, this row's `model_arg`, the seed's
      # `[[models]] alias`, and here. The 2026-08-19 move to gpt-5.6-luna updated
      # the first three and left this at gpt-4.1-mini, so the wrapper — which
      # rebuilds the child env FROM SCRATCH and applies `env_extra` last — pinned
      # VIBE_ACTIVE_MODEL to an alias the rendered catalog no longer contained.
      # vibe selected nothing, fell back to its built-in `mistral` provider and
      # died on `Missing MISTRAL_API_KEY`: exit 1, zero requests, and the lane
      # reported "the stub recorded no model id at all". The LIVE lane was
      # unaffected and stayed green, which is why it took a provider-lane run to
      # surface — there `provider.resolve_env(model)` is applied last and the
      # adapter's own VIBE_ACTIVE_MODEL wins over this value.
      VIBE_ACTIVE_MODEL: "openai/gpt-5.6-luna"
      # The pinned inner bound. The vendor default is 720 s over 3 attempts --
      # a ~36-minute worst case in one slot -- and the adapter's declared
      # `max_wall_s` is computed from this number, so the two cannot drift.
      VIBE_API_TIMEOUT: "90"
      # 2.26.0's retry budget (vendor default 300 s, which measured 16 requests
      # over ~305 s on a fail-forever row). Pinned beside the timeout for the
      # same reason; the declared `max_wall_s` is computed from both.
      VIBE_API_RETRY_MAX_ELAPSED_TIME: "150"
      # §6.5's rung, pinned in env as well as argv: `default_agent` is
      # `accept-edits`, whose AgentSafety is DESTRUCTIVE.
      VIBE_DEFAULT_AGENT: "plan"
      VIBE_THINKING: "off"
      VIBE_ENABLE_TELEMETRY: "false"
      VIBE_ENABLE_UPDATE_CHECKS: "false"
      VIBE_ENABLE_NOTIFICATIONS: "false"
    # MEASURED: exactly one completion POST per clean dispatch and NO catalog GET
    # at any point.
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 1
    terminates_on_text: true
    # vibe's own chain is 3 attempts x the pinned 90 s api_timeout plus ~1.6 s of
    # backoff, and `Retry-After` is NOT honoured -- so unlike copilot's, this
    # inner bound is real and the outer one only has to clear it. At 2.26.0 it
    # is the pinned 150 s retry budget + one capped 30 s delay + one 90 s
    # attempt: 272 s, measured 267 s at worst. 2.26.1 starts no retry whose wait
    # ends past the budget: measured 239 s at worst (2026-10-09).
    row_timeout_s: 300
    chain_row_timeout_s: 600
    version_measured: "2.24.1"
    help_invocation: "vibe --help"
    version_offline: true
    notes: >
      The plan's §4.2 wrinkle does not exist: VIBE_ACTIVE_MODEL selects the model
      from the ENVIRONMENT, and two concurrent slots with different models were
      measured succeeding while sharing one VIBE_HOME and one read-only
      config.toml -- so there is no per-run file to template and §1's
      `prepare_run` hook has no consumer. The seed is static and committed.
      §6.5's ladder is inverted at the bottom for this CLI: a bare `vibe -p` runs
      `default_agent = accept-edits`, whose AgentSafety is DESTRUCTIVE and whose
      write_file/edit permission is `always`, so rung 1 is `--agent plan` (SAFE)
      and the adapter never emits anything wider. Config-validation errors print
      on STDOUT with stderr empty (the opencode trap) through 2.26.0, on stderr
      at 2.26.1; every other failure mode measured is on stderr and exits
      nonzero (1 through 2.26.0; 1, 2 or 3 at 2.26.1, measured 2026-10-09), so
      no exit-0 markers are declared.

  # -------------------------------------------------------------------------
  - cli: omp
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: chat
    mechanism: "$HOME/.omp/agent/models.yml providers.<id> {baseUrl, api: openai-completions, apiKey, models[]}"
    model_arg: "stub/stub-model"
    # MEASURED: omp posts to the per-exec path prefix unchanged
    # (`/s/<exec id>/v1/chat/completions`), so this row keys the stub's turn
    # counter exactly rather than falling back to the coarse tuple.
    session_prefix: true
    config_roots:
      # Reads PI_CODING_AGENT_DIR ahead of $HOME -- pi's trap, inherited whole.
      PI_CODING_AGENT_DIR: ".omp/agent"
    credential_vars: [STUB_API_KEY]
    # The one variable OmpProvider.get_env() sets unconditionally. The wrapper
    # builds its child's environment from scratch, so without this row the
    # container would run omp under a configuration the product never ships —
    # `tests/test_wrapper_env_contract.py` fails the row by name for exactly
    # that. It is an opt-out with no vendor and no credential in it (the setup
    # wizard does not run in print mode anyway; the pin makes that not depend on
    # omp); the adapter's OTHER variable is OPENROUTER_API_KEY, which is
    # conditional on the host having one and has no business on this lane.
    env_extra:
      OMP_SKIP_SETUP: "1"
      # 18.12.6 loads addons even for --help. Surface probes bypass seed_links
      # and use a noexec tmpfs HOME; load the image's pre-extracted addons.
      PI_NATIVES_DIR: "/opt/mllm/omp-natives"
    seed_files: [".omp/agent/models.yml"]
    # THE 346 MB THAT NEVER ENTER A $HOME. omp extracts its native addons into
    # $HOME/.omp/natives/<version>/ on the first run that loads them (3.6 s;
    # `--version` does not trigger it, `omp config get` does), and its loader
    # skips the extraction outright when the files are already at that path with
    # the expected size -- read off the binary at 18.2.2 and measured at 0.69 s
    # per run through a symlink against 3.6 s without one. The bytes are produced
    # ONCE in the image's own download layer, under the read-only root;
    # `wrapper.seed_invocation_root` makes this link in each per-invocation $HOME
    # after it has copied and templated the seed. Not an image ENV: the wrapper
    # builds its child's environment from scratch. PI_NATIVES_DIR above also
    # supports direct probes at 18.12.6; keep the home link for code that reads
    # the default native path. Not the seed tree: that tree is
    # committed, and the wrapper copytrees it per EXEC onto a tmpfs.
    seed_links:
      ".omp/natives": "/opt/mllm/omp-natives"
    http_log:
      - {method: POST, path: /v1/chat/completions, stream: true, has_tools: true}
    turns: 1
    terminates_on_text: true
    # MEASURED on the first green provider-lane run (2026-09-17, image-local,
    # --network none, uid 10001, read-only root): `omp --version` in this image
    # is 0.052 s; dispatch to the single POST reaching the stub is 0.486 s; the
    # slot itself reported `Completed successfully in 0.7s`. The natives are
    # inside those numbers rather than outside them — this row's `seed_links`
    # points each exec at the image's extract, and the same run without it costs
    # 2.7 s and 346 MB of tmpfs before omp answers anything.
    startup_s: 0.052
    first_call_s: 0.486
    turn_s: 0.7
    row_timeout_s: 300
    # NOT measured yet — but no longer blocked. This note used to read "the chain
    # lane cannot run on this host at all today": every borrowing row's
    # `chain_write_runner` was codex, and codex refuses its `agent-write`
    # dispatch with `sandbox_unavailable` (bwrap cannot create a user namespace
    # under Docker's default seccomp profile), so `full --exec-subagents` stopped
    # at apply-suggestions for all 16 rows — pi and grok included, both of which
    # were green here on 2026-09-10. The repoint of this row's helper to
    # `opencode`, which spawns no sandbox, removes exactly that blocker; what is
    # left is a capture pass, and `chain_s` plus the golden bundle land with it.
    chain_row_timeout_s: 600
    version_measured: "18.2.2"
    help_invocation: "omp --help"
    version_offline: true
    notes: >
      THE PROMPT ARRIVES ON STDIN, and this is the first row where that is true:
      OmpProvider declares `prompt_transport = "stdin"`, so the argv this row
      records ends at `--model <model>` with no `--` and no positional, and the
      wrapper passes the stream through untouched (it forks and execve's,
      inheriting fds). The user message the stub sees therefore has TWO text
      parts -- a `<system-reminder>` block carrying the date and the cwd, then the
      prompt itself, once -- beside a ~10 KB system prompt; `extract_prompt`
      joins every part, so the scenario matcher sees the prompt exactly once and
      an argv+stdin regression would show up as a second copy.
      ONE POST PER DISPATCH, `stream: true` with `stream_options.include_usage`,
      `store: false`, `max_completion_tokens` and the tool schemas; no catalog
      GET at any point. Every `-p` run also makes three best-effort loopback
      probes (127.0.0.1:11434 / :8080 / :1234 -- ollama, llama.cpp, lm-studio)
      and one TLS attempt to catalog.stencil.so; under `--network none` all of it
      warns and the run still exits 0, and the stub deliberately listens on none
      of those three ports.
      The overlay `assets/omp/overlay.yml` is rendered on argv as an ABSOLUTE
      path and is copied into the image by the skill layer; a missing overlay is
      a launch failure by design (exit 1, `Config overlay not found`), so a row
      that dies in 0.13 s with an empty stub log is that COPY, not the redirect.

  # -------------------------------------------------------------------------
  # Rows that reach no model surface. Both are `lane: fake`, which is a PROMISE
  # about mock_llm.py (C5): cursor-agent is already one of its six identities;
  # `agy` is the only provider in this matrix that still needs the five mock parts.
  # -------------------------------------------------------------------------
  - cli: cursor-agent
    provenance: none
    lane: fake
    startup_s: 0.279
    version_measured: "2026.08.11"
    help_invocation: "cursor-agent --help"
    attempts: ["CURSOR_API_ENDPOINT", "-e/--endpoint", "bedrock mode"]
    reason: >
      The redirect itself WORKS — CURSOR_API_ENDPOINT (default https://api2.cursor.sh)
      sent 100% of traffic to the stub and nothing reached Cursor. It is unserviceable
      anyway: after a JSON handshake POST /auth/exchange_user_api_key, every call is
      POST /aiserver.v1.<Service>/<Method> with content-type: application/proto and
      connect-protocol-version: 1 — binary protobuf over Connect-RPC. None of the three
      model-API surfaces are involved, so serving it means reimplementing Cursor's
      protobuf schema, which is not a stub. `bedrock` mode is not an escape: its own
      self-test validates against the backend.

    # THE ROW IS BOTH, and `lane: fake` is deliberately unchanged. Moving it to a
    # third lane value would silently drop cursor out of
    # `tests/test_fake_lane_roster.py`'s five-part promise — the ONLY thing that
    # checks this adapter's argv, its parser and its version gate against a
    # binary — and every reader of `lane` is a positive-match filter, so nothing
    # would have gone red. So the live lane is an ORTHOGONAL opt-in field beside
    # it, not a replacement for it.
    #
    # WHY CURSOR IS ON THE CREDIT-SPENDING LANE WHEN THE OTHER TWELVE EARN THEIR
    # GRADE FOR FREE: the reason above is not a gap to be closed later, it is a
    # permanent one. There is no stub, therefore no free behavioural lane, and
    # cursor-agent is `providers.yaml`'s `default_provider` and most of both
    # `defaults.models` and `quick_models`. It shipped a release under
    # `--mode ask` answering every review slot with "I can't write the requested
    # file while Ask mode is active" and no lane here could see it. A live row is
    # what the alternative to that is.
    live_lane: true
    live_vendor: cursor
    #: Not OpenRouter: cursor's models are reached through Cursor's own backend.
    live_base_url: "https://api2.cursor.sh"
    #: The one name this row may resolve. `api2.cursor.sh` is the endpoint;
    #: `cursor.sh` covers it by dot-suffix. Telemetry is DELIBERATELY not here —
    #: see `egress_beyond_stub` below.
    live_allow: ["cursor.sh"]
    #: Cursor's credential is a FILE, not a variable. `~/.config/cursor/auth.json`
    #: (mode 0600, the developer's uid) is the store the CLI itself resolves on
    #: Linux — `$XDG_CONFIG_HOME/cursor/auth.json`, a rule consulting neither
    #: CURSOR_CONFIG_DIR nor CURSOR_DATA_DIR. A `:ro` bind of it is UNREADABLE in
    #: this container (uid 10001; `posture.yaml` rejects `--user $(id -u)` by
    #: name), so the host driver reads it and the runner stages the bytes into
    #: the run's own disposable HOME. `CURSOR_API_KEY` is the other supported
    #: shape and needs none of this — a row may switch to it by dropping
    #: `credential_file` and naming `credential_env: CURSOR_API_KEY`.
    credential_file: ".config/cursor/auth.json"
    credential_source: "~/.config/cursor/auth.json"
    #: `default_timeout` is 600; the inner bound stays strictly under the outer.
    row_timeout_s: 300
    egress_beyond_stub:
      #: Unfixable from our side: the bundle carries no DO_NOT_TRACK, no
      #: CURSOR_TELEMETRY_* and no other opt-out variable, so unlike
      #: copilot/kimi/qwen/vibe this row's opt-out set is EMPTY *by measurement*
      #: and configuration cannot silence any of these. `live_allow` is
      #: `cursor.sh` alone, so each gets NXDOMAIN, and `test_a5_egress` asserts
      #: none of them was ANSWERED rather than merely hoping.
      #:
      #: MEASURED on the first live row (2026-08-19, run 20260819T112857Z):
      #: `registry.npmjs.org` was refused — a real call-home this row's
      #: allowlist stopped, and the reason that name is first in the list. The
      #: statsig and sentry names are compiled into the bundle and did not
      #: appear in that run's dns.jsonl; they are kept because a cold profile is
      #: what triggers the ~703 KB statsig fetch and this run had a warm one.
      #: Refusing them costs a degraded telemetry fetch, never the row.
      hosts: ["registry.npmjs.org", "featureassets.org", "prodregistryv2.org",
              "statsigapi.net", "o4504648565915648.ingest.us.sentry.io"]
      opt_out_vars: []
    #: What the `cursor.sh` suffix really covers, measured in the same run: 33
    #: queries to `api2.cursor.sh` plus `api3.cursor.sh` and
    #: `agentn.global.api5.cursor.sh`. Recorded so a future narrowing of
    #: `live_allow` to the bare endpoint is a deliberate choice rather than a
    #: surprise outage.
    live_hosts_observed: ["api2.cursor.sh", "api3.cursor.sh",
                          "agentn.global.api5.cursor.sh"]

  - cli: agy
    provenance: none
    lane: fake
    startup_s: 0.051
    #: The spike's binary, and the version every `repo_corrections` entry below
    #: was measured against. The IMAGE pins 1.1.15 (cli-versions.lock), which is
    #: two daily releases later; the surface contract records what was really
    #: installed, so the two numbers differing here is data, not drift.
    version_measured: "1.1.13"
    help_invocation: "agy --help"
    attempts: ["CLOUD_CODE_URL", "settings.json modelProvider + GEMINI_API_KEY",
               "GEMINI_API_KEY + GOOGLE_API_KEY + GOOGLE_GEMINI_BASE_URL"]
    reason: >
      CLOUD_CODE_URL is a real, working endpoint override (the binary logs
      "Overriding CloudCodeServerURL via CLOUD_CODE_URL") and the protocol is JSON,
      not protobuf: /v1internal:loadCodeAssist, :setUserSettings, :listExperiments.
      What blocks the provider lane is that agy never reaches a model surface at
      all: it fails at the ELIGIBILITY gate on :loadCodeAssist, whose response
      schema is Google-internal, and its AUTH RESOLVES BEFORE THE FIRST RPC — so
      the failure happens with zero requests leaving the process. Re-measured
      2026-08-19: GEMINI_API_KEY, GOOGLE_API_KEY and GOOGLE_GEMINI_BASE_URL set
      together produce a BYTE-IDENTICAL auth failure with ZERO requests reaching
      the stub, so no environment variable selects an API-key path a stub could
      answer. This row is therefore permanently `lane: fake`; it is not a gap
      waiting on effort.
      THE PREVIOUS TEXT HERE WAS WRONG ON TWO COUNTS, both corrected below and
      both worth stating because each argued against work that is now done:
      it said auth "is not in $HOME at all but in the OS KEYRING, so there is
      nothing to seed" — true only while D-Bus is reachable — and it rated a
      settings.json `modelProvider` API-key path at "~30 minutes of follow-up".
    #: NOT a lane, and deliberately not one. `lane: fake` is a PROMISE about
    #: mock_llm.py (C5) that `tests/test_fake_lane_roster.py` grades, and every
    #: reader of `lane` is a positive-match filter, so re-labelling this row to
    #: get it probed would silently drop it out of that five-part promise with
    #: nothing going red — the same trap the `live_lane` comment above
    #: cursor-agent describes. So this is a THIRD orthogonal opt-in beside both:
    #: it says only "run the cli-surface help probe against this binary", which
    #: needs the binary, no stub, no credential and no network.
    #:
    #: What it buys: agy's adapter emits six options plus a `-p` that carries
    #: the PROMPT AS ITS VALUE rather than as a positional (`-p` is the short
    #: alias of `--print`), which is exactly the shape a silent upstream rename
    #: breaks without any test in this repo noticing — the argv golden compares
    #: our argv against our own table and stays green through it.
    surface_probe: true
    #: The image sets this ENV-wide, and that is not enough: wrapper.py rebuilds
    #: its child's environment from scratch (PATH/TERM/LANG/LC_ALL/TZ and MLLM_*
    #: only), so nothing dispatched THROUGH the wrapper inherits it. `true`, not
    #: `1`: with `=1` agy was measured spawning a background updater and
    #: rewriting itself 1.1.13 -> 1.1.15 inside a single run, and it releases
    #: daily, so an un-opted-out invocation unpins the image within a day.
    env_extra:
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
    repo_corrections:
      # Things this row contradicts in the tree today -- and, for the two marked
      # RETRACTED, things an earlier version of this row got wrong itself.
      - "RETRACTED, and the retraction is what unblocked the image row.
         providers.yaml and the adapter docstring say auth is persisted in
         ~/.gemini/antigravity-cli/, and this row used to answer 'no, it is the
         OS keyring, so there is nothing to seed'. Measured: that holds only
         where D-Bus is REACHABLE. Headless — which is every container — agy
         logs 'Failed to load token from keyring, falling back to file' and
         openat()s $HOME/.gemini/antigravity-cli/antigravity-oauth-token. That
         file is seedable exactly the way cursor-agent's auth.json already is
         (host-side read, forwarded by name, written 0600 into the disposable
         HOME, redacted from every record). So the docstring is right for the
         container case and this row was wrong. It still matters ON A LAPTOP:
         a probe run where D-Bus IS reachable silently uses the developer's real
         Google token, so any such probe must break the bus deliberately
         (DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent-bus)."
      - "agy SELF-UPDATES with no --no-auto-update flag; the opt-out is
         AGY_CLI_DISABLE_AUTO_UPDATE, and its value must be `true` — `=1` was
         measured spawning a background updater that rewrote the binary
         1.1.13 -> 1.1.15 INSIDE A SINGLE RUN. It had already rewritten the
         developer's own binary (1.1.8 -> 1.1.13) during the spike."
      - "RETRACTED. This row used to claim the binary carries a geminiAPIKeyAuth
         method gated on a settings.json `modelProvider` key plus
         GEMINI_API_KEY/GOOGLE_API_KEY, and rated selecting it at '~30 minutes
         of follow-up'. That follow-up was spent: NO SUCH SETTINGS KEY EXISTS,
         and the three variables set together produce a byte-identical auth
         failure with zero requests reaching a stub. 'Google OAuth only' is
         accurate for every path reachable from the environment, agy is not a
         provider-lane candidate, and nobody should spend that half hour again."

# ===========================================================================
# THE WRITER AXIS. A sibling of `clis:`, deliberately NOT three more rows in it.
#
# WHY IT EXISTS. The 16 provider-lane chain rows above grade one question — does
# this CLI's reviewer parse still hold across all eight phases — and the write
# path was only ever graded as a BY-PRODUCT of whichever helper those rows
# borrowed. The three entries below invert that: the reviewer is held fixed and
# the WRITE RUNNER is varied, so each write-capable CLI's own write path is
# graded exactly once, on a row that exists for it and for nothing else.
#
# WHY THE REVIEWER IS `pi`, AND WHY IT IS RECORDED ONCE HERE RATHER THAN PER ROW.
# pi is one of the 13 CLIs that do NOT declare `agent-write`, so pairing it with
# a different write runner cannot trip
# `test_it_is_declared_exactly_where_the_cli_has_no_agent_write`. It is also the
# cheapest reviewer to bolt onto a writer's row: `surface: chat`, `turns: 1`, one
# `POST /v1/chat/completions` per exec, no session-title call, no
# `side_model_ids`, no `egress_beyond_stub`, one seeded `.pi/agent/models.json`
# and nothing else, and a measured `chain_s` of 100.7 s to price the axis from.
# The pin is recorded ONCE, as this block's `reviewer` key, and all three entries
# read it from here so it cannot drift per row. `qwen-code` is the declared
# fallback if pi's seed file collides with a writer's home — also a one-turn
# `chat` row, but with no measured `chain_s`.
#
# WHY A SEPARATE BLOCK AND NOT THREE MORE `clis:` ROWS. Three consumers break at
# once if these enter the provider lane: `test_container_full_chain._rows()`
# builds `VERIFIED` / `IDS` / `BY_CLI` from every `lane: provider` row, so a
# second `codex` row is a duplicate pytest id and a clobbered `BY_CLI` key;
# `test_redirect_matrix_claims` would trip its first guard on all three writers,
# each of which declares `agent-write`; and `container_bundle.baseline_path(cli)`
# resolves to `<cli>/bundle.json`, so `chain-writer-codex` would collide with
# `chain-codex` and the second capture would silently overwrite the first.
#
# WHERE THE BASELINES LIVE. In their own namespace,
# `tests/golden/container/writer-<cli>/bundle.json`, never beside the reviewer
# bundle of the same CLI. `writer-codex` has NONE anywhere — no host has produced
# one — and is exempt from the completeness check by this block's own
# `sandbox_skip_when` declaration, reported as an uncovered writer rather than as
# a present baseline, until a permissive-userns host captures one. The exemption
# covers absence alone: a `writer-codex/` directory that exists is held to every
# assertion the other two are, and retiring the declaration puts it straight back
# into both sets.
# ===========================================================================
chain_writer_axis:
  - writer: codex
    reviewer: pi
    sandbox_skip_when: userns-unavailable
  - writer: opencode
    reviewer: pi
  - writer: claude-code
    reviewer: pi
