  # -------------------------------------------------------------------------
  - cli: grok
    provenance: verified              # the plan predicted `none expected`
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: chat
    mechanism: "GROK_MODELS_BASE_URL + XAI_API_KEY (a documented custom-endpoint mode)"
    # WRITTEN DOWN RATHER THAN INHERITED. Both container lanes fall back to the
    # literal `stub-model` when a row omits this key, so grok was the one row
    # whose model under test was decided by a default instead of a declaration
    # (harness-expansion.md §14.7 gap 7). This value is byte-identical to what the
    # fallback already produced, and it must NOT be providers.yaml's models[0]:
    # `grok-4.5:high` carries an `:effort` suffix that makes the adapter add
    # `--reasoning-effort high`, which no row emits and expected_argv.yaml does not
    # carry. `stub-model` is also CATALOG_MODELS[0] in stub_server.py, which this
    # row needs — grok exits 1 on a -m value absent from GET /v1/models.
    model_arg: "stub-model"
    session_prefix: true
    base_url_vars:
      GROK_MODELS_BASE_URL: "{base_url}"
    # Model ids this CLI puts on the wire that are NOT the -m value: grok's
    # session-title side call hardcodes `grok-build`. Declared so the per-row
    # "the stub saw only this row's models" assertion can be an exact set rather
    # than a count, which is what makes it fail in both directions.
    # MEASURED 2026-09-19 on the 0.2.93 -> 1.0.34 bump: the session-title side
    # call's HARDCODED model id moved from `grok-build` to `grok-4.6`. It is still
    # hardcoded and still unrelated to the -m value, so the exact-set assertion is
    # what caught it — a count would have stayed green through the rename.
    side_model_ids: ["grok-4.6"]
    credential_vars: [XAI_API_KEY]
    # GrokProvider.get_env's two switches (review 24, pins #1/#2), repeated
    # here because the wrapper rebuilds the child env from scratch: the billed
    # turn-summary call off (an answered exec is 4 requests, not 5) and grok's
    # retry ladder bounded (a fail-forever 5xx is 8 chat requests over 54 s, not
    # 60 over ~1,341 s). tests/test_grok_dispatch_env.py holds the values equal.
    env_extra:
      GROK_TURN_SUMMARY: "0"
      GROK_CONFIG: '{"models":{"max_retries":2}}'
    seed_files: []
    http_log:
      # NEW IN 1.0.x, measured 2026-09-19 on the 0.2.93 -> 1.0.34 bump: the CLI
      # probes the base-URL ROOT for reachability before any completion. 0.2.93
      # did not, so this route was neither declared here nor served by the stub
      # and the row recorded `the stub does not serve [('GET', '/')]` — while
      # every other assertion passed, which is exactly the shape a tolerated
      # undeclared request has. `stub_server._route` answers it as health.
      - {method: GET,  path: /,                    stream: false}
      - {method: GET,  path: /v1/models,           stream: false}
      - {method: POST, path: /v1/responses,        stream: true,
         note: "concurrent side call with a HARDCODED model id `grok-build`, not the -m value"}
      - {method: POST, path: /v1/chat/completions, stream: true}
    turns: 1
    terminates_on_text: true
    startup_s: 0.026
    first_call_s: 0.134
    turn_s: 0.271
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 99.9
    chain_row_timeout_s: 600
    version_measured: "0.2.93"
    help_invocation: "grok --help"
    version_offline: true
    notes: >
      THE CONCURRENT /v1/responses CALL IS A SESSION-TITLE GENERATOR ("You are
      tasked with generating the session title."), measured in Phase 3 — and it
      carries tools, which is why has_tools cannot be used to separate it. Its
      model id is the hardcoded `grok-4.6` (`grok-build` before 1.0.x), recorded
      above as side_model_ids.
      Documented in grok's own bundled ~/.grok/README.md under "Custom Models
      Endpoint": GROK_MODELS_BASE_URL switches it off xAI's cli-chat-proxy onto a
      plain OpenAI-compatible base URL, and off session auth onto Authorization:
      Bearer. TWO HARD PRECONDITIONS: the -m model must appear in the stub's
      GET /v1/models catalog or grok exits 1 with `unknown model id`; and XAI_API_KEY
      must be non-empty or grok opens an interactive OAuth DEVICE FLOW against
      accounts.x.ai and blocks until timeout.
      A THIRD PRECONDITION, MEASURED 2026-09-22, AND IT IS THE LANE'S NETWORK
      POSTURE RATHER THAN ANYTHING IN THIS ROW: grok CONNECTs to `api.x.ai:443`
      at startup, before its first stub request, whatever XAI_API_KEY holds. When
      that CONNECT FAILS — `--network none`, which is every `lane: provider` row —
      grok falls through to the documented custom-endpoint path and the four
      requests in `http_log` above are exactly what it makes. When it SUCCEEDS,
      grok validates the credential against xAI, the wrapper's synthesized
      `mllm-stub-<exec_id>` is not a session there, and grok exits 1 with
      `Not signed in. To authenticate without a browser, run: grok login
      --device-code` after the `GET /v1/models` and before every other route
      here. So the fake key is sufficient ONLY where egress is impossible.
      HOW IT WAS MEASURED, host grok 1.0.24 against a localhost OpenAI stub with
      no real credential anywhere: egress reachable -> exit 1, one stub request;
      the same argv with HTTPS_PROXY/HTTP_PROXY/ALL_PROXY pinned at a closed port
      and NO_PROXY=127.0.0.1 -> exit 0 and the full four-request sequence. The
      proxy log records the two `CONNECT api.x.ai:443` attempts. A `xai-`-prefixed
      fake key behaves identically to `mllm-stub-…`, so the shape of the value is
      not what decides this.
      WHAT IT MEANS FOR THE HOST LANE, which runs on `bridge` with `egress: open`
      (`posture.yaml`): a fan-out member `grok` cannot run there on the wrapper's
      fake key. `runs/20260922T084502Z` is the evidence — image grok 1.0.34, the
      call log shows XAI_API_KEY and GROK_MODELS_BASE_URL both present in
      `child_env_names`, `stub.jsonl` shows the one `GET /s/<exec>/v1/models`, and
      the row's error log carries the `Not signed in` line — which is why all four
      `opencode-*` fan-out rows failed `test_every_assigned_provider_really_ran`.
      A REAL xAI KEY IS NOT THE FIX AND WAS NOT TRIED: this rig's fan-out
      credential contract is `wrapper.py`'s rule 2 (inject only FAKE stub
      credentials), so handing grok a live vendor key would make it the one
      provider holding spendable credit inside a container with open egress. The
      two routes that keep the contract are to deny grok egress for the duration
      of its child (no such mechanism exists in the rig today — a bare `env_extra`
      proxy pin would also reach the LIVE provider lane, which `live_provider.py`
      strips `base_url_vars`/`credential_vars`/`http_log` from and nothing else),
      or to carve grok out of the opencode host's `fan_out` with a dated cell, the
      route `host_matrix.yaml`'s partition header already names.

