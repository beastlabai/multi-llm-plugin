  - cli: muse
    provenance: verified
    lane: provider
    # CHAIN ROW ONLY. This CLI's adapter declares no `agent-write` profile, so
    # the executor's runner is a second binary: the shared helper `opencode`,
    # which writes without spawning a sandbox where codex could not (header).
    # It is DECLARED here rather than tolerated: the per-row single-CLI
    # assertion compares the call log against {cli} u {this} in both directions,
    # and a plain-CI test cross-checks this key against the adapters' own
    # `agent_profiles` so the two cannot drift.
    chain_write_runner: opencode
    surface: responses
    mechanism: "muse exec --base-url (ARGV ONLY — no env var, no config key) + auth.json or META_API_KEY"
    model_arg: "muse-spark-1.2"
    session_prefix: partial            # kept on POST /s/<id>/responses, stripped on the catalog GET
    argv_inject:
      # The one row whose override is argv-only. Six config keys across auth.json
      # and settings.json were proved negative — all six left the request on the
      # real Meta endpoint with zero stub hits — and MuseProvider.build_command
      # emits no --base-url, so the wrapper is the only place the flag can come
      # from without putting a test concern into shipping code.
      after_token: exec
      args: ["--base-url", "{base_url}"]
    credential_vars: [META_API_KEY]
    env_extra:
      MUSE_NO_AUTO_UPDATE: "1"
    seed_files: [".config/muse/auth.json", ".config/muse/settings.json"]
    http_log:
      - {method: GET,  path: /muse-code/models, stream: false, count: 2}
      - {method: POST, path: /responses,        stream: true,  count: 15}
    turns: 17
    terminates_on_text: true
    startup_s: 0.008
    first_call_s: 0.025
    turn_s: 0.913
    row_timeout_s: 300
    # Phase 3 measurement: `full --quick --yes --exec-subagents` +
    # `ask` + `status`, one green run, wall clock including container
    # start and the workspace seed.
    chain_s: 119.1
    chain_row_timeout_s: 600
    version_measured: "0.1.0"
    help_invocation: "muse exec --help"
    version_offline: true
    notes: >
      SEVENTEEN REQUESTS FOR ONE GENERATE CALL, and they are not retries: the JSONL
      shows five tasks — the real model.meta.response plus four background
      `reminder.agent.plugin:tbh-reminders:*` tasks fired in parallel, each making
      ~3 calls with distinct bodies. One reminder failed without affecting the exit
      code or the parsed answer. A per-exec turn counter advances ~15x per user turn
      and a coarse (model, surface, pattern) tuple cannot separate them at all — so
      this row REQUIRES the path-prefix session key, and its scenario must tolerate
      the reminder prompts.
      providers.yaml is WRONG that auth is not an env var: META_API_KEY is read and
      takes precedence over auth.json.
      The `muse` on PATH is a bash launcher, not the binary; it auto-updates from
