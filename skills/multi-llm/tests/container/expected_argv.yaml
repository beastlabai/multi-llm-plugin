# Normalized argv table — command-construction regression (C8 part one).
#
# READ THIS AS COVERAGE OF OUR OWN build_command(), NOT AS DRIFT DETECTION.
# Both sides of the comparison originate in this repository. If an upstream CLI
# renames or removes a flag, the wrapper keeps logging the argv *we* generate,
# byte-identical to this table, and the assertion stays green while the real
# binary rejects the call. The upstream-facing half is cli-surface.yaml's help
# probe. What this catches is a refactor on OUR side that drops --json, reorders a
# positional, loses a separator token, or leaks a stray flag — at the argv,
# instead of inside a decoded stream three layers down.
#
# WHAT IS COMPARED is the normalized flag view (tests/golden/normalize_argv.py),
# never the raw argv: the prompt positional is tens of KB of plan text, and the
# model ids, per-invocation config roots and absolute paths are volatile by
# construction. Policy values stay VERBATIM because they are the assertion
# (--sandbox workspace-write, --format json, --log-level ERROR, --with-builtin
# developer, --max-turns 25); row-derived values become a TYPED placeholder, so a
# refactor that passed a base URL to --model does not normalize identically.
#
# KEYED provider x profile x transport. build_command_for_transport(..., "stdin")
# returns cmd[:-1] and hands the prompt to the child's stdin, so one adapter
# legitimately emits two argvs. A record whose prompt is on argv must match an
# `argv` row and one without must match a `stdin` row; a crossed match fails.
# That is deliberate: cmd[:-1] truncating a FLAG because the prompt was no longer
# last is precisely the silent bug a "the prompt is optional" rule would wave
# through.
#
# CURSOR-AGENT IS DELIBERATELY ABSENT, and adding it would break the table.
# Every entry here is graded against the wrapper's call log from a provider-lane
# run (`test_container_argv.py::TestEveryEntryStillDoesWork`: an entry matching
# fewer records than it declares is reported as stale). cursor-agent is in the
# image and on the live lane, but it has no provider-lane row and never will —
# its backend is binary protobuf over Connect-RPC, so no stub can answer it — so
# a cursor entry here would match zero records and fail as stale on every run.
# Its argv is covered instead by `tests/test_cursor_argv_and_residue.py` and the
# fake-lane roster's parser round-trip, and its upstream-facing half by
# `cli-surface.yaml`, whose seeder takes live-lane rows for exactly this reason.
#
# Seeded 2026-08-14 from a real `review-plan --quick` run of all 11 rows, then
# read by hand. The agent-write/stdin rows arrive with Phase 3's full chain,
# which is what dispatches that transport.
#
# COMPARISON RUNS IN BOTH DIRECTIONS: every call-log record must match some entry,
# and every entry must match at least min_records records. An entry matching
# nothing is a stale row (a profile we stopped dispatching), which is as much a
# finding as an unmatched record.

version: 1

entries:
  - provider: aider
    profile: generate
    transport: argv
    binary: aider
    subcommands: []
    options:
      "--chat-history-file": "/dev/null"
      "--input-history-file": "/dev/null"
      "--message": "<prompt>"
      "--model": "<model>"
      "--no-analytics": null
      "--no-auto-commits": null
      "--no-check-update": null
      "--no-detect-urls": null
      "--no-fancy-input": null
      "--no-gitignore": null
      "--no-pretty": null
      "--no-show-model-warnings": null
      "--no-show-release-notes": null
      "--no-stream": null
      "--read": "<path>"
      "--yes-always": null
    tail: []
    prompt: argv
    min_records: 1

  - provider: aider
    profile: generate
    transport: argv
    binary: aider
    subcommands: []
    options:
      "--chat-history-file": "/dev/null"
      "--input-history-file": "/dev/null"
      "--message": "<prompt>"
      "--model": "<model>"
      "--no-analytics": null
      "--no-auto-commits": null
      "--no-check-update": null
      "--no-detect-urls": null
      "--no-fancy-input": null
      "--no-gitignore": null
      "--no-pretty": null
      "--no-show-model-warnings": null
      "--no-show-release-notes": null
      "--no-stream": null
      "--read": "<path>+"
      "--yes-always": null
    tail: []
    prompt: argv
    min_records: 1

  - provider: claude-code
    profile: agent-readonly
    transport: stdin
    binary: claude
    subcommands: []
    options:
      "--allowed-tools": "Read,Grep,Glob,TodoWrite"
      "--disallowed-tools": "Edit,MultiEdit,Write,NotebookEdit,Bash,Task,WebFetch,WebSearch"
      "--model": "<model>"
      "--output-format": "json"
      "-p": null
    tail: []
    prompt: stdin
    min_records: 1

  # The schema-carrying variant of the row above: the one argv renderer
  # (`claude_code.ClaudeCodeProvider._render_argv`, which build_command and both
  # agent profiles go through) splices --json-schema right after
  # --output-format json when the §5.4.1 --help gate passes. The chain reaches it
  # exactly once, for kind
  # task_generation -> phase generate-tasks -> generated_tasks.schema.json. The
  # collapsed digest is pinned deliberately: a schema swapped for another schema
  # is the regression this row exists to catch.
  - provider: claude-code
    profile: agent-readonly
    transport: stdin
    binary: claude
    subcommands: []
    options:
      "--allowed-tools": "Read,Grep,Glob,TodoWrite"
      "--disallowed-tools": "Edit,MultiEdit,Write,NotebookEdit,Bash,Task,WebFetch,WebSearch"
      "--json-schema": "<prompt:sha256:7c5e7d6c:len=2325>"
      "--model": "<model>"
      "--output-format": "json"
      "-p": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: claude-code
    profile: agent-write
    transport: stdin
    binary: claude
    subcommands: []
    options:
      "--allowed-tools": "Read,Grep,Glob,Edit,MultiEdit,Write,NotebookEdit,Bash,TodoWrite,WebFetch,WebSearch"
      "--disallowed-tools": "Task"
      "--model": "<model>"
      "--output-format": "json"
      "--permission-mode": "acceptEdits"
      "-p": null
    tail: []
    prompt: stdin
    min_records: 1

  # `--permission-mode acceptEdits` is on the GENERATE row too since 2026-08-20,
  # and it is policy, so the value stays verbatim. `supports_file_output = True`
  # makes the fan-out prompt end in "write your JSON output to this file: <path>",
  # and headless `claude -p` denied the model's own Write without a grant —
  # measured on the credentialed live lane as exit 0, `is_error: false`,
  # `permission_denials: [{"tool_name": "Write"}]` and an answer that then died in
  # `parse_output`. The two agent-readonly rows ABOVE deliberately carry NO
  # permission flag: their dispatches never write (the executor captures stdout
  # and writes `output_path` itself), so the read-only profile asks for none.
  - provider: claude-code
    profile: generate
    transport: argv
    binary: claude
    subcommands: []
    options:
      "--model": "<model>"
      "--output-format": "json"
      "--permission-mode": "acceptEdits"
      "-p": null
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  # The §5.4.1 per-flag capability gate: `base.read_help_tokens` (M14 absorbed
  # the adapter-local copies into it) spawns `claude --help` once per process,
  # memoised on the resolved binary, and only when a schema is attached.
  - provider: claude-code
    profile: probe
    transport: stdin
    binary: claude
    subcommands: []
    options:
      "--help": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: claude-code
    profile: probe
    transport: stdin
    binary: claude
    subcommands: []
    options:
      "--version": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: cline
    profile: generate
    transport: argv
    binary: cline
    subcommands: []
    options:
      "--json": null
      "-P": "<provider>"
      "-m": "<model>"
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  - provider: codex
    profile: agent-readonly
    transport: stdin
    binary: codex
    subcommands: ["exec"]
    options:
      "--ephemeral": null
      "--json": null
      "--model": "<model>"
      "--sandbox": "read-only"
      "--skip-git-repo-check": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: codex
    profile: agent-write|generate
    transport: argv
    binary: codex
    subcommands: ["exec"]
    options:
      "--ephemeral": null
      "--json": null
      "--model": "<model>"
      "--sandbox": "workspace-write"
      "--skip-git-repo-check": null
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  - provider: codex
    profile: agent-write|generate
    transport: stdin
    binary: codex
    subcommands: ["exec"]
    options:
      "--ephemeral": null
      "--json": null
      "--model": "<model>"
      "--sandbox": "workspace-write"
      "--skip-git-repo-check": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: codex
    profile: probe
    transport: stdin
    binary: codex
    subcommands: []
    options:
      "--version": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: codex
    profile: probe
    transport: stdin
    binary: codex
    subcommands: ["login", "status"]
    options: {}
    tail: []
    prompt: stdin
    min_records: 1

  - provider: gemini
    profile: generate
    transport: argv
    binary: gemini
    subcommands: []
    options:
      "--model": "<model>"
      "--output-format": "json"
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  - provider: goose
    profile: generate
    transport: argv
    binary: goose
    subcommands: ["run"]
    options:
      "--max-turns": "25"
      "--model": "<model>"
      "--no-profile": null
      "--no-session": null
      "--output-format": "json"
      "--provider": "<provider>"
      "--with-builtin": "developer"
      "-q": null
      "-t": "<prompt>"
    tail: []
    prompt: argv
    min_records: 1

  - provider: grok
    profile: generate
    transport: argv
    binary: grok
    subcommands: []
    options:
      "--always-approve": null
      "--no-auto-update": null
      "--output-format": "json"
      "-m": "<model>"
      "-p": "<prompt>"
    tail: []
    prompt: argv
    min_records: 1

  - provider: kilocode
    profile: generate
    transport: argv
    binary: kilocode
    subcommands: ["run"]
    options:
      "--auto": null
      "-m": "<model>"
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  # §6.5 TIER 1, and the absence is the assertion. copilot's help text claims
  # `--allow-all-tools` is "required for non-interactive mode"; the probe walked
  # all four rungs with a seeded filesystem canary, got byte-identical output and
  # a clean canary every time, and rule 1's ascending stop applies at rung 1. So
  # no permission flag and no `--add-dir` appear here, and adding one later is a
  # visible edit to this table rather than a quiet argv change.
  #
  # `--output-format`, `--stream`, `--log-level` are policy constants and stay
  # VERBATIM; `--model` is row-derived and normalizes to `<model>` through the
  # table normalize_argv.py already carries, so this row needs no table change.
  - provider: copilot
    profile: generate
    transport: argv
    binary: copilot
    subcommands: []
    options:
      "--output-format": "json"
      "--stream": "off"
      "--log-level": "none"
      # Bare boolean flags carry a null value, codex's `--ephemeral`/`--json`
      # shape. Omitting them does not make the entry laxer -- `_matches`
      # compares the options dict for EQUALITY, so a missing flag matches
      # nothing at all.
      "--no-custom-instructions": null
      "--no-ask-user": null
      "--no-auto-update": null
      "--disable-builtin-mcps": null
      "--model": "<model>"
      "-p": "<prompt>"
    tail: []
    prompt: argv
    min_records: 1

  # kimi carries NO model token: the slug travels in KIMI_MODEL_NAME, and
  # `kimi -m <slug>` is a hard failure ("Model ... is not configured in
  # config.toml"). This entry is what keeps that measured fact from being
  # "fixed" back into argv by a later edit.
  - provider: kimi
    profile: generate
    transport: argv
    binary: kimi
    subcommands: []
    options:
      "--output-format": "stream-json"
      "-p": "<prompt>"
    tail: []
    prompt: argv
    min_records: 1

  # `--max-wall-time` is the ONE row-derived value this repo's argv tables carry
  # (§7 step 6): its seconds come from the slot's `timeout_s=`, so it is pinned
  # as the `<timeout>` placeholder rather than verbatim -- otherwise one run's
  # slot length would freeze into this row and redden every other one. The
  # placeholder pins the SHAPE; the VALUE is pinned by test_providers.py's
  # derivation table plus test_container_argv.py's raw-call-log read.
  #
  # `--max-tool-calls 0` and `--max-session-turns 25` are module constants, so
  # they stay VERBATIM -- reducing a policy value to a placeholder would make
  # the assertion vacuous.
  #
  # The prompt is a bare trailing positional, not a `-p <prompt>` pair: `-p` is
  # deprecated at 0.21.13.
  - provider: qwen-code
    profile: generate
    transport: argv
    binary: qwen
    subcommands: []
    options:
      "--bare": null
      "--chat-recording": "false"
      "-o": "json"
      "--max-tool-calls": "0"
      "--max-session-turns": "25"
      "--max-wall-time": "<timeout>"
      "-m": "<model>"
    tail:
      - "<prompt>"
    prompt: argv
    min_records: 1

  # vibe. Note what is ABSENT: any model token at all -- vibe has no `--model`
  # flag, so the alias rides VIBE_ACTIVE_MODEL and nothing model-shaped ever
  # reaches the call log. That is also why vibe needed no normalize_argv.py
  # change: with no model token there is nothing to placeholder.
  #
  # `--max-price` and `--max-turns` are POLICY constants and are kept VERBATIM,
  # the rule `--json-schema` already follows -- reducing either to a placeholder
  # would make the assertion vacuous. `--agent plan` is §6.5's rung, and it is
  # pinned here precisely so widening it later is a visible edit to this table
  # rather than a quiet argv change: the BARE invocation vibe would otherwise
  # run is `accept-edits`, whose AgentSafety is DESTRUCTIVE.
  - provider: vibe
    profile: generate
    transport: argv
    binary: vibe
    subcommands: []
    options:
      "--output": "json"
      "--max-price": "0.25"
      "--max-turns": "4"
      "--agent": "plan"
      "-p": "<prompt>"
    tail: []
    prompt: argv
    min_records: 1
  - provider: muse
    profile: generate
    transport: argv
    binary: muse
    subcommands: ["exec"]
    options:
      "--base-url": "<base-url>"
      "--disable-approval": null
      "--disable-sandbox": null
      "--json": null
      "--model": "<model>"
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  # omp's FLAG GATE, which is a real dispatch rather than a version probe:
  # `OmpProvider.build_command` asks `missing_flags` for the exact set that call
  # will emit BEFORE it assembles anything, so every process that builds an omp
  # argv spawns `omp --help` once (memoised on the binary and the help argv) and
  # a renamed flag upstream is a named refusal instead of a rejected argv.
  - provider: omp
    profile: probe
    transport: stdin
    binary: omp
    subcommands: []
    options:
      "--help": null
    tail: []
    prompt: stdin
    min_records: 1

  # THE `generate` DISPATCH — the first row on this table whose fan-out default
  # is STDIN. `prompt: stdin` with an EMPTY tail is the assertion:
  # `build_command_for_transport(..., "stdin")` returns `build_command(...)[:-2]`,
  # dropping `--` AND the positional (omp's own override of the base helper's
  # `[:-1]`, which would leave a bare `--`), and the prompt is written to the
  # child's pipe and the pipe closed — the EOF omp blocks forever without. A
  # record carrying the prompt on argv would be matched against the `argv` rows
  # instead and fail as a crossed transport, which is what makes the pair
  # discriminating.
  #
  # The policy values stay VERBATIM because they are the assertion: `yolo` is
  # bounded by the explicit `--tools` allow-list and by nothing else (§2.3), and
  # `--mode json` is what makes the stream parseable at all. `<overlay>` and
  # `<cwd>` are environment-derived placeholders — the overlay's absolute path
  # moves with the skill dir, and `--cwd` is the spawn cwd, rendered on EVERY
  # dispatch because omp launched from `$HOME` without it relocates itself to
  # /tmp in silence.
  #
  # `--max-time` is `<timeout>` and NOT a literal, which took a one-line fix to
  # `tests/golden/normalize_argv.py`. It is row-derived argv under §7 step 6's
  # rule ("a flag whose VALUE is derived from the slot's `timeout_s=`"), exactly
  # like qwen-code's `--max-wall-time` — the value is `timeout_s -
  # OMP_SHUTDOWN_MARGIN_S`, so the slot's own length is inside it. Left out of
  # that map the seconds normalized verbatim while `seed_expected_argv.py`'s
  # reference is built with no slot timeout at all, the two shapes could never
  # match, and the seeder filed this dispatch as `profile: probe` with a literal
  # `"--max-time": "1195"` — one slot length frozen into the pinned table, which
  # would have reddened the day `providers.yaml`'s `default_timeout` moved. The
  # placeholder pins the SHAPE (flag present, one value, right position); the
  # value's own arithmetic is pinned in `test_providers.py`'s derivation table.
  - provider: omp
    profile: generate
    transport: stdin
    binary: omp
    subcommands: []
    options:
      "--approval-mode": "yolo"
      "--config": "<overlay>"
      "--cwd": "<cwd>"
      "--max-time": "<timeout>"
      "--mode": "json"
      "--model": "<model>"
      "--no-session": null
      "--tools": "read,grep,glob,bash,edit,write"
      "-p": null
    tail: []
    prompt: stdin
    min_records: 1

  # `--pure` is M4's hermetic leg: it is emitted only inside an active dispatch
  # context, together with the run-scoped XDG_CONFIG_HOME redirect, so a run
  # cannot pick up the user's own opencode config. `generate` and
  # `agent-readonly` are hermetic; `agent-write` deliberately is NOT (it keeps
  # inherited config), which is why the agent-write row below carries no
  # `--pure` and must not gain one.
  - provider: opencode
    profile: agent-readonly
    transport: stdin
    binary: opencode
    subcommands: ["run"]
    options:
      "--agent": "plan"
      "--format": "json"
      "--log-level": "ERROR"
      "--model": "<model>"
      "--print-logs": null
      "--pure": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: opencode
    profile: agent-write
    transport: stdin
    binary: opencode
    subcommands: ["run"]
    options:
      "--agent": "build"
      "--format": "json"
      "--log-level": "ERROR"
      "--model": "<model>"
      "--print-logs": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: opencode
    profile: generate
    transport: argv
    binary: opencode
    subcommands: ["run"]
    options:
      "--format": "json"
      "--log-level": "ERROR"
      "--model": "<model>"
      "--print-logs": null
      "--pure": null
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1

  - provider: opencode
    profile: probe
    transport: stdin
    binary: opencode
    subcommands: []
    options:
      "--version": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: opencode
    profile: probe
    transport: stdin
    binary: opencode
    subcommands: ["auth", "list"]
    options: {}
    tail: []
    prompt: stdin
    min_records: 1

  # M4's flag gate: opencode is asked once per process whether it advertises
  # `--pure` before the flag is emitted, so an older opencode degrades to a
  # non-hermetic run instead of dying on an unknown flag. One help spawn per
  # (binary, help argv) per process, hence min_records: 1 rather than one per
  # dispatch.
  - provider: opencode
    profile: probe
    transport: stdin
    binary: opencode
    subcommands: ["run"]
    options:
      "--help": null
    tail: []
    prompt: stdin
    min_records: 1

  - provider: pi
    profile: generate
    transport: argv
    binary: pi
    subcommands: []
    options:
      "--model": "<model>"
      "--no-session": null
      "-p": null
    tail: ["<prompt>"]
    prompt: argv
    min_records: 1
