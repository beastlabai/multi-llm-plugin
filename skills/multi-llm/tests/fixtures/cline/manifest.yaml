# The §6.2 fixture manifest for cline. Graded by tests/test_provider_fixture_rows.py,
# which owns the format (its module docstring is the spec).
#
# Every byte under this directory is raw cline stdout/stderr as the CLI wrote it,
# with ONE labelled exception (`multi-assistant`, which carries `synthesized:
# true` and its provenance). Where a row's ANSWER text came from the stub rather
# than a real model, the bytes on disk are still cline's own JSONL rendering of
# it.
schema_version: 1
provider: cline
cli_version: "3.0.70"
captured: "2026-10-09"
method: >-
  Re-run on cline 3.0.70 on 2026-10-09 by the same rig (the probe's
  `incontainer.py`, one container per row, the same prompt, scenarios and
  failserver modes; the scratch side now a docker volume, since Docker refuses
  to bind-mount a /tmp scratch dir) in the pinned image built from
  tests/container/Dockerfile at the cli-versions.lock pins, as it was on 3.0.69
  on 2026-10-08; the set was first captured on 3.0.55 on 2026-08-19 in
  mllm-e2e:local, and `ClineProvider.build_command`'s argv has not changed
  since. §6 step 5, with `--network none`, the rig
  mounted read-only at /rig, and NO credential — the only key in the child's
  environment is the wrapper's per-exec `mllm-stub-<id>` string, which is
  meaningful on 127.0.0.1 and nowhere else. The probe drove the PATH wrapper
  (`/opt/mllm/bin/cline` IS wrapper.py) rather than hand-building an environment,
  so redirect.yaml's cline row applied itself: the `.cline/data/settings/
  providers.json` seed (the ONLY carrier of the base URL — cline has no base-URL
  env var), `CLINE_NO_AUTO_UPDATE=1` in the child env, and a fresh per-invocation
  $HOME. argv is `ClineProvider.build_command`'s output verbatim
  (`cline --json -P openai -m stub-model <prompt>`), the prompt a 4844-byte
  review-shaped request that demands the JSON on stdout. Servers run INSIDE the
  container: `python3 /rig/stub_server.py --port 8099` with an inline-answer
  scenario for the two answering rows, `python3 /rig/failserver.py --port 8099
  --mode <mode>` for the eight failure rows. ONE CONTAINER PER ROW, because cline
  spawns a background hub daemon and self-updates; never wrapped in `timeout(1)`,
  which is the zero-byte-hang artifact.
notes: >-
  Three facts hold across EVERY row here and are load-bearing rather than
  incidental. (1) cline exits **1** on all nine measured failures — 401, 404,
  400 context-length, 500-forever, 429-forever, a truncated body, a zero-byte
  response, a 200 carrying an error object, and an empty completion — at 3.0.55
  and again at 3.0.69 and 3.0.70. That is a
  CHANGE from the 3.0.39 measurement the adapter's own comment records ("cline
  **exits 0**", 2026-08-16), and it is why `exit-zero-failure` is
  not-applicable below. (2) The diagnosis rides BOTH channels: stdout carries
  the JSONL `run_result` with `finishReason: "error"`, and stderr carries a
  one-line `{"type":"error","message":…}` copy of the same text. (3) At 3.0.69
  and 3.0.70 that one line is ALL stderr carries (91–465 bytes on a failure)
  and the green run's stderr is EMPTY: the three AI SDK deprecation warnings
  3.0.55 wrote ahead of everything (938–1029 bytes) are gone. stderr is still
  never the only carrier, so a parser reading stdout alone loses nothing.
  3.0.70 left every row's bytes where 3.0.69 put them: each file is the same
  length, and the lines differ only in ids, timestamps, `durationMs` and the
  Bun bundle chunk named in a stack trace (`chunk-wzbf2d52.js` ->
  `chunk-4eeszfc5.js`). Its `--help` moved `--retries` from a default of 6 to
  3, which does NOT touch the HTTP retry ladder below: `--retries` counts the
  agent loop's consecutive mistakes, and a 500-forever run with `--retries 1`
  and with `--retries 6` made the same 6 requests over 63.0 s as the
  adapter's argv, which passes none.

rows:
  success:
    stdout: success.stdout.txt
    stderr: success.stderr.txt
    exit_code: 0
    wall_s: 0.73
    requests: 1
    notes: >-
      Nine JSONL lines: `hook_event` agent_start, `agent_event` iteration_start /
      content_start / usage / content_end / iteration_end, `hook_event` agent_end,
      `agent_event` done, then the single `run_result`. Only the last of those is
      read; the test asserts the unwrapped `data` IS the suggestion-list document,
      and that classify_failure is None — the assertion that catches an adapter
      reading its own happy path as a failure.
    expect:
      salvage: answer
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains:
        - '"type":"run_result"'
        - '"finishReason":"completed"'
      classify_failure: null

  truncated:
    stdout: truncated.stdout.txt
    stderr: truncated.stderr.txt
    exit_code: 1
    wall_s: 0.72
    requests: 1
    notes: >-
      failserver `--mode trunc`: 200 headers promising a full Content-Length, a
      60-byte prefix of the body, then the socket closes. At 3.0.69 and 3.0.70
      cline makes **one** request, does not retry, and reports `Response stream
      ended without a finish reason.` (`errorClass: "unknown"`) in under 1 s
      (0.95 s, 0.72 s). 3.0.55 retried
      it three times inside 2.4 s and reported `Model returned empty response`,
      the same words as an empty completion; 3.0.69 tells the two apart (see the
      README), though the wire condition is still not named — no decode error, no
      byte count, no partial frame. Byte-shape identical to `error-envelope`.
    expect:
      salvage: none
      success: false
      error_contains: ["Response stream ended without a finish reason."]
      raw_contains:
        - '"finishReason":"error"'
        - "Response stream ended without a finish reason."
      # Not connection_error and not server_error: nothing in the capture names
      # either condition. `"finishReason":"error"` — the adapter's own declared
      # marker, consulted LAST — is the only thing that says this run failed.
      classify_failure: "runner_error"

  ephemeral-only:
    stdout: ephemeral-only.stdout.txt
    stderr: ephemeral-only.stderr.txt
    exit_code: 1
    wall_s: 1.35
    requests: 3
    notes: >-
      An all-noise run, produced by a stub scenario whose answer is the EMPTY
      string. Everything cline wrote to stdout is a record `parse_output`
      filters — `hook_event`, `agent_event` iteration_start/usage, `agent_event`
      error — and the run must therefore be a failure rather than an
      empty-string success. cline itself refuses to treat an empty completion as
      an answer: it makes three requests (3.0.69: 0.0 s, 0.26 s, 0.54 s; 3.0.70:
      0.0 s, 0.30 s, 0.55 s) and then reports `Model returned empty response`.
      3.0.55 said the same of a truncated body and a 200 error object; 3.0.69 and
      3.0.70 say it of this row alone, and this is the one failure row with no
      `"errorClass":` key.
    expect:
      salvage: none
      success: false
      error_contains: ["Model returned empty response"]
      raw_contains:
        - '"type":"agent_event"'
        - '"finishReason":"error"'
      classify_failure: "runner_error"

  multi-assistant:
    stdout: multi-assistant.stdout.txt
    stderr: multi-assistant.stderr.txt
    exit_code: 0
    wall_s: 0.73
    requests: 1
    synthesized: true
    provenance: >-
      Derived from `success.stdout.txt` (re-derived from the 3.0.70 capture on
      2026-10-09 by the same recipe, as from 3.0.69's on 2026-10-08) by inserting a SECOND `run_result` line
      ahead of the real one, built by json.loads-ing cline's own line, replacing
      only its `text` value with a decoy array, and re-serialising with
      `separators=(',',':')` — verified byte-identical to the original line
      before the substitution, so the shape is cline's and only the answer text
      is ours. Synthesis is necessary because cline emits exactly ONE
      `run_result` per invocation and a second requires a tool loop the
      committed stub deliberately never drives (the copilot
      `multi-assistant.jsonl`
      precedent).
    notes: >-
      LAST-wins, not first-wins and not concatenation. The first `run_result`
      carries `FIRST ANSWER (must NOT be selected)`; a first-wins parser returns
      the D999 document and a concatenating one returns neither.
    expect:
      salvage: answer
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains: ["FIRST ANSWER (must NOT be selected)"]
      classify_failure: null

  error-envelope:
    stdout: error-envelope.stdout.txt
    stderr: error-envelope.stderr.txt
    exit_code: 1
    wall_s: 0.75
    requests: 1
    notes: >-
      failserver `--mode errbody`: HTTP **200** whose body is a provider error
      object carrying the 401 wording. The measured result is worse than "the
      error text is served as the answer" — the text is LOST. At 3.0.69 and
      3.0.70 cline's
      openai-compatible transport reads the JSON body as a stream that never
      finished and reports `Response stream ended without a finish reason.` after
      ONE request (3.0.55 called it `Model returned empty response` and retried
      three times), so not one byte of the provider's message reaches any
      pattern table. The only thing that says this run failed is the adapter's
      own `finishReason` marker.
    expect:
      salvage: none
      success: false
      error_contains: ["Response stream ended without a finish reason."]
      raw_contains:
        - '"finishReason":"error"'
        - "Response stream ended without a finish reason."
      classify_failure: "runner_error"

  exit-zero-failure:
    not_applicable: >-
      Measured, not assumed, and a REGRESSION against the adapter's own recorded
      measurement: at cline 3.0.55 the exit code is **1** on every failure the
      rig can produce — 401, 404, 400 context-length, 500-forever, 429-forever,
      a truncated body, a zero-byte response, a 200 carrying an error object and
      an empty completion (nine modes, nine captures, all `exit_code: 1`; the
      per-row meta is in plans/harness-expansion/probe-out/cline/*.meta.json) —
      and again at 3.0.69 (the 2026-10-08 re-capture, nine for nine) and 3.0.70
      (2026-10-09, nine for nine).
      `ClineProvider`'s comment records exit **0** at 3.0.39 with an invalid
      OPENROUTER_API_KEY, so the exit-0 shape existed and no longer does. The
      declared `exit_zero_failure_markers` are NOT dead: classify_streams
      consults them regardless of exit code, and they are what classifies four
      of the rows here (`truncated`, `ephemeral-only`, `error-envelope`,
      `server-error`) — they simply have no exit-0 producer left to pin.

  stdout-error:
    not_applicable: >-
      Half-satisfied by construction, and the missing half was measured: cline
      does exit non-zero with its whole diagnosis on stdout (that is every
      failure row above), but stderr is NEVER empty on a failure. It carries a
      one-line `{"type":"error","message":…}` copy of the same text on all nine
      failure modes — at 3.0.69 and 3.0.70 nothing else (3.0.55 put three AI SDK
      deprecation warnings ahead of it); the smallest failure stderr measured at
      3.0.69 and 3.0.70 is 91 bytes and the largest 465. The half that IS the trap — a
      nonzero exit whose diagnosis is
      on stdout must not be read as an answer — is pinned by all eight failure
      rows here, each asserting `success: false`.

  empty:
    not_applicable: >-
      Unreachable while cline runs at all: the `hook_event` agent_start and
      `agent_event` iteration_start lines are written before the first HTTP
      request, so the smallest capture in this set is **1257 bytes** on stdout
      (`stall`, 3.0.70; 1319 before it) and none is smaller. Zero bytes on both
      channels would mean the process was killed before it wrote a line, which
      is a harness artifact rather than a CLI behaviour — and manufacturing one
      with `timeout(1)` is the known zero-byte-hang trap §6 step 3 forbids. parse_output's no-run_result branch
      is still covered, by the fallback assertion in test_providers.py.

  auth-error:
    stdout: auth-error.stdout.txt
    stderr: auth-error.stderr.txt
    exit_code: 1
    wall_s: 0.71
    requests: 1
    notes: >-
      failserver `--mode 401`. **One** request — no retry, terminal — and the
      upstream wording survives verbatim into both `run_result.text` and the
      stderr copy. As captured it classified `runner_error` rather than
      `auth_failed`: OpenAI's own 401 sentence ("Incorrect API key provided: …")
      matched none of `base.auth_error_patterns`' ten entries and none of cline's
      added `user not found`, so the run fell all the way through to the exit-0
      marker and a credential failure sat on a RETRYABLE rung.
      **C3 fixed it from this row's own bytes**: `incorrect api key` is now a
      cline `auth_error_patterns` entry, and auth is consulted before the
      marker (§7.2 step 4 vs step 6), so the cell below reads `auth_failed`.
      This is cline's SECOND measured auth wording, not a restatement of the
      first — `user not found` came from 3.0.39 with an invalid
      OPENROUTER_API_KEY, where cline exited **0** and the message named no auth
      word at all. cline glosses neither: both are the upstream provider's
      sentence passed through, which is why the pattern set needs one entry per
      upstream rather than one per CLI. Checked against every capture in this
      directory — the phrase occurs here and nowhere else, so no other cell
      moves. At 3.0.69 and 3.0.70 cline also tags this error `errorClass: "auth"` (3.0.55:
      `"unknown"`); the adapter reads the key's presence, never its value.
    expect:
      salvage: none
      success: false
      error_contains: ["Incorrect API key provided"]
      raw_contains:
        - "Incorrect API key provided: sk-stub***"
        - '"finishReason":"error"'
      classify_failure: "auth_failed"

  rate-limit:
    stdout: rate-limit.stdout.txt
    stderr: rate-limit.stderr.txt
    exit_code: 1
    wall_s: 63.00
    requests: 6
    notes: >-
      failserver `--mode 429`, fail-forever. cline **does** retry a 429
      internally — six requests over 63.1 s at 3.0.69 and 63.0 s at 3.0.70 (0,
      2, 6, 14, 30, 62 s: backoff doubling from 2 s), where 3.0.55 made three
      over 7.8 s — so an executor-level re-dispatch of a rate-limited cline slot
      doubles a wait the CLI already served (§7.6(b)'s rule 6b). Measured on
      3.0.70 with failserver `--mode 429ra` (no files kept: the bytes are this
      row's again): a `Retry-After` under 60 s is HONOURED as the gap and the
      count stays six — `Retry-After: 1` 6 requests over 6.0 s, `30` 150.9 s,
      `31` 155.9 s, `45` 225.9 s, `59` **295.9 s**, the longest 429 chain
      measured — while 60 s or more is ignored for the 2 s ladder (`60`, `61`
      and `120` each 6 requests over ~62.8 s). The upstream text survives, so
      `rate limit` in base.rate_limit_patterns matches before the exit-0 marker
      gets its turn.
    expect:
      salvage: none
      success: false
      error_contains: ["Rate limit reached"]
      raw_contains:
        - "Rate limit reached for stub-model"
        - '"finishReason":"error"'
      classify_failure: "rate_limited"

  invalid-model:
    stdout: invalid-model.stdout.txt
    stderr: invalid-model.stderr.txt
    exit_code: 1
    wall_s: 0.75
    requests: 1
    notes: >-
      failserver `--mode 404`. One request, terminal. The failure NAMES the
      model, and names it as the bare `stub-model` that `-m` carried rather than
      the `openai/stub-model` spec the config used — which is the asymmetry that
      makes a stray `:effort` suffix findable at all.
    expect:
      salvage: none
      success: false
      raw_contains:
        - "The model `stub-model` does not exist or you do not have access to it."
        - '"errorClass":'
      classify_failure: "invalid_model"

  context-overflow:
    stdout: context-overflow.stdout.txt
    stderr: context-overflow.stderr.txt
    exit_code: 1
    wall_s: 0.73
    requests: 1
    notes: >-
      failserver `--mode ctx` (400, `context_length_exceeded`, the verbatim
      OpenAI wording). The best-behaved row in the set: cline runs its own
      overflow-recovery path (three `notice` events — recovery started,
      compaction started, compaction skipped), then raises a
      `ContextWindowOverflowError` whose message QUOTES the provider's sentence
      in full (`provider reported: …`). Because that quote survives,
      CONTEXT_OVERFLOW_MARKERS matches and the terminal classification is
      reached with no retry budget spent — one request, under 1 s (3.0.69:
      0.96 s, 3.0.70: 0.73 s).
    expect:
      salvage: none
      success: false
      error_contains: ["exceeds the model's context window"]
      raw_contains:
        - "maximum context length"
        - "context_overflow_recovery"
        - "ContextWindowOverflowError"
      classify_failure: "context_length_exceeded"

  # ----- beyond §6.2's twelve, graded the same way -------------------------- #

  zero-body:
    stdout: zero-body.stdout.txt
    stderr: zero-body.stderr.txt
    exit_code: 1
    wall_s: 63.00
    requests: 6
    notes: >-
      failserver `--mode empty`: the request is accepted and the socket closed
      after **zero** body bytes. Unlike aider, cline distinguishes this from a
      truncated body — it reports `Cannot connect to API: The socket connection
      was closed unexpectedly … (ECONNRESET)` — so the two are separate files
      here. **Re-pinned `runner_error` → `connection_error` on 2026-09-18**, and
      these bytes did not change: cline 3.0.55 wrote them in August and writes
      them still. What changed is `base.CONNECTION_ERROR_MARKERS`, whose row was
      `connection (?:refused|reset|closed|…)` as one token while cline writes
      "connection **was** closed", so the sentence fell past the connection
      table and was caught one rung lower by the adapter's own
      `exit_zero_failure_markers` — the last-resort "this run failed at all"
      verdict, not a reading of the cause. The row is now
      `connection (?:was )?(?:refused|reset|closed|…)`, which is a better
      reading of the same bytes: a socket dropped after zero body bytes is
      precisely what `connection_error` means. Re-captured on 3.0.69
      (2026-10-08) and 3.0.70 (2026-10-09): the same sentence, after six
      requests over 63 s (3.0.70: 0, 2, 6, 14, 30, 62 s, the 500 row's ladder)
      where 3.0.55 made three over 7.9 s. (`ECONNRESET` itself is still not
      in the table — `ECONNREFUSED` is — but it no longer has to be, because the
      sentence in front of it now matches.) omp's `empty` row carries the
      identical Bun/undici sentence and was re-pinned `null` →
      `connection_error` in the same change. Retry behaviour for this row is
      unchanged: cline declares no `describe_failure`, so Lane A's haystack is
      the bare `cline exited with code 1` either way and the slot is not
      retried; Lane B's re-classification hook upgrades only to auth, rate
      limit, invalid model and sandbox, so it never saw the difference. The
      `Reason:` line does move, "the runner reported a failure" →
      "Connection/network error", which is the point.
    expect:
      salvage: none
      success: false
      error_contains: ["Cannot connect to API"]
      raw_contains:
        - "ECONNRESET"
        - "The socket connection was closed unexpectedly"
      classify_failure: "connection_error"

  server-error:
    stdout: server-error.stdout.txt
    stderr: server-error.stderr.txt
    exit_code: 1
    wall_s: 62.96
    requests: 6
    notes: >-
      failserver `--mode 500`, fail-forever — §6.1.1's experiment 2: at 3.0.69
      and again at 3.0.70 **6 requests over 63.0 s** (0, 2, 6, 14, 30, 62 s — a
      2 s backoff doubling four times), then exit 1; 3.0.55 made 3 requests over
      8.0 s (0.0 s, ~1 s, ~6 s). 3.0.70's `--retries` (default 3, was 6) does
      not reach this ladder: the same mode under `--retries 1` and under
      `--retries 6` made 6 requests over 63.0 s each. Nor is this the whole
      internal-retry envelope any more: a 429 whose `Retry-After` is under 60 s
      stretches the same six requests to 295.9 s (`rate-limit`), and a stalled
      request is one request over 361 s (`stall`). `ClineProvider` still
      declares no `internal_retries` envelope, so the ladder assumes one
      request per dispatch (§7.5 rule 6(c)) and makes no admission test. The
      row is here rather than under
      `exit-zero-failure` because cline's exit code is 1; it classifies
      `runner_error` because OpenAI's 500 sentence ("The server had an error
      while processing your request") matches no member of
      base.SERVER_ERROR_MARKERS — every entry there wants the literal words
      "server error", "internal server error" or "api error".
    expect:
      salvage: none
      success: false
      error_contains: ["The server had an error while processing your request"]
      raw_contains:
        - "The server had an error while processing your request. Sorry about that!"
        - '"finishReason":"error"'
      classify_failure: "runner_error"

  stall:
    stdout: stall.stdout.txt
    stderr: stall.stderr.txt
    exit_code: 1
    wall_s: 361.29
    requests: 1
    notes: >-
      failserver `--mode stall` (accept the request, never answer; `--stall-s`
      3600), first captured on 3.0.70 (2026-10-09). cline makes **one**
      request, does not retry it, and gives up after 360 s of its own
      (`durationMs` 360418; the adapter passes no `-t/--timeout`, whose
      default is 0, "no timeout") with `The operation timed out.`
      (`errorClass: "unknown"`), exit 1, the tenth failure mode to exit 1. It
      is the longest single dispatch measured here, past the six-request 500
      and 429 ladders, and inside the adapter's 600 s `default_timeout`; a 429
      chain that ends in a stall (five 59 s `Retry-After` waits, then 360 s)
      would not be, but that composite is inferred, not measured. Nothing but
      the error follows `iteration_start`, so this is the smallest capture in
      the set (1257 bytes on stdout, 86 on stderr). `timed out` is a base
      timeout pattern, so the row reads `timeout` rather than falling to the
      adapter's `finishReason` marker.
    expect:
      salvage: none
      success: false
      error_contains: ["The operation timed out."]
      raw_contains:
        - "The operation timed out."
        - '"finishReason":"error"'
      classify_failure: "timeout"
