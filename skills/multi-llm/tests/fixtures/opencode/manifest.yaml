schema_version: 1
provider: opencode
cli_version: "1.19.5"
captured: "2026-11-10"
method: >-
  §6 step 5, captured 2026-11-10 by tests/fixtures/row_capture/ (its README is
  the recipe; `batch.sh opencode` reruns this set, $0) in the pinned image
  built from tests/container/Dockerfile at the cli-versions.lock pins
  (`mllm-e2e:local`, image sha256:e3c989b495cf…, `opencode --version` =
  1.19.5, the pin and the adapter's floor), one container per row, `--network
  none`, uid 10001, read-only root, and NO credential: the only key anywhere is
  the PATH wrapper's per-exec `mllm-stub-<id>` in the seeded provider block,
  meaningful only on 127.0.0.1. The server ran inside the container on
  127.0.0.1:8099: `/rig/stub_server.py` with the kit's `success` or
  `empty-answer` scenario, the kit's `scriptserver.py` for `multi-assistant`,
  and `/rig/failserver.py --mode <m>` for every failure row. The CLI was driven
  through the PATH wrapper (`/opt/mllm/bin/opencode` IS wrapper.py), so
  redirect.yaml's opencode row applied itself: a per-invocation HOME seeded
  from the image's `home_seed/opencode/` (an `opencode.json` custom `stub`
  provider at the stub's `/s/<id>/v1` session prefix, the pre-baked
  node_modules and models.json) and `OPENCODE_DISABLE_MODELS_FETCH=1`. argv is
  `OpenCodeProvider.build_command`'s output for a 230 s dispatch timeout,
  verbatim (`argv.json`, held there by tests/test_row_capture_kit.py):
  `opencode run --format json --print-logs --log-level ERROR --model
  stub/stub-model <4,844-byte review prompt>`. That is the bare argv: outside a
  hermetic dispatch slot the adapter adds no `--pure` and no
  `OPENCODE_CONFIG_CONTENT` (capture/ beside this file grades those). stdin
  /dev/null, cwd a git repository holding plans/auth-feature.md, never wrapped
  in timeout(1). The bytes are raw; `requests` counts the POSTs the server
  logged, the session-title call included.
notes: >-
  The rows live in `rows/`: the files beside this file are held to the pin's
  two probe captures (`test_every_committed_capture_is_graded`), and capture/
  is the permission rig. Every request-bearing run makes a tool-free
  session-title call besides the real turn. The shape of every failure: exit
  1, one `error` event on stdout (`{"name": "APIError" | "ContextOverflowError",
  "data": {"message": <vendor text>, "statusCode": …}}`), and the
  `--print-logs` ERROR lines on stderr. Two failserver modes never end:
  see `truncated` and `error-envelope`.
rows:
  success:
    stdout: rows/success.stdout.txt
    stderr: rows/success.stderr.txt
    exit_code: 0
    wall_s: 2.17
    requests: 2
    notes: >-
      `step_start`, one `text` event carrying the answer, `step_finish` with
      `reason: stop`. stderr is 0 bytes. Two requests: the title call, then
      the turn.
    expect:
      lane_status: {lane_a: ok, lane_b: ok}
      salvage: answer
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains: ['"type":"text"', '"reason":"stop"']
      classify_failure: null

  truncated:
    not_applicable: >-
      opencode never ends a cut stream. failserver `--mode trunc` (200
      headers, a prefix of the body, close) put `opencode run` into a loop with
      no backoff: 3,887 requests and 2.77 MB of stdout in the 240 s before the
      kit's deadline killed it (exit 143), the stdout nothing but 3,886
      `step_start` / `step_finish` pairs with zero tokens and `reason:
      "unknown"`, stderr empty. A killed run is a harness artifact, so it is
      not graded; in a real dispatch the slot's timeout is the only bound.

  ephemeral-only:
    stdout: rows/ephemeral-only.stdout.txt
    stderr: rows/ephemeral-only.stderr.txt
    exit_code: 0
    wall_s: 1.87
    requests: 2
    notes: >-
      The stub answered the empty string (the kit's `empty-answer` scenario).
      opencode exits **0** with `step_start` and `step_finish` (`reason: stop`)
      and no `text` event: an all-noise run, which the parser reports as a
      failure (`No text events found in output`). It is also the only exit-0
      failure this rig produced, so `exit-zero-failure` grades these bytes.
    expect:
      lane_status: {lane_a: runner_error, lane_b: unparseable_result}
      salvage: none
      success: false
      error_contains: ["No text events found in output"]
      raw_contains: ['"type":"step_finish"']
      classify_failure: null

  multi-assistant:
    stdout: rows/multi-assistant.stdout.txt
    stderr: rows/multi-assistant.stderr.txt
    exit_code: 0
    wall_s: 2.17
    requests: 3
    notes: >-
      Captured, not synthesized: the kit's `scriptserver.py` answered the
      first turn with a decoy text and a `read` call of plans/auth-feature.md,
      and the request carrying its result with the findings. Two steps: the
      first a `text` event reading `FIRST ANSWER (must NOT be selected)` above
      a D999 array, a `tool_use` event and `step_finish` with `reason:
      tool-calls`; the second the findings' `text` event and `reason: stop`.
      Three requests (title, tool turn, final turn). The parser takes the LAST
      text.
    expect:
      lane_status: {lane_a: ok, lane_b: ok}
      salvage: answer
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains: ["FIRST ANSWER (must NOT be selected)", '"type":"tool_use"', '"reason":"tool-calls"']
      classify_failure: null

  error-envelope:
    not_applicable: >-
      The same endless loop as `truncated`: failserver `--mode errbody` (HTTP
      200 whose body is an error object) gave 3,456 requests and ~2.4 MB of
      zero-token `step_start` / `step_finish` pairs in 240 s, killed at the
      kit's deadline (exit 143), stderr empty. Not graded, for the same reason.

  exit-zero-failure:
    stdout: rows/ephemeral-only.stdout.txt
    stderr: rows/ephemeral-only.stderr.txt
    exit_code: 0
    wall_s: 1.87
    requests: 2
    notes: >-
      The same capture as `ephemeral-only`: of the failures this rig produced,
      only the empty answer exits 0 (`500`, `401`, `429`, `404`, `ctx` and
      `empty` exit 1; the cut stream and the 200 error body never exit). The
      permission rig's `denied_turn` (capture/) is opencode's other exit-0
      failure. opencode is `EXIT0_CLASSIFIABLE`, so the fan-out reads this exit
      0 as `runner_error` rather than stopping.
    expect:
      lane_status: {lane_a: runner_error, lane_b: unparseable_result}
      salvage: none
      success: false
      error_contains: ["No text events found in output"]
      classify_failure: null

  stdout-error:
    not_applicable: >-
      Half the shape holds on every failure: exit 1 with the diagnosis on
      stdout as an `error` event. But stderr is never empty there, because the
      shipped argv's `--print-logs --log-level ERROR` writes `level=ERROR`
      lines for every failed attempt (1,059 to 4,300 bytes across the six
      failure captures here).

  empty:
    not_applicable: >-
      Zero bytes on both channels never happened: every run that ended wrote
      at least one event to stdout, the smallest `zero-body`'s 393 bytes; the
      two that never ended wrote megabytes.

  auth-error:
    stdout: rows/auth-error.stdout.txt
    stderr: rows/auth-error.stderr.txt
    exit_code: 1
    wall_s: 1.87
    requests: 2
    notes: >-
      failserver `--mode 401`. No retry; the `error` event quotes the vendor
      sentence and `statusCode: 401`, and it classifies `auth_failed`.
    expect:
      lane_status: {lane_a: auth_failed, lane_b: auth_failed}
      salvage: none
      success: false
      error_contains: ["APIError: Incorrect API key provided"]
      raw_contains: ['"statusCode":401']
      classify_failure: "auth_failed"

  rate-limit:
    stdout: rows/rate-limit.stdout.txt
    stderr: rows/rate-limit.stderr.txt
    exit_code: 1
    wall_s: 71.58
    requests: 9
    notes: >-
      failserver `--mode 429`, fail-forever. opencode gives up on a 429 by
      itself here: 9 requests over 71.6 s (the title call's three attempts
      among them), then the `error` event with the vendor sentence.
    expect:
      lane_status: {lane_a: rate_limited, lane_b: rate_limited}
      salvage: none
      success: false
      error_contains: ["APIError: Rate limit reached for stub-model"]
      raw_contains: ['"statusCode":429']
      classify_failure: "rate_limited"

  invalid-model:
    stdout: rows/invalid-model.stdout.txt
    stderr: rows/invalid-model.stderr.txt
    exit_code: 1
    wall_s: 1.87
    requests: 2
    notes: >-
      failserver `--mode 404`, naming the model. No retry.
    expect:
      lane_status: {lane_a: invalid_model, lane_b: invalid_model}
      salvage: none
      success: false
      error_contains: ["does not exist or you do not have access to it"]
      raw_contains: ["The model `stub-model` does not exist or you do not have access to it."]
      classify_failure: "invalid_model"

  context-overflow:
    stdout: rows/context-overflow.stdout.txt
    stderr: rows/context-overflow.stderr.txt
    exit_code: 1
    wall_s: 2.02
    requests: 3
    notes: >-
      failserver `--mode ctx`. Two `error` events named `ContextOverflowError`,
      each quoting the vendor sentence; three requests.
    expect:
      lane_status: {lane_a: context_length_exceeded, lane_b: context_length_exceeded}
      salvage: none
      success: false
      error_contains: ["ContextOverflowError"]
      raw_contains: ['"name":"ContextOverflowError"']
      classify_failure: "context_length_exceeded"

  server-error:
    stdout: rows/server-error.stdout.txt
    stderr: rows/server-error.stderr.txt
    exit_code: 1
    wall_s: 74.17
    requests: 9
    notes: >-
      Not a canonical row. failserver `--mode 500`, fail-forever: 9 requests
      over 74 s, then the `error` event with `statusCode: 500` and
      `isRetryable: true`. Nothing reads the status field; the event's message,
      OpenAI's `The server had an error while processing your request.`, is
      what the shared server table reads, so the row classifies `server_error`
      on the same transport-retry statuses as before in both lanes.
    expect:
      lane_status: {lane_a: runner_error, lane_b: unparseable_result}
      salvage: none
      success: false
      error_contains: ["APIError: The server had an error"]
      raw_contains: ['"statusCode":500']
      classify_failure: "server_error"

  zero-body:
    stdout: rows/zero-body.stdout.txt
    stderr: rows/zero-body.stderr.txt
    exit_code: 1
    wall_s: 67.62
    requests: 9
    notes: >-
      Not a canonical row. failserver `--mode empty` (the socket closed with
      zero bytes): 9 requests over 68 s, then `Cannot connect to API:
      ECONNRESET`, which classifies `connection_error`.
    expect:
      lane_status: {lane_a: runner_error, lane_b: unparseable_result}
      salvage: none
      success: false
      error_contains: ["Cannot connect to API: ECONNRESET"]
      raw_contains: ["ECONNRESET: The socket connection was closed unexpectedly"]
      classify_failure: "connection_error"
