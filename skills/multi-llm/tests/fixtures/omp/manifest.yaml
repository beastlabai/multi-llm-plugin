# The §6.2 fixture manifest for omp. Graded by tests/test_provider_fixture_rows.py,
# which owns the format (its module docstring is the spec).
#
# Captured 2026-09-17 by P10/P12 of plans/add-omp-provider.md §5, on the HOST rather
# than in the §5 probe image (that image is Stage E's and does not exist yet). Every
# byte is omp's own stdout/stderr; nothing here is hand-composed. What the host costs
# is the §3 scrub gate: every row but `invalid-tool` carries `synthesized: true` and a
# `provenance:` beginning `SCRUB ONLY:` naming the path replacements applied. No event
# was added, dropped or reordered in any row, every line is still valid JSON, and the
# replacement table is path-only — there is no credential and no OpenRouter generation
# id anywhere in this set because nothing here ever touched the live service.
schema_version: 1
provider: omp
cli_version: "18.2.2"
captured: "2026-09-17"
method: >-
  All rows under the §2.2 argv — `--mode json`, the shipped
  `assets/omp/overlay.yml` (`retry.enabled: false`, `mcp.enableProjectConfig: false`),
  `--approval-mode yolo`, `--tools read,grep,glob,find,bash,edit,write` (at 18.2.2
  `find` was an ALIAS of `glob`; it became a separate default-off tool at 18.2.9 and
  left the allow-list, so today's argv renders six names) — on the host,
  with **loopback servers only** and no API key for any real vendor anywhere in the
  environment (`OPENAI_API_KEY`/`GEMINI_API_KEY` are unset per run; the only key in
  play is the literal `stub-probe-key` in the probe HOME's `models.yml`, meaningful on
  127.0.0.1 and nowhere else). stdin is `/dev/null` on every run: an inherited non-EOF
  pipe makes omp block forever at `readPipedInput` (§1.6), which is the zero-byte-hang
  artifact this set must not contain. The model is `stub/stub-model` on every row but the
  three P13 ones, declared by a probe `~/.omp/agent/models.yml` whose `api` is
  `openai-completions` and whose `baseUrl` is the loopback port — so those captures
  drive the completions client, **not** the Responses path production's `openrouter`
  provider uses. The three `rate-limit-*` rows added 2026-09-18 close that gap and ARE
  the production protocol: the same kind of probe `models.yml`, but overriding the
  **built-in** `openrouter` provider's `baseUrl` (§1.10) with `PI_OPENROUTER_RESPONSES`
  unset and `--model openrouter/openai/gpt-5.6-luna`, so the wire is
  `GET /api/v1/models` then `POST /api/v1/responses`. That was checked in the server's
  own request log on every run, and it is legible in the committed bytes: those rows
  carry `"api":"openrouter"` on every assistant message where the completions rows
  carry `"api":"openai-completions"`.
  THREE VEHICLES, named per row.
  (a) `p12` — the ADAPTER's own argv, built by
  `OmpProvider.build_command_for_transport(prompt, "stub/stub-model", "stdin",
  timeout_s=…, cwd=<skill dir>)` with `build_child_env`, the prompt delivered on
  **stdin**, `--cwd <skill dir>` and `--max-time` rendered by `max_time_value`. The
  prompt is `prompts/plan_review.txt` rendered over `tests/fixtures/sample_plan.md`
  with a real `{output_location}` block — a committed fixture, never a user document.
  The server is a THROWAWAY tool-calling stub under `scratch/` (never
  `stub_server.py`, whose docstring forbids driving a tool loop) that scripts a tool
  call and then answers with the findings array.
  (b) `rig` — the same flags assembled by hand with the prompt on argv after `--`,
  `cwd` a scratch work dir, against `tests/container/failserver.py` run standalone on
  the host (`--mode 500|429|401|404|ctx|empty|stall|trunc|errbody`). Its `--log` is
  the `requests` evidence in every failserver row: the count is the measurement, never
  a guess. One server per row, its own log, never wrapped in `timeout(1)`.
  `wall_s` is the spawn-to-exit wall clock of that one run.
  (c) `p13` — `rig`'s flags exactly, but HOME is a second probe tree whose `models.yml`
  overrides the built-in `openrouter` provider's `baseUrl` instead of declaring a
  `stub` provider, the model is `openrouter/openai/gpt-5.6-luna`, and **no
  `--max-time` is rendered** — the chain is the measurement, not the deadline (a real
  slot renders `--max-time 1195` at the shipped 1200 s default and would cut every one
  of these rows early). `OPENROUTER_API_KEY` is the literal `omp-probe-key`, meaningful
  on 127.0.0.1 and nowhere else. The server for `rate-limit-responses` is
  `tests/container/failserver.py --mode 429` verbatim; for the other two it is a
  THROWAWAY probe under `scratch/` that IMPORTS `failserver` — so the 429 status, body
  and absent `Retry-After` are the same bytes — and adds only the two things failserver
  has no mode for: a per-request server-side delay (`rate-limit-delayed`) and a first
  request answered with a Responses-API `function_call` (`rate-limit-multi-turn`). That
  probe logs ARRIVAL, before its delay, so its gaps are request gaps; `requests` is the
  completion-request count in the log either way.
notes: >-
  SEVEN THINGS THIS SET MEASURED THAT §1 PREDICTED DIFFERENTLY, each recorded in its row:
  (1) **`rate-limit` is 16 requests over 201 s, not 12 over 32 s.** omp parses the
  vendor's own "Please try again in 20s." out of the 429 BODY (failserver sends no
  `Retry-After` header) and sleeps 20 s five times before falling back to the
  `500·2ⁿ` ladder. §1.9's "12 requests / ~32 s is the floor" holds only for the 500
  row, which measured exactly that. §2.8/criterion 6's ≤ 40 s budget does not survive
  a 429 whose message names a delay — note that the adapter's own `--max-time`
  (115 s at `timeout_s=120`) was NOT in force on this row and would have cut it.
  (2) **A pre-flight failure is not always 0 B on stdout.** §1.1 says pre-flight
  failures write plain text to stderr with an empty stdout; that is true of
  `invalid-model` and `invalid-tool` (validated before the session opens) but NOT of
  `auth-error-preflight`, which flushes the `session` event first and then dies — 178
  bytes of stdout under a Bun trace on stderr. This is precisely why the adapter's
  `describe_failure` channel is `STDOUT_ELSE_STDERR` and not `STDOUT_THEN_STDERR`.
  (3) **The empty-stop retry cap is visible, is four cycles, and emits an event type
  §1.2 does not list.** `truncated` (default 60-byte cut) and `error-envelope` both
  end in FOUR assistant `message_end`s with `stopReason: "stop"` and `content: []`,
  then `{"type":"auto_retry_end","success":false,"attempt":3,"finalError":"Assistant
  returned empty stop after retry cap; …"}`, and **exit 0**. §1.9 predicted three
  cycles and 0 B of stdout; in json mode the stream is fully written. The two rows are
  the same shape, as §3 anticipated — and both reach the parser as `Empty output`.
  (4) **failserver `--mode empty` is a connection error at omp, not an empty answer.**
  Exit 1, 21 requests, 31.9 s, a terminal `stopReason: "error"` with NO `errorStatus`
  and `errorMessage: "The socket connection was closed unexpectedly…"`. The canonical
  `empty` cell therefore records what that vehicle produces; the shapes that really do
  degenerate to "nothing to parse" are `truncated`/`error-envelope` (exit 0, `Empty
  output`) and the two 0-byte-stdout pre-flight rows.
  (5) **SIGTERM does not produce the all-noise stream.** §3 expected `--mode stall`
  + SIGTERM at 2 s to leave the user-message prefix and no assistant event; measured,
  omp catches SIGTERM and flushes a full `aborted` assistant `message_end`
  (`errorMessage: "Request was aborted"`) plus `turn_end` before exiting 143. The real
  all-noise prefix needs SIGKILL, which is what `ephemeral-only` is — exit 137, five
  events, no assistant message, real bytes. No hand-composed fallback was needed.
  (6) **`invalid-model` needed the shared table to grow a row, which §2.7
  anticipated.** As captured, `classify_failure` returned None: omp's pre-flight
  sentence is `Model "stub/nonexistent" not found`, and `INVALID_MODEL_MARKERS`'
  existing `model not found` row cannot span the quoted selector sitting between
  the two words. §2.7 says in as many words to "add the omp spelling if the
  shared table's forms do not cover it", so the table gained the SHAPE
  (`model <name> not found`, quotes optional, the gap bounded) rather than one
  vendor's punctuation. No other adapter's row moved. Contrast
  `invalid-model-api`, where the same verdict arrives from the API in-stream and
  classified without any change. The same §2.7 sentence put `CliUsageError` and
  `Config overlay not found` on `LAUNCH_FAILURE_MARKERS`' `spawn_failed` row,
  which is what `invalid-tool` now classifies as.
  (7) **The production chain is SIX requests, not the sixteen finding (1) measured.**
  The 12 and the 16 above are the `openai-completions` client. On the Responses API —
  the built-in `openrouter` provider, which is what every shipped model spec runs — the
  chain of one failing model call is **6** for every status measured: a 500 is 6
  requests over 16.0 s on the plain `500·2ⁿ` ladder (gaps 0.5, 1, 2, 4, 8) and a 429 is
  6 over 100.5 s, still sleeping the 20 s it reads out of the BODY before each retry.
  The doubling is the completions-only `withReplaySafeStreamRetry`
  (`maxProviderErrorRetries: 1`), which does not wrap the Responses client; what is
  left is the fetch wrapper's `maxAttempts: 6`. So §1.9's "12 requests / ~32 s is the
  floor" and finding (1)'s 16 both describe a client production never dispatches on,
  and `internal_retries.max_requests` moved 16 → 6 with them. Two further things the
  three rows pin, each of which §1.9 flagged as unmeasured: **latency is linear and
  does not change the count** (`rate-limit-delayed` — the same six requests take
  220.5 s when the server takes 20 s to answer each one, i.e. `backoff + 6 × latency`,
  and there is no client-side request timeout that would cut or retry them), and **a
  dispatch's total is the chain plus the calls before it** (`rate-limit-multi-turn` —
  one successful call returning a tool call, then a second 429'd forever, logs 7).
  `max_wall_s` therefore stays `null`: 100.5 s and 220.5 s are the same chain against
  two servers, so the wall is the upstream's property, not a ceiling omp enforces on
  itself. The only ceiling is `--max-time`, and P13(d) settled what it does — it
  INTERRUPTS a backoff sleep, an in-flight request and a running tool child alike, with
  a spawn-to-exit overshoot of 0.16–0.21 s (0.72 s on a cold HOME that must extract the
  natives first), which is why `OMP_SHUTDOWN_MARGIN_S` stays 5 rather than growing.

