    notes: >-
      Stream-shape drift, failing by name. `_KNOWN_STOP_REASONS` is closed, and
      an enum outside it may be a cut, a refusal or a rename — the parser cannot
      tell which, so it fails closed and never calls `parse_answer_text`. That
      the message's text is a perfectly good findings array is the point: a
      parser that branched on content rather than on the enum would serve a
      truncated review as a complete one. The raw value and the stream version
