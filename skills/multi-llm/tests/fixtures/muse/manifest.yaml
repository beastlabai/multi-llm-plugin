  truncated:
    stdout: truncated.stdout.txt
    stderr: truncated.stderr.txt
    exit_code: 1
    wall_s: 985.32
    requests: 121
    notes: >-
      failserver `--mode trunc` at the DEFAULT `--trunc-bytes 60` — aider's
      setting, a cut inside the very first `response.created` frame of the
      Responses **SSE** stream, so nothing at all arrives. It terminates, but it
      takes **985 s** (16m25s; 984 s at 0.1.0) and 120 POSTs to do it, and the
      reason it finally writes is the most informative string muse produces
      anywhere: "model call chain exceeded the 12m wall-clock ceiling measured
      from its first failed attempt: 4 failed attempts (40 provider requests)
      over 16m19s since the first counted provider request, all
      [transport_eof_before_terminal_event]" (0.1.0 wrote "over 12m16s" there,
      the same ladder timed from a later point). So the structure is a ladder OF
      ladders — four rounds of the ten-attempt provider ladder — bounded not by
      an attempt count but by a **12-minute wall-clock ceiling** muse measures
      from its first failure. `opening meta model stream attempt 1/10` appears
      four times and so does `10/10`.
      TWO CONSEQUENCES, both operational. (a) 985 s fits the 1800 s slot
      providers.yaml gives muse (the class's `default_timeout` of 600 is only the
      fallback), so the diagnosis above is seen, and `internal_retries` declares
      `max_wall_s` 985 so rule 4 refuses a second chain the 815 s left cannot
      hold. (b) It classifies as **None**: not
      one member of `CONNECTION_ERROR_MARKERS`, `TIMEOUT_MARKERS` or any other
      base table matches `transport_eof_before_terminal_event` — or the
      sentence "check network connectivity (VPN/proxy) and retry" that follows
      it — so a sixteen-minute transport failure is transport-shaped to the
      ladder and gets the whole retry budget on top.
      `failserver --mode empty` (accept the request, write zero bytes, close) is
      the same event: identical request counts through the 900 s mark, at which
      an earlier probe's outer bound cut it (measured at 0.1.0, not re-run).
      That is aider's "a truncated body
      and a zero-byte response are the same event at this CLI's output" result,
      reached from the other side, which is why it is not a second file.
    expect:
      success: false
      error_contains:
        - "Muse run failed"
        - "12m wall-clock ceiling"
        - "transport_eof_before_terminal_event"
      raw_contains:
        - "opening meta model stream attempt 10/10"
        - "4 failed attempts (40 provider requests)"
        - '"terminal":"failed"'
      classify_failure: null
      salvage: none

  truncated-after-deltas:
    stdout: truncated-after-deltas.stdout.txt
    stderr: truncated-after-deltas.stderr.txt
    exit_code: 1
    wall_s: 5.25
    requests: 4
    notes: >-
      NOT one of §6.2's twelve — an extra row, and the reason it exists is that
