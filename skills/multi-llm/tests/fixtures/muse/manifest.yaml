    expect:
      success: false
      error_contains:
        - "Muse run failed"
        - "stream ended before terminal event"
      raw_contains:
        - "stream ended before terminal event"
        - '"terminal":"failed"'
      classify_failure: null
      salvage: none  # the delivered text is `OK`: prose, nothing to repair

  truncated-json-answer:
    stdout: truncated-json-answer.stdout.txt
    stderr: truncated-json-answer.stderr.txt
    exit_code: 1
    wall_s: 70.40
    requests: 31
    notes: >-
      NOT one of §6.2's twelve — an extra row, committed because it is the one
      shape in this whole set where the parser got it WRONG, and nothing else
      here would catch it. Same `--mode trunc` as above with
      `--trunc-bytes 2100` and a `--trunc-answer` that is a complete JSON array:
      the delivered deltas therefore hold a *syntactically complete document*
      while the stream still died before its terminal event. muse exits **1**
      after ten attempts with `run.terminal.failed` /
      `model failed after 10 attempts: stream ended before terminal event`, and
      `parse_output` used to return **success: true** with that document as the
      answer. The cause was a single guard: `parse_output`'s first branch failed
      a non-completed run only `and not full` — with text present it fell
      straight through to `_direct_json(tail)` and returned before the terminal
      state was ever consulted again.
      BLAST RADIUS, measured in the two callers rather than assumed: Lane A was
      safe by accident — `llm_client` short-circuits on `returncode != 0` and
      never calls `parse_output`. The subagent executor was NOT: it documents
      "exit code is evidence, never the verdict" and accepts a schema-valid
      result from a non-zero exit with only an annotation, so a muse dispatch
      that failed ten times would have had its salvaged fragment accepted as the
      task's answer.
      **LANDED (C8), AND THIS ROW IS NOW THE PROOF RATHER THAN THE RECORD.** The
      `and not full` conjunct is gone: terminal state comes before salvaged
      text, in one direction only — a recorded non-`completed` terminal fails
      the run whatever parsed, while a MISSING terminal still parses (the
      `success` row above is the guard on that half, and its cell is untouched).
      So `success` flips **true → false**, the `data` cell is gone, and the row
      now asserts muse's own terminal reason in `error_contains`. The two
      `raw_contains` entries and `classify_failure: null` are deliberately
      **unchanged** — the same bytes, the same unclassifiable transport failure,
      a different verdict. The fix is in the adapter and nowhere else:
      `utils/subagent_executor.py` is byte-identical, because the evidence that
      condemns this run is `run.terminal.failed`, which only this adapter reads,
      not the exit code several CLIs overload. `raw` stays the whole stream, so
      Lane B lands this on rung 5 (`unparseable_result`), not rung 4 —
      `tests/test_muse_terminal_state.py` drives the executor over these exact
      bytes for both halves.
    expect:
      success: false
      error_contains:
        - "Muse run failed"
        - "model failed after 10 attempts: stream ended before terminal event"
      raw_contains:
        - "model failed after 10 attempts: stream ended before terminal event"
        - '"terminal":"failed"'
      classify_failure: null
      salvage: answer  # exit 1, yet its deltas hold a complete array

  exit-zero-failure:
    not_applicable: >-
      Measured on all six failure modes the rig can produce (401, 404, 400
      context-length, a 200 carrying an error object, 500-forever, 429-forever):
      muse exits **1** on every one of them, so the "still exiting 0" half of
      this row has no producer at 0.1.0-R708.1 or at 1.4.3-R5018.1 and
      `exit_zero_failure_markers` has nothing to declare. The one exit-0 run in
      this set that produced no
      answer is `ephemeral-only`, and it is not an exit-0 FAILURE: muse reached
      `run.terminal.completed` legitimately and the model returned an empty
      string. The tempting marker — the `task.lifecycle.failed` record — was
      DISQUALIFIED by measurement, not by taste: at 0.1.0 `success.stdout.txt`
      contained exactly one of those records too (a background reminder observer
      that always failed against a stub), so any marker keyed on it would have
      failed every green muse run in the fan-out. The 1.4.3 green capture has
      none, but the rule stands: every failure already exits 1, and a marker on
      a background task's failure would fail green runs again on any build whose
      observer fails.

  empty:
    not_applicable: >-
      Unreachable while muse runs at all. muse writes its workspace banner
      (`muse: workspace root: … (cwd default)` and, at 1.4.3, an agent-delegation
      line: 123 bytes) to stderr before the first HTTP request and emits
      `runtime.command.accepted` on stdout immediately after, so the smallest
      capture in this set is 16,215 bytes of stdout (17,057 at 0.1.0) and none
      is smaller. Zero bytes on both channels would mean the
      process was killed before it wrote a line — a harness artifact, not a CLI
      behaviour — and manufacturing one with `timeout(1)` is the zero-byte-hang
      trap §6 step 3 forbids. The parser's empty branch is still covered, by
      unit assertion in test_providers.py.
