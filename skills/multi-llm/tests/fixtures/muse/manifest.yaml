# The §6.2 fixture manifest for muse (Meta's Muse Code CLI). Graded by
# tests/test_provider_fixture_rows.py, whose module docstring owns the format.
#
# Every byte under this directory is raw `muse exec --json` stdout/stderr as the
# CLI wrote it. NO row here is synthesized — including `multi-assistant`, which
# every other fixture set in this tree had to fake: see that row's notes.
schema_version: 1
provider: muse
cli_version: "1.4.3-R5018.1"
captured: "2026-10-08"
method: >-
  Re-run on Muse Code 1.4.3-R5018.1 on 2026-10-08 by the same rig (the probe's
  capture driver, the same prompt, scenarios, failserver modes and truncation
  offsets, and the same probe-local server for `multi-assistant`) in the pinned
  image built from tests/container/Dockerfile at the cli-versions.lock pins; the
  set was first captured on 0.1.0-R708.1 on 2026-08-19 in mllm-e2e:local. One
  argv change since that first capture: `MuseProvider.build_command` gained
  `--disable-sandbox` on 2026-09-11 (D6), and the re-capture runs today's argv,
  below. Long rows ran in parallel containers (each with its own loopback).
  §6 step 5, with `--network none`, the rig
  mounted read-only at /rig, and NO credential — the wrapper's own fake
  `META_API_KEY` (`mllm-stub-<exec_id>`, meaningful only on 127.0.0.1) is the
  only key in the child's environment. The probe container runs the servers
  itself: `python3 /rig/stub_server.py --port 8099 --log … --scenario …` for
  `success` and `ephemeral-only`, `python3 /rig/failserver.py --port 8099 --mode
  {401,404,ctx,errbody,500,429,trunc} --log …` for the nine failure rows (the
  canonical `truncated` row uses `trunc`'s DEFAULT `--trunc-bytes 60`; the two
  extra truncation rows pass a larger offset, and one a `--trunc-answer`, and
  their notes say what each cut point buys), and — for
  `multi-assistant` ONLY — a throwaway probe-local Responses-API server in the
  probe's own directory, because the committed stub deliberately never drives a
  tool loop and `tool.result` is the only message boundary muse publishes (that
  row's notes and the README carry the detail). No committed server was edited
  for it. Each is polled on `/__health` with **urllib** (curl is not in the
  image). Dispatch is
  through the PATH wrapper `/opt/mllm/bin/muse`, NOT the real binary: the wrapper
  is what applies redirect.yaml's `argv_inject` (`--base-url
  http://127.0.0.1:8099/s/<exec_id>/v1`, inserted after the `exec` token — muse's
  base URL is argv-only and `MuseProvider.build_command` emits none), its
  `env_extra` (`MUSE_NO_AUTO_UPDATE=1`, without which the bash launcher on PATH
  auto-updates from api.meta.ai synchronously and fatally), and the per-exec HOME
  seeded from `home_seed/muse/`. Everything else is
  `MuseProvider.build_command`'s argv verbatim: `muse exec --json
  --disable-approval --disable-sandbox --model muse-spark-1.2 <prompt>`. cwd is the tmpfs
  /work/sample-project. Container flags: `--user 10001:10001 --cap-drop ALL
  --security-opt no-new-privileges --read-only`, tmpfs /work/homes,
  /work/sample-project, /tmp. Never wrapped in `timeout(1)` inside the container;
  the outer bound is a host-side `timeout --signal=KILL`.
notes: >-
  FIVE FACTS HOLD ACROSS EVERY ROW, and each one changes how a row below reads.
  (1) EIGHTEEN REQUESTS FOR ONE GENERATE CALL at 1.4.3, and they are not
  retries: 1 catalog GET on /muse-code/models plus 17 POSTs on /responses (0.1.0:
  2 GETs plus 15 POSTs). Exactly ONE of those POSTs is the real
  `model.meta.response`; the other 16 are four background reminder observers —
  `reminder.agent.skill-reminder`, `scope-reminder`, `goal-reminder` and
  `verify-reminder` (0.1.0 named them `reminder.agent.plugin:tbh-reminders:*`) —
  four calls each with distinct bodies and a one-tool `submit_reminder_decision`
  namespace, versus the main task's 26-tool `muse` namespace (20 at 0.1.0). A
  capture must tolerate them, which is why these scenarios answer by fallback
  rather than by anchored pattern.
  (2) NO REMINDER FAILS IN THE GREEN RUN at 1.4.3: `success.stdout.txt` and
  `ephemeral-only.stdout.txt` have byte-identical record-type histograms — 44
  records each, fifteen payload types, no `task.lifecycle.failed` — and differ
  only in the answer text. At 0.1.0 both carried exactly one
  `task.lifecycle.failed` ("model did not reach a terminal state within 2
  step(s)"), a reminder that always failed against a stub, which is why muse
  declares no `exit_zero_failure_markers` and must not grow one keyed on a task
  failure: a build whose background observer fails would fail green runs.
  (3) THE SESSION PREFIX IS PARTIAL, exactly as redirect.yaml records: the POSTs
  arrive at /s/<exec_id>/v1/responses and the catalog GET arrives at
  /muse-code/models with the prefix dropped, because muse rebuilds that URL from
  the origin. Both are served; the stub strips the prefix before dispatch.
  (4) stderr IS NOT EMPTY, and at 1.4.3 it CARRIES THE CAUSE TOO. It is 123
  bytes on a run that reaches `completed` (`muse: workspace root: … (cwd
  default)` plus `muse: Agent delegation: auto unavailable: workspace is
  untrusted.`) and 203–642 bytes on a failed one — the same two lines plus `run
  ended with Failed: <reason>`, the `run.terminal.failed` record's `reason`
  verbatim. At 0.1.0 that last line was the content-free `run ended with Failed`
  (79 bytes in all) and stdout was the only carrier; `describe_failure` still
  reads the cause from stdout's terminal record.
  (5) EXIT 1 ON EVERY REAL FAILURE. All nine failure rows below exit 1; the only
  exit-0 run with no answer is `ephemeral-only`, where muse legitimately
  completed and the MODEL returned an empty string.

