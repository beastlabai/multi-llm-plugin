      `tool.result` return too. So the tail-after-last-`tool.result` rule is no
      longer what separates the two outcomes ON THIS CAPTURE. The rule still
      ships, and what it pins is narrower and unchanged: a `tool.result`
      boundary is AUTHORITATIVE, not inferred from document order — text from an
      earlier turn is never the answer, even when it is the last thing before
      the boundary and even when it is the only thing that parses. This row is
