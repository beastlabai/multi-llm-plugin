      What this row pins that the canonical one cannot: §6.2's "partial text or
      a classified failure" branch. `raw` is the delivered `OK`, it is NOT
      served as the answer, and there is no traceback — the terminal reason is
      the whole diagnosis and it survives into the parser's error.
      **C3/C8 MOVED THE ROUTE, NOT THE VERDICT.** Before C8 this row's text
      reached `parse_output`'s RESIDUAL branch — the last lines of that method —
      because salvaged text let a failed run fall past the terminal-failed
      branch; the error read `No valid JSON found in text (muse run failed: …)`.
      C8 dropped the `and not full` conjunct, so a recorded non-`completed`
