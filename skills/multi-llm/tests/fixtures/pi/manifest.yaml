  # ----- synthetic: a reviewer killed at its deadline ----------------------- #

  killed-mid-toolcall:
    stdout: killed-mid-toolcall.stdout.txt
    stderr: killed-mid-toolcall.stderr.txt
    exit_code: -9
    synthesized: true
    provenance: >-
      SYNTHETIC, built 2026-09-28 for plans/review-run-scope-salvage-and-failure-visibility.md
      §4 (T4.1). Lines 1-7 (the `session` header, pi's system message and our
      prompt's echo) are `multi-assistant.stdout.txt`'s own bytes as captured on
      0.87.1 (the file was re-captured on 1.1.0 on 2026-10-08; these rows were
      not re-synthesized: their point is the killed stream's tail, which no
      capture can produce); every
      assistant turn after them is hand-built from the event shapes of the
      2026-09-25 code-review incident's pi stream (openrouter
      deepseek-v4.1-flash, killed at the slot deadline): per turn a `thinking`
      part streamed as `thinking_start`/`_delta`/`_end`, a narration `text`
      part, and one `toolCall` streamed as `toolcall_*`, ending `toolUse`. Three
      such turns complete (`tool_execution_end`, `toolResult` messages,
      `turn_end`), and their narration quotes an example array (`[2, 4, 8]`).
      The FOURTH is the incident: a `thinking` part and a `bash` `toolCall`, no
      text, `tool_execution_start` and an empty-`partialResult`
      `tool_execution_update`, then nothing — no `tool_execution_end`,
      `turn_end` or `agent_end`, because the process was killed. `exit_code:
      -9` is the SIGKILL returncode. The incident itself cannot be captured by
      the stub rig: its deadline kill is the harness's, not pi's.
    notes: >-
      The stream the old salvage gate passed: every assistant `message_end`
      carries a `content` array, so `has_salvageable_json` over the raw stream
      accepted `thinking`/`toolCall` parts as findings, and joining every
      message's text would make the narration (and its example array) the
      salvage text. `salvage_text` reads only the LAST assistant message, which
      has no text part, so the reduction is `""` — nothing to salvage.
    expect:
      success: false
      error_contains: ["Deadline exceeded: run ended inside a tool call: bash"]
      classify_failure: "timeout"
      salvage: none

  killed-mid-text:
    stdout: killed-mid-text.stdout.txt
    stderr: killed-mid-text.stderr.txt
    exit_code: -9
    synthesized: true
    provenance: >-
      SYNTHETIC, built 2026-09-28 with `killed-mid-toolcall` (same lines 1-7 from
      the 0.87.1 `multi-assistant.stdout.txt`, the same three completed narration +
      tool-call turns). The fourth assistant message streams a `thinking` part
      and then its findings array as `text_delta`s, and the process is killed
      mid-array: no `text_end`, no `message_end`, no `turn_end`. `exit_code:
      -9` is the SIGKILL returncode.
    notes: >-
      The case salvage exists for: a reviewer killed while printing its answer.
      The unfinished message's `text_delta`s, joined in order, are the reduced
      text — a truncated array that opens `[\n  {` and holds one whole finding —
      and none of the earlier turns' narration is in it. `parse_output` still
      reads the last FINISHED message (a `toolUse`), so the error names a tool
      call; the parser's verdict is not this row's point.
    expect:
      success: false
      error_contains: ["Deadline exceeded: run ended inside a tool call: bash"]
      classify_failure: "timeout"
      salvage: partial
