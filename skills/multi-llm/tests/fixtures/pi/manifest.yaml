    expect:
      success: false
      error_contains: ["Stream ended without finish_reason"]
      classify_failure: null
      salvage: none

  exit-zero-failure:
    stdout: exit-zero-failure.stdout.txt
    stderr: exit-zero-failure.stderr.txt
    exit_code: 0
    wall_s: 14.61
    requests: 4
    notes: >-
      failserver `--mode 500`. Under `--mode json` EVERY in-stream failure is an
