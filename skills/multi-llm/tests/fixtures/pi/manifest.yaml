# The §6.2 fixture manifest for pi under `--mode json`. Graded by
# tests/test_provider_fixture_rows.py, which owns the format (its module
# docstring is the spec).
#
# Every byte under this directory's top level is raw pi 0.87.1 stdout/stderr as
# the CLI wrote it inside the container. No row is synthesized and nothing was
# scrubbed: the run never left 127.0.0.1, so there is no credential, no host
# path and no OpenRouter generation id to scrub (`responseId` is the stub's
# `chatcmpl-stub`). Every stderr file but one is ZERO BYTES and is committed
# anyway, because "pi wrote nothing on stderr" is half of this set's finding.
#
# The 0.80.6 TEXT-MODE set this one replaces is kept, ungraded, in
# `text-mode-0.80.6/` (its README says why). `json-mode/` holds the 2026-09-25
# live usage probe (one OpenRouter call), read by tests/test_pi_family_stream.py
# and tests/test_pi_json_mode.py by explicit path. `capture/` is the rig.
schema_version: 1
provider: pi
cli_version: "0.87.1"
captured: "2026-09-25"
method: >-
  §7.5 T7.1 of plans/opencode-validator-false-rate-limit-and-denied-turn.md, by
  the 0.80.6 set's own method: the committed image mllm-e2e:local (pi 0.87.1, the
  cli-versions.lock pin) with `--network none`, the rig mounted read-only at /rig,
  and NO credential — the only key anywhere is the wrapper's per-exec
  `mllm-stub-<id>` in the seeded `models.json`. ONE CONTAINER PER ROW, the server
  started INSIDE it on 127.0.0.1:8099 (`/rig/stub_server.py --scenario …` for the
  answering rows, `/rig/failserver.py --mode <m>` for the failure rows, and a
  throwaway `capture/scriptserver.py` — which imports stub_server — for the three
  shapes neither has a mode for: `length`, `length-recovery` and
  `context-overflow-compacted`), then the PATH wrapper (`/opt/mllm/bin/pi` IS
  wrapper.py, so redirect.yaml's pi row applies itself), stdin /dev/null, and
  NEVER a `timeout(1)` around the CLI. The argv is the hand-assembled
  `PiProvider.build_command` output with `--mode json` after `-p` — recorded
  verbatim in `capture/argv.json` and asserted equal to the landed
  `build_command` by tests/test_pi_json_mode.py — over the 4844-byte
  stdout-demanding review prompt (`capture/prompt.txt`) the 0.80.6 set used.
  `wall_s` is spawn-to-exit; `requests` counts the server log's POSTs (pi fetches
  no catalog). The whole rig is `capture/` (`batch.sh` reproduces the session in
  ~2.5 min at $0). No `summarization_retry_*` event and no usage-bearing
  `entry_appended` appears in any row: every `entry_appended` is a
  `context_edit` (pi omitting a failed attempt from context), so the cache-warming
  leg §7.3 worried about is inert here.
notes: >-
  THREE FACTS DOMINATE THIS SET, and each inverts the 0.80.6 one.
  (1) **Every in-stream failure exits 0 with stderr EMPTY.** 401, 404, 429, 5xx,
  a cut stream, a 200-with-an-error-body, a zero-byte response and a 400
  context-length all end in an assistant `message_end` with `stopReason:
  "error"` and the vendor's words in `errorMessage` — the exact string 0.80.6
  printed to stderr (`401: {…json…}`). Only a thrown pre-flight exits non-zero
  (`preflight-no-key`: exit 1, the one-line `session` header on stdout, the
  diagnosis on stderr). So `_DESCRIBE_FAILURE_CHANNELS["pi"]` is
  `STDOUT_ELSE_STDERR`, like omp.
  (2) **The 400 context-length is no longer silent** (`context-overflow`): the
  vendor's `maximum context length` sentence is on stdout and classifies
  `context_length_exceeded`, where 0.80.6 wrote nothing on either channel. With a
  one-message conversation pi does NOT compact (one request); with history it
  compacts — a paid summarization call whose usage is in
  `compaction_end.result.usage` — and retries once
  (`context-overflow-compacted`, 7 requests).
  (3) **pi's retry chain is visible**: 4 requests over ~14.4 s on every
  retryable row (`auto_retry_start` ×3 at 2/4/8 s, then `auto_retry_end
  {success: false, finalError}`), which is what `PiProvider.internal_retries`
  declares.
  The stream echoes our prompt (user message, `agent_end.messages`), carries
  pi's 5.9 KB system prompt twice and every tool result — which is what
  `PiProvider.vendor_text` removes (`markers-in-tool-result`).

rows:
  success:
    stdout: success.stdout.txt
    stderr: success.stderr.txt
    exit_code: 0
    wall_s: 0.33
    requests: 1
    notes: >-
      stub_server with the 0.80.6 success row's answer. The answer is the text of
      the one assistant `message_end` (`stopReason: stop`). The stub streams no
      `usage`, so pi's usage block is present and ZEROED — `parse_usage` reports
      those zeros, it does not invent them.
    expect:
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains: ['"type":"session","version":3', '"stopReason":"stop"']
      classify_failure: null

  truncated:
    stdout: truncated.stdout.txt
    stderr: truncated.stderr.txt
    exit_code: 0
    wall_s: 14.35
    requests: 4
    notes: >-
      failserver `--mode trunc`. Exit 0 now (1 at 0.80.6). Four requests over
      14.4 s, then `errorMessage: "Stream ended without finish_reason"` — the
      same five words, now on stdout. Still classified as nothing (no table
      recognises the sentence); recorded, as at 0.80.6.
    expect:
      success: false
      error_contains: ["Stream ended without finish_reason"]
      raw_contains: ['"type":"auto_retry_end","success":false']
      classify_failure: null

  ephemeral-only:
    not_applicable: >-
      pi's json stream has no "noise-only" shape distinct from `empty`: a run
      whose model answered the empty string is a whole, well-formed stream (header,
      system and user messages, one assistant `message_end` with `content: []` and
      `stopReason: stop`) whose only missing part is the answer — committed as
      `empty`. There is no filtered record class a run could consist only of.

  multi-assistant:
    stdout: multi-assistant.stdout.txt
    stderr: multi-assistant.stderr.txt
    exit_code: 0
    wall_s: 0.33
    requests: 2
    notes: >-
      stub_server with a `scripted_tool_call` on the chat surface (T4.10): the
      first assistant `message_end` is `toolUse` carrying a `read` of
      plans/auth-feature.md, the tool runs (`tool_execution_end`), and the second
      assistant `message_end` is the answer. The LAST assistant message is the
      answer; `parse_usage` sums both and counts `tool_uses: 1`.
    expect:
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains: ['"stopReason":"toolUse"', '"type":"tool_execution_end"']
      classify_failure: null

  error-envelope:
    stdout: error-envelope.stdout.txt
    stderr: error-envelope.stderr.txt
    exit_code: 0
    wall_s: 14.37
    requests: 4
    notes: >-
      failserver `--mode errbody` (HTTP 200 whose body is an error object). pi
      still reads it as a stream that stopped early: byte-identical in shape to
      `truncated`, four requests, and the provider's own sentence appears nowhere.
    expect:
      success: false
      error_contains: ["Stream ended without finish_reason"]
      classify_failure: null

  exit-zero-failure:
    stdout: exit-zero-failure.stdout.txt
    stderr: exit-zero-failure.stderr.txt
    exit_code: 0
    wall_s: 14.37
    requests: 4
    notes: >-
      failserver `--mode 500`. Under `--mode json` EVERY in-stream failure is an
      exit-0 failure, so this row is one representative (the 5xx; same bytes as
      `server-error`, a separate container). What it pins is that success is
      read off the stream and never off the exit code: exit 0, stderr empty, and
      `parse_output` still fails with the vendor's sentence, named "Server
      error" for Lane A's table.
    expect:
      success: false
      error_contains: ["Server error: 500: The server had an error while processing your request"]
      classify_failure: "server_error"

  stdout-error:
    not_applicable: >-
      The row wants the diagnosis on stdout with stderr empty AND a non-zero exit.
      pi 0.87.1 json mode produces the first half on every in-stream failure
      (auth-error, rate-limit, invalid-model, server-error, context-overflow,
      truncated, zero-body, error-envelope: stdout carries `errorMessage`, stderr
      is 0 bytes) but always with exit 0 — `print-mode.js` sets a non-zero exit
      only in text mode — and its one non-zero exit (`preflight-no-key`, exit 1)
      puts the diagnosis on stderr. Both halves together have no producer.

  empty:
    stdout: empty.stdout.txt
    stderr: empty.stderr.txt
    exit_code: 0
    wall_s: 0.34
    requests: 1
    notes: >-
      stub_server answering the EMPTY string. A real empty completion now
      differs from a failure: the assistant `message_end` is `stop` with
      `content: []`, no `errorMessage`, no retry. C4's rung 5: `Empty output`,
      classified nothing, and `describe_failure` returns `None` — nothing on
      either channel names a failure, and nothing is invented. That is the
      measurement, not a gap. The two rows that shared these bytes at 0.80.6
      (`context-overflow`, `exit-zero-failure`) no longer do.
    expect:
      success: false
      error_contains: ["Empty output"]
      classify_failure: null

  auth-error:
    stdout: auth-error.stdout.txt
    stderr: auth-error.stderr.txt
    exit_code: 0
    wall_s: 0.31
    requests: 1
    notes: >-
      failserver `--mode 401`. One request, terminal. `errorMessage` is 0.80.6's
      stderr line verbatim (`401: {…"code":"invalid_api_key"}`), reduced by the
      vendor-JSON tier; the 401 prefix classifies `auth_failed` structurally.
    expect:
      success: false
      error_contains: ["401: Incorrect API key provided", "(invalid_api_key)"]
      raw_contains: ['401: {\"message\":\"Incorrect API key provided']
      classify_failure: "auth_failed"

  rate-limit:
    stdout: rate-limit.stdout.txt
    stderr: rate-limit.stderr.txt
    exit_code: 0
    wall_s: 14.36
    requests: 4
    notes: >-
      failserver `--mode 429`, fail-forever. pi retries a 429 itself: 4 requests
      over 14.4 s (2/4/8 s), then `auto_retry_end{success: false}`. This row is
      T7.14's evidence for `retries_rate_limit=True`, `max_requests=4`.
    expect:
      success: false
      error_contains: ["429: Rate limit reached for stub-model", "(rate_limit_exceeded)"]
      raw_contains: ['"type":"auto_retry_start","attempt":3,"maxAttempts":3']
      classify_failure: "rate_limited"

  invalid-model:
    stdout: invalid-model.stdout.txt
    stderr: invalid-model.stderr.txt
    exit_code: 0
    wall_s: 0.33
    requests: 1
    notes: >-
      failserver `--mode 404`. One request, terminal, the model named. A 404 is
      not a structural class: the reduced haystack (the terminal `errorMessage`)
      reaches the shared tables, which say `invalid_model`.
    expect:
      success: false
      error_contains: ["404: The model `stub-model` does not exist", "(model_not_found)"]
      classify_failure: "invalid_model"

  context-overflow:
    stdout: context-overflow.stdout.txt
    stderr: context-overflow.stderr.txt
    exit_code: 0
    wall_s: 0.33
    requests: 1
    notes: >-
      failserver `--mode ctx` (400, `context_length_exceeded`). THE ROW THAT
      CHANGED MOST: silent at 0.80.6 (0 bytes on both channels, `None`), it is
      now an `error` carrying the vendor's sentence, classified
      `context_length_exceeded` — the terminal class the ladder needs. One
      request and no `compaction_*` event: with one user message there is
      nothing to compact, so pi records a `context_edit` and stops. This settles
      §7.3 step 5's question for this shape: the vendor's 400, not the
      "Context overflow recovery failed" sentence.
    expect:
      success: false
      error_contains: ["400: This model's maximum context length is 8192 tokens"]
      raw_contains: ['context_length_exceeded']
      classify_failure: "context_length_exceeded"

  # ----- beyond §6.2's twelve, graded the same way -------------------------- #

  zero-body:
    stdout: zero-body.stdout.txt
    stderr: zero-body.stderr.txt
    exit_code: 0
    wall_s: 14.35
    requests: 4
    notes: >-
      failserver `--mode empty` (socket closed after zero body bytes).
      `Connection error.` after four requests — the one failure text here that
      lands on a shared marker table.
    expect:
      success: false
      error_contains: ["Connection error."]
      classify_failure: "connection_error"

  server-error:
    stdout: server-error.stdout.txt
    stderr: server-error.stderr.txt
    exit_code: 0
    wall_s: 14.36
    requests: 4
    notes: >-
      failserver `--mode 500`, fail-forever: 4 requests over 14.4 s. Classified
      NOTHING at 0.80.6 (OpenAI's 500 sentence is on no table); the `500:`
      prefix now classifies `server_error` structurally, and the sentence is
      named "Server error" so Lane A's string classifier agrees.
    expect:
      success: false
      error_contains: ["Server error: 500: The server had an error while processing your request"]
      classify_failure: "server_error"

  preflight-no-key:
    stdout: preflight-no-key.stdout.txt
    stderr: preflight-no-key.stderr.txt
    exit_code: 1
    wall_s: 0.30
    requests: 0
    notes: >-
      stub_server, with `apiKey` DROPPED from the seeded models.json. Zero
      requests, exit 1, stdout the 143-byte `session` header alone (written
      before the throw), stderr `No API key found for stub.` plus pi's login
      help. The measured wording is `No API key found for` — the model
      registry's — not the session's `No API key for` the plan read at
      agent-session.js:1647; `PiProvider.auth_error_patterns` carries both.
      omp's `_never_started` shape: `describe_failure` answers from stderr.
    expect:
      success: false
      error_contains:
        - "run ended before any assistant message (last event: session, 1 events)"
        - "stderr: No API key found for stub."
      classify_failure: "auth_failed"

  length:
    stdout: length.stdout.txt
    stderr: length.stderr.txt
    exit_code: 0
    wall_s: 0.31
    requests: 1
    notes: >-
      scriptserver `--mode length-full`: a cut answer, `finish_reason: length`,
      `usage.completion_tokens` 16384 = the stub model's default `maxTokens`, so
      pi does not treat it as recoverable. `stopReason: length` reaches the
      parser directly: `Truncated output`, no error_code, classified nothing.
    expect:
      success: false
      error_contains: ["Truncated output (stopReason length: the model hit its output limit after 44 characters)"]
      raw_contains: ['"stopReason":"length"']
      classify_failure: null

  length-recovery:
    stdout: length-recovery.stdout.txt
    stderr: length-recovery.stderr.txt
    exit_code: 0
    wall_s: 0.34
    requests: 1
    notes: >-
      scriptserver `--mode length-short`: the same cut with 7 output tokens,
      below `maxTokens`, i.e. pi's "recoverable length". MEASURED: with a
      one-message conversation pi makes NO compact-and-retry (one request, no
      `compaction_*` event, only a `context_edit`), so the shape is `length`'s.
      The "Truncated response recovery failed" sentence was not produced here;
      the parser still keys a failed overflow compaction on that text, never on
      `reason: overflow`, and gives it this row's disposition.
    expect:
      success: false
      error_contains: ["Truncated output (stopReason length"]
      classify_failure: null

  markers-in-tool-result:
    stdout: markers-in-tool-result.stdout.txt
    stderr: markers-in-tool-result.stderr.txt
    exit_code: 0
    wall_s: 0.36
    requests: 2
    notes: >-
      stub_server `scripted_tool_call` (chat): pi `read`s notes/incident.md, which
      quotes `401 Unauthorized: Incorrect API key provided`, `429 Too Many
      Requests: Rate limit reached`, `quota exceeded`, `model_not_found` and
      `context_length_exceeded`; the answer mentions 401 and rate limit too. The
      stream also echoes our review prompt and pi's system prompt. A clean run:
      `classify_failure` is `None` ONLY because `vendor_text` reduces a `stop`
      stream to "" — the pi twin of the §2 opencode defect.
    expect:
      success: true
      raw_contains:
        - "401 Unauthorized: Incorrect API key provided"
        - "Rate limit reached for requests per min"
      classify_failure: null

  context-overflow-compacted:
    stdout: context-overflow-compacted.stdout.txt
    stderr: context-overflow-compacted.stderr.txt
    exit_code: 0
    wall_s: 0.37
    requests: 7
    notes: >-
      scriptserver `--mode overflow-compact`, with `PART_BYTES=2000` and a
      per-exec settings.json of `{"compaction":{"keepRecentTokens":200}}` (so the
      history is compactable at 2 KB per tool result instead of ~160 KB; the
      default 20000 produced the identical event sequence at 864 KB). Four `read`
      tool turns, then the 400 context-length; pi compacts (`compaction_start`/
      `compaction_end{reason: overflow, willRetry: true}`, ONE summarization
      request, no tools, `max_tokens` 8192) and retries, and the retry answers.
      Requests: 4 tool + 1 overflow + 1 summarization + 1 answer = 7. A success,
      and `compaction_end.result.usage` (900 in / 40 out, the stub's numbers)
      is the paid call `parse_usage` adds.
    expect:
      success: true
      data:
        - {id: "S001", title: "Bound the retry ladder", severity: "high"}
        - {id: "S002", title: "Strip the vendor token", severity: "medium"}
      raw_contains: ['"type":"compaction_end","reason":"overflow"']
      classify_failure: null
