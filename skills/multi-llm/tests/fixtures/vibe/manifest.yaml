# The §6.2 fixture manifest for vibe. Graded by tests/test_provider_fixture_rows.py,
# which owns the format (its module docstring is the spec).
#
# As with copilot, the FIRST bytes here were older than this file: they were
# captured by the 2026-08-18 §6 probe and consumed only by the hand-written
# `TestVibeProvider` in tests/test_providers.py, so vibe sat in that module's
# `MANIFEST_PENDING` table and nothing pinned its CLASSIFICATION. That is how a
# successful vibe run came to classify **`rate_limited`** without any test
# seeing it: the `--output json` transcript opens with a `role: "user"` entry
# holding our prompt verbatim, and the plan under review says "Unify auth
# errors, rate limits, context overflow and exit-zero failures behind one
# class" (plans/harness-residual-work.md C1). The rows below were re-captured on
# 2.26.0 on 2026-10-08 and again on 2.26.1 on 2026-10-09 (see `method`) and are
# graded by the rig.
schema_version: 1
provider: vibe
cli_version: "2.26.1"
captured: "2026-10-09"
method: >-
  §6 step 5, re-run 2026-10-09 on vibe 2.26.1 exactly as the 2026-10-08 run on
  2.26.0 was (first captured 2026-08-18 on 2.24.1 by the §6 probe in a throwaway
  python:3.12-slim image, against its own seeded config.toml naming the provider
  `stubprov` and the alias `stub`): in the pinned image built from
  tests/container/Dockerfile at the cli-versions.lock pins (`mllm-e2e:local`,
  `vibe --version` = 2.26.1), one container per row, `--network none`, UID
  10001, read-only root, NO credential. The CLI is driven through the PATH
  wrapper (`/opt/mllm/bin/vibe` IS `wrapper.py`), so redirect.yaml's vibe row
  applies verbatim: `VIBE_HOME` seeded from `tests/container/home_seed/vibe/`
  (provider `openrouter`, alias `openai/gpt-5.6-luna`, wire name `stub-model`),
  the per-exec `/s/<id>/v1` api_base, `STUB_API_KEY` set to the wrapper's fake
  session key, and the row's `env_extra` (`VIBE_API_TIMEOUT=90`,
  `VIBE_API_RETRY_MAX_ELAPSED_TIME=150`, `VIBE_THINKING=off`,
  `VIBE_DEFAULT_AGENT=plan` and the three opt-outs) — so unlike the 2.26.0 rows,
  these ran at the PINNED 150 s retry budget, the chain a shipped run gets. argv
  is `VibeProvider.build_command`'s output verbatim, built inside the container
  by the in-image adapter (`vibe --output json --max-price 0.25 --max-turns 4
  --agent plan -p <prompt>`); `success-streaming` and `success-text` swap only
  the `--output` value, and no row adds a flag. Answering rows: the image's
  `stub_server.py` with the probe's own `scenario-json-array.yaml`
  (`success-text`: no scenario); failure rows: the 2.24.1 probe's own
  error-injection server (scratch/vibe-probe/failserver.py, copied verbatim, so
  the vendor bodies such as `upstream boom` are the ones the first capture saw);
  `zero-byte-response` alone uses `tests/container/failserver.py --mode empty`.
  The four limit rows (`turn-limit`, `price-limit`, `length`, `terminated`) are
  new at 2.26.1 and answered by a throwaway chat-completions server written for
  this capture: every turn the review array as text plus one `read_file` tool
  call (`turn-limit`); the review then a usage chunk of 2,000,000 prompt tokens,
  $0.40 at the seed's price (`price-limit`); half the review then
  `finish_reason: "length"` (`length`); half the review then silence, with the
  driver sending SIGTERM to the wrapper's process group at 10 s as the
  harness's timeout kill does (`terminated`). Prompts: the probe's 8,408-byte
  review prompt (`prompt-multikb.txt`) for `success`, `Say READY.` for the
  streaming and text rows, and exp.sh's `Summarise the project in one
  sentence.` for every other row. Never wrapped in `timeout(1)`. Each
  `exit_code`, `wall_s` and `requests` below is read back off THAT row's own run
  (the driver's per-row result and the server's request log). 2.26.0 and 2.26.1
  run the Unified Harness by default; the argv is unchanged, so these bytes are
  its.
notes: >-
  Five facts hold across every row. (1) vibe's error channel is still
  **stderr**, which is why most rows here name a stderr file and no stdout at
  all — the exact inverse of copilot, whose whole diagnosis rides stdout. What
  moved at 2.26.1 is the EXIT CODE: its `--help` now ends "Programmatic mode
  exits 0 finished, 1 usage or config error, 2 infrastructure failure, 3 stopped
  by a limit", and the rows bear it out — 1 for the 401 and a config error; 2
  for the 404, the 400 context overflow, the stall and every retry-budget
  exhaustion; 3 for the four limit rows. 2.26.0 exited 1 on every failure.
  Nothing exits 0 on a failure. (2) The config-validation error moved channel:
  2.26.0 printed it on **stdout** with stderr empty (`stdout-error`, kept on
  its 2.26.0 bytes), 2.26.1 prints `Error: Invalid configuration …` on
  **stderr** with stdout empty (`config-error`), still exit 1. The parser keeps
  its non-JSON-stdout branch for the 2.24.1 floor. (3) The stdout transcript
  still echoes our prompt in a `role: "user"` entry whose `content[].text` is
  the same field the answer uses; `_last_assistant_text` filters it by role,
  and `VibeProvider.vendor_text` does the same for the classifier. The entry
  schema is 2.26.0's key for key. (4) **A run stopped by a limit exits 3 and
  leaves the whole transcript on stdout**: every entry `generationStatus:
  completed`, its last assistant message whatever the run had said when the
  limit fell, and `Stopped: <outcome>` alone on stderr. Through the 2.26.0
  parser all four limit rows read as success (`length` and `terminated` as a
  one-record document salvaged from half an array); `parse_output` now refuses
  a transcript beside that line. (5) **The retry chain changed again inside the
  pinned budget.** 2.26.1's harness (`mistralai_vibe_local_harness/vibe/adapters/
  _retry.py`) backs off 0.5 s × 1.5ⁿ plus up to 1 s of jitter, capped at 30 s,
  makes a retry only when its wait ends inside the 150 s budget, and retries a
  stall once: every fail-forever row shows **13 requests over ~124.5 s** (the
  13th at ~120.4 s; a 14th fits when the jitter runs low), `Retry-After: 30`
  gave 5 requests 30 s apart over 124.0 s, and `Retry-After: 1` 150 requests
  over 152.8 s (not committed: the `rate-limit` bytes but the exec id). The
  envelope's worst case, five `Retry-After: 29` 429s then a stall, ended at
  238.9 s with 6 requests, under the declared 272 s. The HTTP-error wording is
  2.26.0's byte for byte (httpx's status line, an MDN link, the vendor's own
  message); only the stall's changed, from an empty `Error: ` to a named
  `ReadTimeout`. Every pre-existing row still classifies as it did except
  `stall`, which the new words make `timeout`.

rows:
  success:
    stdout: success-json.json
    exit_code: 0
    wall_s: 3.18
    requests: 1
    notes: >-
      THE ROW THIS MANIFEST WAS WRITTEN FOR. `--output json` returns a JSON array
      of transcript entries; the last `role: "assistant"`, `type: "message"`
      entry's fenced block unwraps to the document below. `classify_failure` on
      these bytes answered **`rate_limited`**, entirely from the echoed
      `role: "user"` entry — the plan under review discusses rate limits — and
      `rate_limited` is one of the two classes
      `subagent_executor._classify_failed_run` forwards to the retry ladder, so
      on a *failed* run the echo decides the slot's fate. The `null` below is
      `VibeProvider.vendor_text`; the bytes still carry the whole prompt, so a
      regression fails here. 2.26.0 changed the entries without touching what
      the parser reads (a new `inputEntryId` key, ids spelled
      `user-turn-<hex>-1` / `assistant-<uuid>`, the assistant entry's `source`
      `"harness"` where 2.24.1 wrote `null`), and 2.26.1 changed nothing in
      them. One request, 3.2 s.
    expect:
      salvage: answer
      success: true
      data:
        - id: "S001"
          severity: "high"
          title: "argv-only transport"
          detail: "A multi-KB prompt exceeds the Windows command-line cap."
        - id: "S002"
          severity: "medium"
          title: "unmeasured retry envelope"
          detail: "The retry budget is declared from documentation rather than measurement."
        - id: "S003"
          severity: "low"
          title: "tier not recorded"
          detail: "The permission tier ships without a probe transcript."
      raw_contains:
        - '"role": "user"'
        - '"role": "assistant"'
      classify_failure: null

  truncated:
    stderr: truncated.stderr.txt
    exit_code: 2
    wall_s: 124.92
    requests: 13
    notes: >-
      A cut stream (the probe server's `truncate`: two chunks, no finish reason,
      no `[DONE]`, connection closed). vibe writes nothing at all to stdout and
      reports `Model stream from openrouter (stub-model) ended without a finish
      reason.` on stderr with no traceback — 2.26.0's bytes exactly. 2.26.1
      exits **2** (infrastructure failure; 2.26.0: 1) after retrying it for the
      pinned 150 s budget, 13 requests (2.24.1 failed it on the first request).
      `parse_output` takes the empty-stdout branch and QUOTES the stderr
      sentence rather than restating the symptom — which is the whole reason
      that branch reads stderr — and the classification is `None`, because
      "ended without a finish reason" matches no member of
      `base.CONNECTION_ERROR_MARKERS`. Recorded, not fixed: the run falls to the
      executor's bounded transport retry.
    expect:
      salvage: none
      success: false
      error_contains: ["ended without a finish reason"]
      classify_failure: null

  ephemeral-only:
    stdout: ephemeral-only.json
    exit_code: 0
    synthesized: true
    provenance: >-
      Synthesized from the real 2026-10-09 `success-json.json` capture (2.26.1):
      a well-formed transcript array with the assistant entry removed, so
      nothing `_last_assistant_text` can select remains, rendered at the CLI's
      own 2-space indent with its trailing newline — the surviving
      `role: "user"` entry is byte-for-byte the one in that capture. Necessary
      because the stub always answers and drives no tool calls, so an all-noise
      transcript cannot be produced end to end.
    notes: >-
      An all-noise run is a **failure**, not an empty-string success. Note that
      this row also carried the echoed prompt, so its classification moved from
      `rate_limited` to `null` with the C1 fix — a *failed* run whose only reason
      to be called rate-limited was our own plan text is precisely the live
      hazard, and this is the row that pins it.
    expect:
      salvage: none
      success: false
      error_contains: ["no assistant message in vibe's transcript"]
      raw_contains: ['"role": "user"']
      classify_failure: null

  multi-assistant:
    stdout: multi-assistant.json
    exit_code: 0
    synthesized: true
    provenance: >-
      Synthesized from the real 2026-10-09 `success-json.json` capture (2.26.1)
      by inserting a SECOND assistant entry ahead of the real one: a copy of the
      real entry with its id set to
      `assistant-aaaaaaaa-0000-0000-0000-000000000001` and its text replaced by
      `Preliminary thought: I should look at the plan first.` A second assistant
      turn requires a tool loop the committed stub deliberately never drives
      (the copilot `multi-assistant.jsonl` precedent; `turn-limit` below has
      real ones, but every one of them carries the whole review). The rule it
      pins is real and this repo has paid for it: muse's silent concatenation.
    notes: >-
      LAST-wins, not first-wins and not concatenation. A first-wins parser
      returns the preliminary sentence and a concatenating one returns neither.
      This capture carries the echoed user entry too, so it is the second vibe
      row whose classification moved from `rate_limited` to `null`.
    expect:
      salvage: answer
      success: true
      data:
        - id: "S001"
          severity: "high"
          title: "argv-only transport"
          detail: "A multi-KB prompt exceeds the Windows command-line cap."
        - id: "S002"
          severity: "medium"
          title: "unmeasured retry envelope"
          detail: "The retry budget is declared from documentation rather than measurement."
        - id: "S003"
          severity: "low"
          title: "tier not recorded"
          detail: "The permission tier ships without a probe transcript."
      raw_contains: ["Preliminary thought: I should look at the plan first."]
      classify_failure: null

  error-envelope:
    stderr: error-envelope.stderr.txt
    exit_code: 2
    wall_s: 124.57
    requests: 13
    notes: >-
      HTTP 200 whose body is a provider error object. vibe does NOT serve it as
      the answer — stdout is empty and the run exits **2** (2.26.0: 1) — and it
      still does not forward the vendor's text: what reaches stderr is vibe's
      own `Model stream from openrouter (stub-model) produced no chunks.`, the
      sentence 2.26.0 introduced (2.24.1 printed the `ended without a finish
      reason` sentence here, byte-identical to the `truncated` and
      `incomplete-stream` rows). It is retried like them, 13 requests over the
      150 s budget (2.24.1: one request). The right half is still pinned (the
      error never becomes an answer), and so is the cost: the vendor's own
      message is lost, and the row classifies `None`.
    expect:
      salvage: none
      success: false
      error_contains: ["produced no chunks"]
      classify_failure: null

  exit-zero-failure:
    not_applicable: >-
      No producer at vibe 2.26.1, as at 2.26.0 and 2.24.1: every failure mode
      the rig could drive exits nonzero, each read off its own run — 1 for a
      401 and an invalid config; 2 for a 404, a 400 context-length, a 429, a 429
      with `Retry-After` (30 and 1), a 500, a stalled request, a cut stream, a
      finish-less stream, a 200 carrying a provider error object and a
      zero-byte response; 3 for a run stopped by `--max-turns`, `--max-price`, a
      `length` finish, a SIGTERM or `--time-limit` (eighteen modes). That is also
      why `VibeProvider` declares no `exit_zero_failure_markers`: the exit code
      is authoritative for this adapter, so there is nothing for the ladder's
      last step to consult.

  stdout-error:
    stdout: stdout-error.stdout.txt
    exit_code: 1
    wall_s: 0.94
    requests: 0
    notes: >-
      CAPTURED ON 2.26.0 (2026-10-08) AND NOT RE-CAPTURED: 2.26.1 prints the
      same validation error on stderr with stdout empty (`config-error` below),
      so no 2.26.1 run produces these bytes; the exit code, wall and request
      count are that 2.26.0 run's. Kept because the parser branch it pins still
      serves the 2.24.1 floor and 2.26.0: §6.2's `stdout-error` row exactly, a
      *config validation* error printed on **stdout** with stderr empty, exit 1,
      before any request. Produced by giving the seeded `[[models]]` entry
      `thinking = "bogus"` for that one run, so the message names the committed
      seed's alias (`models.openai/gpt-5.6-luna.thinking`). This is the opencode
      trap, and it is why `parse_output` reports unparseable stdout as a failure
      CARRYING that text — handing these bytes to the extractor would find
      nothing and report an empty answer instead of the reason, which is the
      one place the reason exists. The classification is `None`: a rejected
      `thinking` level is not a transport condition and matches no table.
    expect:
      salvage: none
      success: false
      error_contains:
        - "vibe produced non-JSON output on stdout"
        - "Invalid configuration"
      classify_failure: null

  empty:
    stdout: empty.stdout.txt
    stderr: empty.stderr.txt
    exit_code: 1
    notes: >-
      CAPTURED ON 2.24.1 AND NOT RE-CAPTURED: these two zero-byte files are the
      2026-08-18 probe's (its inventory lists them as captured; it kept no
      per-run record, so `exit_code` is that probe's class rule). On 2.26.0 and
      2.26.1 the nearest condition the rig can drive — a server that accepts and
      closes writing zero bytes — does NOT leave both channels empty: vibe
      retries it for the budget and prints `Error: Server disconnected without
      sending a response.` on stderr (the `zero-byte-response` row). Kept
      because what it pins is the adapter's branch, not a CLI behaviour: zero
      bytes on **both** channels, committed as two empty files rather than
      omitted, because "the CLI wrote nothing anywhere" is a different fact from
      "the CLI wrote nothing on this one channel". `parse_output` names the
      cause rather than restating the symptom, and falls back to the no-stderr
      wording because there is no stderr text to quote. The classifier answers
      `None` on an empty haystack by construction.
    expect:
      salvage: none
      success: false
      error_contains: ["Empty output from vibe"]
      classify_failure: null

  auth-error:
    stderr: auth-error.stderr.txt
    exit_code: 1
    wall_s: 3.23
    requests: 1
    notes: >-
      A real 401, not retried, and the one HTTP failure 2.26.1 still exits **1**
      for: its `RunOutcome` maps an invalid key to `config_error`. vibe prints
      its own sentence with the key's variable NAME (never its value), 2.26.0's
      bytes exactly: `Error: Invalid API key (from env var STUB_API_KEY). Please
      check your API key and try again.` — 2.24.1 wrapped the same sentence in
      `API error from stubprov (model: stub-model):`. `invalid api key` is a
      member of the adapter's `auth_error_patterns`, so the credential failure
      lands on rung 1 where it belongs.
    expect:
      salvage: none
      success: false
      error_contains: ["Invalid API key"]
      raw_contains: ["Please check your API key and try again."]
      classify_failure: "auth_failed"

  rate-limit:
    stderr: rate-limit.stderr.txt
    exit_code: 2
    wall_s: 124.38
    requests: 13
    notes: >-
      A real 429, forever. vibe forwards httpx's status line and the vendor's own
      message — `Client error '429 Too Many Requests' for url '…'` then `: rate
      limit exceeded` — as 2.26.0 did (2.24.1 printed its own `Rate limits
      exceeded. Please wait a moment before trying again.` after 3 requests in
      2.3 s), and exits **2** (2.26.0: 1) once the pinned budget is spent: 13
      requests, 124.4 s. It still classifies `rate_limited`, through the shared
      table rather than the adapter's own `rate limits exceeded` pattern, which
      no 2.26.x capture carries. The same 429 with `Retry-After: 30` (not
      committed: identical bytes but the exec id) gave 5 requests exactly 30 s
      apart, 124.0 s; with `Retry-After: 1` (the committed failserver's `429ra`,
      its own vendor body) 150 requests one second apart, 152.8 s — the header
      is taken as given below the 30 s cap, so a short one sets the count.
    expect:
      salvage: none
      success: false
      error_contains: ["429 Too Many Requests"]
      raw_contains: ["rate limit exceeded"]
      classify_failure: "rate_limited"

  invalid-model:
    stderr: invalid-model.stderr.txt
    exit_code: 2
    wall_s: 3.08
    requests: 1
    notes: >-
      A real 404, not retried, and it still NAMES the model — the vendor's
      `The model `stub-model` does not exist` survives verbatim after httpx's
      `Client error '404 Not Found' for url '…'` — which is what makes a stray
      `:effort` suffix findable. 2.26.0's bytes but the exec id; 2.26.1 exits
      **2** (2.26.0: 1): the harness does not read a 404 as its `invalid_model`
      turn error, which would have been `config_error` and exit 1. 2.24.1 kept
      the whole upstream record under an `API error from stubprov` prefix
      (`status:`, `provider_message:`, a `body_excerpt` carrying `"code":
      "model_not_found"`), and that prefix's `\bapi error\b` is what once sent
      this row to `server_error` before C2 put `INVALID_MODEL_MARKERS` first.
      2.26.x carries no `api error` token and no error code at all; the row
      classifies `invalid_model` either way.
    expect:
      salvage: none
      success: false
      error_contains: ["The model `stub-model` does not exist"]
      raw_contains:
        - "Client error '404 Not Found'"
        - "does not exist"
      classify_failure: "invalid_model"

  context-overflow:
    stderr: context-overflow.stderr.txt
    exit_code: 2
    wall_s: 3.33
    requests: 1
    notes: >-
      A real 400, one request (2.24.1 made two). vibe forwards the upstream
      sentence verbatim — `This model's maximum context length is 8192 tokens,
      however you requested 99999 tokens.` after httpx's `Client error '400 Bad
      Request'` line — 2.26.0's bytes but the exec id, where 2.24.1 substituted
      its own `The conversation context exceeds the model's maximum limit. Use
      /rewind …`. 2.26.1 exits **2** (2.26.0: 1), not the 3 its `length`
      outcome for a `context_too_long` turn error would give: this 400 reaches
      the run as an infrastructure failure. It classifies
      `context_length_exceeded` through the shared `maximum context length`
      marker; `conversation context exceeds`, added to
      `base.CONTEXT_OVERFLOW_MARKERS` for 2.24.1's wording, stays for that
      release. Worth holding beside goose's context row, where the same upstream
      400 is swallowed into a compaction report that matches nothing and burns
      the whole retry budget on the one condition §7.2 calls terminal.
    expect:
      salvage: none
      success: false
      error_contains: ["maximum context length is 8192 tokens"]
      classify_failure: "context_length_exceeded"

  # ----- beyond §6.2's twelve, graded the same way -------------------------- #

  server-error:
    stderr: server-error.stderr.txt
    exit_code: 2
    wall_s: 124.8
    requests: 13
    notes: >-
      A 500 served forever, kept as the retry-exhausted shape: `Server error
      '500 Internal Server Error' for url '…'` then the vendor's `upstream boom`,
      2.26.0's bytes but the exec id. 2.24.1 gave up after 3 requests in 2.4 s;
      2.26.1 spends the pinned 150 s budget, 13 requests at 0, 0.8, 1.8, 3.2,
      5.9, 8.5, 13.2, 19.2, 28.5, 42.0, 61.3, 90.5 and 120.5 s, and exits **2**
      (2.26.0: 1). `server_error` is the correct answer and the status line
      produces it.
    expect:
      salvage: none
      success: false
      error_contains: ["500 Internal Server Error"]
      raw_contains: ["upstream boom"]
      classify_failure: "server_error"

  incomplete-stream:
    stderr: incomplete-stream.stderr.txt
    exit_code: 2
    wall_s: 124.51
    requests: 13
    notes: >-
      The probe server's `nofinish`: well-formed chunks and a `[DONE]`, but no
      `finish_reason` ever — §6.1.1 experiment 6. 2.24.1 failed it on the first
      request (0.77 s), which is what voided §4.2's "stream-retry loop" hazard;
      **2.26.x retries it for the whole budget** (13 requests over the pinned
      150 s at 2.26.1, exit **2**; 2.26.0: 1), so that hazard is real again on
      these releases and bounded by the pin. The sentence is the `truncated`
      row's, byte for byte, so those two conditions still cannot be told apart
      from stderr and both answer `None`; the `error-envelope` row is no longer
      a third member of that set.
    expect:
      salvage: none
      success: false
      error_contains: ["ended without a finish reason"]
      classify_failure: null

  zero-byte-response:
    stderr: zero-byte-response.stderr.txt
    exit_code: 2
    wall_s: 126.57
    requests: 13
    notes: >-
      `tests/container/failserver.py --mode empty`: the server accepts every
      request and closes writing zero bytes. 2.26.1 retries it for the pinned
      budget, 13 requests, exits **2** (2.26.0: 1), and reports `Error: Server
      disconnected without sending a response.` on stderr — which is why the
      `empty` row above (nothing on either channel) could not be re-captured.
      The sentence matches no `base.CONNECTION_ERROR_MARKERS` member, so the
      classification is `None` and the run falls to the executor's bounded
      transport retry, as the `truncated` row does.
    expect:
      salvage: none
      success: false
      error_contains: ["Server disconnected without sending a response"]
      classify_failure: null

  stall:
    stderr: stall.stderr.txt
    exit_code: 2
    wall_s: 185.43
    requests: 2
    notes: >-
      The probe server's `stall`: accept, never answer, under the pinned
      `VIBE_API_TIMEOUT=90`. Requests at 0 and 91.5 s: 2.26.1 retries a stall
      ONCE whatever budget is left (`_MAX_STALL_RETRIES = 1`, "every attempt
      repeats it, and each one is paid for"), so the chain ends at the second
      attempt's 90 s timeout, 185.4 s, exit **2** (2.26.0 at its 300 s default:
      4 requests, 367 s, exit 1). The diagnosis is no longer EMPTY: 2.26.0 wrote
      `Error: ` and a newline, 8 bytes; 2.26.1 writes `Error: Timed out waiting
      for the model to send its response (ReadTimeout).`, and the shared
      `timed out` marker now classifies it `timeout` (2.26.0's bytes answered
      `None`).
    expect:
      salvage: none
      success: false
      error_contains: ["stderr said: Error: Timed out waiting for the model"]
      classify_failure: "timeout"

  config-error:
    stderr: config-error.stderr.txt
    exit_code: 1
    wall_s: 1.04
    requests: 0
    notes: >-
      2.26.1's spelling of the `stdout-error` row's condition, produced the same
      way (the seeded `[[models]]` entry given `thinking = "bogus"` for this one
      run): `Error: Invalid configuration (1 error(s)):` and the validator's
      line, now on **stderr** with stdout empty and no longer wrapped at 80
      columns, exit 1 (`config_error`), before any request. `parse_output`
      takes the empty-stdout branch and quotes it; the classification is
      `None`, as on stdout.
    expect:
      salvage: none
      success: false
      error_contains:
        - "vibe produced no output on stdout"
        - "Invalid configuration"
      raw_contains: ["models.openai/gpt-5.6-luna.thinking"]
      classify_failure: null

  turn-limit:
    stdout: turn-limit.json
    stderr: turn-limit.stderr.txt
    exit_code: 3
    wall_s: 3.27
    requests: 4
    notes: >-
      The adapter's own `--max-turns 4`, reached: every turn the server answers
      with the review array as text AND a `read_file` call, which the plan agent
      runs (`approvalType: always`; the file is missing, so each call fails), so
      after four requests vibe stops the turn, prints the whole transcript —
      four assistant messages each followed by its `effect` entry, all
      `completed` — and exits **3** with `Stopped: turn_limit` alone on stderr.
      Through the 2.26.0 parser this was a SUCCESS: the last assistant message
      carries the whole array. `parse_output` now refuses any transcript beside
      a `Stopped:` line (`stopped_by_a_limit`); the salvage label is the bytes'
      own, since a failed run can still hold an answer worth salvaging. The
      only paths in it are the container's own `/tmp/work-turn-limit`.
    expect:
      salvage: answer
      success: false
      error_contains: ["vibe stopped before finishing (Stopped: turn_limit)"]
      raw_contains:
        - "Stopped: turn_limit"
        - '"type": "effect"'
      classify_failure: null

  price-limit:
    stdout: price-limit.json
    stderr: price-limit.stderr.txt
    exit_code: 3
    wall_s: 3.03
    requests: 1
    notes: >-
      The adapter's own `--max-price 0.25`, passed by ONE completion: the server
      streams the whole review, `finish_reason: "stop"`, then a usage chunk of
      2,000,000 prompt tokens ($0.40 at the seed's $0.20/M). As at 2.24.1 the
      cap does not cut the call short — the transcript holds the finished answer
      — but 2.26.1 lets a spent budget outrank a turn that ended by itself
      (`_final_outcome` in `vibe/cli/programmatic.py`), so the run reports
      `Stopped: price_limit` and exits **3**. The transcript is byte-shaped
      exactly like `success`; stderr is the only difference, which is why the
      refusal reads stderr.
    expect:
      salvage: answer
      success: false
      error_contains: ["vibe stopped before finishing (Stopped: price_limit)"]
      raw_contains: ["Stopped: price_limit"]
      classify_failure: null

  length:
    stdout: length.json
    stderr: length.stderr.txt
    exit_code: 3
    wall_s: 3.13
    requests: 1
    notes: >-
      A completion cut by the model's own output limit: half the review, then
      `finish_reason: "length"`. vibe does not retry it; it prints the
      transcript with that half-array as a `completed` assistant message and
      exits **3**, `Stopped: length`. The 2.26.0 parser read it as success with
      a ONE-record document (`S001`, salvaged out of the cut array) — the worst
      of the four, because the answer it served was short rather than absent.
    expect:
      salvage: partial
      success: false
      error_contains: ["vibe stopped before finishing (Stopped: length)"]
      raw_contains: ["Stopped: length"]
      classify_failure: null

  terminated:
    stdout: terminated.json
    stderr: terminated.stderr.txt
    exit_code: 3
    wall_s: 10.38
    requests: 1
    notes: >-
      What the harness's own timeout does to vibe: the server sends half the
      review and goes silent, and the driver sends SIGTERM to the wrapper's
      process group at 10.0 s (`kill_tree`'s first signal). vibe handles it —
      exit **3**, not 143 — and prints the transcript with the half-array as a
      `completed` assistant message, then `Stopped: terminated`. The adapter
      sets no `--time-limit`; measured beside it, `--time-limit 10` against the
      same server gives the same bytes with `Stopped: deadline`, exit 3, 11.3 s
      (not committed). `llm_client` and the executor already treat a kill they
      sent as a timeout; the refusal makes the parser agree.
    expect:
      salvage: partial
      success: false
      error_contains: ["vibe stopped before finishing (Stopped: terminated)"]
      raw_contains: ["Stopped: terminated"]
      classify_failure: null

  success-streaming:
    stdout: success-streaming.jsonl
    exit_code: 0
    wall_s: 3.23
    requests: 1
    notes: >-
      `--output streaming`: the SAME entry objects as NDJSON, one per line,
      carrying the `inputEntryId` key like the array form. The shipped adapter
      renders `--output json`, so through `parse_output` these bytes are a
      failure — correctly, since the array parse is the documented contract and
      a line-per-entry stream is not what this argv asks for. The row is here
      for the other half: `VibeProvider.vendor_text` handles this shape too,
      dropping `role: "user"` LINES, so the reduction is not accidentally
      coupled to the array form. The classification is `None` before and after,
      because this capture's echoed prompt is a two-word test prompt rather
      than a plan.
    expect:
      salvage: none
      success: false
      error_contains: ["vibe produced non-JSON output on stdout"]
      raw_contains:
        - '"role": "user"'
        - '"role": "assistant"'
      classify_failure: null

  success-text:
    stdout: success-text.txt
    exit_code: 0
    wall_s: 3.13
    requests: 1
    notes: >-
      `--output text`: three bytes, `OK\n` (byte-identical at 2.24.1, 2.26.0 and
      2.26.1), and no envelope at all — no role, no entry type, no way to tell
      an answer from an error. Committed as the record of why `--output json` is
      what ships, and graded as the failure it is through the shipped adapter
      rather than left as an untested cell.
    expect:
      salvage: none
      success: false
      error_contains: ["vibe produced non-JSON output on stdout"]
      raw_contains: ["OK"]
      classify_failure: null
