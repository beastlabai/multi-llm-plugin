# providers.yaml - Multi-LLM provider configuration (BASE layer)
#
# This is the built-in BASE layer. Config is assembled lowest -> highest:
#   1. this file (base; always present)
#   2. <git-root>/.multi-llm/providers.yaml   (optional per-project override,
#      auto-discovered; deep-merges its FULL contents — including a `providers:`
#      block — over base, identical to the env layer below)
#   3. MULTI_LLM_PROVIDERS_CONFIG=/path.yaml   (optional env escape hatch)
# Each layer is deep-merged over the one below; LIST values replace wholesale.
# Scaffold a per-project override with `--init`. See the README
# "Per-project configuration" section for the full semantics.
#
# Note: Command construction (flags, arguments, subcommands) — and the binary
# name itself — is handled by provider classes in utils/providers/. This config
# only contains:
# - default_timeout: Provider-specific timeout in seconds
# - max_concurrent: Provider-specific concurrency ceiling
# - models: List of supported model names for this provider
#
# `command:` and `supports_json_output:` used to be declared here too. Both had
# ZERO readers (§9.2): every `is_available()` is a hardcoded `shutil.which` on a
# literal binary name, and nothing ever consulted the JSON flag. They are gone
# rather than left as config a user could reasonably expect to take effect. A
# `command:` in ANY layer still merges and is still inert — it can never make
# the tool run a different program (see TestCommandNeverLaunchesBinary).
#
# Version floors and ceilings (M14/§5.4). Every supported build of every CLI is
# decided by ONE gate, in utils/providers/base.py:
# - the FLOOR (`min_version`) and the fixture build (`verified_version`) are
#   declared on the adapter, next to the parser they protect;
# - the CEILING (`max_version_exclusive`) is declared on the adapter too and may
#   be overridden here, per provider, because a vendor can ship a broken build
#   between two releases of this skill and pinning it must not require a code
#   edit. See `providers.opencode.max_version_exclusive` for the worked example.
# Below the floor or at/above the ceiling is a REFUSAL before any child is
# spawned, naming the number; above `verified_version` is a warning and never a
# block, because blocking on new releases would rot faster than the CLIs do.
# The rule that binds all three: a number ships with a comment naming the
# FEATURE it protects — never a bare version. A measured-at version is an upper
# bound on the true floor, so a floor raised to "whatever it was probed on"
# disables installs that work; that is why a flag verified on one recent build
# is gated per flag (the CLI's own --help, read once per process) instead.
#
# Effort convention: most providers accept an optional ":effort" suffix on
# model entries, parsed on the LAST colon against a per-provider whitelist
# (see each provider's comment; unknown suffixes pass through as part of the
# model name). Exceptions: cursor-agent encodes effort in the model name itself;
# gemini is config-file-only. agy is BOTH — its display names carry a tier and
# it also has a real `--effort low|medium|high` flag, so a ":effort" suffix works
# there too.
#
# Those per-provider whitelists are no longer seventeen independent opinions.
# One canonical ladder — none, minimal, low, medium, high, xhigh, max — lives in
# utils/providers/base.py (M12/§6.1), each adapter declares its accepted subset
# against it as EFFORT_LADDER, and its REASONING_EFFORTS is derived from that
# declaration. Two names in this file are per-CLI SPELLINGS of a rung rather
# than rungs of their own: "off" is the "none" rung (goose, pi, vibe) and
# "ultra" is the "max" rung (muse outbound, codex inbound-only). Two more,
# "thinking" and "instant" (kilocode, opencode), are a SECOND AXIS — a mode, not
# an amount — and are passed through without ever being compared to a rung.
# Every adapter that declines an effort mechanism entirely now says so in code,
# with its measured reason, instead of by having no constant.
# tests/test_reasoning_effort_ladder.py checks all of that over the live
# provider registry, so a new adapter cannot slip past it.

providers:
  claude-code:
    default_timeout: 1800
    max_concurrent: 2
    # Model entries may carry an optional ":effort" suffix (e.g. fable:max),
    # translated to "--effort <level>". Valid: low, medium, high, xhigh, max;
    # unsupported levels are silently downgraded by the CLI per model.
    # Without a suffix, the CLI's default effort applies.
    models:
      - sonnet
      - opus
      - fable
      - haiku
    # `--fallback-model <m1,m2>`: automatic fallback when the primary is
    # overloaded (three consecutive 529s) or unavailable (a 404 falls back on
    # the FIRST error — free insurance against a retired model alias above).
    # Only works under `--print`, which is the mode this adapter already uses.
    #
    # DEFAULT OFF, and deliberately so: the flag is proven, but nothing here
    # knows which model should stand in for which, and an implicit list would
    # have multi-llm quietly answering with a model nobody configured. With this
    # map empty the adapter emits no `--fallback-model` at all and the argv is
    # byte-for-byte what it has always been. There is no built-in stand-in and no
    # degrade ladder — the configured list IS the whole source, joined verbatim
    # in your order. A fired fallback is attributed: the result records the
    # `served_model` read from the envelope's `modelUsage`, not the requested one.
    #
    # Validated at load, because the CLI accepts a bad list silently: an entry
    # that repeats, is empty, names a model not listed above, or is its own
    # primary fails the run naming the key.
    #
    #   fallback_models:
    #     sonnet: [haiku]
    #   fallback_models_default: [haiku]   # primaries with no entry above
    fallback_models: {}
    # strip_vendor_keys: auto | always | never   (default: auto)
    #
    # M3/§2.1 — the "money bug". Measured on the wire at claude-code 2.1.233:
    # with a subscription token present, an exported ANTHROPIC_API_KEY swaps the
    # request's `authorization: Bearer ...` for `x-api-key: ...` and drops the
    # subscription beta header entirely — so the run is billed per token and the
    # subscription is not used at all. ANTHROPIC_AUTH_TOKEN overrides it the same
    # way and ANTHROPIC_CUSTOM_HEADERS is a third x-api-key injection path (the
    # CLI matches header names case-insensitively, so the whole variable goes).
    # Those three names are the credential set; they are pinned in the adapter,
    # never read out of the installed bundle at run time.
    #
    #   auto (default) strip only on an affirmative subscription verdict from a
    #        SANITIZED `claude auth status` — run once per process with the
    #        candidate strip set already removed, because run with those
    #        variables still inherited it reports only which credential currently
    #        wins, not whether a usable one survives the strip. Zero network,
    #        ~0.3 s, cached for the process lifetime, and never spawned at all
    #        for a run with no claude-code slot or no vendor credential set.
    #        EVERY other outcome declines: not logged in, a key still reaching
    #        the CLI from a config file or helper, a non-OAuth authMethod, a
    #        non-zero exit, undecodable JSON, a missing binary, a probe timeout.
    #        The gate fails OPEN — an API-key-only user's key is preserved
    #        byte-for-byte and one warning line names the billing consequence —
    #        because failing closed would break every claude-code slot for that
    #        population, which is a strictly worse trade than a per-token bill.
    #   always strip regardless of the verdict, skipping the probe.
    #   never  disable the credential half entirely.
    #
    # ANTHROPIC_BASE_URL is NEVER stripped, and its presence DECLINES the
    # credential strips under `auto`: when the org pays through a gateway the
    # subscription-vs-API-key billing question does not apply, and stripping
    # would authenticate against the public API with credentials meant for the
    # gateway. That is what keeps the README's endpoint recipes working.
    # OPENAI_API_KEY, CLAUDE_CONFIG_DIR and CODEX_HOME are never stripped either.
    strip_vendor_keys: auto
    # vendor_backend: auto | keep | strip   (default: auto)
    #
    # The SECOND, independent gate, over the seven CLAUDE_CODE_USE_* names
    # (BEDROCK, VERTEX, FOUNDRY, ANTHROPIC_AWS, GOOGLE_CLOUD, MANTLE, GATEWAY).
    # An inherited one is worse than a billing bug: CLAUDE_CODE_USE_BEDROCK was
    # measured hanging for 137 s with zero requests and zero output before
    # SIGTERM, blocking on AWS credential resolution. But for a user who really
    # runs claude-code against Bedrock, Vertex or Foundry it IS the configured
    # auth path, so this gate reads DECLARATION, never the probe:
    #
    #   auto (default) strip it iff it arrived by ambient inheritance — i.e. no
    #        backend is named in this provider's own `env:` block below. multi-llm
    #        never sets one itself, so an undeclared one can only have leaked in
    #        from the invoking shell.
    #   keep  never stripped on any lane, in any strip_vendor_keys mode. Its hang
    #         risk is then bounded by the per-slot timeout and the process-group
    #         kill, and that is your own choice.
    #   strip strip regardless of declaration (an escape hatch for determinism).
    #
    # The two tables are independent: a Bedrock user with `vendor_backend: keep`
    # still gets the credential row evaluated normally, and a
    # `strip_vendor_keys: never` user still gets an undeclared backend removed.
    #
    # Declaring a backend is what makes it yours. The seven names above are the
    # validation domain for this block, so the set you may declare and the set
    # the strip reasons about cannot drift apart:
    #
    #   env:
    #     CLAUDE_CODE_USE_BEDROCK: "1"
    vendor_backend: auto

  cursor-agent:
    default_timeout: 1200
    max_concurrent: 2
    # Give each run its own cursor profile — CURSOR_CONFIG_DIR + CURSOR_DATA_DIR
    # pointed at a process-scoped 0700 temp dir, removed at exit.
    #
    #   auto (default) redirect only where cursor's auth rule is VERIFIED not to
    #        follow those two variables. That is Linux today, and it was
    #        measured, not read off the bundle: auth.json is
    #        $XDG_CONFIG_HOME/cursor/auth.json, which neither variable moves, and
    #        a real run against an EMPTY redirected dir exited 0, authenticated
    #        and printed nothing on stderr. Everywhere else `auto` declines and
    #        the snapshot/restore guard below takes over.
    #   on   always redirect, including on a platform nobody has measured. If
    #        cursor resolves auth differently there, `on` presents every cursor
    #        slot as logged out — a disabled provider — whereas `auto` falls back
    #        to exactly the behaviour that shipped before the redirect existed.
    #        That asymmetry is why the default is `auto`: use `on` to opt a
    #        non-Linux host in once YOU have checked it.
    #   off  today's behaviour — cursor writes to YOUR profile
    #
    # The trade-off: `--model` rewrites your global default model in
    # cli-config.json and `--trust` writes a durable .workspace-trusted marker.
    # With the redirect on, neither ever reaches your profile. With it off, a
    # snapshot/restore guard puts them back — but that guard lives in ONE
    # process, so two overlapping multi-llm runs still corrupt your default
    # model permanently (the second run snapshots the first run's value as if it
    # were yours). Turn it off only if you need cursor to see your own profile —
    # a project-scoped rule set, an MCP config — and accept that. Setting
    # CURSOR_CONFIG_DIR or CURSOR_DATA_DIR yourself also suppresses the
    # redirect: a pinned profile is your decision, and it is never written or
    # deleted.
    isolate_profile: "auto"
    # Effort is encoded directly in cursor-agent's own model names (e.g. the
    # -xhigh variants); no ":effort" suffix support needed or implemented.
    models:
      - auto
      - glm-5.2-max
      - gpt-5.5-extra-high
      - gpt-5.6-sol-xhigh
      - gemini-3.1-pro
      - gemini-3.5-flash
      - gemini-3.6-flash-high
      - kimi-k2.7-code
      - kimi-k3-high
      - kimi-k3-max
      - glm-5.2-high
      # Canonical name. The legacy grok-4.5-{medium,high,xhigh} aliases still
      # resolve but are absent from `cursor-agent models`, and ALL of them —
      # xhigh included — land on "Cursor Grok 4.5 High" (verified via the
      # stream-json init event). There is no xhigh grok tier in cursor-agent.
      - cursor-grok-4.5-high
      - claude-sonnet-5-thinking-xhigh
      - claude-opus-4-8-thinking-xhigh
      - claude-fable-5-high
      - composer-2.5

  gemini:
    default_timeout: 1200  # Gemini can be slower
    # No per-run effort control in gemini-cli (no flag, no env var). To control
    # thinking, define a custom alias with a thinkingConfig under
    # modelConfigs.customAliases in ~/.gemini/settings.json (or the project's
    # .gemini/settings.json) and list that alias name here as the model.
    # Gemini 3 models take thinkingLevel LOW/HIGH; 2.5 takes a numeric thinkingBudget.
    # MEASURED 2026-08-19 against generativelanguage.googleapis.com/v1beta with a
    # GEMINI_API_KEY: of the five ids previously listed here, `gemini-3-flash`,
    # `gemini-3-pro` and `gemini-3.1-pro` are ABSENT from the catalog, and
    # `gemini-3-flash` 404s on :generateContent. It was models[0], so a bare
    # `gemini` spec resolved to a model the API-key path cannot serve. The two
    # verified ids lead now; the gemini-3 line is kept, corrected to the names the
    # catalog really publishes, and flagged as unverified on the OAuth/Code Assist
    # path which resolves a different catalog.
    models:
      - gemini-2.5-flash          # verified 200
      - gemini-2.5-pro            # verified in catalog
      - gemini-3-flash-preview    # verified 200 (was: gemini-3-flash, absent)
      - gemini-3.1-pro-preview    # in catalog (was: gemini-3.1-pro, absent)
      - gemini-flash-latest       # moving alias, in catalog

  grok:
    default_timeout: 1200
    # Run "grok models" to see the full list of available models
    # ":effort" suffix (e.g. grok-4.5:low) -> "--reasoning-effort <level>".
    # Valid: none, minimal, low, medium, high, xhigh, max. Per-model support
    # varies: grok-4.5 supports high/medium/low; grok-composer-2.5-fast has none.
    models:
      - grok-4.5:high
      - grok-composer-2.5-fast

  opencode:
    default_timeout: 1200
    # max_version_exclusive: the first opencode build multi-llm REFUSES to run,
    # exclusive — the ceiling half of the one version gate (see the "Version
    # floors and ceilings" note at the top of this file). Ships EMPTY, which
    # means "no ceiling", and the empty string is the shipped value rather than a
    # commented-out line so the key is discoverable without reading code.
    #
    # Why this adapter is where the key is written out: opencode is the one CLI
    # whose npm `latest` has been a prerelease beta, i.e. the one where "newest"
    # and "supported" measurably come apart. If such a build breaks the event
    # stream `parse_output` reads, pin it here — e.g. `max_version_exclusive:
    # "2.0.0"` — and every slot on that build is refused before it spawns,
    # naming the number. The rule that comes with it: write the FEATURE (or the
    # breakage) in a comment beside the number, never the number alone. A
    # ceiling with no reason is unremovable, because nobody can tell what would
    # retire it.
    #
    # This is deliberately NOT `verified_version` (the adapter's own
    # declaration, which only warns that parsing is best-effort above the build
    # the fixtures came from). A ceiling is a refusal and only ever belongs to a
    # build measured to be broken.
    max_version_exclusive: ""
    # hermetic: on | auto | off  (default: on)
    #
    # `on`/`auto` run opencode under an empty, run-scoped XDG_CONFIG_HOME plus
    # `--pure`, so YOUR ~/.config/opencode/opencode.json cannot silently change
    # the model, agent or permission set a multi-llm dispatch uses. XDG_DATA_HOME
    # is kept, so stored auth (auth.json) and `opencode auth list` are unaffected,
    # and XDG_CACHE_HOME is kept so the model catalog is not re-fetched cold.
    # Applies to fan-out/`ask` and `agent-readonly` slots; `agent-write` keeps
    # today's inherited config until the write-slot gates are green.
    #
    # Known cost: the empty config home is inherited by everything opencode
    # launches, so an MCP server that reads its own XDG config sees it too.
    # `off` restores today's inheritance for the user that bites.
    # Quoted on purpose: YAML 1.1 resolves a bare `on`/`off` to a boolean.
    hermetic: "on"
    # config_providers: a verbatim opencode `provider` map, CREDENTIALS EXCLUDED
    # (those stay in auth.json). A hermetic run cannot see a provider that exists
    # only in your own opencode config, so declare one here to keep using it —
    # a slot naming such a provider is refused before spawn rather than
    # dispatched into a silent model-resolution failure. Built-in providers need
    # nothing here.
    #
    # config_providers:
    #   my-gateway:
    #     options:
    #       baseURL: https://gateway.example.com/v1
    #     models:
    #       my-model: {}
    #
    # Run "opencode models" to see the full list of available models
    # ":effort" suffix (e.g. openai/gpt-5.5:high) -> "run --variant <name>".
    # Variant names are provider-specific (OpenAI: none/minimal/low/medium/high/xhigh;
    # Anthropic: high/max); unknown variants are resolved/ignored server-side.
    models:
      - opencode/big-pickle
      - opencode/sonnet
      - opencode/deepseek-v4-flash-free
      - opencode/hy3-free
      - opencode/nemotron-3-ultra-free
      - google/gemini-3.1-pro-preview
      - openai/gpt-5.5
      # openrouter/* needs a stored credential: opencode auth login
      # --provider openrouter --method api. Without it opencode lists no
      # openrouter models at all and the name fails to resolve.
      # NO ":effort" suffix on this one. It advertises low/high/max variants,
      # but on opencode 1.18.12 every --variant run hangs indefinitely without
      # writing a byte to either stream or reaching session creation — it burns
      # the full timeout instead. Plain (no suffix) answers in ~3s.
      - openrouter/deepseek/deepseek-v4-flash-0731

  codex:
    default_timeout: 1800
    # strip_vendor_keys defaults to `never` here and is deliberately NOT set.
    # codex has no zero-network verdict — `codex login status` false-negatives
    # for a CODEX_API_KEY-only user and `codex doctor --json` is advisory — so
    # claude-code's sanitized preflight cannot be transferred, and `auto`
    # therefore behaves as `never` for every adapter without a verdict of its
    # own. The breakage an `always` here would accept, with its signature: a
    # CODEX_API_KEY-only user (no usable $CODEX_HOME/auth.json) has no credential
    # left after the strip, and codex does NOT fail fast — measured, it issues
    # the request with no Authorization header at all, so the turn dies at the
    # server mid-stream rather than as a 0.35 s local "Not logged in". Only a
    # measured zero-network codex probe could raise this default; none exists.
    # OPENAI_API_KEY is never stripped on any path: it is measured not consulted
    # by codex at all, and stripping it breaks configs declaring
    # `env_key = "OPENAI_API_KEY"` for a custom provider.
    # Model entries may carry an optional ":effort" suffix (e.g. gpt-5.5:high),
    # translated by the codex adapter to "-c model_reasoning_effort=<effort>".
    # Valid efforts: none, minimal, low, medium, high, xhigh, max — plus "ultra",
    # which is accepted and rewritten to "max" before argv is built. `max` is
    # advertised per model by `codex debug models` (supported_reasoning_levels)
    # for gpt-5.6-sol/-terra/-luna; none/minimal are taken on the wire but
    # advertised by no catalog entry, so pass one only when you mean it.
    # Without a suffix, codex uses the default from the user's ~/.codex/config.toml
    models:
      - gpt-5.5
      - gpt-5.5:high
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-5.6-sol:xhigh

  kilocode:
    default_timeout: 1200
    # Run "kilocode models" to see the full list of available models
    # Model names use 3-part format: backend/provider/model
    # ":variant" suffix -> "run --variant <name>". Variant names are MODEL-specific
    # and drift, so there is no per-family rule to memorise — 201 of 351 openrouter
    # models publish a `variants` list and each one is its own. Measured 2026-08-16
    # on kilocode 7.4.19: glm-5.2 high/xhigh; minimax-m3 and kimi-k2.7-code
    # instant/thinking; kimi-k3 low/high/max; nemotron-3-ultra medium/high;
    # mimo-v2.5-pro low/medium/high; qwen3.8-max minimal/low/medium/high/xhigh;
    # qwen3.7-max high/max; hy3 none/low/high; step-3.7-flash low/medium/high.
    # Discover with "kilocode models <backend> --verbose" (credential-free); the
    # capture backing these rows is tests/fixtures/kilocode/model_variants.json.
    # GOTCHA: an invalid/unsupported variant is SILENTLY ignored. Whitelisted
    # suffixes: none, minimal, low, medium, high, xhigh, max, thinking, instant;
    # anything else (e.g. ":free" model ids) passes through as part of the model name.
    max_concurrent: 2
    models:
      - openrouter/moonshotai/kimi-k2.7-code
      - openrouter/moonshotai/kimi-k3:max          # was :thinking (publishes low, high, max)
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b
      - openrouter/z-ai/glm-5.2:xhigh
      - kilo/z-ai/glm-5.2
      - openrouter/minimax/minimax-m2.7
      - openrouter/minimax/minimax-m3:thinking     # was :xhigh (publishes instant, thinking)
      - openrouter/x-ai/grok-4.20-multi-agent
      - openrouter/arcee-ai/trinity-large-thinking
      - openrouter/xiaomi/mimo-v2.5-pro
      - openrouter/qwen/qwen3.7-max:max            # was :xhigh (publishes high, max)
      - openrouter/qwen/qwen3.8-max:xhigh
      - openrouter/tencent/hy3:high                # was :xhigh (publishes low, high, none)
      - openrouter/stepfun/step-3.7-flash:high     # was :xhigh (publishes low, medium, high)
      - openrouter/openai/gpt-5.5-pro
      - openai/gpt-5.5-pro
      - openrouter/nex-agi/nex-n2-pro
      - openrouter/inclusionai/ring-2.6-1t
      - openrouter/google/gemini-3.5-flash
      - google/gemini-3.1-pro-preview
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/anthropic/claude-sonnet-5
      - openrouter/anthropic/claude-fable-5

  cline:
    default_timeout: 1200
    # Model names use the format <cline-provider>/<model-id>, e.g.
    # openrouter/z-ai/glm-5.2 — the segment before the first "/" is the cline
    # backend provider (-P), the rest is the model id (-m).
    # -m mutates the saved default in ~/.cline, so cap concurrency.
    # ":effort" suffix -> "--thinking <level>". Valid: none, low, medium, high,
    # xhigh; the CLI hard-errors (exit 1) on invalid levels. Unlike -m,
    # --thinking does NOT mutate the saved default in ~/.cline.
    # Note: xhigh may be downgraded to high on some provider paths inside cline.
    max_concurrent: 2
    models:
      - openrouter/z-ai/glm-5.2
      - openrouter/moonshotai/kimi-k2.7-code
      - openrouter/openai/gpt-5.5

  goose:
    default_timeout: 1200
    # Model names use the format <goose-provider>/<model-id>, e.g.
    # openrouter/z-ai/glm-5.2 — the segment before the first "/" is the goose
    # backend provider (--provider), the rest is the model id (--model).
    # Auth is env-only: the openrouter backend needs OPENROUTER_API_KEY in
    # the environment.
    # ":effort" suffix -> exported as GOOSE_THINKING_EFFORT env var for the
    # subprocess (goose has no CLI flag). Valid: off, none, low, medium, high,
    # max, xhigh. GOTCHA: goose SILENTLY ignores it for openrouter models it
    # doesn't classify as reasoning-capable, and silently ignores invalid values.
    models:
      - openrouter/z-ai/glm-5.2
      - openrouter/moonshotai/kimi-k2.7-code
      - openrouter/openai/gpt-5.5

  aider:
    default_timeout: 1200
    # Model names are litellm model specs passed VERBATIM to --model, e.g.
    # openrouter/z-ai/glm-5.2 (no provider/model splitting).
    # Auth is env-only: openrouter/ models need OPENROUTER_API_KEY in the
    # environment.
    # ":effort" suffix -> "--reasoning-effort <value>". Whitelist: none, minimal,
    # low, medium, high, xhigh. Aider passes the value through unvalidated:
    # openrouter/ models always accept it (sent as OpenRouter's reasoning.effort),
    # other models warn-and-ignore.
    models:
      - openrouter/z-ai/glm-5.2
      - openrouter/moonshotai/kimi-k2.7-code
      - openrouter/openai/gpt-5.5

  agy:
    # This is now the ONLY number. agy's `--print-timeout` (its internal
    # print-mode cutoff) is derived from whatever timeout resolves for a run —
    # this value, unless overridden — minus a 30s shutdown margin, so agy
    # reaches its own cutoff and writes its ERROR envelope before the harness's
    # deadline fires. It used to be a hardcoded `20m` in the adapter, which made
    # raising this key above 1200 a silent no-op and lowering it a race.
    default_timeout: 1200
    # Model names are the exact DISPLAY NAMES from `agy models` (spaces and
    # parentheses included), so keep these matching `agy models` exactly.
    # An unknown name is rejected outright: agy returns an ERROR envelope
    # ("model ... is not recognized") listing the valid names (verified
    # 2026-07-29; older builds silently fell back to the default model).
    # Auth is Google OAuth only: requires a one-time `agy` sign-in
    # (persisted in ~/.gemini/antigravity-cli/); no API keys involved.
    # Effort appears twice, on two different axes. The display name carries the
    # model's own tier ("(High)", "(Low)"), and `agy --effort low|medium|high`
    # is a REAL flag on top of it (read from `agy --help`, agy 1.1.13) — this
    # file used to deny that flag existed, so a configured effort was refused by
    # our own whitelist. Entries may therefore carry a ":effort" suffix, e.g.
    # "Gemini 3.1 Pro (High):high"; valid levels are low, medium, high ONLY, and
    # anything else stays part of the model name (agy then rejects it out loud).
    models:
      - "Gemini 3.6 Flash (High)"
      - "Gemini 3.6 Flash (Medium)"
      - "Gemini 3.6 Flash (Low)"
      - "Gemini 3.5 Flash (Medium)"
      - "Gemini 3.5 Flash (High)"
      - "Gemini 3.5 Flash (Low)"
      - "Gemini 3.1 Pro (Low)"
      - "Gemini 3.1 Pro (High)"
      - "Claude Sonnet 4.6 (Thinking)"
      - "Claude Opus 4.6 (Thinking)"
      - "GPT-OSS 120B (Medium)"

  muse:
    default_timeout: 1800
    # Meta's Muse Code harness. Auth is a stored provider credential
    # (`muse login` / `muse auth set`), not an env var.
    # ":effort" suffix (e.g. muse-spark-1.2:xhigh) -> "--reasoning-effort <level>".
    # Valid: none, minimal, low, medium, high, xhigh, ultra. GOTCHA: muse
    # hard-errors on any other value, so an unknown suffix stays part of the
    # model name and fails model resolution instead. WITHOUT a suffix muse does
    # not apply the default from --help; it reads reasoning_effort from
    # ~/.config/muse/settings.json.
    # Timeout is generous on purpose: muse retries a failing provider call up
    # to 10 times with exponential backoff (a 429 alone waits 60s), so an
    # unfunded account burns minutes before reporting the 402.
    models:
      - muse-spark-1.2
      - muse-spark-1.2:xhigh

  pi:
    default_timeout: 1200
    # Model names are pi model patterns passed VERBATIM to --model; pi resolves
    # "provider/id" forms itself (e.g. openrouter/z-ai/glm-5.2). Run
    # "pi --list-models" to see the full list.
    # Auth: provider API-key env vars (OPENROUTER_API_KEY, ANTHROPIC_API_KEY, ...)
    # inherited by the subprocess, or keys stored via pi's /login.
    # ":effort" suffix -> "--thinking <level>". Valid: off, minimal, low, medium,
    # high, xhigh, max. The suffix is stripped before --model, so pi's own
    # native ":level" model-suffix parsing never sees it; unknown suffixes
    # (e.g. ":free" ids, bedrock "...-v1:0") stay part of the model name.
    models:
      - openrouter/z-ai/glm-5.2
      - openrouter/moonshotai/kimi-k2.7-code
      - openrouter/openai/gpt-5.5

  kimi:
    default_timeout: 1200
    max_concurrent: 2
    # Kimi Code (Moonshot), binary `kimi`. Measured against 0.36.1 in the §6
    # container probe of plans/harness-expansion.md.
    #
    # OpenRouter slugs — BYOK generic backend. A Kimi Code subscription is a
    # DIFFERENT catalog and these entries do not transfer to it.
    #
    # The slug travels in `KIMI_MODEL_NAME`, never in argv: the KIMI_MODEL_*
    # family synthesizes a model under the fixed literal id `__kimi_env_model__`,
    # so `kimi -m <slug>` fails with `Model "<slug>" is not configured in
    # config.toml`. The adapter emits no `-m` at all.
    #
    # No ":effort" suffix — a third ":"-segment is part of the model id.
    # KIMI_MODEL_THINKING_EFFORT exists as a name but is inert on the wire at
    # 0.36.1 (byte-identical request body with and without it).
    #
    # argv-only — a large prompt exceeds the Windows command-line cap and is
    # refused before spawn. Measured: kimi reads no stdin (`-p -` delivers the
    # literal "-"), expands no `@file`, and has no `--prompt-file`.
    #
    # TELEMETRY, MEASURED AND UNFIXABLE FROM HERE: at 0.36.1 kimi resolves
    # `telemetry-logs.kimi.com` on every run **even with KIMI_DISABLE_TELEMETRY=1**,
    # which the adapter does set. Reproduced offline three ways (opt-out set,
    # opt-out unset, and with KIMI_DISABLE_CRON=1): two DNS queries every time,
    # identical in all three. The value is not the problem -- "1" is in the CLI's
    # own true-value set and its `isTelemetryDisabledByEnv` gate reads it -- the
    # connection attempt simply is not gated. In the container the egress
    # allowlist refuses it and nothing leaves; on YOUR machine there is no such
    # allowlist, so the request goes out. Re-check on the next version bump.
    # MODEL CHOICE, 2026-08-19. Kimi K3 was requested "on low reasoning"; that
    # qualifier is NOT expressible through this adapter, so K3 was not taken.
    # Two measured reasons, both already recorded above: there is no ":effort"
    # suffix (a third ":"-segment is part of the model id, so `kimi-k3:low` would
    # travel to OpenRouter verbatim as an unknown model), and
    # KIMI_MODEL_THINKING_EFFORT is inert on the wire at 0.36.1 (byte-identical
    # request body with and without it). OpenRouter exposes `reasoning_effort` as
    # a request parameter, but the kimi CLI never sends one. K3 would therefore
    # have run at default reasoning for $3.00/M in and $15.00/M out -- 5x and 6x
    # this row's previous cost, on the token side that reasoning inflates.
    # `kimi-k2.5` is the chosen alternative: newer than kimi-k2-thinking and
    # CHEAPER than it too ($0.45/M in, $2.25/M out against $0.60/$2.50).
    models:
      - moonshotai/kimi-k2.5

  qwen-code:
    default_timeout: 1200
    max_concurrent: 2
    # Qwen Code, binary `qwen` (provider key `qwen-code` -- the key names the
    # HARNESS, not the model family, the same split as claude-code/claude).
    # Measured against 0.21.13 in the §6 container probe of
    # plans/harness-expansion.md.
    #
    # OpenRouter slugs -- BYOK generic backend, via the OPENAI_BASE_URL /
    # OPENAI_API_KEY / OPENAI_MODEL trio. A Qwen first-party plan (OAuth or
    # DashScope) is a DIFFERENT catalog and these entries do not transfer to it.
    #
    # EXITS 0 ON BACKEND FAILURE -- the defect that shapes the adapter. 401, 404,
    # 400-overflow and 500 alike all produce rc=0, `subtype: "success"`,
    # `is_error: false`, EMPTY STDERR, and an answer of "[API Error: <upstream
    # text>]". The adapter declares that marker as an exit-zero failure marker and
    # classifies before it unwraps; without both, a fan-out slot would report the
    # error string as the model's answer.
    #
    # No ":effort" suffix -- a third ":"-segment is part of the model id. There is
    # no effort/thinking/reasoning option anywhere in the full help, and a stray
    # suffix was measured passing through to the backend VERBATIM, where it
    # becomes a "model not found" with nothing pointing at the suffix.
    #
    # Structured output IS supported: `--json-schema <json literal>`, the same
    # spelling and inline transport as claude-code, measured constraining the
    # output and failing closed on plain text.
    #
    # `--max-wall-time` is derived from the slot timeout and held 30 s under it.
    # That is load-bearing rather than tidy: only qwen's 5xx retry path
    # self-terminates -- a 429 backend was still retrying past 180 s and a stalled
    # one retries a ~120 s client timeout indefinitely.
    #
    # NOISIER THAN THE OTHER PROVIDERS, MEASURED AND DELIBERATE. The adapter
    # ships `--max-tool-calls 0`, which aborts the run BEFORE a tool executes.
    # Against the real backend, 4 of 14 live runs (~29%) on a trivial prompt
    # ended that way -- `FatalBudgetExceededError: tool-call budget of 0
    # exceeded` -- because a real model sometimes chooses to call a tool where
    # the offline stub never does. The retry ladder normally absorbs it (the
    # abort is transport-shaped), at the cost of a second call.
    #
    # That 29% is the reason the flag STAYS. It is direct evidence that the model
    # wants to call tools on ordinary prompts, so without the cap those calls
    # would execute in YOUR checkout -- from a provider that only ever parses the
    # output as an answer. A structured-output dispatch (`--json-schema`) is
    # quieter: the synthetic tool is exempt from the cap.
    models:
      # MODEL CHOICE, 2026-08-19: the cheap member of the same family, moved off
      # `qwen/qwen3.8-max`. $0.45/M in, $3.20/M out against max's $2.00/$6.00 --
      # 4.4x cheaper on input. This also directly relieves the recorded live-lane
      # failure: qwen-code took OpenRouter 402 "requested up to 64000 tokens, but
      # can only afford 43729", which is a max_tokens-vs-balance check, and a
      # cheaper slug raises the affordable ceiling for the same credit.
      - qwen/qwen3.8-27b

  copilot:
    default_timeout: 1200
    max_concurrent: 2
    # GitHub Copilot CLI, binary `copilot`. Measured against 1.0.80 in the §6
    # container probe of plans/harness-expansion.md.
    #
    # OpenRouter slugs -- BYOK generic backend, via COPILOT_PROVIDER_BASE_URL
    # (the ACTIVATION SWITCH) + _TYPE + _API_KEY. NO GITHUB ACCOUNT IS NEEDED:
    # the vendor's own docs say "GitHub authentication is not required" in this
    # mode. A Copilot SEAT is a DIFFERENT catalog -- the built-in
    # `auto`/`claude-*`/`gpt-5.x`/`gemini-3.x` model list belongs to that path
    # and is consulted only for token limits, so none of it transfers here and
    # none of it belongs in this list.
    #
    # NON-REASONING SLUGS ONLY. A model whose OpenRouter stream carries
    # `reasoning_content` deltas breaks copilot's completions parser
    # (copilot-cli#4196). Both entries below were chosen off OpenRouter's own
    # `supported_parameters` (neither advertises `reasoning`/`reasoning_effort`)
    # and both were run on the live smoke. `COPILOT_PROVIDER_WIRE_API=responses`
    # is the proven fallback if a future slug needs it -- measured working
    # against the committed stub -- but it is not set today.
    #
    # Model entries may carry an optional ":effort" suffix, split on the LAST
    # colon.  Valid: none, minimal, low, medium, high, xhigh, max
    # (all seven accepted at 1.0.80; which ones a given backend honours is
    # server-side and model-dependent).
    #
    # TOOL TIER 1, AND THE HELP TEXT IS WRONG. `--allow-all-tools` is documented
    # as "required for non-interactive mode"; measured, it is not. All four §6.5
    # rungs produced byte-identical output with a clean filesystem canary, so the
    # adapter emits NO permission flag and no `--add-dir` at all. The env twin
    # `COPILOT_ALLOW_ALL` is stripped, because it would widen the tier with no
    # argv change and make the recorded tier unenforceable.
    #
    # EXITS 0 ON ONE FAILURE SHAPE: an empty provider 200 gives exit 0,
    # `result.exitCode: 0` and an empty assistant message with no error record.
    # There is no text for a marker to match, so the adapter detects it
    # structurally in parse_output instead.
    # MODEL CHOICE, 2026-08-19: moved off the dated `openai/gpt-4.1-mini`.
    # `openai/gpt-5.6-luna` is newer AND cheaper -- $0.20/M in, $1.20/M out
    # against gpt-4.1-mini's $0.40/$1.60 (OpenRouter catalog, same day).
    #
    # ONE RISK, RECORDED RATHER THAN DISCOVERED LATER: gpt-4.1-mini was chosen
    # partly for being a NON-REASONING slug, because a stream carrying
    # `reasoning_content` deltas breaks copilot's completions parser
    # (copilot-cli#4196). Luna advertises `reasoning`/`reasoning_effort` where
    # gpt-4.1-mini advertised no reasoning parameters at all, so whether it emits
    # those deltas unprompted is the open question. The credentialed live lane is
    # exactly the instrument for it: a2/a3 fail loudly if the parser breaks.
    models:
      - openai/gpt-5.6-luna
      - openai/gpt-4.1-mini
      - openai/gpt-4o-mini

  vibe:
    default_timeout: 1200
    max_concurrent: 2
    # Mistral Vibe, binary `vibe` (PyPI package `mistral-vibe`). Measured against
    # 2.24.1 in the §6 container probe of plans/harness-expansion.md.
    #
    # ENTRIES HERE ARE SEED ALIASES, NOT SLUGS -- vibe is the one adapter in this
    # roster whose model surface is neither a flag nor a raw wire name. Each
    # entry names a `[[models]]` alias defined in the committed seed
    # (tests/container/home_seed/vibe/.vibe/config.toml on the container lanes,
    # $VIBE_HOME/config.toml on a host), whose own `name` field is the OpenRouter
    # slug that reaches the wire. The adapter carries the alias in
    # VIBE_ACTIVE_MODEL, because vibe has NO --model flag at all.
    #
    # OpenRouter slugs -- BYOK generic backend, via the seed's `[[providers]]`
    # entry (`backend = "generic"`, `api_style = "openai"`, `api_base`, and
    # `api_key_env_var` naming OPENROUTER_API_KEY). A Mistral API key is a
    # DIFFERENT catalog and none of this transfers to it; MISTRAL_API_KEY is
    # stripped so a stale one cannot select the vendor backend underneath.
    #
    # ADDING AN ENTRY IS A TWO-FILE CHANGE. An alias listed here with no
    # `[[models]]` entry behind it is selectable in the picker and fails at
    # dispatch; on the container lane the alias must also equal the redirect row's
    # `model_arg` byte-for-byte, or test_the_stub_saw_only_this_row_s_model fails.
    #
    # Model entries may carry an optional ":effort" suffix, split on the LAST
    # colon.  Valid: off, low, medium, high, max
    # (the accepted set of the `thinking` config key, read off the installed
    # validator at 2.24.1). It rides VIBE_THINKING rather than argv -- vibe has no
    # effort flag either -- but the suffix is still split here, because an alias
    # with `:high` glued on selects no configured model.
    #
    # TOOL TIER: `--agent plan`, AND THE BARE INVOCATION IS NOT THE FLOOR.
    # vibe's `default_agent` is `accept-edits`, whose AgentSafety is DESTRUCTIVE
    # and whose write_file/edit permission is `always` -- so a bare `vibe -p ...`
    # is the second-WIDEST rung, not tier 1. The adapter always emits
    # `--agent plan` (SAFE, read-only), which completed a realistic review prompt
    # with a clean filesystem canary, and pins VIBE_DEFAULT_AGENT to match so an
    # argv change cannot silently fall back. Never --auto-approve/--yolo.
    #
    # SPEND: `--max-price 0.25` is the roster's only USD cap, but it is checked
    # BETWEEN turns -- a single completion runs to completion regardless -- so
    # `--max-turns 4` is the bound that actually stops a runaway.
    # MODEL CHOICE, 2026-08-19: same move as copilot -- newer and cheaper.
    # THIS VALUE IS BYTE-COUPLED TO TWO OTHERS: the redirect row's `model_arg`
    # and the seed's `[[models]] alias`. vibe is the one adapter whose model
    # surface is an indirection, so all three must be changed together.
    models:
      - openai/gpt-5.6-luna


# Default provider when model name doesn't include provider prefix
default_provider: cursor-agent

# ---------------------------------------------------------------------------
# read_only_modes: each CLI's OWN read-only mechanism, as data (M15 / §3.5)
# ---------------------------------------------------------------------------
# THIS BLOCK EXECUTES NOTHING. It is a record, not a knob — no adapter, no
# orchestrator and no spawn site reads it, and argv stays where AGENTS.md puts
# it, in the provider classes under utils/providers/. Its only readers are
# tests/test_read_only_modes.py and a human. It lives here because what it
# records is per-CLI catalog data of the same kind as `models:`, and because
# the prose it replaces (the `vibe:` comment above, and the same fact scattered
# through a dozen adapter docstrings) is not something a test can hold anyone to.
#
# ONE ROW PER REGISTERED ADAPTER, and the row set is checked against
# utils/provider_registry._PROVIDERS rather than against a list of names written
# here: a new adapter is missing its row on the day it is registered, not on the
# day somebody remembers this file. Nothing in the test names an adapter or a
# count.
#
# `mechanism:` is the runner's own read-only mechanism — an ask/plan mode, a
# read-only sandbox, a deny-all tool list — as the exact argv tokens it renders,
# or `null`. A row is non-null ONLY where it was measured, `probed:` carries
# that measurement's provenance, and the two move together in both directions.
#
# AN UNPROBED ROW IS `null`, NEVER A GUESS. Not from the adapter's flags, not
# from its help text, not from its name. Three rows are measured; every other
# row is `null` and the `null` rows ARE the probe queue. Two of them have an
# obvious-looking candidate — opencode and vibe both already pass `--agent plan`
# — and that is exactly the inference this rule refuses: a candidate is not a
# measurement, and §3.5's three positives are the three that were exercised. A
# row moves to non-null only with its own probe transcript, on §13.1's method.
#
# `bypass_exception:` is §3.5's named-exception disposition, and it is the only
# thing that keeps the negative-set guard green over an adapter still emitting a
# `--yolo`-class token from `build_command`/`get_env`. It is deliberately
# uncomfortable to write: it names the token, the profile it is emitted on, why
# it is still there, and what retires it. "It was already there" is not a
# disposition. The guard is red for any such token NOT declared here, and
# equally red for a declaration whose token is no longer emitted, so an
# exception cannot outlive the flag it excuses.
#
# The guard reads the BASE layer only (provider_registry.load_base_config), so
# no per-project `.multi-llm/providers.yaml` and no MULTI_LLM_PROVIDERS_CONFIG
# can add an exception, retire a row or silence the scan.
read_only_modes:
  agy:
    mechanism: null
    probed: null
    bypass_exception:
      token: "--dangerously-skip-permissions"
      profile: generate
      reason: >-
        agy 1.1.15's only known unattended mode, emitted by this adapter's
        build_command since it was written. §3.5 names it a defect of the same
        class as cursor's `-f` and gives it exactly two dispositions: replace it
        with agy's own read-only mechanism, PROBED FIRST, or record an explicit
        `null` row plus this named exception. The first needs a probe that does
        not exist — `agy --help` was captured 2026-08-19 into
        tests/container/cli-surface.yaml for the flags we already emit, and
        nothing has ever measured what a headless `agy -p` does without this
        one. Dropping it on the assumption that a read/analyze prompt needs no
        tool approval is the guess this table exists to refuse, and it would
        turn every agy slot into an unexplained timeout if the assumption were
        wrong. So it is written down instead of waved through.
      retires_when: >-
        agy's read-only mode is probed and lands in `mechanism:` above, or a
        probe shows the flag is unnecessary for a `/generate` read/analyze
        prompt. Either way the token leaves build_command and this entry is
        deleted with it — the guard fails on a stale exception, so the two
        cannot drift apart.
  aider:
    mechanism: null
    probed: null
    bypass_exception:
      token: "--yes-always"
      profile: generate
      reason: >-
        Found by this guard, not by the plan. §3.5 names two live violations
        (cursor's `-f`, agy's `--dangerously-skip-permissions`) and misses this
        third one, even though `--yes-always` is in its own negative set and the
        donor table it rejected proposed exactly this flag. It is real:
        utils/providers/aider.py's build_command emits it on the `generate`
        fan-out. It is also narrower than it reads — the prompt is prefixed
        `/ask `, aider's read-only chat mode (adjudicated in
        tests/test_provider_housekeeping.py's STOPS_FILE_WRITES), and the flag's
        live job there is to suppress interactive prompts and to auto-add the
        in-repo files the model asks to read. Narrower is not exempt, so it is
        recorded rather than excluded by hand.
      retires_when: >-
        aider's own read-only mechanism is probed — whether `/ask ` plus
        `--no-auto-commits` already IS one, or a flag replaces `--yes-always` —
        and whoever takes that probe is scoped to edit utils/providers/aider.py,
        which M15's file scope was not.
  claude-code:
    # `--allowed-tools` / `--disallowed-tools`, the deny-all tool list.
    mechanism: ["--allowed-tools", "--disallowed-tools"]
    probed: >-
      In-repo and enforced, which is why §3.5 counts it among the three
      positives: build_agent_command's agent-readonly leg renders both flags,
      AGENTS.md names it as this adapter's own denial mechanism, and
      tests/test_providers.py cross-checks the declaration against the
      implementation in both directions.
  cline:
    mechanism: null
    probed: null
  codex:
    # `--sandbox read-only`, the sandbox value rewritten in place for the
    # agent-readonly profile.
    mechanism: ["--sandbox", "read-only"]
    probed: >-
      2026-08-16, harness-invocation-improvements.md §3.3. Live at
      utils/providers/codex.py's agent-readonly leg.
  copilot:
    mechanism: null
    probed: null
  cursor-agent:
    # `--mode ask`. `--trust` rides beside it in build_command and is NOT part
    # of the mechanism: it satisfies a workspace-trust launch gate and grants
    # nothing (CURSOR_REQUIRED_FLAGS explains why the pair is one change).
    mechanism: ["--mode", "ask"]
    probed: >-
      2026-08-16, harness-invocation-improvements.md §3.1 — measured REFUSING
      writes ("I'm in Ask mode, so I can't create or edit files"), re-confirmed
      2026-08-18 over three identical runs. Q12 separately confirmed it keeps
      its read tools (Grep/Read tool_use entries in the same transcript): a
      positive row means read-ONLY, not read-LESS.
  gemini:
    # Not a `null`-by-oversight: gemini ships no write_file tool at all under
    # this adapter's argv (MEASURED 2026-08-19, tests/test_provider_housekeeping
    # NO_WRITE_TOOL_AT_ALL). That is an absent capability, not a read-only MODE
    # the adapter selects, and it fails OPEN — gemini exits 0 reporting a write
    # that never happened. It is therefore not a mechanism this table may claim.
    mechanism: null
    probed: null
  goose:
    mechanism: null
    probed: null
  grok:
    mechanism: null
    probed: null
  kilocode:
    mechanism: null
    probed: null
  kimi:
    mechanism: null
    probed: null
  muse:
    mechanism: null
    probed: null
  opencode:
    # CANDIDATE, DELIBERATELY NOT WRITTEN AS A VALUE: `--agent plan` is already
    # this adapter's agent-readonly leg and AGENTS.md names it. No probe on
    # §13.1's method has ever exercised it as a read-only MODE, and §3.5's three
    # positives are the three that were. Probe it and this row moves.
    mechanism: null
    probed: null
  pi:
    mechanism: null
    probed: null
  qwen-code:
    # CANDIDATE, same treatment: `--max-tool-calls 0` is a zero tool budget
    # adjudicated in STOPS_FILE_WRITES for the file-output question. Whether a
    # zero budget is a read-only mode or an abort is exactly what a probe would
    # settle (it exits 55 with zero stdout), so the row stays null.
    mechanism: null
    probed: null
  vibe:
    # CANDIDATE, same treatment: `--agent plan` plus VIBE_DEFAULT_AGENT=plan.
    mechanism: null
    probed: null

# ---------------------------------------------------------------------------
# driver: how --exec-subagents dispatches materialized subagent prompts (D3)
# ---------------------------------------------------------------------------
# Only consulted when the Python executor is the invoker (`--exec-subagents`,
# or a host whose capability entry has no native subagent tool). A host with
# native subagents (Claude Code, Cursor) never reads these on a default run —
# the key configures the *executor's* runner, not the session's model.
#
# Merge semantics are the ordinary three-layer chain: this base block is always
# present and fully populated, an override layer merges key-by-key (so setting
# `subagent_runner` alone inherits the rest), a blank value (`subagent_runner:`
# → YAML None) is SKIPPED and keeps the base value, and unknown keys under
# `driver:` are rejected at load time so a typo is never silently a no-op.
# Leaving `subagent_runner` unset in a repo shared by several hosts is the
# healthy arrangement: each host then resolves its own CLI.
driver:
  # Any provider:model spec with an implemented adapter. Validated at load time
  # (parseable spec, known adapter, declares the profile the phase needs).
  subagent_runner: claude-code:sonnet
  # Used for tasks whose materialized `capability_tier` is `cheap`; falls back
  # to `subagent_runner` when unset.
  subagent_runner_cheap: claude-code:haiku
  # User preference, not the effective limit: the executor takes the minimum of
  # this, the runner provider's own `max_concurrent` above, and the host's
  # documented ceiling.
  max_concurrent_subagents: 4
  # WRITE phases (apply-*, implement) get their own ceiling and it defaults to 1:
  # the batchers partition by artifact (one plan file per apply batch, one source
  # file per code-fix batch), so the read path's fan-out would be two agents
  # editing one file. Raising this only PERMITS parallelism — the batch must also
  # declare `can_parallelize`, the declared file sets must be pairwise disjoint at
  # dispatch time, and shared-artifact phases stay pinned to 1 regardless.
  max_concurrent_write_subagents: 1
  # null = the runner provider's `default_timeout`. A positive integer overrides it.
  subagent_timeout_s: null
  # Re-dispatches for TRANSPORT-shaped failures only (timeout, no parsed text,
  # parse_output failure). A result that parsed but failed schema validation is
  # never retried — that is a deterministic disagreement a retry would launder.
  subagent_retries: 1
  # The declared write policy for edit-capable dispatches, resolved against the
  # pinned repo root and enforced TWICE: pre-dispatch against the batch's declared
  # file set (refused before the runner starts) and post-run against the set the
  # snapshot diff actually observed (batch failed, files restored, run exits 3).
  # `.multi-llm/**` is denied to the RUNNER because the EXECUTOR owns those bytes.
  # The runner's own sandbox stays the preventive control; this is the second,
  # detective layer that makes a violation loud.
  write_paths:
    allow:
      - '**'
    deny:
      - .git/**
      - .multi-llm/**
      - '**/.env'
      - '**/.env.*'
      - '**/*.pem'
      - '**/id_rsa*'
      - '**/.ssh/**'
      - '**/.aws/**'
      - '**/.npmrc'
      - '**/node_modules/**'

# ---------------------------------------------------------------------------
# git_env: the non-interactive git environment every spawned CLI inherits
# ---------------------------------------------------------------------------
# Every provider CLI shells out to git under an agent profile, and a credential
# prompt behind captured pipes blocks forever. Measured against a private https
# remote under a scratch HOME: a tty prompt burns 75.1 s with two empty streams,
# and a GUI-style credential helper burns 90.1 s AND survives the parent's kill
# as an orphan.
#
# Two layers, and only the second is configurable:
#   * ALWAYS, every provider and both lanes — GIT_TERMINAL_PROMPT=0 and
#     GIT_ASKPASS="" (plus the inert-on-Linux SSH_ASKPASS / SSH_ASKPASS_REQUIRE /
#     GCM_INTERACTIVE hedges). Neither suppresses a helper that ANSWERS, so
#     authentication that works today keeps working. Not a knob.
#   * SCOPED — GIT_CONFIG_COUNT + `credential.helper=""`, applied only to the
#     read-only lanes: the `generate` profile (which is the model fan-out) and
#     `agent-readonly`. NEVER to `agent-write`, which is the profile that
#     legitimately runs git clone/fetch/commit against the user's own remotes.
#
# credential_helper: auto | wipe | keep
#   auto (default) — the scoping above.
#   keep           — never wipe. Restores today's behaviour for the read-only
#                    lanes: a private-HTTPS clone/fetch that a helper can answer
#                    keeps working, and a helper that HANGS is bounded only by
#                    the slot timeout. Set this if a read-only lane legitimately
#                    needs a private remote (a private plan repo, a submodule
#                    fetch during review).
#   wipe           — wipe everywhere, agent-write included. Deterministic, at the
#                    cost of agent-write no longer reaching private HTTPS remotes.
#
# Settable here (global) and per provider under `providers.<name>.git_env`;
# MULTI_LLM_GIT_CREDENTIAL_HELPER=<value> overrides both for one run. An unknown
# value in EITHER config layer is rejected at load time (a typo that silently
# meant `auto` would restore the hang this key exists to switch off).
#
# The accepted cost of `auto`, stated so nobody has to guess it from a stack
# trace: in the scoped lanes a private-HTTPS clone/fetch fails in ~0.27 s with
# `fatal: could not read Username for '<url>': terminal prompts disabled`. The
# helper is never invoked and leaves no orphan; the CLI reports its own tool
# error and the model continues the turn. Fast and legible, never a hang.
git_env:
  credential_helper: auto

# env_allowlist: off | on   (default: off — and it SHIPS off)
#
# M17/§2.4. Today every provider subprocess sees every other provider's API key
# and every cloud token in the shell. `on` replaces that with a deny-by-default
# allowlist — proxy, CA-bundle, XDG, keyring and per-CLI home variables pass, the
# rest does not — built inside the one shared child-env builder M3 introduced
# (utils/providers/base.py: build_child_env), so it can never allow on one
# dispatch lane what it denies on the other.
#
# WHY IT SHIPS OFF, and what turns it on. The list is only as good as the
# per-CLI x per-platform capability matrix behind it, and that matrix is
# **derived from the live provider registry**, never from a written roster:
# len(registry) x 3 platforms x 4 capabilities (credential, keyring, proxy, CA
# bundle). A matrix derived from a stale roster silently omits the newer
# adapters' credential, keyring, proxy and CA cells, and each omission is a
# mid-run auth or TLS failure of exactly the kind the allowlist exists to
# prevent — a security defect, not a stale number. A cell is green only when the
# CLI, launched under `env -i` plus the allowlist, reaches that capability at
# parity with a full-env control; answering `--version` is not parity.
#
# Nothing in this pass ran a cell, so every cell reads `unmeasured`, the Linux
# column is not green, and the default therefore stays `off` — an unrun cell
# degrades to today's inheritance rather than to a silent failure. The macOS and
# Windows columns are run jointly with plans/windows-macos-portability.md; until
# a platform's column is green the allowlist stays opt-in on that platform.
# `tests/test_env_allowlist.py` is where the gate is enforced: it reds if this
# value is anything but `off` while a Linux cell is unmeasured.
#
# Quoted on purpose: YAML 1.1 resolves a bare `on`/`off` to a boolean (a bare
# `off` is read as the documented word anyway, but the quotes keep the file
# saying what it means).
env_allowlist: "off"

