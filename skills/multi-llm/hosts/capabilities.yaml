# Host capability data (D5b) — one entry per host id, validated against
# schemas/host_capabilities.schema.json.
#
# WHAT THIS FILE IS. The verb -> mechanism map the host-neutral instruction core
# defers to. The core says *spawn subagents* / *ask the user* / *run detached*; the
# three fields `subagents`, `ask` and `detach` say what each one resolves to for a
# given host. That resolution is paid **once**, when a shim is rendered, and never
# per run by an agent.
#
# WHAT THIS FILE IS NOT. It is not on any agent read path. It is consumed by
# `multi_llm.py`, by `install-host`, by `hosts/render_capabilities.py` and by the
# tests. No instruction file and no shim ever tells an agent to open it or to open
# `references/host-capabilities.md` — the shim's baked sentence *is* the answer this
# matrix would have given. An agent reasoning over a capability table mid-workflow
# would be a worse instruction-following failure mode than the one this design
# removes.
#
# PROVENANCE IS LOAD-BEARING. Host docs churn faster than this design does, so
# every value carries a provenance: `verified` (a recorded live smoke observed it),
# `documented` (host docs only) or `unknown` (the shipping default). **A
# `documented`-only value never selects the non-conservative path.** Concretely,
# today: Codex and OpenCode are `subagents: executor` because spawn-from-exec is
# unconfirmed, and `detach: python`/`required` rather than trusting a raised command
# timeout. Promoting either is a one-line edit here, not a shim rewrite — but only
# once a smoke run has recorded it.
#
# A cell is `documented` until a recorded run has observed it, and most of them
# still are — which is why the conservative resolution is what executes. The
# `verified` cells each name the run that promoted them in a comment beside the
# entry, and `tests/test_host_capabilities.py`'s smoke ledger fails any promotion
# that does not.

version: 1

hosts:

  claude-code:
    # The reference host. There is deliberately no hosts/claude-code/shim.md.tmpl:
    # Claude Code loads a skill from <skill-root>/SKILL.md and nowhere else, so a
    # copy under hosts/ could only be dead text or a duplicate to keep in sync.
    # `installable: false` -> `install-host claude-code` is --check-only, and the
    # shim-correctness test asserts SKILL.md's three hand-written verb sentences are
    # byte-identical to what the renderer emits for this entry.
    shim: {template: null, installed: SKILL.md, format: markdown+frontmatter}
    # Rationale: this host's mandatory manifest is 23 lines on its own (a long
    # `description`, the rendered `argument-hint`, and 18 `allowed-tools` grants
    # that cannot be shortened without losing a permission). The shim *body* — what
    # the ~100-line budget is actually about — is 84 lines.
    shim_max_lines: 110
    installable: false
    install_paths:
      project: [".claude/skills/multi-llm"]
      global: ["$HOME/.claude/skills/multi-llm"]
      legacy: []
    reload: none
    arguments: placeholder            # $ARGUMENTS / ${CLAUDE_SKILL_DIR}
    # The plugin's own invocation, namespace included. `documented`, not
    # `verified`: no row has ever typed it into a Claude Code session — the
    # container lane drives this host headless with a prompt, exactly as the two
    # installable hosts' `documented` cells were before 2026-08-24.
    invocation: "as `/multi-llm:multi-llm <mode-flag> <plan-path> [options]`."
    multi_turn: true
    subagents: native
    ask: structured
    detach: native
    native_tool:
      subagents: Task
      ask: AskUserQuestion
      detach: run_in_background
    default_subagent_runner: "claude-code:sonnet"
    # subagents: native, so the tier -> model map lives here rather than in
    # providers.yaml driver.subagent_runner{,_cheap} (D2e).
    subagent_tiers: {full: sonnet, cheap: haiku}
    runners:
      claude-code: {bundled: true, needs_auth: false, login_cmd: "",
                    profiles: [generate, agent-readonly, agent-write], usage: full}
      cursor-agent: {bundled: false, needs_auth: true,
                     login_cmd: "cursor-agent login",
                     profiles: [generate], usage: partial}
    # In-session native dispatch: no process of ours sits between parent and child,
    # so there is nothing to strip and nothing to neutralize.
    nested_exec: {spawn: allowed, network: allowed, credentials: allowed,
                  notes: "Native subagents run in-session; the executor is not on
                    the default path for this host."}
    # Audited and non-empty: these are the variables Claude Code injects, which a
    # dispatched third-party runner must not inherit. Literal names only — a
    # wildcard would strip the runner's own credentials along with the guard.
    #
    # `passthrough` is EMPTY, and the entry that used to sit here is the reason
    # this comment is worth reading. It carried `ANTHROPIC_API_KEY`, sanctioned
    # as "an API key the host owns". `subagent_executor` re-admits every
    # passthrough name last, so that one cell silently cancelled M3/§2.1's
    # credential strip on the agent-profile lane while leaving it in force on
    # the fan-out lane: the same claude-code slot stripped the key on Lane A and
    # inherited it on Lane B, and the money bug the strip exists to close stayed
    # open for every subagent dispatch. Re-adding it would restore exactly that.
    #
    # The strip is not unconditional and does not need a passthrough as its
    # escape hatch: it is gated on the sanitized `claude auth status` preflight
    # and fails OPEN — an API-key-only user's key is preserved byte-for-byte —
    # and a user who wants it back unconditionally sets
    # `providers.claude-code.strip_vendor_keys: never` in providers.yaml, which
    # is a per-provider decision rather than a host-wide one.
    #
    # NOTE: this is a HOST-side allowlist, keyed by the host multi-llm is
    # *running inside*, not by the runner it dispatches. `codex` and `opencode`
    # both already carry `passthrough: []`, so emptying this one changes exactly
    # one situation: claude-code dispatched from inside claude-code.
    env_guards:
      guards: ["CLAUDECODE", "CLAUDE_CODE_ENTRYPOINT"]
      session_scoped: ["CLAUDE_SESSION_ID", "CLAUDE_SKILL_DIR"]
      passthrough: []
    max_concurrent_subagents: 10
    timeout_ceiling_s: 600            # Bash tool hard cap, silently clamped above
    timeout_override: {frontmatter: none, env: none, config: none}
    provenance:
      shim: documented
      shim_max_lines: verified      # counted on the file in the repo
      installable: verified
      install_paths: documented
      reload: documented
      arguments: verified
      invocation: documented
      multi_turn: verified
      subagents: verified
      ask: verified
      detach: verified
      native_tool: verified
      default_subagent_runner: verified
      subagent_tiers: verified
      runners: documented
      nested_exec: documented
      env_guards: documented
      max_concurrent_subagents: documented
      timeout_ceiling_s: documented
      timeout_override: documented

  codex:
    # Same skills format, and no longer on paper. The 2026-08-24 container
    # documented-invocation row installed this shim into a fresh `$HOME` and codex
    # enumerated it, advertising `multi-llm` to the model inside
    # `<skills_instructions>` with its `SKILL.md` locator — so the format claim
    # itself is measured. What the same row measured is the half that claim never
    # covered, and it is a negative: see `invocation` below. A codex skill is
    # reached by the MODEL choosing to read it; the composer rejects `/multi-llm`
    # outright. `invocation` is therefore the one cell promoted to `verified` here.
    # shim/arguments/install_paths stay `documented`: that row graded the host's
    # command surface in one scope on one platform, not placeholder substitution
    # and not the rest of the path matrix, and a promotion may not claim more than
    # the run behind it.
    shim: {template: hosts/codex/shim.md.tmpl, installed: SKILL.md,
           format: markdown+frontmatter}
    installable: true
    install_paths:
      # A preferred entry names the directory to write into (the file name comes
      # from `shim.installed`); a legacy entry names the FILE, because a
      # deprecated layout's file name is the host's own old convention and not
      # ours. Deprecated Codex prompts were `~/.codex/prompts/<command>.md`, so
      # the copy to detect is `multi-llm.md` — probing `prompts/SKILL.md` would
      # be a path no install of any vintage ever created.
      project: [".codex/skills/multi-llm"]
      global: ["$HOME/.codex/skills/multi-llm"]
      legacy: ["$HOME/.codex/prompts/multi-llm.md"]
    reload: new-session
    arguments: placeholder
    # MEASURED 2026-08-24, codex-cli 0.146.0, container documented-invocation row,
    # and it is a NEGATIVE result: typing `/multi-llm --review-plan <plan>` into a
    # fresh composer prints `Unrecognized command '/multi-llm'` and sends nothing
    # at all — no request reached the stub. The `/` popup lists no skill, `/multi`
    # offers no completion, and a file at the deprecated `install_paths.legacy`
    # prompts location is rejected the same way. Headless, `codex exec "/multi-llm
    # …"` passes the line through verbatim. The shim IS discovered — codex
    # advertises it to the model inside `<skills_instructions>` with its `SKILL.md`
    # locator — so it is model-invoked rather than typed, which is what this
    # sentence has to say. Read into the generated pages after "Invoke it ".
    invocation: >-
      by name rather than as a slash command — `Use the multi-llm skill with
      exactly these arguments: <the same arguments the Claude Code skill takes>`.
      Codex installs this shim as a **skill**, which is model-invoked rather than
      typed: its composer answers `/multi-llm` with `Unrecognized command`.
    multi_turn: true                 # documented, not observed: `codex exec`
                                     # runs a tool loop and `codex exec resume`
                                     # continues the session — either would give
                                     # the agent the follow-up turn.
    subagents: executor              # agents are GA in the TUI; spawn-from-exec is
                                     # unconfirmed, and the failure is
                                     # silent-then-fatal, so the exec profile is
                                     # `executor` until a recorded run says
                                     # otherwise. native_tool names the tool for
                                     # documentation, not for dispatch.
                                     #
                                     # EVIDENCE, NOT A PROMOTION (2026-08-25,
                                     # codex-cli 0.149.1, read out of the captured
                                     # tools[] array of a real headless request):
                                     # `multi_agent_v1` IS offered in `codex exec`,
                                     # carrying spawn_agent, wait_agent, send_input,
                                     # resume_agent and close_agent with a
                                     # documented model-override list. That closes
                                     # "is it offered" and leaves "does it work"
                                     # open, which is the half this cell grades — a
                                     # tool in the array is not a recorded run, and
                                     # the failure mode here is silent-then-fatal.
                                     # One detail a `native` promotion would have to
                                     # clear: spawn_agent's own description reads
                                     # "Do not spawn sub-agents unless the user or
                                     # applicable AGENTS.md/skill instructions
                                     # explicitly ask" — a skill CAN grant that
                                     # permission, so the lever exists.
    ask: free-text                   # request_user_input is Plan-Mode-only
                                     #
                                     # EVIDENCE, NOT A PROMOTION (same capture):
                                     # request_user_input is in the tool list and
                                     # its own description says "This tool is only
                                     # available in Plan mode." — which CONFIRMS the
                                     # line above rather than contradicting it, so
                                     # the cell does not move. What is new is a flag
                                     # to watch: `codex features list` reports
                                     # `default_mode_request_user_input under
                                     # development false`. That is the switch that
                                     # would make the tool generally available, so
                                     # re-probe it on each codex bump.
    detach: python
    native_tool:
      subagents: agent
    default_subagent_runner: "codex:gpt-5.2-codex"
    subagent_tiers: null             # forbidden to carry a map: subagents != native
    runners:
      codex: {bundled: true, needs_auth: false, login_cmd: "",
              profiles: [generate, agent-readonly, agent-write], usage: full}
      claude-code: {bundled: false, needs_auth: true, login_cmd: "claude login",
                    profiles: [generate, agent-readonly, agent-write], usage: full}
    nested_exec: {spawn: unknown, network: unknown, credentials: unknown,
                  notes: "Filled by the Phase 3 nested-exec smoke: --exec-subagents
                    launched from inside `codex exec`'s own sandboxed shell, for
                    both the same-host runner and a third-party one."}
    # Empty because the env diff has not run yet, not because the host is clean —
    # which is what provenance: unknown records.
    env_guards: {guards: [], session_scoped: [], passthrough: []}
    max_concurrent_subagents: 4
    timeout_ceiling_s: 0             # 0 = no documented cap on `codex exec`
    timeout_override: {frontmatter: none, env: unknown, config: unknown}
    provenance:
      shim: documented
      installable: documented
      install_paths: documented
      reload: documented
      arguments: documented
      invocation: verified
      multi_turn: documented
      subagents: documented
      ask: documented
      detach: documented
      native_tool: documented
      default_subagent_runner: documented
      subagent_tiers: documented
      runners: documented
      nested_exec: unknown
      env_guards: unknown
      max_concurrent_subagents: documented
      timeout_ceiling_s: unknown
      timeout_override: unknown

  opencode:
    # commands/ is PLURAL — the singular command/ path is simply not scanned.
    shim: {template: hosts/opencode/shim.md.tmpl,
           installed: commands/multi-llm.md, format: markdown+frontmatter}
    installable: true
    install_paths:
      project: [".opencode/commands"]
      global: ["$XDG_CONFIG_HOME/opencode/commands", "$HOME/.config/opencode/commands"]
      # Empty on purpose, and `.opencode/command` is the entry that is NOT here:
      # OpenCode never scans the singular directory, so a file sitting in it is
      # not a copy that loads. Listing it would make `--check` report — and, as
      # the highest-precedence project location, *rank first* — a file the host
      # will never discover, marking the real install shadowed. A compatibility
      # location is a place an install of an older vintage really works, never
      # a place a file might merely exist.
      legacy: []
    reload: new-session
    arguments: placeholder           # $ARGUMENTS / $1 — verified: the message
                                     # text reaches the command body.
    # Measured, and a trap worth shipping: `opencode run` parses the message
    # with yargs, so an argument list that STARTS with a flag (`--ask …`,
    # `--review-plan …` — i.e. every invocation this skill takes) is swallowed
    # as an option and the run silently prints yargs' own help instead. The
    # `--` separator is mandatory headless. Harmless in the TUI, where
    # `/multi-llm --ask …` needs no separator.
    headless_invocation: 'opencode run --command multi-llm -- "<args>"'
    # MEASURED 2026-08-24, opencode 1.18.18, container documented-invocation row:
    # the published spelling WORKS in a fresh TUI session. Typing
    # `/multi-llm --review-plan <plan>` expanded the installed command into the
    # turn the host sent — the shim's own text, its dispatcher block with
    # `{SKILL_DIR}` already substituted, the baked `--host opencode --yes
    # --exec-subagents`, and the mode flag still adjacent to its argument. Read
    # into the generated pages after "Invoke it "; the headless correction above
    # is rendered separately, because `--command` is what resolves the shim
    # there, not this spelling.
    invocation: "as `/multi-llm <the same arguments the Claude Code skill takes>`."
    multi_turn: true                 # measured: its agent takes further tool
                                     # turns inside one `opencode run` and acts
                                     # on what they printed — see the promotion
                                     # note below.
    subagents: executor              # `mode: subagent` dispatch is documented only;
                                     # dispatch is instructed in the command body,
                                     # never via frontmatter `subtask:` (which the
                                     # parser accepts and then ignores).
    ask: free-text                   # the `question` tool is unreliable headless
    detach: required                 # the ~120 s bash cap is documented, not
                                     # measured, and every fan-out mode runs far
                                     # longer than it — so no foreground fan-out
                                     # path is offered at all.
    native_tool:
      subagents: task
    default_subagent_runner: "opencode:opencode/sonnet"
    subagent_tiers: null
    runners:
      opencode: {bundled: true, needs_auth: false, login_cmd: "",
                 profiles: [generate, agent-readonly, agent-write], usage: full}
      claude-code: {bundled: false, needs_auth: true, login_cmd: "claude login",
                    profiles: [generate, agent-readonly, agent-write], usage: full}
    nested_exec: {spawn: unknown, network: unknown, credentials: unknown,
                  notes: "Filled by the Phase 3 nested-exec smoke from inside
                    `opencode run`."}
    env_guards: {guards: [], session_scoped: [], passthrough: []}
    max_concurrent_subagents: 4
    timeout_ceiling_s: 120           # documented default bash timeout
    # No `timeout` field exists in the V2 command contract, so the ceiling moves
    # only through the environment/config surface — and the installer only ever
    # writes through a non-`none` channel.
    timeout_override: {frontmatter: none, env: unknown, config: unknown}
    # Promoted from a recorded smoke on opencode 1.18.12 (2026-08-08): the
    # installed command was discovered by name in a new session, its uv
    # preflight ran ahead of the first `uv run`, the baked prefix resolved, and
    # a `--detach`ed `ask` fan-out was polled through `status --wait` to a
    # terminal `done` and its answers file read back. That same run settles
    # `multi_turn`, which had shipped `false` on nothing: its agent took four
    # tool turns inside a single `opencode run` — `command -v uv`, then
    # `util instructions status`, then `status`, then a read of the answers —
    # and followed `MULTI_LLM_RESULT.next` on its own initiative, which is
    # precisely the follow-up turn the field claims. Everything that run did
    # not exercise stays where it was — in particular `subagents` (no subagent
    # was dispatched) and `ask` (nothing was asked), which is what keeps the
    # conservative resolution in force.
    provenance:
      shim: verified
      installable: verified
      install_paths: verified
      reload: verified
      arguments: verified
      headless_invocation: verified
      invocation: verified
      multi_turn: verified
      subagents: documented
      ask: documented
      detach: verified
      native_tool: documented
      default_subagent_runner: documented
      subagent_tiers: documented
      runners: documented
      nested_exec: unknown
      env_guards: unknown
      max_concurrent_subagents: documented
      timeout_ceiling_s: documented
      timeout_override: unknown
