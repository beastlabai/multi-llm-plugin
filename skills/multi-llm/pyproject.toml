[project]
name = "multi-llm"
version = "0.1.0"
description = "Multi-LLM automation for plan review, task generation, implementation, and code review"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-xdist>=3.0", "ruff>=0.1.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
markers = [
    "robustness: marks tests for LLM error handling robustness scenarios",
    "live: marks tests that require Claude Code CLI and API (skipped in CI)",
    "timeout: marks tests with a timeout limit (requires pytest-timeout)",
    "config_override: opts out of the autouse per-project config isolation fixture (tests that exercise override discovery/env themselves)",
    "slow: marks tests that drive several real orchestrator invocations end to end (the instruction-refactor golden guard); runs in CI, not deselected by default",
    "container: marks tests that build and drive the E2E container image (needs a Docker daemon; opt in with -m container). Deselected by default via addopts below",
    "live_provider: marks the credentialed provider lane (harness-expansion.md §7.4) — a real CLI against https://openrouter.ai on the user's own key, so it SPENDS CREDITS. Carried in addition to `container`, so the addopts default already deselects it and CI's `not container` does too; `make e2e-live-provider` is the only thing that sources the key",
]
# A marker deselects nothing on its own — it only gives a -m expression something
# to exclude. This default is what keeps a bare `pytest` green on a machine with no
# container runtime. It is a *default*: an explicit -m on the command line replaces
# it, which is why .github/workflows/test.yml has to say `not container` itself.
addopts = "-m 'not container'"
# Filter out warnings about dataclass fixtures being collected by pytest
filterwarnings = [
    "ignore:cannot collect test class.*FixturePlan.*:pytest.PytestCollectionWarning",
]
